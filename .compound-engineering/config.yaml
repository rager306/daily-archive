# Compound Engineering — team defaults for daily-archive
# Local overrides: .compound-engineering/config.local.yaml (gitignored)

# Keep ADRs in doc/; CE plans/solutions/ideation live under this root.
docs_root: .compound-engineering/artifacts

pulse_product_name: "daily-archive"

# Cross-model review sends plan and diff content to an external model CLI.
# off: ce-doc-review and ce-code-review stay on the session model.
# A direct in-conversation request still overrides this for one run.
cross_model_review_mode: off
