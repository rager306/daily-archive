# Candidate-only corpus metric variants; legacy pair metric remains unchanged.
schema_version: policy-corpus-experiment.v1
adr_ref: ADR-080 post-M516 correction
min_support: 4
token_normalization: ascii_alphabetic_lowercase
ordered_ngram_size: 5
quality_tie_margin: 0.02
metric_variants:
- legacy_yield
- sections
- sections_per_ms
- body_chars
- chars_per_ms
- token_f1
- ordered_5gram_f1
- quality_then_latency
native_execution_equivalence:
  xy_cut: grobid_structural
  grobid_structural: grobid_structural
  page_outline: page_outline
legacy_metric_path: data/policies/parse_pair_metric.yaml
validation_usage: adaptive_diagnostic_not_final_test
locks:
  deployed: false
  import_eligible: false
  auto_promote: forbidden
  graph_write: forbidden
