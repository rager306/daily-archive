schema_version: v2
path: .
description: Repo root — valid top-level directories, tolerated tool dirs, forbidden
  patterns
adr_ref: ADR-068
valid_directories:
- data
- governor
- crates
- scripts
- doc
- artifacts
- archive
- logs
tolerated:
- legacy
- target
ignore:
- .*
forbidden:
- old_*
- temp
- tmp
- __pycache__
- node_modules
