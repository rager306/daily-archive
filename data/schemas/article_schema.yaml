# ═══════════════════════════════════════════════════════════════════
# ARTICLE SCHEMA — единственное место определения статьи (ADR-068)
#
# Роли: SCHEMA = норма · FS = истина · Governor = прямой валидатор ·
#       MANIFEST = производный кэш. Этот файл — норма для статьи.
#
# Его читают: Governor (инварианты), пайплайн (слои/lifecycle), люди.
# Ничто не дублирует эти правила в другом месте.
# ═══════════════════════════════════════════════════════════════════

schema_version: article-schema.v7   # v7: citations_resolved enrichment — corpus title-match, venue_id, style classification
adr_ref: ADR-068
changes:
  v2: "artifacts: present/missingness/not_reached/built_at/actor/inputs; citations_resolved vocabulary"
  v3: "invariants: машиночитаемые декларации паттернов — общий движок валидации, статья лишь первый объект"
  v4: "missingness_vocabulary += no_citation_elements; equations/citations слои уважают parsed missingness"
  v5: "figures слой наполняется из TEI (8833 figure-элементов корпуса); НОВЫЙ слой external_resources (6189 ptr-URL); словарь external_resource_domains.yaml"
  v6: "quality_signals слой: 7 детерминированных сигналов из уже собранных слоёв; пороги/набор = data/ontology/quality_signal_policy.yaml"
  v7: "citations_resolved: title-match против корпуса (resolved_corpus), venue_id из venue_registry, style из citation_styles, сжатые авторы"
  v1: "initial definition (layers, lifecycle, invariants, forbidden edges)" 
path: data/schemas/article_schema.yaml

# ── Layout: плоско по умолчанию, версии по требованию ───────────────
#
# ОДНА версия (по умолчанию, ~все статьи):
#   processed/<paper_id>/
#   ├── manifest.yaml          ← метаданные артефакта (строчные = артефакт)
#   ├── parsed/article.json
#   ├── pageindex/projection.json
#   ├── extracted/entities.json
#   └── …
#
# НЕСКОЛЬКО версий (появляется при второй версии, append-only):
#   processed/<paper_id>/
#   ├── manifest.yaml          ← метаданные АКТИВНОЙ версии + revision
#   ├── revision_graph.json    ← supersedes/same_as/derived_from
#   ├── v1/…                   ← заморожено
#   └── v2/…                   ← активная
#
# Источник хранится отдельно и неизменно:
#   sources/<type>/<category>/<paper_id>/source/*

layout:
  default: flat
  versioned: on_second_version
  revision_graph: revision_graph.json

# ── Lifecycle ────────────────────────────────────────────────────────
# Порядок стадий. Значение статьи = DERIVED из последнего события,
# не выставляется вручную.

lifecycle_order:
  - raw         # источник загружен
  - parsed      # GROBID/HTML парсинг завершён
  - structured  # AST + figures + tables + equations
  - extracted   # сущности извлечены
  - enriched    # внешние метаданные присоединены
  - summarized  # выжимки построены
  - validated   # инварианты Governor проходят

# ── Слои (authority stack: нижний неизменяем, верхний не понижает) ──
# derived_from указывает на слои-предки. debug выводится из manifest —
# транзитивно видит всё, что видит манифест.

layers:
  - id: source
    authority: A0
    title: Исходные ассеты
    immutable: true
    lives_in: sources/<type>/<category>/<paper_id>/source/
    derived_from: []
    lifecycle_ceiling: raw

  - id: parsed
    authority: A1
    title: Структурная истина
    files:
      - {name: article.json, type: ParsedArticle, required: true}
    derived_from: [source]
    lifecycle_ceiling: parsed

  - id: context
    authority: A2
    title: Навигационная истина (AST-проекция документа)
    files:
      - {name: projection.json, type: DocumentContextProjection, required: true}
    derived_from: [parsed]
    lifecycle_ceiling: structured

  - id: figures
    authority: A2
    title: Рисунки (TEI figure-элементы без type=table)
    files:
      - {name: index.json, type: "Vec<FigureCandidate>", required: true}
      - {name: "*.png", type: binary, required: false}
    derived_from: [parsed]
    lifecycle_ceiling: structured
    fields: [figure_id, label, caption, ref_count, has_graphic]

  - id: tables
    authority: A2
    title: Таблицы
    files:
      - {name: index.json, type: "Vec<TableCandidate>", required: true}
    derived_from: [parsed]
    lifecycle_ceiling: structured

  - id: equations
    authority: A2
    title: Формулы
    files:
      - {name: index.json, type: "Vec<EquationCandidate>", required: true}
    derived_from: [parsed]
    lifecycle_ceiling: structured

  - id: extracted
    authority: A3
    title: Сущности
    files:
      - {name: entities.json, type: "Vec<ExtractedEntity>", required: true}
    derived_from: [parsed]
    lifecycle_ceiling: extracted

  - id: enriched
    authority: A4
    title: Внешние метаданные
    files:
      - {name: authors.json, type: "Vec<AuthorEntry>", required: true}
      - {name: venue.json, type: VenueEntry, required: true}
      - {name: topics.json, type: "Vec<TopicEntry>", required: true}
      - {name: provenance.json, type: ProvenanceRecord, required: true}
    derived_from: [parsed]          # обогащение от parsed, НЕ от extracted
    lifecycle_ceiling: enriched

  - id: citations_resolved
    authority: A4
    title: Разрешённые цитаты
    files:
      - {name: citations_resolved.json, type: "Vec<ResolvedCitation>", required: true}
    derived_from: [parsed, enriched]
    lifecycle_ceiling: enriched

  - id: external_resources
    authority: A3
    title: Внешние ресурсы (ptr-URL из TEI)
    files:
      - {name: external_resources/index.json, type: "Vec<ExternalResource>", required: true}
    derived_from: [parsed]
    lifecycle_ceiling: extracted
    fields: [url, domain, resource_type, family]
    inputs: [data/ontology/external_resource_domains.yaml]

  - id: summaries
    authority: A5
    title: Выжимки
    files:
      - {name: abstract.json, type: SummaryNode, required: true}
      - {name: per_section.json, type: "Vec<SectionSummary>", required: false}
      - {name: full_paper.json, type: SummaryNode, required: false}
    derived_from: [parsed, enriched]
    lifecycle_ceiling: summarized

  - id: quality_signals
    authority: A6
    title: Сигналы качества (детерминированные, без LLM)
    files:
      - {name: quality_signals.json, type: "Vec<QualitySignal>", required: true}
    derived_from: [parsed, extracted, figures, citations_resolved, external_resources]
    lifecycle_ceiling: summarized
    fields: [signal_id, value, verdict]
    inputs: [data/ontology/quality_signal_policy.yaml]
    verdict_vocabulary: [ok, warn, alarm, info]

  - id: debug
    authority: A7
    title: HTML-отчёт для человека
    regenerable: true
    files:
      - {name: debug/index.html, type: html, required: false}
    derived_from: [manifest]        # транзитивно: всё, что видит манифест
    lifecycle_ceiling: any

# ── manifest.yaml артефакта (контракт полей) ────────────────────────
manifest:
  required_fields:
    - schema_version          # article-manifest.v1
    - paper_id
    - source                  # {type, category, sha256, acquired_at}
    - lifecycle               # DERIVED из последнего события
    - lifecycle_events        # append-only
    - artifacts               # граф слоёв (см. artifact_entry)
  optional_fields:
    - revision                # присутствует только у мультиверсионных
    - notes

  # Контракт одной записи artifacts (v2)
  artifact_entry:
    built:                    # слой материализован
      file: str               # путь внутри processed/<paper_id>/
      derived_from: [layer_id]
      sha256: str
      built_at: timestamp     # recorded_at семантика
      actor: str              # кто построил (стадия/инструмент)
      stats: dict             # счётчики слоя (производные)
      inputs: [path]          # DATA-словари, повлиявшие на сбор (optional)
    missing:                  # слой отсутствует — типизированная причина
      present: false
      missingness: str        # типизированная причина (missingness_vocabulary)
      derived_from: [layer_id]
    not_reached:              # lifecycle статьи ещё не дошёл до слоя
      not_reached: true

  # Словарь причин отсутствия слоя (typed missingness, ADR-055)
  missingness_vocabulary:
    no_table_elements: "парсер не нашёл таблиц в источнике"
    no_figure_elements: "парсер не извлекает рисунки (нет coords/фигур в GROBID-профиле)"
    no_formula_elements: "парсер не нашёл формул"
    no_citation_elements: "парсер не нашёл цитат (поле citations пусто)"
    no_external_resources: "TEI не содержит ptr-URL"
    parser_not_configured: "слой предусмотрен схемой, пайплайн не реализован"

  # Цитаты: словарь состояний разрешения (детерминированный матч — DATA)
  # Принцип: индексы цитирования опираются на ID; имя-матч — явно
  # помеченный фолбэк пониженного доверия (resolved_by обязателен).
  citations_resolved_vocabulary:
    resolved_arxiv: "arxiv_id присутствует (resolved_by=arxiv_id)"
    resolved_doi: "doi присутствует (resolved_by=doi)"
    resolved_corpus_arxiv: "arxiv_id цитаты указывает на статью корпуса (resolved_by=corpus_arxiv_id) — ID-основа"
    corpus_title_fallback: "имя-фолбэк: title матчится на корпус (resolved_by=title_normalized) — пониженное доверие"
    candidate_title: "ID нет; venue/style/authors извлечены, внешняя идентичность не установлена"
    raw_only: "только сырой GROBID-текст"
  citation_record_fields:
    resolved_state: vocab
    resolved_by: "метод резолва (обязателен при любом resolved_*): arxiv_id|doi|corpus_arxiv_id|title_normalized"
    matched_paper_id: "статья корпуса при corpus-резолве"
    venue_id: "canonical из venue_registry.yaml"
    style: "id из citation_styles.yaml (journal_article/book/…)"
    authors_compressed: "список {author_key (внутренний ID-базис, norm(initials+surname)), compressed, label?, identity_method: unmatched|tei_directory_name_fallback, seen_in_paper?} — полное имя это LABEL, не идентичность; внешние ID (OpenAlex A-id/ORCID) подключаются на enriched"
  events:
    fields: [stage, recorded_at, observed_at, actor, evidence_sha256]
    observed_at_optional: true   # только когда есть внешний якорь
    semantics: |
      recorded_at  — transaction_time: когда наш пайплайн зафиксировал.
      observed_at  — valid_time: когда факт был истинен во внешнем мире.
      Текущий lifecycle = стадия последнего события. Регенерация манифеста
      сохраняет журнал (append-only) и пересчитывает производные поля.

# ── Инварианты: машиночитаемые декларации паттернов ─────────────────
# Паттерны — переиспользуемые правила ОБЩЕГО движка валидации
# (da-domain::schema_invariants). Какие поля/словари — декларирует
# схема объекта; статья — первый объект, дальше главы/словари/снапшоты.
# Формулировки-проза прежних версий перенесены в `documentation`.

invariants:
  - pattern: derived_state_from_events        # состояние выводится из последнего события
    state_field: lifecycle
    events_field: lifecycle_events
    stage_field: stage
    default_state: raw

  - pattern: monotonic_timestamp              # время не убывает в журнале
    field: lifecycle_events[].recorded_at

  - pattern: enum_membership                  # значения из словаря нормы
    field: lifecycle_events[].stage
    vocabulary: lifecycle_order

  - pattern: graph_edges_known                # рёбра графа указывают на известные узлы
    graph_field: artifacts
    edge_field: derived_from
    node_vocabulary: layers
    allowed_roots: [source]

  - pattern: cross_layer_stat_eq              # статистики слоёв согласованы
    layer_a: parsed
    stat_a: sections
    layer_b: context
    stat_b: ast_nodes

  - pattern: collection_records               # записи коллекции удовлетворяют полю
    layer: extracted
    file: extracted/entities.json
    field: section_ordinal
    required: true
    min: 0

documentation:
  lifecycle_monotonic: "stage_index(artifact) <= stage_index(article.lifecycle)"
  derived_from_acyclic: "граф слоёв ацикличен (гарантируется топологией схемы)"
  enrichment_after_parse: "enriched.stage_index >= parsed.stage_index"
  source_immutable: "source.sha256 неизменен с первого manifest"
  events_append_only: "регенерация манифеста не теряет и не переписывает события"
  authority_no_downgrade: "слой с меньшим authority не зависит от слоя с большим"

# ── Запрещено ────────────────────────────────────────────────────────
forbidden:
  - enriched понижает/повышает lifecycle parsed   # изменение чужой стадии
  - figures/tables/equations подменяют source
  - сущность без привязки к секции
  - authors без provenance
  - debug как источник истины для других слоёв
  - ручная установка lifecycle (только через событие)

# ── revision_graph.json (только для мультиверсионных) ───────────────
revision_graph:
  edges: [supersedes, same_as, derived_from]
  edge_fields: [from, to, observed_at, recorded_at]
  invariants:
    - revision_acyclic: граф ревизий ацикличен
    - old_version_immutable: слои superseded-версии заморожены
    - active_version_min_parsed: активная версия >= parsed
