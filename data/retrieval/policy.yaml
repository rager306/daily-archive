# Retrieval quality admission policy (M387 S07). Quality decides ruvector admission.
schema_version: retrieval-policy.v1
# Minimum recall@k for a retrieval surface to be considered for admission.
minimum_recall_at_k: 0.6
k: 5
# Filter correctness (tenant/temporal) must be exact; any failure disqualifies.
filter_correctness_required: true
# No tuning in benchmark mode.
tuning_enabled: false
auto_promote: false
optimizer_enabled: false
