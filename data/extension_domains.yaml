# Extension domains — non-arXiv first-class scientific domains.
# These are NOT second-class; equal status with arXiv codes.
# Used when arXiv taxonomy doesn't cover a domain adequately.

version: "1.0"
namespace: "da"
description: "daily-archive extension domains for non-arXiv scientific fields"

domains:
  - code: "da.medicine"
    name: "Clinical / biomedical research"
    typical_sources: ["PubMed", "clinical guidelines", "preprints"]

  - code: "da.microbiome"
    name: "Host-microbiome science"
    typical_sources: ["papers", "reviews", "datasets"]

  - code: "da.metabolism"
    name: "Metabolism / metabolic health"
    typical_sources: ["papers", "protocols"]

  - code: "da.genetics"
    name: "Applied genetics / genomics"
    typical_sources: ["papers", "ClinVar-like refs"]

  - code: "da.biohacking"
    name: "Human enhancement / self-experiment protocols"
    typical_sources: ["protocols", "n-of-1", "reviews"]

  - code: "da.nutrition"
    name: "Nutrition science"
    typical_sources: ["trials", "reviews"]

  - code: "da.longevity"
    name: "Aging / longevity research"
    typical_sources: ["papers", "trials"]

  - code: "da.social_science"
    name: "Social / behavioral sciences"
    typical_sources: ["papers", "surveys"]

  - code: "da.chemistry"
    name: "Applied chemistry"
    typical_sources: ["papers", "protocols"]

  - code: "da.general"
    name: "Unspecified / routing fallback"
    typical_sources: ["mixed"]

# Informal label → canonical code aliases
aliases:
  "cs.ml": "cs.LG"
  "machine-learning": "cs.LG"
  "machine_learning": "cs.LG"
