structural:
  acronym_definitions:
    enabled: true
    entity_type: Method
    acronym_min_len: 2
    acronym_max_len: 6
    min_words_in_phrase: 2
    max_words_in_phrase: 5
    note: 'NEW-term discovery: "<phrase> (ABBR)" where ABBR initials match phrase
      words. Catches methods/datasets/models absent from whitelists. "ingest-time
      semantic compilation (ISC)" -> Method[ISC].'
  proposal_noun_phrases:
    enabled: true
    entity_type: Method
    triggers:
    - we propose
    - we introduce
    - we present
    - we develop
    - we describe
    - we build
    third_person_triggers:
    - propose
    - propose a
    - proposes
    - introduces
    - presents
    max_phrase_chars: 40
    note: 'Extract the noun phrase (not just first word) after proposal verbs: "we
      propose a compiled semantic substrate" -> Method[compiled semantic substrate].
      Lowercase allowed.'
  prose_benchmark_numbers:
    enabled: true
    entity_type: Metric
    patterns:
      percentage:
        regex: (\d{1,3}(?:\.\d+)?)\s*%
        label_suffix: pct
        drop_int_multiples_of: 5
      p_value:
        regex: p\s*[≤<=]\s*(\d+(?:\.\d+)?\s*[×x]\s*10\s*[-−]\s*\d+)
        label_prefix: p_value
      fold_change:
        regex: (\d+(?:\.\d+)?)\s*[×x](?=\s|[,;.)])
        label_suffix: fold
      sample_size:
        regex: \b(\d{2,6})\s+(?:transcripts|questions|documents|papers|samples|participants|examples|cells)\b
        label_prefix: n_
        min_value: 10
        strip_leading_zeros: true
    max_per_section: 8
    note: 'ADR-069 §2.5: benchmark-числа в прозе (vision-жанр не имеет Results-секций).
      Source specimen: 85.2% vs 72.5%, p<=4.9e-6, 33.7x, 500 transcripts.'
