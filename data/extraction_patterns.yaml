    - (?i)scope and contributions?
    - (?i)^survey of
    - (?i)a .* survey
    - (?i)taxonomy
  label_junk_filters:
    enabled: true
    junk_patterns:
    - (?i)manuscript submitted
    - (?i)submitted to
    - (?i)\bpage \d+\b
    - (?i)arxiv:\d
    - (?i)preprint
    - (?i)\d+\s*$
    note: 'GROBID page furniture leaking into section text (specimen 2512.00107: label
      "resultsManuscript submitted"). Labels matching junk never enter entities.'
  numbered_environments:
    enabled: true
    entity_type: Method
    environment_prefixes:
    - M
    max_name_len: 60
    scan_title: true
    scan_text_intro_chars: 0
    note: 'Survey spine (specimen 2512.00107): numbered environments M1..M39 form
      a CLOSED index of the survey objects — one regex gives 100% recall vs ~20/39
      by frequency. Title form "M3. Isolating centrality." + inline form "M21." then
      name as first sentence. M=measure→Method; extend prefixes for D (definition),
      T (theorem) when mathematics profiles consume this. scan_text_intro_chars=0:
      полный скан текста — определения живут и в середине секций (M5. Closeness centrality
      внутри параграфа).'
