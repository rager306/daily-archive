# Algorithm parameters — runtime tuning values for detection algorithms.
# No hardcoded values in Rust — this YAML is the single source of truth.
# Override by editing this file; no recompilation needed.

version: "1.1"

# Provider-neutral embedding input projections. Full document/section text is
# embedded through structure-aware chunk stages, never hidden Paper truncation.
embedding_input:
  max_input_chars: 2048
  separator: "\n"
  paper_fields: [title, abstract]

# ConceptCluster detection parameters (cluster.rs detect_clusters).
cluster_detection:
  # Minimum number of papers two entities must co-occur in to form a cluster.
  min_cooccurrence: 3
  # Minimum number of papers a single entity must appear in to get its own cluster.
  min_single_mentions: 5
  default_cluster_type: concept_cluster
  type_cluster_types:
    Method: method_family
    Dataset: benchmark_suite
