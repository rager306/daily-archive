# Revision classification policy (M383 S01 / ADR-058).
# Candidate-only. Never invents revision=1 for versionless locators.
schema_version: revision-classification-policy.v1
import_eligible: false
# Versionless locators are an explicit policy case, not implicit v1.
allow_versionless: true
# Exact vN still needs at least one checksum-bound manifestation before materialize.
require_manifestation_for_exact: true
