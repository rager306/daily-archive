schema_version: source-import-tools.v1
adr_ref: ADR-068, doc/research/document-model-pageindex-synthesis-2026-08-23.md
stages:
- stage: raw
  title: источник получен и идентифицирован (registered identity)
  tools:
  - id: arxiv_catalog
    impl: rust
    cli: da acquire-arxiv
    note: каталог-hit/script-ensure
  - id: doi_mirror_fetch
    impl: reference
    cli: scripts/m451_doi_import.py
    note: W-D rehearsal; Rust SourceAcquisitionPort — будущая W-D1
  - id: textbook_placement
    impl: reference
    cli: scripts/m451_textbook_import.py|monograph
    note: identity+manifest по паттерну M450
- stage: parsed
  title: полный текст + структура по грамматике
  tools:
  - id: grobid_structural
    impl: rust
    cli: da ingest/batch-ingest
    note: D204 structural профиль; TEI
  - id: html_headings_parser
    impl: rust
    cli: da source parse-html <id> --html <path>
    note: 'фаза-2 порт: h1-h6 дерево, permalink-чистка, path_id из numbering; rust-regex
      без backreference — пары уровней проверяются пост-матчем; кросс-валидировано
      gnn ch.01: 57 секций, 0 расхождений полей'
  - id: pdf_toc_parser
    impl: reference
    cli: scripts/m451_monograph_import.py
    note: embedded TOC, page-range якоря
- stage: structured
  title: навигация + роли + структурные элементы + фигуры
  tools:
  - id: navigation_build
    impl: rust
    cli: da source build-navigation
    note: 'фаза-2 порт: грамматика path_id, furniture-детекторы DATA, tree_cost; кросс-валидирован
      с reference (tree_cost совпадает)'
  - id: structural_elements
    impl: rust
    cli: da source build-structural
    note: 'фаза-2 порт: DATA-детекторы окружений, numbering; кросс-валидирован (ADS
      741/257 def, trench 708)'
  - id: figures_geometry
    impl: rust
    cli: 'da source build-figures (наблюдения: scripts/m451_pdf_observations.py)'
    note: 'фаза-2 порт: аналитика Rust на инжектированных наблюдениях (injected observations);
      экстрактор PDF — reference (PyMuPDF) до появления Rust PDF-бэкенда; стратегия
      канонизирована: image без переиспользования; кросс-валидировано ADS 202/165/94'
  - id: figures_tei
    impl: rust
    cli: da source build-figures-tei
    note: 'фаза-2 порт: untyped <figure> из parsed tei_xml, figDesc/label/graphic/in-text
      refs; rust-regex без lookahead — attrs-фильтрация typed=table; кросс-валидировано
      2402.18361 (7/7/4/17), 2408.06292 (50/47/32/38)'
- stage: extracted
  title: сущности по DATA-словарям
  optional_for:
  - chapter
  - monograph
  tools:
  - id: rule_based_extractor
    impl: rust
    cli: da extract
    note: живые словари M446 (rules_sha256)
- stage: enriched
  title: внешние якоря (OpenAlex A-ID/ORCID)
  tools:
  - id: openalex_work
    impl: rust
    cli: da enrich/batch-enrich
    note: порт есть; article-слой якорь — reference
  - id: article_enriched_layer
    impl: reference
    cli: scripts/m451_enrich_openalex.py
    note: позиционная привязка авторов, кэш+provenance
- stage: summarized
  title: выжимки (модель из models.yaml binding)
  lazy: true
  tools:
  - id: summaries_build
    impl: reference
    cli: scripts/m451_summaries_build.py
    note: agnes-2.5, injection-scrub, lineage
  - id: per_section_lazy
    impl: reference
    cli: scripts/m451_background_runner.py
    note: фоновые задачи по реестру
- stage: validated
  title: инварианты по норме (generic engine)
  tools:
  - id: schema_validator
    impl: rust
    cli: da validate-objects
    note: generic движок паттернов, file-backed
guards:
  grammar_optional_stages:
    chapter:
    - extracted
    monograph:
    - extracted
  lazy_stages:
  - summarized
  event_semantics: каждый переход = append-only lifecycle_event (recorded_at, actor,
    evidence_sha256)
research_candidates:
  firecrawl_pdf_inspector:
    what: 'PDF: классификация TextBased/Scanned/Mixed, позиционный текст, markdown
      с H1-H4 (font-ratios), CID/ToUnicode детект'
    already: da-adapters pdf-classifier feature (0.1.7; upstream 1.17.0 — активен)
    roles:
    - 'garbled-детект (память: page-local ToUnicode/CID эвристики)'
    - heading_stream-грамматика для PDF без TOC (кандидат, отдельная грамматика)
    - кандидат на Rust-бэкенд наблюдений для figures_geometry
  firecrawl_html_extractor:
    what: 'trafilatura-класс: main-content очистка, page_type, confidence, markdown'
    roles:
    - kb_page/web-страницы как источники (raw-стадия будущего)
    - не для html_headings глав — там структура уже честная h1-h6
    indexed: 'codebase-memory: firecrawl-html-extractor (492 узла)'
  firecrawl_simd_html_to_md:
    what: SIMD HTML->Markdown (транспорт)
    roles:
    - кандидат для debug-рендера и markdown-экспорта слоёв
  firecrawl_anydoc:
    what: Word/PPT/Excel/ODT/RTF/EPUB/CSV/PDF -> Block-модель (Heading{level,anchor},
      Table, Asset) + GFM
    roles:
    - parsed-стадия для офисных источников (учебные материалы как KB)
    - 'расширение grammar-профилей: office_blocks'
    indexed: 'codebase-memory: firecrawl-anydoc (1884 узла)'
