# Stage-1 figure type labels (ADR-060). DATA-driven — not hardcoded in product logic.
schema_version: figure-type-labels.v1
import_eligible: false
default_type: other
# Higher list order wins on ties by cumulative weight; first match weight sums.
types:
  - id: flowchart
    wire: flowchart
    weight: 3
    caption_keywords:
      - flowchart
      - pipeline
      - algorithm overview
      - overview of the
      - candidate proposal
      - mutation
      - merge
      - feedback loop
      - iterative
  - id: plot
    wire: plot
    weight: 3
    caption_keywords:
      - plot
      - chart
      - bar graph
      - line graph
      - scatter
      - roc
      - accuracy vs
      - performance comparison
      - results for
      - ablation
  - id: diagram
    wire: diagram
    weight: 2
    caption_keywords:
      - diagram
      - architecture
      - schematic
      - block diagram
      - model architecture
      - network architecture
  - id: table
    wire: table
    weight: 3
    caption_keywords:
      - table
      - tabular
      - comparison table
  - id: screenshot
    wire: screenshot
    weight: 2
    caption_keywords:
      - screenshot
      - user interface
      - ui capture
  - id: photograph
    wire: photograph
    weight: 2
    caption_keywords:
      - photograph
      - micrograph
      - microscopy
      - photo of
  - id: other
    wire: other
    weight: 0
    caption_keywords: []
