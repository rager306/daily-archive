# Caption-driven compound-figure panel markers (ADR-060 / M392).
# Candidate-only. No paper-specific keywords. No pixel crop.
schema_version: figure-panel-markers.v1
import_eligible: false
# Prefer the caption head (until first period) so body prose like "section 3a" is ignored.
caption_first: true
max_panels: 12
detectors:
  - id: letter_range_parens
    description: "Parenthetical letter range such as (a-c) or (A–C)"
    enabled: true
  - id: sequential_letter_parens
    description: "Repeated parenthetical letters such as (a) (b) (c)"
    enabled: true
  - id: figure_letter_range
    description: "Figure/Fig. prefix with letter range such as Figure 3a-c"
    enabled: true
