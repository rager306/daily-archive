# Local Influence Flower policy (M394 / arXiv:1907.12748 §4.2 idea).
# Candidate-only. No cmlab service. No graph import.
schema_version: influence-flower-policy.v1
import_eligible: false
# Skip citations where citing and cited share the ego entity (self-cite).
skip_self_cite: true
# Unknown author lists are not treated as n=1.
reject_empty_cited_authors: true
