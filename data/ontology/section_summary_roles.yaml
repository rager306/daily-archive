schema_version: section-summary-roles.v1
max_title_chars: 160
rules:
  - summary_type: methods
    allow_suffix_match: true
    title_aliases:
      - method
      - methods
      - methodology
      - approach
      - proposed method
      - model architecture
      - experimental setup
  - summary_type: results
    allow_suffix_match: true
    title_aliases:
      - result
      - results
      - experiments
      - experimental results
      - evaluation
      - evaluation results
      - empirical evaluation
