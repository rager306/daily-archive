# External resource classification — domain → resource_type (DATA).
# Consumed by the external_resources layer builder (article_schema v5).
# Pain coverage: ADR-053 Tier-2 #16 (reproducibility — code/model links),
# #13 (figure/data artifacts), Layer I ExternalResource.
schema_version: external-resource-domains.v1
adr_ref: ADR-053, ADR-068

domains:
  github.com: {type: code, family: repository}
  gist.github.com: {type: code, family: repository}
  gitlab.com: {type: code, family: repository}
  bitbucket.org: {type: code, family: repository}
  huggingface.co: {type: model_hub, family: artifacts}
  hf.co: {type: model_hub, family: artifacts}
  paperswithcode.com: {type: benchmark, family: artifacts}
  openreview.net: {type: venue_page, family: scholarly}
  aclanthology.org: {type: venue_page, family: scholarly}
  proceedings.mlr.press: {type: venue_page, family: scholarly}
  arxiv.org: {type: preprint, family: scholarly}
  doi.org: {type: doi, family: scholarly}
  semanticscholar.org: {type: scholarly_index, family: scholarly}
  api.semanticscholar.org: {type: scholarly_index, family: scholarly}
  scholar.google.com: {type: scholarly_index, family: scholarly}
  zenodo.org: {type: dataset, family: artifacts}
  figshare.com: {type: dataset, family: artifacts}
  osf.io: {type: dataset, family: artifacts}
  kaggle.com: {type: dataset, family: artifacts}
  tensorflow.org: {type: docs, family: documentation}
  pytorch.org: {type: docs, family: documentation}
  openai.com: {type: org_page, family: organization}
  anthropic.com: {type: org_page, family: organization}
  deepmind.com: {type: org_page, family: organization}
  nature.com: {type: journal_page, family: scholarly}
  science.org: {type: journal_page, family: scholarly}
  plos.org: {type: journal_page, family: scholarly}
  jmlr.org: {type: journal_page, family: scholarly}
  neurips.cc: {type: venue_page, family: scholarly}
  mindmodeling.org: {type: venue_page, family: scholarly}

fallback:
  type: other
  family: unclassified
