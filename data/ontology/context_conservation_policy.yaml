schema_version: context-conservation-policy.v1
policy_id: acap-context-conservation-diagnostic-v1
# Diagnostic quality relations. Hard identity, grounding and D127 invariants
# remain typed Rust contracts and cannot be weakened here.
minimum_text_retention_bps:
  parse_to_revision_materialization: 10000
  parse_to_extraction_compute: 10000
  revision_materialization_to_summary: 500
minimum_section_grounding_bps: 9500
maximum_navigation_noise_bps: 1000
navigation_noise_titles:
  - references
  - bibliography
  - table of contents
  - contents
  - navigation
  - acknowledgements
