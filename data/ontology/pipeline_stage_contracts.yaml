schema_version: pipeline-stage-contracts.v1
import_eligible: false
stages:
  - id: acquisition
    owner: adapter
    input_semantics: [article_locator]
    output_semantics: [checksum_bound_source_assets]
    depends_on: []
    context_adds: [durable_pdf_html_tex_bytes, source_checksums, canonical_source_identity]
    context_losses: [remote_transport_headers]
    hard_invariants: [network_requires_explicit_authorization, atomic_publication, import_eligible_false]
    consumers: [catalog, parse]
    cache_mode: durable_artifact
    failure_class: retryable_or_terminal_source_error
    conditional: false
    graph_truth_boundary: false
    acap_layer: source_registered
  - id: catalog
    owner: adapter
    input_semantics: [checksum_bound_source_assets]
    output_semantics: [canonical_article_metadata]
    depends_on: [acquisition]
    context_adds: [source_variant_roles, catalog_provenance, topic_category]
    context_losses: [none]
    hard_invariants: [versionless_lookup_preserves_versioned_provenance, readiness_not_claimed, import_eligible_false]
    consumers: [parse, assurance]
    cache_mode: durable_artifact
    failure_class: terminal_checksum_or_identity_conflict
    conditional: false
    graph_truth_boundary: false
    acap_layer: source_verified
  - id: parse
    aliases: [grobid_parse, html_parse, parsed_artifact, document_context, figure_detect]
    owner: adapter
    input_semantics: [canonical_source_asset]
    output_semantics: [parsed_article]
    depends_on: [catalog]
    context_adds: [title, abstract, ordered_sections, citations, structural_spans]
    context_losses: [pixels, unselected_layout_signals]
    hard_invariants: [source_checksum_in_cache_key, parser_profile_in_config_fingerprint, output_schema_bound]
    consumers: [revision_materialization, extraction_compute, embedding, figure_context, table_fidelity, equation_extraction]
    cache_mode: pure_compute
    failure_class: retryable_sidecar_or_terminal_parse_error
    conditional: false
    graph_truth_boundary: false
    acap_layer: parsed
  - id: figure_context
    aliases: [figure_context_artifact]
    owner: application
    input_semantics: [parsed_article, detected_visual_artifacts]
    output_semantics: [grounded_figure_semantic_context]
    depends_on: [parse]
    context_adds: [caption, section_identity, reference_excerpts, artifact_identity]
    context_losses: [unselected_layout_signals]
    hard_invariants: [candidate_not_authoritative, revision_section_grounding, output_schema_bound, import_eligible_false]
    consumers: [figure_analysis, candidate_materialization, assurance]
    cache_mode: pure_compute
    failure_class: terminal_grounding_or_policy_error
    conditional: true
    graph_truth_boundary: false
    acap_layer: structured
  - id: figure_analysis
    owner: application
    input_semantics: [grounded_figure_semantic_context, figure_image_asset]
    output_semantics: [typed_figure_candidate_payload]
    depends_on: [figure_context]
    context_adds: [schema_selection, model_route, typed_visual_evidence, confidence]
    context_losses: [raw_pixels]
    hard_invariants: [candidate_not_authoritative, schema_registry_bound, model_route_bound, import_eligible_false]
    consumers: [candidate_materialization, assurance]
    cache_mode: pure_compute
    failure_class: retryable_llm_or_terminal_schema_error
    conditional: true
    graph_truth_boundary: false
    acap_layer: extracted
  - id: table_fidelity
    owner: application
    input_semantics: [parsed_article_tei_tables, visual_table_payload]
    output_semantics: [typed_table_fidelity_report]
    depends_on: [parse]
    context_adds: [cell_provenance, typed_conflicts, coverage, source_spans]
    context_losses: [unmentioned_cells]
    hard_invariants: [candidate_only_fidelity, typed_findings, import_eligible_false]
    consumers: [candidate_materialization, assurance]
    cache_mode: pure_compute
    failure_class: terminal_fidelity_or_identity_error
    conditional: true
    graph_truth_boundary: false
    acap_layer: evidence_linked
  - id: equation_extraction
    owner: adapter
    input_semantics: [parsed_article_tei_formulas]
    output_semantics: [typed_equation_candidate_inputs]
    depends_on: [parse]
    context_adds: [representation_kind, source_spans, section_identity, coordinates]
    context_losses: [none]
    hard_invariants: [candidate_not_authoritative, typed_missingness, import_eligible_false]
    consumers: [candidate_materialization, assurance]
    cache_mode: pure_compute
    failure_class: retryable_sidecar_or_terminal_extraction_error
    conditional: true
    graph_truth_boundary: false
    acap_layer: embedded
  - id: revision_materialization
    owner: application
    input_semantics: [parsed_article, revision_content_context]
    output_semantics: [revision_scoped_graph_content]
    depends_on: [parse]
    context_adds: [paper_revision_identity, source_manifestations, ordinal_sections, content_identity]
    context_losses: [none]
    hard_invariants: [paper_is_versionless_work, mutable_content_owned_by_revision, exact_source_vids, replay_idempotent, import_eligible_false]
    consumers: [extraction_materialization, summary, readiness, query]
    cache_mode: graph_materialize
    failure_class: terminal_identity_or_graph_error
    conditional: false
    graph_truth_boundary: true
    acap_layer: structured
  - id: extraction_compute
    aliases: [extract, rule_extract]
    owner: adapter
    input_semantics: [parsed_article]
    output_semantics: [extracted_entity_candidates]
    depends_on: [parse]
    context_adds: [typed_mentions, spans, section_ordinals, confidence]
    context_losses: [unmentioned_prose]
    hard_invariants: [candidate_not_authoritative, implementation_and_config_in_cache_key, output_schema_bound]
    consumers: [extraction_materialization, evaluation]
    cache_mode: pure_compute
    failure_class: terminal_extractor_error
    conditional: false
    graph_truth_boundary: false
    acap_layer: extracted
  - id: extraction_materialization
    aliases: [entity_papers_artifact]
    owner: application
    input_semantics: [extracted_entity_candidates, revision_scoped_graph_content]
    output_semantics: [grounded_entity_evidence_graph]
    depends_on: [revision_materialization, extraction_compute]
    context_adds: [entity_nodes, mentions_edges, found_in_revision_sections, evidence]
    context_losses: [none]
    hard_invariants: [section_ordinal_grounding, graph_materialization_never_skipped_by_compute_cache, replay_idempotent, import_eligible_false]
    consumers: [cluster, resolution, assurance, query]
    cache_mode: graph_materialize
    failure_class: terminal_graph_error
    conditional: false
    graph_truth_boundary: true
    acap_layer: evidence_linked
  - id: candidate_materialization
    owner: application
    input_semantics: [revision_scoped_graph_content, typed_candidate_payloads]
    output_semantics: [candidate_evidence_graph]
    depends_on: [revision_materialization, figure_context, figure_analysis, table_fidelity, equation_extraction]
    context_adds: [candidate_nodes, typed_conflict_evidence, replay_diagnostics, lineage_edges]
    context_losses: [none]
    hard_invariants: [candidate_not_graph_truth, authoritative_false, import_eligible_false, replay_idempotent, grounding_never_invented, D127_false]
    consumers: [assurance, query]
    cache_mode: graph_materialize
    failure_class: terminal_graph_error
    conditional: true
    graph_truth_boundary: false
    candidate_only: true
  - id: embedding
    aliases: [embed, paper_embed]
    owner: adapter
    input_semantics: [parsed_article_or_entity_text]
    output_semantics: [typed_dense_vector]
    depends_on: [parse]
    context_adds: [semantic_similarity_signal]
    context_losses: [lexical_explainability]
    hard_invariants: [model_and_dimensions_bound, no_nan, batch_equals_single, candidate_signal_only]
    consumers: [vector_index, retrieval]
    cache_mode: pure_compute
    failure_class: retryable_embedder_or_terminal_dimension_error
    conditional: true
    graph_truth_boundary: false
    acap_layer: embedded
  - id: summary
    aliases: [summaries_artifact]
    owner: application
    input_semantics: [revision_scoped_graph_content]
    output_semantics: [grounded_revision_summary]
    depends_on: [revision_materialization]
    context_adds: [role_selected_extracts, evidence_section_vids]
    context_losses: [nonselected_prose]
    hard_invariants: [revision_owned, data_driven_roles, evidence_required, no_llm_authority]
    consumers: [readiness, query, assurance]
    cache_mode: graph_materialize
    failure_class: terminal_grounding_or_policy_error
    conditional: true
    graph_truth_boundary: true
    acap_layer: summarized
  - id: readiness
    owner: application
    input_semantics: [revision_scoped_graph_content, grounded_revision_summary]
    output_semantics: [derived_revision_readiness]
    depends_on: [revision_materialization, summary]
    context_adds: [deterministic_missingness_and_policy_evidence]
    context_losses: [none]
    hard_invariants: [derived_not_authoritative, revision_scoped, policy_digest_bound]
    consumers: [assurance, query]
    cache_mode: graph_materialize
    failure_class: terminal_policy_or_evidence_error
    conditional: true
    graph_truth_boundary: true
  - id: cluster
    aliases: [cluster_detection]
    owner: application
    input_semantics: [grounded_entity_evidence_graph]
    output_semantics: [concept_cluster_assignments]
    depends_on: [extraction_materialization]
    context_adds: [cross_article_concept_structure]
    context_losses: [within_cluster_distinctions]
    hard_invariants: [deterministic_configuration, candidate_only_until_verified, report_lineage_bound]
    consumers: [resolution, assurance, retrieval]
    cache_mode: durable_artifact
    failure_class: terminal_configuration_or_evidence_error
    conditional: true
    graph_truth_boundary: false
  - id: resolution
    owner: application
    input_semantics: [grounded_entity_evidence_graph, concept_cluster_assignments]
    output_semantics: [identity_resolution_decisions]
    depends_on: [extraction_materialization, cluster]
    context_adds: [cross_document_identity_links, ambiguity_evidence]
    context_losses: [candidate_alias_surface_forms]
    hard_invariants: [no_self_confirm, atomic_evidence, data_policy_bound]
    consumers: [assurance, retrieval, query]
    cache_mode: durable_artifact
    failure_class: terminal_policy_or_identity_conflict
    conditional: true
    graph_truth_boundary: false
    acap_layer: resolved
  - id: assurance
    owner: application
    input_semantics: [pipeline_stage_evidence]
    output_semantics: [article_and_corpus_assurance]
    depends_on: [catalog, revision_materialization, extraction_materialization]
    context_adds: [hard_invariant_results, missingness, lineage, replay_evidence]
    context_losses: [none]
    hard_invariants: [hard_failures_separate_from_scores, exact_lineage, no_claim_for_missing_evidence, D127_false]
    consumers: [checkpoint, support]
    cache_mode: none
    failure_class: terminal_assurance_block
    conditional: false
    graph_truth_boundary: false
  - id: checkpoint
    owner: application
    input_semantics: [article_and_corpus_assurance]
    output_semantics: [sealed_checkpoint_package]
    depends_on: [assurance]
    context_adds: [exact_physical_and_semantic_snapshot_lineage]
    context_losses: [none]
    hard_invariants: [package_digest_bound, exact_derivation_continuity, D127_false]
    consumers: [acceptance, query]
    cache_mode: durable_artifact
    failure_class: terminal_lineage_or_gate_error
    conditional: false
    graph_truth_boundary: false
    acap_layer: accepted_checkpoint
  - id: query
    owner: application
    input_semantics: [sealed_checkpoint_package, revision_scoped_graph_content]
    output_semantics: [grounded_article_or_corpus_answer]
    depends_on: [checkpoint]
    context_adds: [selected_grounded_context, retrieval_diagnostics]
    context_losses: [unselected_candidates]
    hard_invariants: [readonly_policy, revision_selection_explicit, evidence_vids_returned, no_hidden_fallback]
    consumers: [cli, mcp]
    cache_mode: none
    failure_class: terminal_policy_or_not_found
    conditional: false
    graph_truth_boundary: false
stage_invariant_dispositions:
  schema_version: stage-invariant-dispositions.v1
  reason_vocabulary:
    review_only_commitment: "The invariant is a design commitment a human reviewer must adjudicate, and the pipeline emits no runtime fact that can decide it."
    evidence_not_yet_emitted: "The pipeline does not yet emit the durable evidence the invariant would need to be computed on a run."
    declaration_bound_at_load_time: "The invariant is fixed by the ledger or registry declaration when it is loaded, so it is enforced by declaration validation rather than per-run computation."
  records:
    graph_materialization_never_skipped_by_compute_cache:
      disposition: checked
      check_id: graph_materialization_never_skipped_by_compute_cache
    import_eligible_false:
      disposition: checked
      check_id: import_eligible_false
    D127_false:
      disposition: checked
      check_id: D127_false
    candidate_not_authoritative:
      disposition: checked
      check_id: candidate_not_authoritative
    authoritative_false:
      disposition: checked
      check_id: authoritative_false
    derived_not_authoritative:
      disposition: checked
      check_id: derived_not_authoritative
    candidate_not_graph_truth:
      disposition: checked
      check_id: candidate_not_graph_truth
    replay_idempotent:
      disposition: checked
      check_id: replay_idempotent
    no_nan:
      disposition: checked
      check_id: no_nan
    typed_missingness:
      disposition: checked
      check_id: typed_missingness
    output_schema_bound:
      disposition: checked
      check_id: output_schema_bound
    model_and_dimensions_bound:
      disposition: checked
      check_id: model_and_dimensions_bound
    source_checksum_in_cache_key:
      disposition: checked
      check_id: source_checksum_in_cache_key
    implementation_and_config_in_cache_key:
      disposition: checked
      check_id: implementation_and_config_in_cache_key
    parser_profile_in_config_fingerprint:
      disposition: checked
      check_id: parser_profile_in_config_fingerprint
    policy_digest_bound:
      disposition: checked
      check_id: policy_digest_bound
    package_digest_bound:
      disposition: checked
      check_id: package_digest_bound
    report_lineage_bound:
      disposition: checked
      check_id: report_lineage_bound
    data_policy_bound:
      disposition: checked
      check_id: data_policy_bound
    evidence_required:
      disposition: checked
      check_id: evidence_required
    network_requires_explicit_authorization:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "Acquisition authorisation is an operator decision recorded in a run override, so no pipeline stage emits a durable boolean to evaluate."
    atomic_publication:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "No stage currently emits a durable publication-transaction record, so atomicity cannot be observed on a run."
    versionless_lookup_preserves_versioned_provenance:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "The catalog resolver returns provenance only for versioned filenames, so a versionless fallback carries no durable evidence to assert preservation."
    readiness_not_claimed:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Readiness is a derived report field, not an emitted stage artifact, so a claim-vs-no-claim predicate has no fact to read."
    revision_section_grounding:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Figure context grounding is stored inside the candidate payload and never surfaced as a per-run groundedness observation."
    schema_registry_bound:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: declaration_bound_at_load_time
      decision_ref: D556
      rationale: "The figure schema registry identity is fixed by the DATA prompt registry at load, so no per-run observation carries it."
    model_route_bound:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: declaration_bound_at_load_time
      decision_ref: D556
      rationale: "The model route is resolved from the DATA model registry at composition, and the pipeline records no route-identity fact per stage."
    candidate_only_fidelity:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "Fidelity of a candidate payload is a review judgement over the emitted artifact, and no numeric predicate is emitted."
    typed_findings:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Table and equation findings are emitted as typed values, but no stage observation aggregates a typed-findings flag."
    paper_is_versionless_work:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: declaration_bound_at_load_time
      decision_ref: D556
      rationale: "Paper-as-work identity is a domain declaration fixed by the locator, so no run emits a fact asserting it."
    mutable_content_owned_by_revision:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Revision ownership is enforced by the materialization API contract rather than by an emitted per-run observation."
    exact_source_vids:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Source VIDs are computed inside materialization, and the stage does not return a facts object carrying them."
    section_ordinal_grounding:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "The section ordinal is stored in the materialized node, not returned as an observation the evaluator can read."
    grounding_never_invented:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "Whether a span was invented rather than excerpted is a review judgement, and the pipeline emits no provenance predicate for it."
    batch_equals_single:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Batch and single ingest paths are separate surfaces, and no stage observation compares the two runs."
    candidate_signal_only:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "Candidate-only signalling is declared in the stage contract, and no runtime observation asserts the signal boundary."
    revision_owned:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Summary revision ownership is a declaration on the artifact, and no run emits a revision-ownership boolean."
    data_driven_roles:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: declaration_bound_at_load_time
      decision_ref: D556
      rationale: "Roles are data fixed by the ledger declaration at load time, not a per-run computed fact."
    no_llm_authority:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "There is no executable fact that distinguishes an LLM-derived value from an authoritative one at runtime."
    revision_scoped:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Revision scoping is enforced by query construction, and the pipeline does not emit a scope predicate."
    deterministic_configuration:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: declaration_bound_at_load_time
      decision_ref: D556
      rationale: "Configuration determinism is a property of the load-time declaration, not an observed run fact."
    candidate_only_until_verified:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "Verification promotion is a governance process outside the pipeline, and no run observation records it."
    no_self_confirm:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "A report cannot observe that it did not confirm itself, so this needs an external reviewer rather than a runtime predicate."
    atomic_evidence:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Evidence writes are atomic by adapter implementation, and no durable per-run atomicity record is emitted."
    hard_failures_separate_from_scores:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "The assurance report keeps hard failures and scores in separate fields, but no stage emits that separation as a fact."
    exact_lineage:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Lineage digests are bound inside the report structure and are not surfaced as an observation the evaluator reads."
    no_claim_for_missing_evidence:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Missing-evidence no-claim is a report-rendering rule, and no stage emitter publishes a claim flag to check."
    exact_derivation_continuity:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Derivation continuity is asserted by the checkpoint package structure, and no per-run observation carries it."
    readonly_policy:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "Read-only query policy is enforced by the store mode rather than by an emitted predicate."
    revision_selection_explicit:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Explicit revision selection is a query-construction rule, and no run observation records which revision was chosen."
    evidence_vids_returned:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: evidence_not_yet_emitted
      decision_ref: D556
      rationale: "Returned evidence VIDs are computed at query time and are not persisted as a stage observation."
    no_hidden_fallback:
      disposition: downgraded
      owner: M516-th0oby/S08
      reason: review_only_commitment
      decision_ref: D556
      rationale: "There is no emitted fact distinguishing an explicit result from a hidden fallback, so this remains a review commitment."
