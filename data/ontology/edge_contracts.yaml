# External meta-ontology: edge endpoint contracts (ADR-050 / M324 / M326).
# DATA not code — edit here when ontology changes; Rust is fallback only.
# wire strings must match da_domain::relation::* constants / graph storage.
#
# temporal_class (ADR-046 / GRAPH-CORE-TEMPORAL-DESIGN):
#   structural — composition/provenance; only created_at; no invalidation race
#   fact       — assertion that can become false; full 5-field TemporalEdge
#                (valid_at, invalid_at, expired_at, reference_time, created_at)
edge_contracts:
  - edge_constant: AFFILIATED_WITH
    source_label: Author
    target_labels: [Institution]
    temporal_class: fact
    rationale: "Author is affiliated with an institution (OpenAlex authorship)."
  - edge_constant: CITES
    source_label: Paper
    target_labels: [Citation]
    temporal_class: fact
    rationale: "Paper cites a bibliographic citation (resolvable to a Paper)."
  - edge_constant: CITES
    source_label: PaperRevision
    target_labels: [Citation]
    temporal_class: fact
    rationale: "Immutable article revision cites this deduped Citation (additive revision-owned edge, PIR-011)."
  - edge_constant: authoredBy
    source_label: Author
    target_labels: [Paper]
    temporal_class: structural
    rationale: "Author authored the Paper (OpenAlex authorship)."
  - edge_constant: foundIn
    source_label: Entity
    target_labels: [Section]
    temporal_class: structural
    rationale: "Entity was extracted from this Section of the Paper."
  - edge_constant: FROM_SOURCE
    source_label: Paper
    target_labels: [Source]
    temporal_class: structural
    rationale: "Paper originated from this Source (provenance)."
  - edge_constant: hasPart
    source_label: Paper
    target_labels: [Section, Reference]
    temporal_class: structural
    rationale: "Paper has this Section/Reference as a structural part (FaBiO frbr:part)."
  - edge_constant: hasPart
    source_label: PaperRevision
    target_labels: [Section, Reference]
    temporal_class: structural
    rationale: "Immutable article revision has this revision-scoped Section/Reference as a structural part (ADR-058 PIR-011, additive revision-owned edges)."
  - edge_constant: HAS_REVISION
    source_label: Paper
    target_labels: [PaperRevision]
    temporal_class: structural
    rationale: "Canonical scholarly work has this immutable revision expression (ADR-058)."
  - edge_constant: HAS_MANIFESTATION
    source_label: PaperRevision
    target_labels: [SourceManifestation]
    temporal_class: structural
    rationale: "Article revision is represented by this captured PDF, HTML, TEI, or TeX manifestation (ADR-058)."
  - edge_constant: hasTopic
    source_label: Paper
    target_labels: [Topic]
    temporal_class: structural
    rationale: "Paper is classified under this Topic (OpenAlex topic assignment)."
  - edge_constant: inCategory
    source_label: Paper
    target_labels: [Category]
    temporal_class: structural
    rationale: "Paper is in this arXiv/OpenAlex Category."
  - edge_constant: MEMBER_OF_CLUSTER
    source_label: Entity
    target_labels: [ConceptCluster]
    temporal_class: fact
    rationale: "Entity is a member of this ConceptCluster (membership can change)."
  - edge_constant: MENTIONS
    source_label: Paper
    target_labels: [Entity, Method, Dataset, Metric, ResearchProblem, MetricObservation]
    temporal_class: fact
    rationale: "Paper mentions this Entity or first-class typed semantic node, grounded by extraction or structured summary evidence."
  - edge_constant: PARTICIPATES_IN
    source_label: Entity
    target_labels: [EvidenceBundle]
    temporal_class: fact
    rationale: "Entity participates in this EvidenceBundle (co-occurring entities)."
  - edge_constant: SUPPORTS
    source_label: EvidenceBundle
    target_labels: [Claim]
    temporal_class: fact
    rationale: "EvidenceBundle supports this Claim."
  - edge_constant: SUPERSEDES
    source_label: Entity
    target_labels: [Entity]
    temporal_class: fact
    rationale: "Source Entity supersedes target Entity (D135 merge scenario)."
  - edge_constant: SUPERSEDES
    source_label: PaperRevision
    target_labels: [PaperRevision]
    temporal_class: fact
    rationale: "Newer observed article revision supersedes the previous observed revision without deleting history (ADR-058)."
  # ─── Decision plane (ADR-048 causal primitives) ───
  # Six decision audit and causal edges scoped to scientific KG use.
  # All temporal_class=fact: causal claims can be revised (wrong attribution,
  # later correction, retracted reasoning). Decision is the actor;
  # Conflict is active. Policy/HealingAction/ExtractionOverride are planned
  # ADR endpoints and MUST NOT be presented as active runtime capability.
  - edge_constant: CAUSED
    source_label: Decision
    target_labels: [Decision]
    temporal_class: fact
    rationale: "Decision A caused Decision B (strong causal link). Transitive: a causal chain."
  - edge_constant: AFFECTS
    source_label: Decision
    target_labels: [Entity]
    temporal_class: fact
    rationale: "Decision directly affected an Entity while preserving the reviewed audit trail (ADR-053 Layer G)."
  - edge_constant: INFLUENCED
    source_label: Decision
    target_labels: [Decision]
    temporal_class: fact
    rationale: "Decision A was a factor in Decision B (weak causal link). Non-transitive."
  - edge_constant: PRECEDENT_FOR
    source_label: Decision
    target_labels: [Decision]
    temporal_class: fact
    rationale: "Decision A is a precedent cited by Decision B (analogical reference)."
  - edge_constant: TRIGGERED_BY
    source_label: Decision
    target_labels: [Conflict]
    temporal_class: fact
    rationale: "Decision was triggered by this registered Conflict event (ADR-044/047 tie-in)."
  - edge_constant: TRIGGERED_BY
    source_label: Decision
    target_labels: [HealingAction, ExtractionOverride]
    temporal_class: fact
    implementation_status: planned
    rationale: "Planned ADR-044/047 trigger endpoints; inactive until schemas and materializers ship."
  - edge_constant: AUTHORITY_FOR
    source_label: Policy
    target_labels: [Decision]
    temporal_class: fact
    implementation_status: planned
    rationale: "Planned Phase 2 Policy authority edge; Phase 1 keeps policy_id as an opaque string."
  # ─── ADR-053 Article Preparation 2.0 edges (M362 Wave 1 Layer A implemented) ───
  # next_sibling / first_child / parent_section are implemented in
  # crates/da-domain/src/relation.rs::structure (M362 S01 T03) as structural
  # edges (temporal_class=structural). Remaining edges below are forward
  # declarations for Waves 2-3 (Layers B/C/F/I/J) and use YAML as planning
  # source until Rust constants land.
  - edge_constant: next_sibling
    source_label: Section
    target_labels: [Section]
    temporal_class: structural
    rationale: "Section navigation tree (ADR-053 Layer A): next sibling in same parent."
  - edge_constant: first_child
    source_label: Section
    target_labels: [Section]
    temporal_class: structural
    rationale: "Section navigation tree (ADR-053 Layer A): first child of this section."
  - edge_constant: parent_section
    source_label: Section
    target_labels: [Section]
    temporal_class: structural
    rationale: "Section navigation tree (ADR-053 Layer A): parent section in the document hierarchy."

  # ─── ADR-053 Layer B: Summary edge (D194 Wave 1) ───
  - edge_constant: hasSummary
    source_label: Paper
    target_labels: [Summary]
    temporal_class: structural
    rationale: "Legacy work-level digest only; revision-mutable article summaries belong to PaperRevision."
  - edge_constant: hasSummary
    source_label: PaperRevision
    target_labels: [Summary]
    temporal_class: structural
    rationale: "Immutable article revision expression to its grounded abstract digest (ADR-058, D224)."
  - edge_constant: hasSummary
    source_label: Section
    target_labels: [Summary]
    temporal_class: structural
    rationale: "Section to path-identity-linked section digest (ADR-053 Layer B)."
  - edge_constant: hasQualitySignal
    source_label: Paper
    target_labels: [QualitySignal]
    temporal_class: fact
    rationale: "Legacy work-level typed quality signal; this evidence is not a Summary and may be revised."
  - edge_constant: hasQualitySignal
    source_label: PaperRevision
    target_labels: [QualitySignal]
    temporal_class: fact
    rationale: "Revision-scoped readiness and quality evidence with explicit policy/evidence identity (D225)."

  # ─── ADR-053 Layer F: Cross-paper patterns (D194 Wave 2) ───
  - edge_constant: predecessor_of
    source_label: Method
    target_labels: [Method]
    temporal_class: structural
    rationale: "Method lineage: A predecessor_of B means A builds on / extends B. Enables PageRank on Method influence graph and agent gap analysis."
