schema_version: structural-type-detectors.v1
types:
  abstract:
    patterns:
    - (?i)^(abstract|a\s*b\s*s\s*t\s*r\s*a\s*c\s*t)$
  introduction:
    patterns:
    - (?i)^introduction
    - (?i)^motivation
    - (?i)^background$
  related_work:
    patterns:
    - (?i)^related work
    - (?i)^literature review
    - (?i)^prior work
  methodology:
    patterns:
    - (?i)^method
    - (?i)^approach
    - (?i)^our (method|approach|framework)
    - (?i)^model
    - (?i)^algorithm
    - (?i)^formulation
    - (?i)^problem statement
    - (?i)^setup
  experiments:
    patterns:
    - (?i)^experiment
    - (?i)^evaluation
    - (?i)^empirical
  results:
    patterns:
    - (?i)^result
    - (?i)^finding
    - (?i)^main result
  discussion:
    patterns:
    - (?i)^discussion
    - (?i)^analysis
    - (?i)^ablation
  conclusion:
    patterns:
    - (?i)^conclusion
    - (?i)^summary and conclusion
    - (?i)^final remark
  limitations:
    patterns:
    - (?i)^limitation
    - (?i)^threats to validity
  references:
    patterns:
    - (?i)^reference
    - (?i)^bibliography
    - (?i)^work cited
  appendix:
    patterns:
    - (?i)^appendix
    - (?i)^supplementary
    - (?i)^additional
  acknowledgments:
    patterns:
    - (?i)^acknowledg
  author_info:
    patterns:
    - (?i)^author
    - (?i)^contributor
    - (?i)^conflict of interest
    - (?i)^data availability
  research_agenda:
    patterns:
    - (?i)^the research agenda
    - (?i)^research agenda
    - (?i)^roadmap
    - (?i)^future directions
    - (?i)^open (problems|questions)
    - (?i)^agenda$
    note: 'genre marker: position/vision paper (ADR-069). Essayistic heading distribution
      + agenda marker switches extraction to global structural passes.'
  existence_proof:
    patterns:
    - (?i)^existence proofs?
    - (?i)^two existence proofs
    - (?i)^proof of concept
    - (?i)^feasibility (study|proof)
    note: 'genre marker: claims demonstrated via controlled studies outside Results
      sections (vision-paper analogue of experiments).'
  vision:
    patterns:
    - (?i)^the vision
    - (?i)^a vision for
    - (?i)^manifesto
    - (?i)^position (paper|statement)
    - (?i)^the dream
    - (?i)^what if
    note: 'genre marker: essayistic thesis sections.'
  compilation_contract:
    patterns:
    - (?i)^contracts? and guarantees
    - (?i)^guarantees
    - (?i)^the deal
    note: 'contract-table sections: claims with guarantees/enforced-by/shown (system
      papers).'
  related_surveys:
    patterns:
    - (?i)^related surveys?
    - (?i)^survey of (related|existing)
    - (?i)^state of the art
    note: 'genre marker: survey/review paper (specimen 2512.00107: 39 centrality measures
      survey).'
  scope_contributions:
    patterns:
    - (?i)^scope and contributions?
    - (?i)^contributions?
    - (?i)^paper outline
    - (?i)^outline$
    note: 'genre marker: survey front-matter (scope+outline sections before the body).'
fallback: body
