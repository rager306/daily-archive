schema_version: structural-type-detectors.v1
types:
  abstract:
    patterns:
    - ^(abstract|a\s*b\s*s\s*t\s*r\s*a\s*c\s*t)$
  introduction:
    patterns:
    - ^introduction
    - ^motivation
    - ^background$
  related_work:
    patterns:
    - ^related work
    - ^literature review
    - ^prior work
  methodology:
    patterns:
    - ^method
    - ^approach
    - ^our (method|approach|framework)
    - ^model
    - ^algorithm
    - ^formulation
    - ^problem statement
    - ^setup
  experiments:
    patterns:
    - ^experiment
    - ^evaluation
    - ^empirical
  results:
    patterns:
    - ^result
    - ^finding
    - ^main result
  discussion:
    patterns:
    - ^discussion
    - ^analysis
    - ^ablation
  conclusion:
    patterns:
    - ^conclusion
    - ^summary and conclusion
    - ^final remark
  limitations:
    patterns:
    - ^limitation
    - ^threats to validity
  references:
    patterns:
    - ^reference
    - ^bibliography
    - ^work cited
  appendix:
    patterns:
    - ^appendix
    - ^supplementary
    - ^additional
  acknowledgments:
    patterns:
    - ^acknowledg
  author_info:
    patterns:
    - ^author
    - ^contributor
    - ^conflict of interest
    - ^data availability
fallback: body
