schema_version: structural-type-detectors.v1
types:
  abstract:
    patterns:
    - (?i)^(abstract|a\s*b\s*s\s*t\s*r\s*a\s*c\s*t)$
  introduction:
    patterns:
    - (?i)^introduction
    - (?i)^motivation
    - (?i)^background$
  related_work:
    patterns:
    - (?i)^related work
    - (?i)^literature review
    - (?i)^prior work
  methodology:
    patterns:
    - (?i)^method
    - (?i)^approach
    - (?i)^our (method|approach|framework)
    - (?i)^model
    - (?i)^algorithm
    - (?i)^formulation
    - (?i)^problem statement
    - (?i)^setup
  experiments:
    patterns:
    - (?i)^experiment
    - (?i)^evaluation
    - (?i)^empirical
  results:
    patterns:
    - (?i)^result
    - (?i)^finding
    - (?i)^main result
  discussion:
    patterns:
    - (?i)^discussion
    - (?i)^analysis
    - (?i)^ablation
  conclusion:
    patterns:
    - (?i)^conclusion
    - (?i)^summary and conclusion
    - (?i)^final remark
  limitations:
    patterns:
    - (?i)^limitation
    - (?i)^threats to validity
  references:
    patterns:
    - (?i)^reference
    - (?i)^bibliography
    - (?i)^work cited
  appendix:
    patterns:
    - (?i)^appendix
    - (?i)^supplementary
    - (?i)^additional
  acknowledgments:
    patterns:
    - (?i)^acknowledg
  author_info:
    patterns:
    - (?i)^author
    - (?i)^contributor
    - (?i)^conflict of interest
    - (?i)^data availability
fallback: body
