version: "1"
# Candidate generation only. These locks are validated at load time.
auto_merge: false
auto_promote: false
same_type_only: true
max_block_size: 50
normalization_steps:
  - trim
  - collapse_whitespace
  - lowercase
blocking_keys:
  - exact
  - alphanumeric_fold
decision:
  category: healing_action
  scenario: entity-resolution-merge
  outcome: approved
