schema_version: prompt-task-registry.v1
optimizer_enabled: false
max_validation_gap_basis_points: 500
prompt_contract:
  schema_version: prompt-contract.v1
  authority: ADR-059
  policy_owner: data/ontology/prompt_tasks.yaml
  immutable_proof_boundary:
    clauses: [grounding, no_invention, candidate_only, evidence_binding, abstention]
    optimizer_may_change: [wording, ordering, examples]
    optimizer_may_not_change: [rule_id, authority, preconditions, evidence_obligations, verification_operations, candidate_only, import_eligible]
  rules:
    - rule_id: PR-SUM-001
      scope: article_summary.system_template
      authority: ADR-059
      preconditions: [grounded_article_text_present, output_schema_resolved]
      evidence_obligations: [ground_every_claim_in_source, no_invented_numbers_names_or_claims]
      verification_operations: [evidence.quote_verbatim, output.json_schema]
      optimizer_immutable: true
    - rule_id: PR-SUM-002
      scope: article_summary.system_template
      authority: ADR-059
      preconditions: [source_text_supplied]
      evidence_obligations: [populate_methods_metrics_datasets_only_from_source]
      verification_operations: [evidence.quote_verbatim]
      optimizer_immutable: true
    - rule_id: PR-FIG-001
      scope: figure_analysis.system_template
      authority: ADR-059
      preconditions: [grounded_context_present, figure_media_checksum_bound]
      evidence_obligations: [citations_are_verbatim, citation_identifiers_copied_from_context]
      verification_operations: [evidence.quote_verbatim, evidence.identifier_in_context, output.json_schema]
      optimizer_immutable: true
    - rule_id: PR-FIG-003
      scope: figure_analysis.system_template
      authority: ADR-059
      preconditions: [candidate_output_schema_resolved]
      evidence_obligations: [never_claim_graph_authority, relationship_endpoints_declared]
      verification_operations: [policy.candidate_only, output.json_schema]
      optimizer_immutable: true
    - rule_id: PR-CRIT-001
      scope: critic.system_prompt
      authority: ADR-059
      preconditions: [low_confidence_pairs_present, evidence_fields_present]
      evidence_obligations: [same_order_as_input, abstain_when_insufficient_evidence]
      verification_operations: [output.array_order, output.json_schema]
      optimizer_immutable: true
    - rule_id: PR-CRIT-002
      scope: critic.system_prompt
      authority: ADR-059
      preconditions: [pair_evidence_is_supplied]
      evidence_obligations: [ground_reason_in_supplied_fields, never_use_outside_knowledge]
      verification_operations: [evidence.identifier_in_context]
      optimizer_immutable: true
  task_rule_bindings:
    article_summary: [PR-SUM-001, PR-SUM-002]
    figure_analysis: [PR-FIG-001, PR-FIG-003]
    critic: [PR-CRIT-001, PR-CRIT-002]
  approved_verification_operations:
    - operation_id: evidence.quote_verbatim
      parameters: {source_field: string, quote: string, max_length: integer}
      result: evidence_ref
    - operation_id: evidence.identifier_in_context
      parameters: {context_field: string, identifier: string}
      result: evidence_ref
    - operation_id: output.json_schema
      parameters: {schema_id: string}
      result: validation_receipt
    - operation_id: output.array_order
      parameters: {input_count: integer, output_count: integer}
      result: validation_receipt
    - operation_id: policy.candidate_only
      parameters: {import_eligible: boolean, graph_authority: boolean}
      result: policy_receipt
  change_control:
    required_for_normative_change: [new_rule_id, authority_review, fixture_update, negative_mutation_pass]
    forbidden: [silent_rule_removal, authority_downgrade, evidence_obligation_removal, verification_operation_expansion]
  negative_mutation_cases:
    - case_id: mutate-remove-grounding
      target_rule_id: PR-SUM-001
      mutation: remove_grounding_obligation
      expected: reject
    - case_id: mutate-enable-authority
      target_rule_id: PR-FIG-003
      mutation: set_graph_authority_true
      expected: reject
    - case_id: mutate-free-form-verification
      target_rule_id: PR-CRIT-002
      mutation: replace_approved_operation_with_free_text
      expected: reject
    - case_id: mutate-remove-abstention
      target_rule_id: PR-CRIT-001
      mutation: remove_abstain_outcome
      expected: reject
routes:
  - route_policy_id: ninerouter-summary-default
    model_binding_id: paper-summary-generate-default
    endpoint_override_env: NINEROUTER_URL
    credential_env: NINEROUTER_KEY
    supports_images: false
    maximum_temperature_milli: 1000
  - route_policy_id: ninerouter-figure-primary
    model_binding_id: figure-qa-primary
    endpoint_override_env: NINEROUTER_URL
    credential_env: NINEROUTER_KEY
    supports_images: true
    maximum_temperature_milli: 1000
output_schemas:
  - output_schema_id: article-summary.v1
    schema:
      type: object
      additionalProperties: false
      required: [abstract_summary, section_summaries, methods, datasets, metrics, quantitative_results, limitations, reproducibility, tags]
      properties:
        abstract_summary: {type: string, minLength: 1}
        key_contributions: {type: array, items: {type: string}}
        section_summaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path_id, summary]
            properties:
              path_id: {type: string, minLength: 1}
              summary: {type: string, minLength: 1}
        methods: {type: array, items: {type: object, additionalProperties: false, required: [name, description], properties: {name: {type: string}, description: {type: string}}}}
        datasets: {type: array, items: {type: object, additionalProperties: false, required: [name, description], properties: {name: {type: string}, description: {type: string}}}}
        metrics: {type: array, items: {type: object, additionalProperties: false, required: [name, value, baseline], properties: {name: {type: string}, value: {type: string}, baseline: {type: string}}}}
        quantitative_results: {type: string}
        limitations: {type: string}
        future_work: {type: array, items: {type: string}}
        glossary:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [term, definition]
            properties:
              term: {type: string}
              definition: {type: string}
        reproducibility:
          type: object
          additionalProperties: false
          required: [score, justification]
          properties:
            score: {type: integer, minimum: 0, maximum: 5}
            justification: {type: string}
        reading_difficulty:
          type: object
          additionalProperties: false
          required: [score, target_audience]
          properties:
            score: {type: integer, minimum: 0, maximum: 5}
            target_audience: {type: string}
        tags: {type: array, items: {type: string}}
  - output_schema_id: figure-analysis-candidate.v1
    schema:
      type: object
      additionalProperties: false
      required: [visual_type, description, components, relationships, findings, citations, confidence]
      properties:
        visual_type: {type: string, enum: [flowchart, plot, diagram, table, screenshot, photograph, other]}
        description: {type: string}
        components:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, role, visual_evidence]
            properties:
              name: {type: string, minLength: 1}
              role: {type: string, minLength: 1}
              visual_evidence: {type: string, minLength: 1}
        relationships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_component, relation, target_component]
            properties:
              source_component: {type: string}
              relation: {type: string}
              target_component: {type: string}
        findings: {type: array, items: {type: string}}
        citations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [section_id, path_id, quote]
            properties:
              section_id: {type: string, minLength: 1}
              path_id: {type: string, minLength: 1}
              quote: {type: string, minLength: 1, maxLength: 4000}
        confidence: {type: number, minimum: 0.0, maximum: 1.0}
tasks:
  - task_id: article_summary
    version: summary.v1
    system_template: >-
      You are a scientific paper summarizer. Return only JSON conforming to the declared
      output schema. Ground every claim in the supplied article text and do not invent facts.
      Prefer verbatim or near-verbatim phrasing for method names, baselines, numeric results,
      efficiency claims, and budget/parameter statements that appear in the source. Populate
      methods/metrics/datasets only with names supported by the source text.
    user_template: >-
      Summarize article {paper_id}. Title: {title}. Abstract: {abstract}. Full text: {full_text}.
    output_schema_id: article-summary.v1
    route_policy_id: ninerouter-summary-default
    temperature_milli: 300
    max_output_tokens: 4096
    eval_suite_id: article-summary-eval.v1
    optimizer_enabled: false
  - task_id: figure_analysis
    version: figure-analysis.v3
    system_template: >-
      Analyze the supplied scientific figure image and caption. Return only JSON conforming to the declared candidate output schema. Never claim graph authority. Every citations[].quote must be a non-empty verbatim excerpt from the article text; keep each quote as short as faithful evidence allows — the output schema's maxLength is the hard ceiling, so never exceed it and never return null. Every citations[].section_id and path_id must be copied verbatim from the sections listed in the grounded context; never invent identifiers or formats. Every relationship endpoint must reference a component name declared in the components array.
    user_template: >-
      Analyze the attached scientific figure using this canonical grounded context: {grounded_context}
    output_schema_id: figure-analysis-candidate.v1
    route_policy_id: ninerouter-figure-primary
    temperature_milli: 0
    max_output_tokens: 8192
    eval_suite_id: figure-analysis-eval.v1
    optimizer_enabled: false
