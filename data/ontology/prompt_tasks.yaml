schema_version: prompt-task-registry.v1
optimizer_enabled: false
max_validation_gap_basis_points: 500
routes:
  - route_policy_id: ninerouter-summary-default
    model_binding_id: paper-summary-generate-default
    endpoint_override_env: NINEROUTER_URL
    credential_env: NINEROUTER_KEY
    supports_images: false
    maximum_temperature_milli: 1000
  - route_policy_id: ninerouter-figure-primary
    model_binding_id: figure-qa-primary
    endpoint_override_env: NINEROUTER_URL
    credential_env: NINEROUTER_KEY
    supports_images: true
    maximum_temperature_milli: 1000
output_schemas:
  - output_schema_id: article-summary.v1
    schema:
      type: object
      additionalProperties: false
      required: [abstract_summary, section_summaries, methods, datasets, metrics, quantitative_results, limitations, reproducibility, tags]
      properties:
        abstract_summary: {type: string, minLength: 1}
        key_contributions: {type: array, items: {type: string}}
        section_summaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path_id, summary]
            properties:
              path_id: {type: string, minLength: 1}
              summary: {type: string, minLength: 1}
        methods: {type: array, items: {type: object, additionalProperties: false, required: [name, description], properties: {name: {type: string}, description: {type: string}}}}
        datasets: {type: array, items: {type: object, additionalProperties: false, required: [name, description], properties: {name: {type: string}, description: {type: string}}}}
        metrics: {type: array, items: {type: object, additionalProperties: false, required: [name, value, baseline], properties: {name: {type: string}, value: {type: string}, baseline: {type: string}}}}
        quantitative_results: {type: string}
        limitations: {type: string}
        future_work: {type: array, items: {type: string}}
        glossary:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [term, definition]
            properties:
              term: {type: string}
              definition: {type: string}
        reproducibility:
          type: object
          additionalProperties: false
          required: [score, justification]
          properties:
            score: {type: integer, minimum: 0, maximum: 5}
            justification: {type: string}
        reading_difficulty:
          type: object
          additionalProperties: false
          required: [score, target_audience]
          properties:
            score: {type: integer, minimum: 0, maximum: 5}
            target_audience: {type: string}
        tags: {type: array, items: {type: string}}
  - output_schema_id: figure-analysis-candidate.v1
    schema:
      type: object
      additionalProperties: false
      required: [visual_type, description, components, relationships, findings, citations, confidence]
      properties:
        visual_type: {type: string, enum: [flowchart, plot, diagram, table, screenshot, photograph, other]}
        description: {type: string}
        components:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, role, visual_evidence]
            properties:
              name: {type: string, minLength: 1}
              role: {type: string, minLength: 1}
              visual_evidence: {type: string, minLength: 1}
        relationships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_component, relation, target_component]
            properties:
              source_component: {type: string}
              relation: {type: string}
              target_component: {type: string}
        findings: {type: array, items: {type: string}}
        citations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [section_id, path_id, quote]
            properties:
              section_id: {type: string, minLength: 1}
              path_id: {type: string, minLength: 1}
              quote: {type: string, minLength: 1, maxLength: 160}
        confidence: {type: number, minimum: 0.0, maximum: 1.0}
tasks:
  - task_id: article_summary
    version: summary.v1
    system_template: >-
      You are a scientific paper summarizer. Return only JSON conforming to the declared output schema. Ground every claim in the supplied article text and do not invent facts.
    user_template: >-
      Summarize article {paper_id}. Title: {title}. Abstract: {abstract}. Full text: {full_text}.
    output_schema_id: article-summary.v1
    route_policy_id: ninerouter-summary-default
    temperature_milli: 300
    max_output_tokens: 4096
    eval_suite_id: article-summary-eval.v1
    optimizer_enabled: false
  - task_id: figure_analysis
    version: figure-analysis.v1
    system_template: >-
      Analyze the supplied scientific figure image and caption. Return only JSON conforming to the declared candidate output schema. Never claim graph authority.
    user_template: >-
      Analyze the attached scientific figure using this canonical grounded context: {grounded_context}
    output_schema_id: figure-analysis-candidate.v1
    route_policy_id: ninerouter-figure-primary
    temperature_milli: 0
    max_output_tokens: 4096
    eval_suite_id: figure-analysis-eval.v1
    optimizer_enabled: false
