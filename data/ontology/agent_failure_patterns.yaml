our_adaptations:
  repair_obligation:
    description: |
      Главный перенос (F.4, 82.5%): critic reject-вердикт ОБЯЗАН триггерить
      repair, не только аннотацию. Метакогнитивный луп: нашёл → подействовал.
    implementation: "critic reject → перезапуск стадии → повторная оценка"
  cross_layer_consistency:
    description: |
      Insight 1: улики в run directory. У нас слои = артефакты. Сигналы
      должны сравнивать summary↔parsed, extracted↔equations, citations↔anchors.
    implementation: "summary_parsed_grounding сигнал (R1-детекция)"
  trajectory_pattern_annotation:
    description: |
      SONA-траектории маркируются паттернами (не только grounding).
      Router учится на ТИПАХ отказов.
    implementation: "TrajectoryRecord += failure_pattern: Option<String> (ref на patterns[].id)"
