# Cross-automata invalidation map — pointer, not a second map.
#
# GAR-014's bounded interaction map (invalidating inputs, local transitions,
# retry preconditions and non-authorizing states for the parse, maturity,
# assurance and learning automata) is DATA in the governor check contract:
#
#   scripts/governor/checks/fsm_interaction_map.yaml
#
# This file exists only so policy consumers that look under data/policies/ find
# the canonical path without carrying a rival copy. It must NOT declare
# `automata` or `invalidation_rules`: two independently maintained maps would
# let invalidation reasoning diverge, and the governor rule
# `fsm_interaction_map` fails closed on a duplicate (`fsm_interaction_map_duplicate_map`).
schema_version: fsm-interaction-map-ref.v1
canonical_map: scripts/governor/checks/fsm_interaction_map.yaml
superseded_by: >-
  GAR-014 remediation, M509-yzblqx/S04/T01 — earlier revisions carried an
  independent map (parse_workflow, evidence_maturity, authorization,
  article_assurance) with no learning/evaluation automaton, no retry
  preconditions, no non-authorizing state list and no governor binding.
