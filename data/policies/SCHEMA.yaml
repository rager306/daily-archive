schema_version: v2
path: data/policies
description: 'Versioned WASM FSM policy modules (ADR-074). Native fallback
  thresholds live in registry.yaml; .wasm/.wat artifacts are immutable by
  content hash. LoRA weights are D136-gated and must not appear here yet.'
adr_ref: ADR-074
valid_files:
- '*.yaml'
- '*.md'
- '*.wasm'
- '*.wat'
valid_subdirs:
- fixtures
- computer_science
- mathematics
- physics
- biology
- economics
ignore:
- .*
forbidden:
- '*.safetensors'
- '*.bin'
- '*.pt'
