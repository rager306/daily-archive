# ADR-074 FSM policy registry (DATA). Paths relative to repo root.
# Native thresholds apply when wasm/wat is missing or fails to load.
# D136: no LoRA weights in this file.
schema_version: v2
adr_ref: ADR-074
decision_points:
  grammar_route:
    wat: data/policies/fixtures/grammar_route.wat
    wasm: data/policies/fixtures/grammar_route.wasm
    # GrammarRoute -> FSM grammar_profile (source_import_fsm object_class).
    # xy_cut has no CLI yet: stamp intent, keep arxiv_pdf_dot parse path.
    default_profile: arxiv_pdf_dot
    profile_map:
      page_outline: page_outline
      xy_cut: arxiv_pdf_dot
      grobid_structural: arxiv_pdf_dot
    native:
      page_outline_min_pages: 50
      page_outline_min_bookmarks: 1
      grobid_max_text_quality: 0.4
  batch_admission:
    native:
      skip_if_pages_eq: 0
      defer_max_text_quality: 0.2
  concurrency_tune:
    native: {}
  retry_policy:
    native: {}
  summary_depth:
    native: {}
  profile_route:
    # Java GROBID REST profile. Not FSM grammar_profile.
    # structural = D204 corpus default (no Crossref). rich is named, not default.
    native:
      default: structural
