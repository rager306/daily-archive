schema_version: external-holdout-manifest.v1
description: External holdout articles NOT in gold_standard — for independent parity
  verification (GAR-015)
created: '2026-09-12'
default_state: bytes_present
# M512-lxafs8/S03/T04: the census is the WHOLE non-gold corpus, not a bounded
# sample. The executable rule in `--rederive` derives 825 PDF assets -> 806
# arXiv identities -> 196 gold exclusions -> 610 non-gold identities, and this
# list is exactly that derived sequence (ascending article_id), so the declared
# population is a derivation rather than an inventory (D453). The bounded
# `take_first` limit and the pilot-only `exclude.identities` exclusions that
# shaped the earlier 50-row sample are gone with it: a full census that omitted
# five documents it had already frozen would be a silent filter, not a census.
selection:
  rule_version: external-holdout-selection.v1
  corpus_root: data/sources/arxiv
  corpus_index: data/sources/arxiv/MANIFEST.yaml
  identity_rule: >-
    An asset's arXiv identity is the first name walking from the PDF stem up
    through its ancestor directories whose trailing version suffix (`vN`,
    N >= 1, no leading zero) is stripped and whose remainder matches
    `^\d{4}\.\d{4,5}$`; so `<cat>/<id>/source/original.pdf` inherits `<id>`
    and an `<id>vN` directory contributes revision N. When one identity has
    several assets the lowest revision wins (versionless counts as revision 0),
    then the lexicographically smallest repo-relative path breaks the remaining
    tie.
  exclude:
    gold_standard_glob: data/gold_standard/*.gold.json
    gold_identity_rule: file name with the trailing `.gold.json` removed
  ordering: ascending_article_id
  selected_at: '2026-09-25'
