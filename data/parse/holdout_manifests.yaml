schema_version: external-holdout-manifest.v1
description: External holdout articles NOT in gold_standard — for independent parity
  verification (GAR-015)
created: '2026-09-12'
default_state: bytes_present
# M512-lxafs8/S02/T02: deterministic composition rule for the 45 rows appended
# below. The five pre-existing pilot rows are unchanged. This block is DATA, not
# prose: re-running the rule against `corpus_root` reproduces exactly the same
# 45 identities, so the population is auditable rather than hand-picked.
selection:
  rule_version: external-holdout-selection.v1
  corpus_root: data/sources/arxiv
  corpus_index: data/sources/arxiv/MANIFEST.yaml
  identity_rule: >-
    An asset's arXiv identity is its PDF stem with a trailing version suffix
    (v1, v2, ...) stripped; `original.pdf` inherits the parent article
    directory's identity. When one identity has several assets the lowest
    revision wins (versionless counts as revision 0), then the
    lexicographically smallest repo-relative path breaks the remaining tie.
  exclude:
    gold_standard_glob: data/gold_standard/*.gold.json
    gold_identity_rule: file name with the trailing `.gold.json` removed
    identities:
    - '1203.2295'
    - '2401.17167'
    - '2411.07228'
    - '2505.16270'
    - '2608.22118'
  ordering: ascending_article_id
  take_first: 45
  selected_at: '2026-09-25'
