# ───── S08/T01: native CRF core profile and closed SIMD/PGO disposition ─────
#
# Sibling block only: no existing block above is mutated by this record.
# S03 recorded an UNMEASURED hot spot — `da_domain::scalar_crf::map_input`
# rebuilds a `BTreeMap` over the whole observation table and a `Vec<Vec<&str>>`
# of every input row on each call — while declared `da-domain` optimization as
# "not without separate proof". This block is that proof surface: it names the
# phases the profile must measure, the DATA threshold that decides whether a
# dense numeric kernel was found, and the closed disposition vocabulary.
# Nothing here adopts an optimization: `selection` stays forbidden in every
# sub-block, the PGO disposition stays `not_adopted`, and H05 (RSS/CPU/byte
# ceilings) is explicitly NOT closed by this slice.
native_core_qualification:
  schema_version: native-core-qualification.v1
  adr_ref: ADR-075
  requirement_ids: [R109, R085, R117]
  manifest_binding: data/parse/comparison_contract.yaml

  # Measurement plan. Timing is observational evidence: it is recorded in the
  # in-process receipt, marked observational, and excluded from the emitted
  # artifact bytes and from every acceptance denominator.
  profile:
    warmup_iterations: 2
    repetitions: 5
    percentiles:
      p50_ms: 50
      p95_ms: 95
      p99_ms: 99
    throughput_units_per_second: decoded_positions_per_second
    allocator:
      allocations: measured_delta_between_injected_snapshots
      allocated_bytes: measured_delta_between_injected_snapshots
    private_scratch:
      capacity_bytes: scratch_arena_capacity
      high_water_bytes: scratch_arena_high_water
    scalar_oracle: required
    selection_forbidden: true

  # `dense_numeric_kernel_found` is true only when an eligible phase is BOTH
  # numeric over declared-contiguous storage AND at or above `threshold` of the
  # measured native-core phase share. Phase vocabulary is closed: a phase name
  # outside `phase_kinds` is rejected by the reader, never ignored.
  dense_numeric_kernel_rule:
    rule_id: dense-contiguous-numeric-phase
    share_metric: phase_share_of_native_core
    threshold: 0.25
    requires_contiguous_numeric_arrays: true
    eligible_phases: [viterbi_decode]
    outcome_when_unmet: not_applicable
    phase_kinds:
      render_feature_strings:
        work_kind: text
        storage: arena_bytes
        contiguous_numeric_arrays: false
      observation_index_build:
        work_kind: text
        storage: btree_index
        contiguous_numeric_arrays: false
      map_input_lookup:
        work_kind: text
        storage: row_strings
        contiguous_numeric_arrays: false
      # The decoder's score/backpointer matrices are `Vec<Vec<f64>>` and
      # `Vec<Vec<usize>>`: every row is a contiguous numeric slice scanned in
      # order, while sparse weight reads still go through `BTreeMap`. The phase
      # is contiguous numeric storage with sparse-map reads, so the measured
      # share — never a SIMD-friendliness claim — is what the gate consumes.
      viterbi_decode:
        work_kind: numeric
        storage: contiguous_numeric_rows
        contiguous_numeric_arrays: true
        sparse_weight_reads: true

  # `measured_retained` is unreachable without all three DATA thresholds and a
  # scalar-equivalence proof for an actually measured candidate. This slice
  # measures no candidate, so the gate can only yield `not_applicable` or
  # `measured_rejected`.
  optimization:
    states: [not_applicable, measured_rejected, measured_retained]
    retained_requires_data_thresholds: true
    retained_thresholds:
      minimum_dense_phase_share: 0.25
      minimum_repeated_cpu_improvement_ratio: 0.10
      maximum_full_pipeline_p95_regression_ratio: 0.0
      requires_scalar_equivalence: true
    selection: forbidden
    safe_rust_only: true

  pgo:
    disposition_vocabulary: [not_adopted, adopted]
    adoption_requires: [profile, scalar_equivalence, full_pipeline_p95_non_regression, data_thresholds]
    disposition: not_adopted
    selection: forbidden

  redaction:
    forbidden: [raw_pdf, raw_text, raw_tei, token_text, model_bytes, lexicon_bytes, physical_path, hostname, executable]

  promotion:
    state: candidate
    selected: forbidden
    promoted: forbidden
    auto_promote: forbidden
    rollback_target: java-grobid-http@0.9.0-crf

  h05_closure: not_claimed
  h05_reason: >-
    RSS ceilings, per-stage Java CPU wall-clock, and byte ceilings are NOT
    closed or claimed by S08. Those stay typed not_observed; this block only
    profiles the native scalar CRF core and records a closed SIMD/PGO
    disposition.

# ────────────── S06: global batch budgets and bounded reorder ──────────────
# Top-level SIBLING added by S06/T01: no existing block above is mutated and no
# new file is created under data/parse/ (D377 keeps the sanctioned set at 24
# names). Rationale — S06 must DESIGN its ceilings before any behaviour change.
# The only batch budget today (`ParseBatchBudget`/`ParseBatchLimits` in
# crates/da-parse/src/batch.rs) counts SLOTS: workers, queue capacity, in-flight
# and document counts. It pins `budget_scope: process-local` and declares no
# byte, RSS, Java-CPU or latency ceiling. H05-N2 forbids presenting a
# document-count limit as a byte or RSS ceiling, so the ceiling dictionary, the
# mandatory metric set and the prohibitions live here as DATA and are bound to
# the LIVE `da_parse::batch_budget` constants by
# crates/da-parse/tests/batch_budget_data_contract.rs before any behaviour
# changes. This block does NOT close H05 and does not touch S08's
# `native_core_qualification` block above.
batch_budget_ceilings:
  schema_version: batch-budget-ceilings.v1
  adr_ref: ADR-076
  requirement_ids: [R085, R087, R139]

  # Closed observation grammar. `not_observed` is the ONLY honest carrier for an
  # unmeasured value: it must name a reason and never a number, so a ceiling
  # cannot be reported as observed without a measurement (H19-N1).
  observation_states: [observed, not_observed]
  absence_requires_reason: true

  # Mandatory S06 metric set. Every ceiling observation carries exactly one of
  # these names; a missing or invented name is a DATA failure.
  metrics:
    - latency_p50_ms
    - latency_p95_ms
    - latency_p99_ms
    - peak_retained_bytes
    - peak_rss_bytes
    - java_cpu_wall_clock_ns
    - max_reorder_depth
    - max_publication_outstanding
    - max_in_flight
    - budget_waits

  # Closed verdict vocabulary for a measured ceiling. `memory_pressure` is the
  # honest verdict when an observed peak sits above the declared retention
  # ceiling; `not_observed` is the verdict when no measurement exists.
  verdicts: [within_ceiling, memory_pressure, not_observed]

  # Invariants — prohibitions, not tuning knobs.
  zero_is_not_a_measurement: true
  silent_clamp: forbidden
  count_limit_is_not_a_byte_ceiling: true
  retention_ceiling_composes_with: response_bytes_transport_bound

  # H05 stays unclaimed: this block declares ceilings, it measures none. H05
  # closes only when RSS, Java CPU and latency tails are MEASURED under
  # concurrent batches with a slow ordinal-0 document
  # (doc/review/grobid-rust-horizon-review.json#H05).
  h05_closure: not_claimed
  h05_reason: >-
    H05 stays explicitly unclaimed. Slot limits (workers, queue capacity,
    in-flight and document counts) are bounded today, but no byte, RSS,
    Java-CPU or latency-tail ceiling is measured or declared by S06/T01: this
    block only freezes the ceiling dictionary, the mandatory metric set and the
    prohibitions as DATA. H05 stays unclaimed until RSS, Java CPU and latency
    tails are MEASURED under concurrent batches with a slow ordinal-0 document
    (doc/review/grobid-rust-horizon-review.json#H05). An unmeasured value stays
    a typed not_observed with a named reason, never a fabricated number.
