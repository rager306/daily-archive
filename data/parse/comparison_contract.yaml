# S18/T01: source-bound native fulltext composition authority. This is an
# additive shadow contract; it does not rewrite S12/S15/S16 evidence owners.
native_fulltext_composition_shadow:
  schema_version: native-fulltext-composition.v1
  engine: da_parse::native_fulltext_composition
  candidate_id: da-parse.native_fulltext_composition
  candidate_version: '1.0.0'
  observation_mode: shadow
  promotion_state: candidate
  auto_promote: forbidden
  import_eligible: false
  production_route: forbidden
  graph_mutation: forbidden
  rollback_target: java-grobid-http@0.9.0-crf
  rollback:
    fulltext: java-grobid-http@0.9.0-crf
    header: java-grobid-http@0.9.0-crf
    references: java-grobid-http@0.9.0-crf
    segmentation: java-grobid-http@0.9.0-crf
    visual: java-grobid-http@0.9.0-crf
  component_ids: [header, references, document_segmentation, figure, table, formula, learning_policy]
  dispositions: [passed, fallback, rejected, unsupported, not_observed, invalid_evidence, stale]
  strata:
    lanes: [header, references, document_segmentation, body]
    domains: [computer_science, physics, mathematics]
    genres: [research_article, survey, proceedings]
    closed: true
  admission:
    native_substitution_requires: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt]
    terminal_receipt_is_pass: false
    pooled_winner: forbidden
    independently_selectable_lanes: [header, references]
    output_affecting_learning: false
    current_matrix:
      header: passed
      references: passed
      document_segmentation: fallback
      figure: fallback
      table: fallback
      formula: fallback
      learning_policy: not_observed
    fallback_target: java-grobid-http@0.9.0-crf
  source_evidence:
    s12_named_denominators:
      date_total: 173
      header_raw_total: 36
      header_accepted_total: 35
      header_rejected_or_incomplete: 1
      citation_names_total: 2198
      affiliation_recognition_total: 13
      affiliation_linking_total: 13
      references_total: 207
      # S05/T06: native body reading-order lane denominators (T05 lexical
      # receipts, native_fulltext_same_n.rs). The 2375/75369 pair binds the
      # native "one ABI row per body token" claim to an independent number;
      # the family split is the DATA-ledger partition (body_blocks /
      # body_markers / visual_content). 376 is this lane's body-scoped
      # `<ref type="bibr">` marker denominator and 380 restates the bibliography
      # oracle's whole-document anchor population, so the two can never be
      # quietly pooled.
      body_blocks_total: 2375
