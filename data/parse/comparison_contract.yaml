schema_version: parse-comparison.v1
adr_ref: ADR-075
contract_id: parse-comparison
requirement_ids: [R113, R117, R106]
decisions: [D127, D204, D294, D295]
import_eligible: false
auto_promote: forbidden

# Source-bound comparison artifact for every small capability.
# T03 emits the first baseline report. Later slices update the ledger
# against this contract. Reports must never contain raw document content.

report_identity:
  required_fields:
  - source_hash
  - backend_id
  - backend_version
  - profile_fingerprint
  - request_fields
  - output_hash
  - corpus_id
  - corpus_hash
  - corpus_n
  - same_n
  - fixture_ids
  - family_counts
  - current_lifted_counts
  - promotion_state
  - rollback_target
  optional_fields:
  - grobid_version
  - latency_p50_ms
  - latency_p95_ms
  - latency_p99_ms
  - peak_rss_bytes
  - duration_ms
  - malformed_input_results
  - known_hard_regressions
  identity_rule: >-
    Bind source hash + profile fingerprint + request fields + output hash.
    Output hash alone is ambiguous when different stage/profile contracts
    emit identical bytes.

forbidden_report_fields:
- tei_xml
- body_text
- pdf_bytes
- raw_document_content
- raw_tei
- fulltext
- page_images

corpus_classes:
  fast_local_fixtures:
    id: fast_local_fixtures
    purpose: CI and slice-local characterization
    location: crates/da-parse/tests/fixtures/
    missing_behavior: fail_visible
    silent_skip: forbidden
    required_coverage:
    - sections
    - references
    - tables
    - formulas
    - authors
    - idno
    - figures
    - coordinates
    - restarted_numbering_anchors
    used_by: [S01-T02, S01-T03, S02-T02, S02-T03, S02-T04]
  publisher_acceptance:
    id: publisher_acceptance
    purpose: official publisher-style identities with a bounded local proxy; remote bytes remain explicit missingness
    manifest_binding: data/parse/acceptance_manifest.yaml#classes.publisher_acceptance
    acceptance_evidence_binding: artifacts/parse_compat/acceptance_evidence.json#classes.publisher_acceptance
    location: data/parse/acceptance_manifest.yaml
    missing_behavior: fail_visible
    executed_corpus: fast_local_fixtures
    used_by: [S20-T01, S20-T02, S20-T03]
  layout_omnidocbench:
    id: layout_omnidocbench
    purpose: scientific layout/Markdown comparison only; not TEI conservation proof
    manifest_binding: data/parse/acceptance_manifest.yaml#classes.layout_omnidocbench
    acceptance_evidence_binding: artifacts/parse_compat/acceptance_evidence.json#classes.layout_omnidocbench
    location: data/parse/acceptance_manifest.yaml
    missing_behavior: fail_visible
    executed_corpus: fast_local_fixtures
    used_by: [S20-T01, S20-T02, S20-T03]
  entity_f1_supporting:
    id: entity_f1_supporting
    purpose: downstream extraction F1 is supporting evidence, not parse proof
    location: data/gold_standard/
    used_by: [eval_batch]

same_n:
  required: true
  meaning: baseline and candidate evaluated on exactly the same documents
  mismatch: hard_failure

hard_regressions:
  # A better average cannot hide any of these.
  - id: lost_references_or_links
    description: References, citation links or callouts disappear
  - id: changed_reading_order
    description: Section or token reading order changes
  - id: lost_figures_tables_formulas
    description: Figures, tables or formulas are dropped
  - id: invented_revision
    description: Article revision or idno is invented or rewritten
  - id: nondeterministic_output
    description: Output hash changes across replay or worker counts
  - id: panic
    description: Parser panics instead of typed BackendError
  - id: dropped_parser_work
    description: Parser tasks are dropped instead of backpressured
  - id: incorrect_cache_reuse
    description: Cache hit across distinct profile/request fingerprints
  - id: train_eval_contamination
    description: Train and eval corpora overlap
  - id: self_promotion
    description: Candidate promotes itself without explicit receipt
  - id: silent_skip_missing_tei_fixture
    description: Missing or changed TEI fixture is skipped instead of failing

metrics:
  conservation:
    family_counts: required
    source_span_retention: required
    delta_digest_and_verdict: required
    malformed_summary: required
    # S07/T05: the coordinate families are now lifted (figures with
    # graphic-owned coordinates) and carried as conservation evidence, so the
    # former `required_from_s07` intentional deferral is REQUIRED.
    coordinate_coverage: required
  quality:
    strict_field_match: required_from_s03
    soft_field_match: required_from_s03
    levenshtein_or_ratcliff: optional
  determinism:
    identical_hashes_across_replay: required
    identical_hashes_across_workers: required_from_s14
  operations:
    latency_p50_p95_p99_ms: when_executable
    peak_rss_bytes: when_executable
    throughput: when_executable
    busy_503_honest: required_from_s04
  malformed_input:
    empty_pdf: typed_error
    truncated_pdf: typed_error
    non_pdf_bytes: typed_error
    missing_fixture: fail_visible
    checksum_mismatch: fail_visible
  learning:
    train_eval_disjoint: required_when_training
    ablation_lift_same_n: required_when_training
    lineage_hashes: required_when_training
    auto_promote: forbidden
    ruvllm_ablation:
      schema_version: parse-learning-ablation.v1
      evidence_surface: da-application::parse_learning_evaluation
      frozen_ordered_eval_set: required
      exact_same_n: required_and_nonzero
      dual_task_metrics: [metric_one, metric_two]
      validation_gap: required
      producer_independence: required
      critic_failures_remain_in_denominator: required
      conservation_veto_before_aggregation: required
      rollback_identity: required
      promotion_state: candidate
      explicit_decision: null
      deployed: false
      import_eligible: false
      graph_write: forbidden
      route_reload: forbidden
      promotion_receipt: forbidden

# S03/T04: every exact TeiEnvelope/TeiParseIr pair executed by a parse-compat
# report must run through the sanctioned provider-neutral conservation engine
# and carry its typed, redacting delta evidence (R106). The aggregate always
# equals the sum over per-case rows; malformed bytes are summarized, never
# hidden.
conservation_evidence:
  engine: da_parse::ConservationEngine
  required_per_case_fields:
  - engine
  - backend_id
  - profile_fingerprint
  - paper_id
  - raw_tei_sha256
  - raw_tei_len
  - verdict
  - delta_digest
  - total_rows
  - loss_rows
  - malformed_rows
  - reason_counts
  - structure_counts
  - family_counts
  - source_span_retention
  - delta
  identity_binding: >-
    Per case: raw_tei_sha256 == case source_sha256, backend_id == cached-tei
    envelope identity, profile_fingerprint == case profile fingerprint.
  aggregate_rule: aggregate_counts_equal_per_case_sums
  used_by: [S03-T04]

# S08/T03: the native scholarly-date candidate is observed INSIDE this single
# parse-compat report as additive shadow evidence (never a parallel date
# report). Every parsed occurrence rides the checksum-bound ordered
# <date type="published"> occurrence vector of the three preserved TEI
# fixtures, exactly the vector the T02 oracle contract pins. Evidence is
# identity/hash/count only; raw date display text and TEI fragments are
# forbidden. The candidate stays shadow: no runtime route, promotion_state
# stays candidate, auto-promotion stays forbidden (D127), Java GROBID remains
# oracle and rollback target.
native_date_shadow:
  engine: da_parse::NativeDateParser
  candidate_id: da-parse.native_date
  candidate_version: '1.0.0'
  outcome_schema_version: da-parse.native-date.outcome/v1
  observation_mode: shadow
  oracle_source: tei_when_attribute
  corpus_class: fast_local_fixtures
  occurrence_vector: ordered <date type="published"> elements in document order per bound fixture
  denominator:
    total: 173
    per_fixture:
      reg.tei.hub-bibliography-2507.19457: 80
      reg.tei.rlm-2512.24601: 50
      reg.tei.reca-bibliography-2605.26525: 43
  scope_order: [header_article_date, header_bibliography_date, bibliography_date]
  semantics:
    strict: candidate recognized equals the oracle when exactly (every declared component and the implied precision)
    soft: candidate recognized matches the oracle at year precision
    same_n: required
    mismatch: hard_failure
    invented_component_budget: 0
  redaction: >-
    Per-occurrence evidence carries fixture id, ordinal, byte span, scope tag
    and SHA-256 only — never the source display string, the `when` value or
    any TEI fragment.
  latency: >-
    p50/p95/p99 are bucketized characterization labels from a closed bucket
    vocabulary; exact wall-clock never enters the report so two offline
    generations stay byte-identical.
  forbidden:
  - auto_promotion
  - runtime_routing
  - raw_display_text
  - tei_fragments
  - invented_bindings
  hard_regressions: [invented_revision, nondeterministic_output, panic, silent_skip_missing_tei_fixture]
  promotion_state: candidate
  rollback_target: java-grobid-http@0.9.0-crf
  used_by: [S08-T03]

# S09/T04: additive native personal-name evidence stays inside this report.
# Header and citation populations are never pooled; rows are redacted hashes only.
native_personal_name_shadow:
  engine: da_parse::NativePersonalNameParser
  candidate_id: da-parse.native_personal_name
  candidate_version: '1.0.0'
  outcome_schema_version: da-parse.native-personal-name.outcome/v1
  observation_mode: shadow
  oracle_source: preserved_tei_reconstruction
  corpus_class: fast_local_fixtures
  scope_order: [header, citation]
  semantics:
    strict: exact role-field parity including particles, initials and suffixes
    soft: initial-compatible parity without relaxing same_n
    same_n: required independently for header and citation
    mismatch: hard_failure
    invented_component_budget: 0
  redaction: >-
    Per-occurrence evidence carries case/fixture identity, context, ordinal,
    bounded span and SHA-256 hashes only; raw/reconstructed names and TEI
    fragments are forbidden.
  latency: >-
    p50/p95/p99 are bucketized labels from a closed vocabulary; exact wall-clock
    values never enter the report.
  forbidden: [auto_promotion, runtime_routing, raw_names, reconstructed_names, tei_fragments, invented_bindings]
  hard_regressions: [invented_revision, nondeterministic_output, panic, silent_skip_missing_tei_fixture]
  promotion_state: candidate
  rollback_target: java-grobid-http@0.9.0-crf
  used_by: [S09-T04]

# S11/T04: native citation fields, preserved raw-reference list order and
# citation-anchor occurrences are one additive redacted block. Denominators are
# independent and checksum-bound; no raw citation or TEI content enters output.
native_citation_shadow:
  engine: da_parse::NativeCitationParser
  candidate_id: da-parse.native_citation
  candidate_version: '1.0.0'
  outcome_schema_version: da-parse.native-citation.outcome/v1
  observation_mode: shadow
  promotion_state: candidate
  rollback_target: java-grobid-http@0.9.0-crf
  oracle_source: preserved_tei_reconstruction
  corpus_class: fast_local_fixtures
  fields:
    denominator:
      total: 207
      title_observed_n: 200
      per_fixture:
        reg.tei.hub-bibliography-2507.19457: 80
        reg.tei.reca-bibliography-2605.26525: 78
        reg.tei.rlm-2512.24601: 49
    observed_roles: [authors, publication_date, article_title, container_title, volume, issue, pages, article_number, publisher, place, doi, arxiv_id, url]
    independent_expected_roles: [article_title, publication_date, doi, arxiv_id]
    same_n: required
    invented_component_budget: 0
  reference_list:
    denominator:
      total: 207
    provenance: preserved_tei_reconstruction
    ordered_digest: required
    counters: [lost, extra, reordered, merged, split]
  anchors:
    denominator:
      total: 380
      targeted: 217
      targetless: 163
      adjacent_fragment_pairs: 168
    ordered_digest: required
    target_state: preserved
    counters: [lost, extra, reordered, merged, split]
  redaction:
    allowed: [fixture_id, case_id, ordinal, role, bounded_spans, input_sha256, oracle_sha256, candidate_sha256, closed_outcome, target_present, parity]
    forbidden: [raw_reference, raw_citation, tei_fragments, title, name, identifier, venue, anchor_quote, physical_path]
  hard_regressions: [lost_references_or_links, changed_reading_order, invented_revision, nondeterministic_output, panic, silent_skip_missing_tei_fixture]
  forbidden: [auto_promotion, runtime_routing, raw_references, raw_tei, invented_bindings, pooled_denominators]
  used_by: [S11-T04]

# S12/T03: header and reference composition is one additive, independently
# selectable shadow contract. Component populations remain separate and the
# composer never reparses or serializes raw scholarly material.
native_header_reference_composition_shadow:
  engine: da_parse::native_composition
  candidate_id: da-parse.native_header_reference_composition
  candidate_version: '1.0.0'
  outcome_schema_version: da-parse.native-composition.outcome/v1
  observation_mode: shadow
  promotion_state: candidate
  auto_promote: forbidden
  rollback:
    header: java-grobid-http@0.9.0-crf
    references: java-grobid-http@0.9.0-crf
  independently_selectable_lanes: [header, references]
  component_receipts:
    required: [native_date_shadow, native_personal_name_shadow, native_affiliation_shadow, native_citation_shadow]
    same_n: required_per_component
    ordered_digest: required_per_component
    denominator_policy: no_pooling_or_erosion
    # Explicit, independently conserved receipts prevent a component-ID
    # reference from hiding denominator erosion during composition.
    date:
      total: 173
    header:
      raw_total: 36
      accepted_total: 35
      rejected_or_incomplete: 1
      strict_n: 0
      soft_initial_n: 35
      # S03/T07: independent same-n receipts for the full native header lane.
      # These are the T05 test-local constants (native_header_same_n.rs), not a
      # Java-derived output; they extend the field coverage, not the accepted
      # author denominator.
      native_title_stmt_titles: 3
      native_header_title_elements: 6
      native_emails: 3
      native_idno_elements: 6
      native_pubnum_elements: 3
      native_checksum_idno_elements: 3
      native_header_date_elements: 6
      native_document_dates: 173
      native_header_features_schema: da-parse.native-header-features/v1
      native_header_sequence_schema: da-parse.native-header-sequence/v1
      native_header_fields_schema: da-parse.native-header-fields/v1
    citation_names:
      total: 2198
      strict_n: 0
      soft_initial_n: 2196
      unsupported_n: 2
    affiliation:
      recognition_total: 13
      linking_total: 13
      linked_authors: 11
      zero_link_authors: 25
      exactly_one_three_link: 1
      address_observed_n: 0
    references:
      total: 207
      # S04/T08: independent same-n receipts for the native bibliography lane.
      # 3135/15415 come from the T07 lexical scan of the SHA-pinned TEI body
      # (native_bibliography_same_n.rs); the native row builders are bound to
      # the token denominator, not to their own output. These extend the
      # reference lane's coverage and never pool with the header denominators.
      bibl_struct_total: 80
      bibl_struct_hub: 80
      bibl_struct_rlm: 49
      bibl_struct_reca: 78
      bibl_lines_total: 3135
      bibl_tokens_total: 15415
      bibl_author_elements_total: 2185
      citation_row_columns: 30
      reference_segmenter_row_columns: 28
    anchors:
      total: 380
      targeted: 217
      targetless: 163
      fragmented_adjacency: 168
  lanes:
    header:
      denominator: 35
      strict_n: 0
      soft_n: 35
      candidate_state: candidate
      # S03/T07: the native header lane is registered here as shadow-only. The
      # surfaces and symbols are the header atoms the governor quarantine keeps
      # out of source_cli.rs/parser.rs; the offline limits are the honest
      # proof-level statement (research §6).
      native_surfaces:
      - crates/da-parse/src/native_header_features.rs
      - crates/da-parse/src/native_header_sequence.rs
      - crates/da-parse/src/native_header_fields.rs
      native_symbols:
      - render_header_features
      - render_header_feature_text
      - decode_header_sequence
      - project_native_header_fields
      - compose_header_with_fields
      - run_header_sequence_with_fields
      native_projection:
        title_source: '<title>'
        email_source: '<email>'
        ids_source: '<pubnum>'
        ids_is_explicit_mapping: true
      hub_gap: {java_header_raw: 21, native_accepted_header: 20, pooling: forbidden}
      proof_level: contract
      offline_limits:
      - no_preserved_alto_for_the_three_fixtures_so_pdf_to_header_e2e_is_unproven
      - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
      - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
      - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
      hard_regressions: [invented_revision, nondeterministic_output, panic, silent_skip_missing_tei_fixture]
    references:
      references_denominator: 207
      anchors_denominator: 380
      targeted_anchors: 217
      targetless_anchors: 163
      fragmented_adjacency: 168
      candidate_state: candidate
      # S04/T08: the native bibliography lane is registered here as shadow-only.
      # The surfaces and symbols are the bibliography/callout atoms the governor
      # bibliography_sequence_quarantine keeps out of source_cli.rs, ParserPort,
      # da-parse parser.rs and da-parse projector.rs; the offline limits are the
      # honest proof-level statement (D360/D361/D362).
      native_surfaces:
      - crates/da-parse/src/native_feature_facts.rs
      - crates/da-parse/src/native_bibliography_gazetteer.rs
      - crates/da-parse/src/native_bibliography_features.rs
      - crates/da-parse/src/native_bibliography_sequence.rs
      - crates/da-parse/src/native_bibliography_nested.rs
      - crates/da-parse/src/callout_markers.rs
      native_symbols:
      - citation_row
      - reference_segmenter_row
      - render_citation_feature_text
      - render_reference_segmenter_feature_text
      - decode_bibliography_labels
      - decode_reference_sequence
      - decode_citation_sequence
      - bibliography_label_runs
      - name_citation_row
      - date_row
      - decode_name_citation_cluster
      - decode_date_cluster
      - gazetteer_spans
      - classify_callout_markers
      - link_callout_markers
      native_abi:
        citation_columns: 30
        reference_segmenter_columns: 28
        name_citation_columns: 18
        date_columns: 17
        citation_labels: 38
        reference_segmenter_labels: 6
        name_citation_labels: 9
        date_labels: 7
        citation_roles: 19
      named_gap:
        citation_names: 2198
        references: 207
        bibl_author_elements: 2185
        pooling_citation_names_with_references: forbidden
        pooling_with_header_denominators: forbidden
      proof_level: contract
      offline_limits:
      - no_preserved_alto_for_the_three_fixtures_so_pdf_to_bibliography_rows_is_unproven
      - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
      - bibl_lines_3135_and_bibl_tokens_15415_are_lexical_receipts_not_recorded_java_goldens
      - citation_names_2198_is_a_named_gap_never_pooled_with_references_207
      - identifier_and_url_gazetteer_lanes_are_shape_rules_not_source_bound_patterns
      - callout_inventory_resolution_is_ordinal_marker_to_body_label_not_java_coordinates
      - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
      - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
      hard_regressions: [lost_references_or_links, changed_reading_order, nondeterministic_output, panic, silent_skip_missing_tei_fixture]
  forbidden: [auto_promotion, runtime_routing, raw_text, raw_tei, raw_names, raw_references, pooled_denominators, invented_stage, invented_bindings]
  hard_regressions: [invented_revision, lost_references_or_links, changed_reading_order, nondeterministic_output, panic, silent_skip_missing_tei_fixture]
  evidence: [native_header_reference_composition_shadow]
  used_by: [S12-T03]

