# Canonical component licence and redistribution inventory for the scholarly
# parse plane (GAR-004 / ADR-075). This is the single canonical ledger: every
# component named on one of the three read-only licence surfaces must be
# declared here exactly once and bound to that surface through surface_claims.
#
# Every position is either verified against a resolvable licence text or typed
# blocked with a mandatory reason. A component whose licence or redistribution
# terms were never established is blocked, never assumed compatible: an absent
# right must not be inferred from a repository URL, a vendor layout, or a name.
#
# surface_claims[].surface uses "<repo-relative file>#<inventory key>", the
# cross-reference form used by data/parse/acceptance_manifest.yaml. The
# `surfaces` map binds each identifier to its real path and status field,
# because the read-only surfaces do not share one status dialect:
# license_provenance_inventory uses license_status, grobid_model_rights.yaml
# uses rights_status with its own vocabulary. blocked_reason values are
# lower_snake_case tokens so that a reason is greppable and comparable;
# the read-only surfaces keep their own phrasing.
schema_version: parse-component-license-inventory.v1
authority: ADR-075
review_state: machine_checked_data; independent_rights_review_required

redistribution_policy:
  commercial_use: false
  new_distribution: forbidden
  import_eligible: false
  graph_write: forbidden
  auto_promote: forbidden
  gpl_linking: forbidden
  unknown_rights: blocked
  blocked_components_must_not_enter_runtime: true

boundary_vocabulary: [subprocess, http, rust-source-port, rust-workspace, data-only, cargo-dependency]
license_status_vocabulary: [verified, blocked]
redistribution_status_vocabulary: [allowed_with_notice, source_offer_required, not_distributed, blocked]

surfaces:
  "data/parse/grobid_compatibility.yaml#license_provenance_inventory":
    role: donor_layout_and_runtime_component_inventory
    inventory_key: license_provenance_inventory
    status_field: license_status
  "data/parse/feature_tagger_training_parity.yaml#license_provenance_inventory":
    role: feature_tagger_training_input_inventory
    inventory_key: license_provenance_inventory
    status_field: license_status
  "data/parse/grobid_model_rights.yaml#assets":
    role: grobid_model_and_lexicon_asset_inventory
    inventory_key: assets
    status_field: rights_status

