schema_version: grobid-compatibility.v1
adr_ref: ADR-075
ledger_id: grobid-compatibility
requirement_ids: [R113, R117, R085, R110, R112, R118, R119, R120, R121, R124]
decisions: [D127, D204, D291, D292, D294, D295, D321]
import_eligible: false
auto_promote: forbidden

# Source-bound identities. T03 fills hashes/latency; T01 records the
# contract those reports must bind. Never store raw TEI/PDF here.
defaults:
  baseline:
    backend: java-grobid-http
    product: GROBID
    version: 0.9.0-crf
    license: Apache-2.0
    rest_base: /api
    default_port: 8070
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    vendor_paths: /root/vendor-source/grobid/grobid-service/src/main/java/org/grobid/service/GrobidPaths.java
  candidate:
    backend: da-parse
    crate: da-parse
    surface: crates/da-parse
    version: workspace
    license: project
  rollback_target: java-grobid-http@0.9.0-crf
  policy_stamp:
    closed_sources: [wasm, native_fallback, none]
    closed_hash_tokens: [none]
    production_consult: parse-pdf
    demo_cli_is_not_closure: true
    parse_pdf_consults: [grammar_route, profile_route]
    empty_native_unknown_point: [concurrency_tune, retry_policy, summary_depth]
  # S05/T01: independent Java absent-endpoint set. The roadmap shorthand
  # processHeaderFunding maps to the Java constant PATH_HEADER_FUNDING whose
  # wire token is processHeaderFundingDocument. This list — not
  # capabilities[].state — is the sole source of the forbidden set, so a
  # mutation of state cannot remove an endpoint from the checked set.
  java_absent_endpoints:
  - processHeaderFundingDocument
  - processFulltextDocumentHTML
  - processFulltextAssetDocument
  - createTraining
  - annotatePDF
  # S08/T01: DATA-gated visual-head quarantine. This section — not
  # capabilities[].state — is the sole source of the forbidden token set
  # and the production boundaries, so a mutation of state cannot remove a
  # token or boundary from the checked set. Snake_case tokens are matched
  # as call-sites (whitespace allowed before `(`); CamelCase tokens are
  # matched as type names (word boundary). Full-line and trailing `//`
  # comments are stripped; prose and prefix-substrings never count.
  visual_heads_quarantine:
    tokens:
    - detect_figure_heads
    - detect_table_heads
    - detect_formula_heads
    - NativeVisual
    - LayoutProvider
    boundaries:
    - crates/da-cli/src/source_cli.rs
    - crates/da-ports/src/parser.rs
  production_pdf_constructors:
    # After M471 PDF parse constructors consult ProfileRoute.
    # GrobidParser::from_env stays historical rich. A bare from_env used as
    # a PDF parse constructor splits D204 fingerprints. Health probes,
    # with_profile, corpus_grobid_parser and tests are allowed.
    scan_roots:
      - crates/da-cli/src
      - crates/da-cli/examples
    allowed_from_env_roles: [health_probe, with_profile, consult_helper, test, comment]
    consult_helper: crates/da-cli/src/parse_profile.rs
    forbidden_role: PARSE_BARE
  promotion:
    max_non_candidate_families: 1
    this_wave_promotes: none
    deployed: false
    auto_promote: forbidden
    reason: W6 does not candidate-promote; tracked conservation on preserved TEI is Conserved; native families stay shadow
  # Native P2 -> body accounting remains a test-only shadow sequence. These
  # call/type atoms must never enter parse-pdf source_cli or ParserPort.
  body_accounting_quarantine:
    tokens: [NativeBodyAccountant, run_native_body_sequence]
    boundaries:
      - crates/da-cli/src/source_cli.rs
      - crates/da-ports/src/parser.rs
    production_authority: java_http
    observe_mode: shadow_receipt
  # Closed P0-P9 cascade skeleton (ADR-076). production_authority is never native.
  # fsm_consult must be parse_pdf_consults or none. later names stay later.
  # P5 observe_mode is accountant_later and is not a live parse-pdf stamp.
  # Native modules are shadow_receipt observe only — not splice into parse_pdf.
  cascade_stages:
    P0:
      grobid: admit_identity_profile
      production_authority: java_http
      native_surface: none
      fsm_consult: [grammar_route, profile_route]
      observe_mode: production_stamp
    P1:
      grobid: pdfalto_layout_lattice
      production_authority: java_http
      native_surface: crates/da-parse/src/layout.rs
      fsm_consult: [none]
      observe_mode: shadow_receipt
    P2:
      grobid: document_segmentation
      production_authority: java_http
      native_surface: crates/da-parse/src/native_segmentation.rs
      fsm_consult: [none]
      observe_mode: shadow_receipt
    P3:
      grobid: header_heads_and_compose
      production_authority: java_http
      native_surface: crates/da-parse/src/native_composition.rs
      fsm_consult: [none]
      observe_mode: shadow_receipt
    P4:
      grobid: bibliography_segment_and_compose
      production_authority: java_http
      native_surface: crates/da-parse/src/native_composition.rs
      fsm_consult: [none]
      observe_mode: shadow_receipt
    P5:
      grobid: fulltext_body_sections
      production_authority: java_http
      native_surface: none
      fsm_consult: [none]
      observe_mode: accountant_later
    P6:
      grobid: figure_table_formula
      production_authority: java_http
      native_surface: crates/da-parse/src/native_visual.rs
      fsm_consult: [none]
      observe_mode: shadow_receipt
    P7:
      grobid: tei_coordinates_callouts
      production_authority: java_http
      native_surface: none
      fsm_consult: [none]
      observe_mode: production_stamp
    P8:
      grobid: bibliographic_consolidation
      production_authority: java_profile
      native_surface: crates/da-parse/src/profile.rs
      fsm_consult: [profile_route]
      observe_mode: production_stamp
    P9:
      grobid: tei_lift_conservation
      production_authority: tei_lift
      native_surface: crates/da-parse/src/lift.rs
      fsm_consult: [none]
      observe_mode: candidate_lift
  profiles:
    rich:
      consolidateHeader: 1
      consolidateCitations: 1
      teiCoordinates: [figure, table, note, formula]
    structural:
      consolidateHeader: 0
      consolidateCitations: 0
      teiCoordinates: [figure, table, note, formula]
  current_request_dialect:
    # Since S04 the wire request is the serde-versioned FulltextRequestV1
    # dialect (schema version 1): typed consolidation modes (header 0..=2,
    # citations/funders 0..=1), typed CoordinateSet, raw/sentence/ID switches
    # and a validated inclusive page window. Legacy rich/structural presets
    # project byte-identically to the S02 wire contract (D204 fingerprints
    # pinned by tests/cache_identity.rs).
    request_envelope: FulltextRequestVersioned-v1
    consolidateHeader: typed-mode-0..=2-legacy-presets-0-or-1
    consolidateCitations: typed-mode-0..=1
    consolidateFunders: typed-mode-0..=1
    teiCoordinates: typed-CoordinateSet-deduped-canonical-order
    teiCoordinates_constant: figure,table,note,formula
    failure_vocabulary: ParseBackendFailure-schema-v1-closed-8-codes
    # S05/T03: the two sanctioned proxy operations ride their own versioned
    # request dialects through the same ParseBackend seam and share the ONE
    # closed failure vocabulary; their multipart allowlists are closed and
    # never carry a foreign endpoint knob or teiCoordinates.
    header_request_envelope: HeaderRequestVersioned-v1
    header_allowlist: input,consolidateHeader(0..=2),includeRawAffiliations
    header_static_route: /api/processHeaderDocument
    references_request_envelope: ReferencesRequestVersioned-v1
    references_allowlist: input,consolidateCitations(0..=1),includeRawCitations
    references_static_route: /api/processReferences
  # S06/T05: additive batch/cache observation of the bounded resumable batch
  # and its two-stage artifact cache. Machine-checked against the LIVE
  # da-parse vocabulary by crates/da-parse/tests/data_contracts.rs; the
  # parse-plane states above stay byte-unchanged.
  batch_cache:
    batch_cache_schema_version: 1
    cache_modes: [off, read-only, write-through, refresh]
    cache_mode_semantics: >-
      Exactly these four modes; output semantics are mode-independent.
      off never reads and never writes; read-only reads both stages and
      computes without publishing on a miss; write-through reads and
      publishes raw TEI BEFORE the projector stage; refresh bypasses hits
      and REPLACES both stages.
    cache_stages:
      raw_tei_stage_id: parse.raw_tei.v1
      project_article_stage_id: parse.project_article.v1
      raw_payload_schema_version: 1
      project_article_payload_schema_version: 1
      projector_schema_fingerprint: ParsedArticle@serde-v4-p0-tei-lift
      stage_rotation: independent
    batch_limits_bounded_fields: [workers, queue_capacity, max_in_flight, max_documents]
    batch_limits_nonzero: true
    batch_limits_content_identity_excluded: true
    batch_wide_error_scope: admission_only
    cursor_input_binding: ordered_input_fingerprint
    cursor_schema_version: 1
    cursor_fail_closed: true
    terminal_per_document_taxonomy: one_typed_outcome_per_admitted_ordinal
    terminal_backend_failure_schema: ParseBackendFailure-v1-closed-8-codes
    terminal_cache_integrity_codes: [checksum_mismatch, manifest_corrupt, identity_mismatch, payload_unreadable, stage_write_failed]
    run_summary_schema_version: 1
    legacy_read_only_identities: [pdf-grobid, html-primary]
    legacy_projection_schema: ParsedArticle.v1
    legacy_hit_creates_canonical_record: false
    redb_role: rebuildable_only
    redb_feature_gated: true
    redb_owner_crates: [da-adapters, da-cli]
    redb_deletion_preserves: canonical_stage_payloads_and_terminal_evidence
  known_hard_regressions_until_t02:
  - silent_skip_missing_tei_fixture
  configuration_keys_documented_not_owned:
    # Values live at da-cli composition root (R116). Ledger records names only.
    # S06/T05: this list is machine-checked against the LIVE da-cli key
    # constants (crates/da-cli/src/parse_config.rs) — an invented key or a
    # dropped live key fails data_contracts by exact name. The pre-S06
    # phantom names DA_PARSE_POLICY_ROOT and DA_PARSE_EXPERIENCE_RVF_PATH
    # were removed (no live code defines them) and the real GROBID_URL
    # compatibility alias was added.
  - DA_GROBID_URL
  - GROBID_URL
  - DA_PARSE_BACKEND
  - DA_PARSE_CACHE_MODE
  - DA_PARSE_CACHE_ROOT
  - DA_PARSE_BATCH_SIZE
  - DA_PARSE_WORKERS
  - DA_PARSE_QUEUE_CAPACITY
  - DA_PARSE_REDB_INDEX_ENABLED
  - DA_PARSE_REDB_INDEX_PATH
  - DA_PARSE_LEARNING_RVF_PATH
  - DA_PARSE_LEARNING_REDB_INDEX_PATH

capability_groups:
  1: service_liveness
  2: fulltext
  3: header_and_references
  4: fine_grained_header_citation
  5: coordinates_and_annotations
  6: training_evaluation_promotion
  7: patent_deferred

capabilities:
  # ------------------------------------------------------------------
  # Group 1 — service liveness (ADR-075 §2.8 required subset)
  # ------------------------------------------------------------------
  - id: rest.isalive
    group: 1
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: GET /api/isalive
      grobid_path_constant: PATH_ALIVE
      request_fields: []
      response_format: text/plain true|false
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidParser::is_alive
      notes: GET {GROBID_URL}/api/isalive; fail-closed ParserError::Unavailable
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: crates/da-parse/src/http.rs
    hard_regressions: [panic]
    metrics:
      conservation: not_applicable
      quality: boolean_alive
      performance: probe_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.health
    group: 1
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: GET /api/health
      grobid_path_constant: PATH_HEALTH
      request_fields: []
      response_format: JSON Dropwizard/health payload
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidHttpBackend::probe_health
      notes: >-
        GET {GROBID_URL}/api/health; 2xx JSON object succeeds. 5xx/transport
        Unavailable; other bodies InvalidResponse. Not on ParseBackend.
        Optional REST facade (D291) must not bind :8070. Payload is not identity.
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    hard_regressions: [panic]
    metrics:
      conservation: not_applicable
      quality: status_code
      performance: probe_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.version
    group: 1
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: GET /api/version
      grobid_path_constant: PATH_VERSION
      request_fields: []
      response_format: JSON {name, version, revision} or plain version string
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidHttpBackend::probe_version
      notes: >-
        GET {GROBID_URL}/api/version; JSON version field or non-empty plain
        string. Not on ParseBackend. Version is diagnostic until TeiIdentity
        T02; must not bind a product facade to :8070.
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    hard_regressions: [incorrect_cache_reuse]
    metrics:
      conservation: not_applicable
      quality: version_string_match
      performance: probe_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  # ------------------------------------------------------------------
  # Group 2 — fulltext
  # ------------------------------------------------------------------
  - id: rest.processFulltextDocument
    group: 2
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: POST /api/processFulltextDocument
      grobid_path_constant: PATH_FULL_TEXT
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      - {name: consolidateHeader, required: false, type: enum, values: [0, 1, 2, 3]}
      - {name: consolidateCitations, required: false, type: enum, values: [0, 1, 2]}
      - {name: consolidateFunders, required: false, type: enum, values: [0, 1, 2]}
      - {name: includeRawCitations, required: false, type: enum, values: [0, 1]}
      - {name: includeRawAffiliations, required: false, type: enum, values: [0, 1]}
      - {name: teiCoordinates, required: false, type: list, values: [persName, figure, ref, biblStruct, formula, s, note, title, head, p, affiliation, table]}
      - {name: segmentSentences, required: false, type: enum, values: [0, 1]}
      - {name: generateIDs, required: false, type: enum, values: [0, 1]}
      - {name: start, required: false, type: int, meaning: first_page}
      - {name: end, required: false, type: int, meaning: last_page}
      response_format: application/xml TEI (200); 204 empty; 400 invalid; 413 too large; 503 busy; client timeout/transport typed separately
      busy_semantics: honest_503_not_internal_retry; bounded_retry_after_metadata
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidHttpBackend::process_fulltext (reached through ParserPort::parse_pdf)
      notes: >-
        Multipart is the sole projector of the typed FulltextRequestV1 dialect
        since S04: exact Java field names/values, extended fields appended only
        when enabled, so legacy rich/structural requests stay byte-identical to
        the S02 wire contract (D204). Timeout 120s default; opt-in request/
        response byte bounds are transport tuning excluded from identity.
        Profile fingerprint rotates cache identity (D204). Since S02 the
        transport sits behind the provider-neutral ParseBackend seam
        (GrobidHttpBackend). Since S04/T02 outcomes are typed and closed: 200
        verbatim bytes (non-UTF-8 survives), 204 no_content, 400
        invalid_request, 413/opt-in bounds limit_exceeded, 503 busy with
        bounded Retry-After and no hidden retry, timeout vs transport
        separated, other 5xx conversion_failed, else invalid_response; the
        error body is never read and the facade maps availability class to
        ParserError::Unavailable while the rest fail closed as ParseFailed.
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: crates/da-parse/src/http.rs
    hard_regressions:
    - lost_references_or_links
    - changed_reading_order
    - lost_figures_tables_formulas
    - invented_revision
    - nondeterministic_output
    - panic
    - dropped_parser_work
    - incorrect_cache_reuse
    metrics:
      conservation: tei_family_counts
      quality: header_reference_field_accuracy
      performance: p50_p95_p99_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.processFulltextAssetDocument
    group: 2
    kind: endpoint
    state: absent
    product_scope: supporting
    promotion_state: candidate
    official:
      identity: POST /api/processFulltextAssetDocument
      grobid_path_constant: PATH_FULL_TEXT_ASSET
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      - {name: consolidateHeader, required: false, type: enum, values: [0, 1, 2, 3]}
      - {name: consolidateCitations, required: false, type: enum, values: [0, 1, 2]}
      - {name: teiCoordinates, required: false, type: list}
      response_format: zip of TEI plus extracted assets
    implementation:
      crate: da-parse
      surface: none
      notes: Not a compatibility requirement. Asset zip is not graph truth (D127).
    baseline: java-grobid-http@0.9.0-crf
    candidate: none
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    hard_regressions: [incorrect_cache_reuse]
    metrics:
      conservation: asset_family_counts
      quality: not_gated
      performance: p95_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.processFulltextDocumentHTML
    group: 2
    kind: endpoint
    state: absent
    product_scope: supporting
    promotion_state: candidate
    official:
      identity: POST /api/processFulltextDocumentHTML
      grobid_path_constant: PATH_FULL_TEXT_HTML
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      response_format: text/html visualization, not TEI truth
    implementation:
      crate: da-parse
      surface: none
      notes: Visualization only. Markdown/HTML is not TEI conservation proof.
    baseline: java-grobid-http@0.9.0-crf
    candidate: none
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    hard_regressions: [changed_reading_order]
    metrics:
      conservation: not_applicable
      quality: not_gated
      performance: p95_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  # ------------------------------------------------------------------
  # Group 3 — header and references (ADR-075 §2.8 required subset)
  # ------------------------------------------------------------------
  - id: rest.processHeaderDocument
    group: 3
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: POST /api/processHeaderDocument
      grobid_path_constant: PATH_HEADER
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      - {name: consolidateHeader, required: false, type: enum, values: [0, 1, 2, 3]}
      - {name: includeRawAffiliations, required: false, type: enum, values: [0, 1]}
      response_format: application/xml TEI header (200); 204 empty; 400 invalid; 413 too large; 503 busy; client timeout/transport typed separately
      busy_semantics: honest_503_not_internal_retry; bounded_retry_after_metadata
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidHttpBackend::process_header (reached through ParseBackend::fetch_tei)
      notes: >-
        Since S05/T02 the closed header operation proxies Java GROBID through
        the shared endpoint-neutral one-shot multipart exchange: exactly one
        POST to the static /api/processHeaderDocument route (ParseEndpoint
        mapping only — no caller-controlled route), exactly one streamed
        response read, the shared closed failure ladder (200 verbatim bytes
        incl. empty/non-UTF-8, 204 no_content, 400 invalid_request, 413/
        opt-in bounds limit_exceeded, 503 busy with bounded Retry-After,
        timeout vs transport separated, 5xx conversion_failed, else
        invalid_response; no hidden retry, the error body is never read).
        Multipart allowlist is exactly input, consolidateHeader (typed
        0..=2), optional includeRawAffiliations. The Java 0.9.0 handler
        accepts NO teiCoordinates — the pre-S05 DATA drift claiming it here
        was corrected in S05/T03, and the projector denies every
        fulltext/references knob. The partial header TEI is returned
        verbatim as a TeiEnvelope stamped with the endpoint/profile/result
        identity (endpoint=header;schema=v1;header=v1;…): no TeiLifter, no
        ParsedArticle projection, no ParserPort on this seam.
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: crates/da-parse/src/http.rs
    hard_regressions: [invented_revision, lost_references_or_links]
    metrics:
      conservation: header_field_counts
      quality: title_author_date_affiliation_accuracy
      performance: p95_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.processHeaderFundingDocument
    group: 3
    kind: endpoint
    state: absent
    product_scope: supporting
    promotion_state: candidate
    official:
      identity: POST /api/processHeaderFundingDocument
      grobid_path_constant: PATH_HEADER_FUNDING
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      response_format: application/xml TEI header with funding acknowledgement
    implementation:
      crate: da-parse
      surface: none
      notes: >-
        Roadmap shorthand processHeaderFunding maps to Java constant
        PATH_HEADER_FUNDING (wire token processHeaderFundingDocument).
        Funding acknowledgement extraction is not a product compatibility
        requirement and must stay absent with no implementation surface.
    baseline: java-grobid-http@0.9.0-crf
    candidate: none
    evidence_ref: /root/vendor-source/grobid/grobid-service/src/main/java/org/grobid/service/GrobidPaths.java
    hard_regressions: [incorrect_cache_reuse]
    metrics:
      conservation: not_applicable
      quality: not_gated
      performance: not_gated
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.processReferences
    group: 3
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: POST /api/processReferences
      grobid_path_constant: PATH_REFERENCES
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      - {name: consolidateCitations, required: false, type: enum, values: [0, 1, 2]}
      - {name: includeRawCitations, required: false, type: enum, values: [0, 1]}
      response_format: application/xml TEI listBibl (200); 204 empty; 400 invalid; 413 too large; 503 busy; client timeout/transport typed separately
      busy_semantics: honest_503_not_internal_retry; bounded_retry_after_metadata
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidHttpBackend::process_references (reached through ParseBackend::fetch_tei)
      notes: >-
        Since S05/T02 the closed references operation proxies Java GROBID
        through the same shared endpoint-neutral one-shot multipart exchange:
        exactly one POST to the static /api/processReferences route
        (ParseEndpoint mapping only), exactly one streamed response read, the
        shared closed failure ladder (200 verbatim bytes incl.
        empty/non-UTF-8, 204 no_content, 400 invalid_request, 413/opt-in
        bounds limit_exceeded, 503 busy with bounded Retry-After, timeout vs
        transport separated, 5xx conversion_failed, else invalid_response;
        no hidden retry, the error body is never read). Multipart allowlist
        is exactly input, consolidateCitations (typed 0..=1), optional
        includeRawCitations. The Java 0.9.0 handler accepts NO teiCoordinates
        — the pre-S05 DATA drift claiming it here was corrected in S05/T03,
        and the projector denies every fulltext/header knob. The partial
        listBibl TEI is returned verbatim as a TeiEnvelope stamped with the
        endpoint/profile/result identity
        (endpoint=references;schema=v1;references=v1;…): no TeiLifter, no
        ParsedArticle projection, no ParserPort on this seam. Citation
        conservation is a hard regression.
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: crates/da-parse/src/http.rs
    hard_regressions: [lost_references_or_links, nondeterministic_output]
