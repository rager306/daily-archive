    Every full row names the typed failure vocabulary that carries its
    failures. A row whose module defines a public error enum binds that enum; a
    row whose module defines none binds the shared parse-plane failure
    vocabulary in crates/da-parse/src/transport.rs, because that is the
    vocabulary through which the shadow/native implementation reports failure
    to the parse plane. The contract asserts each named identifier occurs as a
    separate identifier in the named source file.
