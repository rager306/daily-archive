schema_version: grobid-compatibility.v1
adr_ref: ADR-075
ledger_id: grobid-compatibility
requirement_ids: [R113, R117, R085, R110, R112, R118, R119, R120, R121, R124]
decisions: [D127, D204, D291, D292, D294, D295, D321]
import_eligible: false
auto_promote: forbidden

# Source-bound identities. T03 fills hashes/latency; T01 records the
# contract those reports must bind. Never store raw TEI/PDF here.
defaults:
  baseline:
    backend: java-grobid-http
    product: GROBID
    version: 0.9.0-crf
    license: Apache-2.0
    rest_base: /api
    default_port: 8070
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    vendor_paths: /root/vendor-source/grobid/grobid-service/src/main/java/org/grobid/service/GrobidPaths.java
  candidate:
    backend: da-parse
    crate: da-parse
    surface: crates/da-parse
    version: workspace
    license: project
  rollback_target: java-grobid-http@0.9.0-crf
  policy_stamp:
    closed_sources: [wasm, native_fallback, none]
    closed_hash_tokens: [none]
    production_consult: parse-pdf
    demo_cli_is_not_closure: true
    parse_pdf_consults: [grammar_route, profile_route]
    empty_native_unknown_point: [concurrency_tune, retry_policy, summary_depth]
  # S05/T01: independent Java absent-endpoint set. The roadmap shorthand
  # processHeaderFunding maps to the Java constant PATH_HEADER_FUNDING whose
  # wire token is processHeaderFundingDocument. This list — not
  # capabilities[].state — is the sole source of the forbidden set, so a
  # mutation of state cannot remove an endpoint from the checked set.
  rest_batch_asset_quarantine:
    source_artifacts:
      - artifacts/parse_compat/java_grobid_rest_batch_asset_source.json
      - data/parse/rest_batch_asset_parity.yaml
      - artifacts/parse_compat/rest_batch_asset_oracle_source.json
      - crates/da-parse/tests/fixtures/rest_batch_asset_oracle.yaml
      - artifacts/parse_compat/rest_batch_asset_shadow.json
    implemented_new_endpoints: 0
    sanctioned_parse_endpoints: [processFulltextDocument, processHeaderDocument, processReferences]
    local_batch_is_composition: true
    structural_parse_independent_of_enrichment: true
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
  java_absent_endpoints:
  - processHeaderFundingDocument
  - processFulltextDocumentHTML
  - processFulltextAssetDocument
  - createTraining
  - annotatePDF
  # S08/T01: DATA-gated visual-head quarantine. This section — not
  # capabilities[].state — is the sole source of the forbidden token set
  # and the production boundaries, so a mutation of state cannot remove a
  # token or boundary from the checked set. Snake_case tokens are matched
  # as call-sites (whitespace allowed before `(`); CamelCase tokens are
  # matched as type names (word boundary). Full-line and trailing `//`
  # comments are stripped; prose and prefix-substrings never count.
  visual_heads_quarantine:
    tokens:
    - detect_figure_heads
    - detect_table_heads
    - detect_formula_heads
    - run_visual_heads_sequence
    - NativeVisual
    - LayoutProvider
    boundaries:
    - crates/da-cli/src/source_cli.rs
    - crates/da-ports/src/parser.rs
  production_pdf_constructors:
    # After M471 PDF parse constructors consult ProfileRoute.
    # GrobidParser::from_env stays historical rich. A bare from_env used as
    # a PDF parse constructor splits D204 fingerprints. Health probes,
    # with_profile, corpus_grobid_parser and tests are allowed.
    scan_roots:
      - crates/da-cli/src
      - crates/da-cli/examples
    allowed_from_env_roles: [health_probe, with_profile, consult_helper, test, comment]
    consult_helper: crates/da-cli/src/parse_profile.rs
    forbidden_role: PARSE_BARE
  promotion:
    max_non_candidate_families: 1
    this_wave_promotes: none
    deployed: false
    auto_promote: forbidden
    reason: W6 does not candidate-promote; tracked conservation on preserved TEI is Conserved; native families stay shadow
  # Native P2 -> body accounting remains a test-only shadow sequence. These
  # call/type atoms must never enter parse-pdf source_cli or ParserPort.
  body_accounting_quarantine:
    tokens: [NativeBodyAccountant, run_native_body_sequence, join_p5_shadow, check_cross_stage_semantic_invariants]
    boundaries:
      - crates/da-cli/src/source_cli.rs
      - crates/da-ports/src/parser.rs
    production_authority: java_http
    observe_mode: shadow_receipt
  fulltext_blocks_quarantine:
    tokens: [account_full_regions, run_native_fulltext_blocks, NativeFulltextBlocksConfig]
    boundaries:
      - crates/da-cli/src/source_cli.rs
      - crates/da-ports/src/parser.rs
      - crates/da-application/src
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
  # S04 callout matching is a downstream, digest-only shadow join. Keep this
  # separate from S03 so the earlier quarantine remains independently audited.
  callout_matching_quarantine:
    tokens: [match_native_callouts, NativeCalloutMatchingOutcome, DigestOnlyTargetInventory]
    boundaries:
      - crates/da-cli/src/source_cli.rs
      - crates/da-ports/src/parser.rs
      - crates/da-application/src
      - crates/da-adapters/src
      - crates/da-parse/src/parser.rs
      - crates/da-parse/src/projector.rs
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
  # S05/T04 specialized metadata stays an accountant-bound offline shadow.
  # The dedicated s18 scanner must inspect only these production boundaries.
  consolidation_specialized_quarantine:
    tokens: [evaluate_native_consolidation_specialized, NativeConsolidationSpecializedOutcome, SpecializedFamilyOutcome]
    boundaries:
      - crates/da-cli/src/source_cli.rs
      - crates/da-ports/src/parser.rs
      - crates/da-application/src
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
    decision_point: 6
    independently_selectable: [header, references]
  # S06/T04 feature/tagger/training remains a digest-only advisory shadow.
  # Java HTTP owns production parsing; no engine, trainer, model, or promotion path is exposed.
  feature_tagger_training_quarantine:
    tokens: [NativeFeatureTagger, NativeFeatureInput, FeatureUpstreamStatus]
    boundaries:
      - crates/da-cli/src/source_cli.rs
      - crates/da-ports/src/parser.rs
      - crates/da-application/src
      - crates/da-adapters/src
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
    decision_point: 6
    independently_selectable: [header, references]
    dispositions: [port_structural_subset, replace_runtime_abstraction, defer_insufficient_evidence]
    training_and_model_runtime: forbidden
    same_n_required: true
  # S03/T07: the full native header lane (29-column feature ABI -> sequence
  # decode -> field projection) stays a shadow candidate. This section — not
  # capabilities[].state — is the sole source of the forbidden token set and
  # the production boundaries, so a mutation of state cannot remove a token or
  # boundary from the checked set. Snake_case tokens are matched as call-sites
  # (whitespace allowed before `(`); CamelCase tokens are matched as type names
  # (word boundary). Full-line and trailing `//` comments are stripped; prose
  # and prefix-substrings never count.
  header_sequence_quarantine:
    tokens:
    - compose_header
    - run_header_sequence
    - NativeDateParser
    - decode_header_sequence
    - render_header_features
    - render_header_feature_text
    - project_native_header_fields
    boundaries:
    - crates/da-cli/src/source_cli.rs
    - crates/da-ports/src/parser.rs
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
    deployed: false
    decision_point: 6
    independently_selectable: [header, references]
    # Additive registration of the new native surfaces. The 29-column ABI is
    # proven against the model's own column references; the seam re-export lives
    # in da-ports because da-parse may not name da-domain directly.
    native_surfaces:
    - path: crates/da-parse/src/native_header_features.rs
      schema_version: da-parse.native-header-features/v1
      abi_columns: 29
    - path: crates/da-parse/src/native_header_sequence.rs
      schema_version: da-parse.native-header-sequence/v1
      declared_labels: 44
      max_rows: 32768
    - path: crates/da-parse/src/native_header_fields.rs
      schema_version: da-parse.native-header-fields/v1
    seam_reexport: crates/da-ports/src/scalar_crf.rs
    independent_oracle: crates/da-parse/tests/native_header_same_n.rs
    real_model_harness: crates/da-adapters/tests/native_header_real_model.rs
    proof_level: contract
    offline_limits:
    - no_preserved_alto_for_the_three_fixtures_so_pdf_to_header_e2e_is_unproven
    - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
    - hub_native_accepted_20_vs_java_header_raw_21_is_a_named_gap_never_pooled
    - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
    - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  # S04/T08: the full native bibliography + callout lane (30-column citation
  # ABI, 28-column reference-segmenter ABI, 18/17 nested name/date rows, the
  # 38/6/9/7 label tables, base-name run grouping and the in-text callout
  # grammar) stays a shadow candidate. Like the header lane this section — not
  # capabilities[].state — is the sole source of the forbidden token set and
  # the production boundaries, so a mutation of state cannot remove a token or
  # boundary from the checked set.
  #
  # The existing bibliography split is untouched (MEM1115, D362):
  # `_BIBLIOGRAPHY_QUARANTINE_TOKENS` keeps ONLY the snake_case call-site atoms
  # `compose_references(` / `run_reference_sequence(`, and the ParserPort
  # type/method prohibition stays on the Rust side in
  # `crates/da-parse/tests/architecture_contract.rs`. This NEW key is additive
  # and carries the new lane's own atoms.
  # Snake_case tokens are matched as call-sites (whitespace allowed before
  # `(`); CamelCase tokens are matched as type names (word boundary). Full-line
  # and trailing `//` comments are stripped; prose and prefix-substrings never
  # count.
  bibliography_sequence_quarantine:
    tokens:
    # Row builders (the citation/reference-segmenter/nested ABI surfaces).
    - citation_row
    - reference_segmenter_row
    - name_citation_row
    - date_row
    # Printed-value renderers (the exact Java `printVector` text).
    - render_citation_feature_text
    - render_reference_segmenter_feature_text
    - render_name_citation_feature_text
    - render_date_feature_text
    # Decoders and the shared base-name run grouping.
    - decode_bibliography_labels
    - decode_reference_sequence
    - decode_citation_sequence
    - decode_name_citation_cluster
    - decode_date_cluster
    - bibliography_label_runs
    # Gazetteer consumption rule (positional spans, not single-token membership).
    - gazetteer_spans
    # In-text callout grammar and inventory linking.
    - classify_callout_markers
    - link_callout_markers
    # PascalCase row/span/role types of the same lane.
    - CitationFeatureRow
    - ReferenceSegmenterFeatureRow
    - BibliographySequenceFamily
    - BibliographyLabelRun
    - ReferenceSegmentSpan
    - CitationRoleSpan
    - NameCitationFeatureRow
    - DateFeatureRow
    - NativeNameCitation
    - NativeDateValue
    - NativePersonTitleCoverage
    - CalloutMarkerClass
    - CalloutBodyInventory
    - CalloutLinkReport
    - BibliographyGazetteerIndex
    boundaries:
    - crates/da-cli/src/source_cli.rs
    - crates/da-ports/src/parser.rs
    - crates/da-parse/src/parser.rs
    - crates/da-parse/src/projector.rs
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
    deployed: false
    decision_point: 6
    independently_selectable: [header, references]
    # Additive registration of the new native surfaces. The column counts are
    # the frozen models' own referenced-column counts (`#rdr#`), not a copy of
    # `printVector`'s wider field list. The seam re-export lives in da-ports
    # because da-parse may not name da-domain directly.
    native_surfaces:
    - path: crates/da-parse/src/native_feature_facts.rs
      schema_version: da-parse.native-feature-facts/v1
    - path: crates/da-parse/src/native_bibliography_gazetteer.rs
      schema_version: da-parse.native-bibliography-gazetteer/v1
    - path: crates/da-parse/src/native_bibliography_features.rs
      schema_version: da-parse.native-bibliography-features/v1
      abi_columns: 30
      reference_segmenter_columns: 28
      citation_labels: 38
      reference_segmenter_labels: 6
    - path: crates/da-parse/src/native_bibliography_sequence.rs
      schema_version: da-parse.native-bibliography-sequence/v1
      declared_labels: 38
      max_rows: 32768
    - path: crates/da-parse/src/native_bibliography_nested.rs
      schema_version: da-parse.native-bibliography-nested/v1
      abi_columns: 18
      date_columns: 17
      citation_labels: 9
      date_labels: 7
    - path: crates/da-parse/src/callout_markers.rs
      schema_version: da-parse.callout-markers/v1
    seam_reexport: crates/da-ports/src/scalar_crf.rs
    independent_oracle: crates/da-parse/tests/native_bibliography_same_n.rs
    real_model_harness: crates/da-adapters/tests/native_bibliography_real_model.rs
    proof_level: contract
    offline_limits:
    - no_preserved_alto_for_the_three_fixtures_so_pdf_to_bibliography_rows_is_unproven
    - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
    - bibl_lines_3135_and_bibl_tokens_15415_are_lexical_receipts_not_recorded_java_goldens
    - citation_names_2198_is_a_named_gap_never_pooled_with_references_207
    - identifier_and_url_gazetteer_lanes_are_shape_rules_not_source_bound_patterns
    - callout_inventory_resolution_is_ordinal_marker_to_body_label_not_java_coordinates
    - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
    - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  # S05/T06: the full native body/fulltext lane (27-column fulltext feature
  # ABI -> D359 base-name run decode -> cross-page reading order with continued
  # runs -> typed non-CRF sentence/language steps) stays a shadow candidate.
  # Like the header and bibliography lanes this section — not
  # capabilities[].state — is the sole source of the forbidden token set and
  # the production boundaries, so a mutation of state cannot remove a token or
  # boundary from the checked set.
  #
  # Naming adjacency is deliberate and the three keys are never merged (D362):
  # `defaults.fulltext_blocks_quarantine` (P2 region accounting),
  # `defaults.body_accounting_quarantine` (M496 P5 accountant) and this
  # `fulltext_sequence_quarantine` (M507 S05 body reading order) are three
  # different lanes; the first two stay untouched here.
  # Snake_case tokens are matched as call-sites (whitespace allowed before
  # `(`); CamelCase tokens are matched as type names (word boundary). Full-line
  # and trailing `//` comments are stripped; prose and prefix-substrings never
  # count.
  fulltext_sequence_quarantine:
    tokens:
    # The 27-column ABI in the exact `FeaturesVectorFulltext.printVector` order.
    - render_fulltext_features
    - render_fulltext_feature_text
    - check_fulltext_feature_columns
    - relative_position_fulltext_document
    - relative_position_fulltext_page
    # D359 base-name run decode over the shared grouping primitive.
    - decode_fulltext_sequence
    - check_fulltext_label_block
    - fulltext_label_is_admissible
    # Cross-page reading order and the continued-run page span.
    - glue_fulltext_reading_order
    - cross_page_runs
    # Typed non-CRF sentence/language steps and the body version registry.
    - native_body_version_surface
    # PascalCase row/run/step types of the same lane.
    - FulltextAlignment
    - FulltextCalloutType
    - FulltextFeatureRow
    - FulltextFeatureToken
    - FulltextFontSize
    - FulltextFontStatus
    - NativeFulltextFeatureError
    - FulltextLabelRun
    - NativeFulltextDecodeCandidate
    - NativeFulltextDecodeOutcome
    - NativeFulltextSequenceError
    - ColumnShift
    - CrossPageRun
    - NativeFulltextPageToken
    - NativeFulltextReadingOrder
    - NativeFulltextReadingOrderError
    - NativeFulltextTokenText
    - PageReadingSpan
    - NativeBodyStep
    - NativeBodyStepOutcome
    - NativeBodyStepReceipt
    - NativeBodySurfaceKind
    - NativeBodyVersionSurface
    - NativeLanguageStep
    - NativeSentenceStep
    boundaries:
    - crates/da-cli/src/source_cli.rs
    - crates/da-ports/src/parser.rs
    - crates/da-parse/src/parser.rs
    - crates/da-parse/src/projector.rs
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
    deployed: false
    decision_point: 6
    independently_selectable: [header, references]
    # Additive registration of the new native surfaces. `abi_columns: 27` is
    # the fulltext model's own feature width, not a copy of the citation or
    # header widths (S04/D361: separate scales). The seam re-export lives in
    # da-ports because da-parse may not name da-domain directly.
    native_surfaces:
    - path: crates/da-parse/src/native_fulltext_features.rs
      schema_version: da-parse.native-fulltext-features/v1
      abi_columns: 27
      relative_position_bins: 12
      max_rows: 32768
    - path: crates/da-parse/src/native_fulltext_sequence.rs
      schema_version: da-parse.native-fulltext-sequence/v1
      base_labels: 12
      label_spellings: 24
      max_rows: 32768
    - path: crates/da-parse/src/native_fulltext_reading_order.rs
      schema_version: da-parse.native-fulltext-reading-order/v1
      max_pages: 4096
      max_tokens: 32768
    - path: crates/da-parse/src/native_fulltext_sentence.rs
      schema_version: da-parse.native-fulltext-sentence/v1
      crf_family: false
    seam_reexport: crates/da-ports/src/scalar_crf.rs
    independent_oracle: crates/da-parse/tests/native_fulltext_same_n.rs
    real_model_harness: crates/da-adapters/tests/native_fulltext_real_model.rs
    proof_level: contract
    offline_limits:
    - no_preserved_alto_or_page_geometry_so_pdf_to_body_rows_is_unproven
    - same_n_frame_is_tei_to_body_atoms_not_pdf_to_atoms
    - sentence_and_language_are_named_gaps_not_reproduced_detectors
    - abstract_is_a_header_label_and_pdf_version_vs_tei_body_is_envelope_not_a_crf_family
    - fulltext_post_process_is_not_reproduced
    - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
    - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  # S06/T08: the native visual-family lane (figure/table second-pass decode over
  # the S05 27-column fulltext ABI, plus the formula locator join) stays a
  # shadow candidate. This section — not capabilities[].state — is the sole
  # source of the forbidden token set and the production boundaries.
  #
  # This key is a FIFTH lane next to `visual_heads_quarantine` (S08 geometric
  # heads), `fulltext_blocks_quarantine` (P2 region accounting),
  # `body_accounting_quarantine` (M496 P5 accountant) and
  # `fulltext_sequence_quarantine` (S05 body reading order) — it is never merged
  # with any of them (D362). Naming adjacency is not inheritance: the earlier
  # visual-head key carries no lock fields and only the weak `NativeVisual`
  # CamelCase token, so it cannot carry this lane's atoms.
  #
  # Snake_case tokens are matched as call-sites (whitespace allowed before `(`);
  # CamelCase tokens are matched as type names (word boundary). Full-line and
  # trailing `//` comments are stripped; prose and prefix-substrings never count.
  visual_family_sequence_quarantine:
    tokens:
    # Shared family clusteror and the common caption-link band.
    - cluster_family_label_runs
    - caption_links_from_markers
    # The `figure` second-pass runner over the S05 fulltext ABI.
    - decode_figure_sequence
    - check_figure_label_block
    - check_figure_column_window
    - figure_spans_from_decoded
    - figure_label_is_admissible
    # The `table` second-pass runner: same ABI plus the Java split/revert rules.
    - decode_table_sequence
    - check_table_label_block
    - check_table_column_window
    - table_spans_from_decoded
    - table_cells_from_inventory
    - table_revert_reason
    - cluster_opens_new_table
    - table_label_is_admissible
    # The `formula` locator join over an already-decoded fulltext sequence.
    - join_native_equations
    - join_native_equation_labels
    - is_formula_join_label
    # PascalCase row/span/outcome/error types of the same lane.
    - FamilyLabelCluster
    - NativeVisualFamilyClusterError
    - NativeCaptionMarker
    - NativeCaptionLinks
    - NativeCaptionLinkAbsence
    - FigureSpan
    - NativeFigureAbsence
    - NativeFigureDecodeOutcome
    - NativeFigureSequenceError
    - NativeTableSpan
    - NativeTableCell
    - NativeTableCells
    - NativeTableAbsence
    - NativeTableRevertReason
    - NativeTableDecodeOutcome
    - NativeTableSequenceError
    - NativeEquationSpan
    - NativeFormulaAbsence
    - NativeFormulaJoinError
    - NativeFormulaJoinOutcome
    boundaries:
    - crates/da-cli/src/source_cli.rs
    - crates/da-ports/src/parser.rs
    - crates/da-parse/src/parser.rs
    - crates/da-parse/src/projector.rs
    production_authority: java_http
    observe_mode: shadow_receipt
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    auto_promote: forbidden
    deployed: false
    decision_point: 6
    independently_selectable: [header, references]
    # The families themselves are DATA in the S06 dictionary; this key only
    # carries the locks and the ABI facts a boundary scan can be held to.
    data_binding: data/parse/native_visual_families.yaml
    schema_version: native-visual-families.v1
    grouping_rule: tagging_token_clusteror_is_beginning
    caption_link_resolve_owner: native_callout_matching
    caption_link_empty_inventory: not_observed
    # The figure/table second pass reads the S05 fulltext ABI unchanged: 27
    # emitted columns, and only columns 0..=25 are referenced by the frozen
    # models' own `%x[...]` templates (col 26, superscript, is never referenced).
    emitted_columns: 27
    referenced_columns: 26
    model_root_env: DA_GROBID_MODEL_ROOT
    bundled_model_bytes: false
    independent_oracle: crates/da-parse/tests/native_visual_family_same_n.rs
    real_model_harness: crates/da-adapters/tests/native_visual_family_real_model.rs
    proof_level: contract
    offline_limits:
    - row_and_cell_merge_geometry_is_not_reproduced_so_table_cells_need_a_caller_inventory
    - caption_marker_to_reference_resolution_is_owned_by_s04_native_callout_matching
    - fulltext_post_process_fix_invalid_table_or_figure_is_not_reproduced
    - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
    - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  # S06/T08: the native funding lane (17-column `FeaturesVectorFunding` ABI with
  # the literal `0` dummy label column, 10-label decode and entity lift) stays a
  # shadow candidate. It owns this key and its own ABI; it is never merged with
  # the visual-family key above or with any earlier quarantine.
  funding_sequence_quarantine:
    tokens:
    # The 17-column ABI in the exact `FeaturesVectorFunding.printVector` order.
    - render_funding_features
    - render_funding_feature_text
    - check_funding_feature_columns
    - validate_funding_gazetteer_coverage
    # The funding decode and its entity lift.
    - decode_funding_sequence
    - check_funding_label_block
    - check_funding_column_window
    - funding_entries_from_decoded
    - funding_label_is_admissible
    - funding_role_of_label
    # PascalCase row/coverage/entry/outcome/error types of the same lane.
    - FundingFeatureRow
    - FundingFeatureToken
    - FundingLineStatus
