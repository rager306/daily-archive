  # ------------------------------------------------------------------------
  # Required-scope downgrade registry (M516-th0oby/S05, D548/D551).
  #
  # The 12 `scope: required` rows the frozen corpus declares
  # `outside_corpus_parity` have no measurable frozen-corpus mechanism, so each
  # is resolved by a recorded `not_applicable` downgrade that names an owner, a
  # reason from the single existing outside-corpus vocabulary, a decision
  # reference (D551; D548 carries the downgrade semantics and is superseded on
  # placement) and a rationale. The block is total over exactly those 12
  # families: the family stays `required` with `state: threshold_pending`, and
  # only the gate disposition is downgraded. Judged fail-closed by
  # crates/da-parse/tests/parity_ledger/mod.rs.
  #
  # `reason_vocabulary_ref` is a pointer, not a copy: the seven reasons already
  # live once in `parity_measurement.outside_reason_vocabulary`.
  # ------------------------------------------------------------------------
  required_scope_downgrades:
    disposition_vocabulary: [not_applicable]
    required_record_fields: [owner, reason, decision_ref, rationale]
    reason_vocabulary_ref: parity_measurement.outside_reason_vocabulary
    records:
      rest.isalive:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: rest_transport_surface
        decision_ref: D551
        rationale: >-
          The is-alive probe is a transport liveness signal, not a parse-stage
          artefact: a frozen document corpus carries no HTTP transport byte to
          compare, so the frozen-corpus parity lane has no denominator and the
          family is downgraded rather than assigned a false threshold.
      rest.health:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: rest_transport_surface
        decision_ref: D551
        rationale: >-
          The health endpoint reports service liveness as a JSON surface with
          no scholarly content, so there is no frozen-corpus byte to score and
          a measured threshold would be fabricated rather than observed.
      rest.version:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: rest_transport_surface
        decision_ref: D551
        rationale: >-
          The version endpoint is a build-identity probe; the frozen corpus
          stores document bytes and holds no version payload, so the family
          cannot be measured on it and is recorded as a downgrade.
      rest.processFulltextDocument:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: rest_transport_surface
        decision_ref: D551
        rationale: >-
          The frozen corpus scores TEI content, not the HTTP request/response
          dialect of this endpoint: the fulltext content itself is measured by
          the native fulltext stage families, and the REST transport surface
          has no frozen-corpus denominator.
      rest.processHeaderDocument:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: rest_transport_surface
        decision_ref: D551
        rationale: >-
          Header content is measured by stage.header_composition, while this
          row is the REST transport surface; the frozen corpus carries no
          request/response dialect byte, so the transport family is downgraded
          instead of double-counted as a content measurement.
      rest.processReferences:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: rest_transport_surface
        decision_ref: D551
        rationale: >-
          Reference content is measured by stage.reference_segmentation, while
          this row is the REST transport surface; the frozen corpus carries no
          request/response dialect byte, so the transport family is downgraded
          rather than measured against a denominator it does not have.
      dialect.teiCoordinates:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: dialect_flag_surface
        decision_ref: D551
        rationale: >-
          Coordinate emission is an opt-in wire dialect flag on the request,
          not an artefact of the parse itself; the frozen corpus records TEI
          output rather than request shape, so the dialect surface has no
          measured denominator on a frozen corpus.
      stage.pdfalto_layout:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: pdf_input_stage_not_in_tei_composition
        decision_ref: D551
        rationale: >-
          The pdfalto layout stage runs on the PDF before TEI composition; the
          frozen corpus scores the composed TEI, so the pre-composition layout
          output is not represented and cannot be measured on that corpus.
      stage.document_segmentation:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: lane_not_admitted_in_measurement
        decision_ref: D551
        rationale: >-
          The segmentation lane is not admitted into the measured runner path
          for this milestone, so the frozen corpus carries no segmentation
          denominator; the family is recorded as downgraded rather than left
          as an unstated pending threshold.
      stage.figure_table_formula:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: visual_lane_not_admitted_in_measurement
        decision_ref: D551
        rationale: >-
          The visual lane is not admitted into the measurement, so figures,
          tables and formulas have no frozen-corpus denominator; the family is
          downgraded by decision rather than measured against a population the
          corpus does not contain.
      stage.bibliographic_consolidation:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: java_side_profile_surface
        decision_ref: D551
        rationale: >-
          Bibliographic consolidation is a Java-side request profile surface:
          the frozen corpus scores scholarly content, not consolidation flag
          behaviour, so the family has no frozen-corpus denominator to measure.
      stage.tei_lift:
        disposition: not_applicable
        owner: M516-th0oby/S05
        reason: not_in_measured_runner_path
        decision_ref: D551
        rationale: >-
          The TEI lift stage is not in the measured runner path, so there is
          no frozen-corpus execution to measure; the family is recorded as
          downgraded instead of assigned a threshold that was never observed.
  denominators:
    capabilities: 38
    scope:
      required: 15
      supporting: 14
      not_compatibility_requirement: 5
      deferred: 4
    implemented: 22
    absent: 16
    parity:
      full: 21
      not_applicable_no_java_donor: 1
      not_claimed_absent: 16
    named_gaps: 1
  locks:
    import_eligible: false
    production_route: forbidden
    graph_write: forbidden
    auto_promote: forbidden
    deployed: false
  # ------------------------------------------------------------------------
  # Negative fixtures for the mutation matrix (S07/T03, H21). These are DATA,
  # not a second copy in the test: `id` is stable and `expected_detection` is
  # the exact validator error token that must catch the tampered ledger. The
  # mutation target (crates/da-parse/tests/grobid_parity_ledger_mutations.rs)
  # owns the appliers; it fails when the applied registry diverges from this
  # list, when any mutation is a no-op, or when any mutation survives.
  # H21-N1 = incomplete link (missing_test_link et al.); H21-N2 = scope
  # substitution (scope_substitution_*).
  # ------------------------------------------------------------------------
  mutations:
  - id: missing_java_source_id
    expected_detection: has no java link
  - id: missing_rust_entry
    expected_detection: has no rust link
  - id: missing_test_link
    expected_detection: has no test link
  - id: scope_substitution_supporting_to_required
    expected_detection: "!= product_scope"
  - id: scope_substitution_required_to_supporting
    expected_detection: "!= product_scope"
  - id: absent_row_claims_parity
    expected_detection: disagree on absence
  - id: absent_row_missing_reason
    expected_detection: has no absent reason
  - id: unknown_capability_id
    expected_detection: has no capability
  - id: missing_row
    expected_detection: has no parity row
  - id: duplicate_row
    expected_detection: appears 2 times
  - id: java_sha256_mismatch_vs_capture
    expected_detection: "!= capture"
  - id: java_sha256_not_hex
    expected_detection: is not 64 lowercase hex
  - id: rust_symbol_not_found_in_file
    expected_detection: rust symbol
  - id: test_fn_not_found_in_target
    expected_detection: test fn
  - id: test_path_not_a_tests_target
    expected_detection: is not a crates/**/tests/ target
  - id: license_identity_unresolved
    expected_detection: does not resolve in
  - id: full_without_links
    expected_detection: claims full parity
  - id: denominators_drift
    expected_detection: denominators.capabilities
  - id: rust_path_escape
    expected_detection: escapes the repository root
  - id: test_path_absolute
    expected_detection: escapes the repository root
  # ------------------------------------------------------------------------
  # Fourth-link measurement negatives (M513-r7dg4z/S03, D471): the coverage
  # judge (`check_measurement_coverage`) must reject a missing link on a
  # required row, a link on a row that is not required, an unknown class or
  # reason, and the identity judge (`check_measurement_identity`) must reject
  # an artifact-bytes drift, an identity digests drift and a pooled quality
  # claim. Each token is the exact validator error path.
  # ------------------------------------------------------------------------
  - id: measurement_missing_on_required_row
    expected_detection: has no measurement
  - id: measurement_on_absent_row
    expected_detection: declares a measurement
  - id: measurement_unknown_class
    expected_detection: not in the declared class set
  - id: measurement_unknown_reason
    expected_detection: not in the declared measurement reason vocabulary
  - id: measurement_artifact_sha_drift
    expected_detection: "!= artifact bytes"
  - id: measurement_identity_digest_drift
    expected_detection: "!= artifact identity"
  - id: measurement_pooled_claim_allowed
    expected_detection: must be forbidden
  # ------------------------------------------------------------------------
  # Absent-disposition fate negatives (M513-r7dg4z/S05, D478/D479): the
  # fail-closed judge `check_absent_dispositions` is only proven where it
  # rejects tampering, so each fate invariant gets a DATA-declared mutation
  # whose `expected_detection` is the exact validator token. Coverage: missing
  # entry, stray entry, unknown disposition/reason, empty rationale, an
  # in-horizon capability without order, an out-of-scope capability with
  # order, a duplicate order, a horizon gap, and a named-gap disagreement with
  # the typed no-donor refusal. The appliers are real in-memory edits in
  # crates/da-parse/tests/grobid_parity_ledger_mutations.rs.
  # ------------------------------------------------------------------------
  - id: absent_disposition_missing_entry
    expected_detection: has no disposition
  - id: absent_disposition_stray_entry
    expected_detection: has no capability
  - id: absent_disposition_unknown_disposition
    expected_detection: not in the declared absent disposition vocabulary
  - id: absent_disposition_unknown_reason
    expected_detection: not in the declared absent reason vocabulary
  - id: absent_disposition_empty_rationale
    expected_detection: has no rationale
  - id: absent_disposition_in_horizon_without_order
    expected_detection: has no horizon order
  - id: absent_disposition_out_of_scope_with_order
    expected_detection: claims a horizon order
  - id: absent_disposition_duplicate_horizon_order
    expected_detection: duplicate horizon order
  - id: absent_disposition_horizon_gap
    expected_detection: is not contiguous
  - id: absent_disposition_named_gap_disagreement
    expected_detection: disagrees with the named gap refusal
