    implementation:
      crate: da-parse
      surface: crates/da-parse/src/lift.rs
      notes: >-
        String-find lift; no XML parser (no XXE). Single algorithm owner since
        S02/T02 is the provider-neutral TeiLifter (TeiEnvelope + logical
        paper_id/pdf_hash in, TeiParseIr out); GrobidParser::lift_tei delegates
        to the same code. Silent skip of missing fixtures is a hard integrity
        regression. Conservation inventory is S03: the typed evidence is
        da_parse::ConservationEngine.compare(TeiEnvelope, TeiParseIr), bound
        per case in the parse-compat baseline report (S03/T04). P0
        idno/authors/figures/coords is S07.
    baseline: preserved-java-tei
    candidate: da-parse@lift-v1
    evidence_ref: crates/da-parse/src/lift.rs
