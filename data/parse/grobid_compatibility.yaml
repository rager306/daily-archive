# --------------------------------------------------------------------------
# Java -> Rust parity ledger (M511-j7wz2f/S07, H21).
#
# Additive top-level block inside the same sanctioned carrier (D377): no new
# file under data/parse/ is created and capabilities[] is not restated. Each
# row is keyed by capabilities[].id and never re-declares product_scope; the
# contract test (crates/da-parse/tests/grobid_parity_ledger_contract.rs) holds
# the mapping fail-closed. Locks are unchanged: import_eligible=false,
# production_route/graph_write/auto_promote=forbidden, deployed=false.
# Contained paths only: the contract rejects absolute paths, `..` components
# and paths resolving outside the repository root, and `pinned_by` refers to
# the vendor root declared once as java_source_vendor_root.
# --------------------------------------------------------------------------
parity_ledger:
  contract_id: grobid-java-rust-parity-ledger.v1
  authority: >-
    capabilities[] in this same file is the sole capability denominator; the
    parity rows below are a per-capability binding projection over it. Java
    content is pinned in java_sources (logical path + sha256 + how it was
    pinned); Rust surfaces and independent tests are named per row.
  requirement_ids: [R113, R117]
  observed_checkout_revision: 523bb8e97f357e93682dc4eaa6d22faa8b5b93de
  capture_declared_revision: 0b0ab53b159b32792a01fca1d9d04fd02cf8b24b
  revision_discrepancy_note: >-
    The baseline identity java-grobid-http@0.9.0-crf and the existing capture
    artifacts under artifacts/parse_compat/ declare revision
    0b0ab53b159b32792a01fca1d9d04fd02cf8b24b, while the live vendor checkout at
    /root/vendor-source/grobid reports 523bb8e97f357e93682dc4eaa6d22faa8b5b93de.
    Every pinned Java file re-hashes to the value recorded in its capture or to
    a fresh sha256sum of the observed checkout, so the ledger binds content,
    not a revision label. Hash-vs-vendor recomputation is S07/T06.
  scope_vocabulary: [required, supporting, deferred, not_compatibility_requirement]
  parity_level_vocabulary:
  - full
  - partial
  - not_applicable_no_java_donor
