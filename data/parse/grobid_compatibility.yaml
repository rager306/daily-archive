schema_version: grobid-compatibility.v1
adr_ref: ADR-075
ledger_id: grobid-compatibility
requirement_ids: [R113, R117, R085, R110, R112]
decisions: [D127, D204, D291, D292, D294, D295]
import_eligible: false
auto_promote: forbidden

# Source-bound identities. T03 fills hashes/latency; T01 records the
# contract those reports must bind. Never store raw TEI/PDF here.
defaults:
  baseline:
    backend: java-grobid-http
    product: GROBID
    version: 0.9.0-crf
    license: Apache-2.0
    rest_base: /api
    default_port: 8070
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    vendor_paths: /root/vendor-source/grobid/grobid-service/src/main/java/org/grobid/service/GrobidPaths.java
  candidate:
    backend: da-parse
    crate: da-parse
    surface: crates/da-parse
    version: workspace
    license: project
  rollback_target: java-grobid-http@0.9.0-crf
  profiles:
    rich:
      consolidateHeader: 1
      consolidateCitations: 1
      teiCoordinates: [figure, table, note, formula]
    structural:
      consolidateHeader: 0
      consolidateCitations: 0
      teiCoordinates: [figure, table, note, formula]
  current_request_dialect:
    # da-parse GrobidProfile currently maps two bools onto 0|1, not the
    # official 0|1|2(|3) consolidation dialect. S04 types the full dialect.
    consolidateHeader: bool-as-0-1
    consolidateCitations: bool-as-0-1
    teiCoordinates_constant: figure,table,note,formula
  known_hard_regressions_until_t02:
  - silent_skip_missing_tei_fixture
  configuration_keys_documented_not_owned:
    # Values live at da-cli composition root (R116). Ledger records names only.
  - DA_GROBID_URL
  - DA_PARSE_BACKEND
  - DA_PARSE_CACHE_MODE
  - DA_PARSE_CACHE_ROOT
  - DA_PARSE_BATCH_SIZE
  - DA_PARSE_WORKERS
  - DA_PARSE_QUEUE_CAPACITY
  - DA_PARSE_POLICY_ROOT
  - DA_PARSE_EXPERIENCE_RVF_PATH
  - DA_PARSE_REDB_INDEX_ENABLED
  - DA_PARSE_REDB_INDEX_PATH

capability_groups:
  1: service_liveness
  2: fulltext
  3: header_and_references
  4: fine_grained_header_citation
  5: coordinates_and_annotations
  6: training_evaluation_promotion
  7: patent_deferred

capabilities:
  # ------------------------------------------------------------------
  # Group 1 — service liveness (ADR-075 §2.8 required subset)
  # ------------------------------------------------------------------
  - id: rest.isalive
    group: 1
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: GET /api/isalive
      grobid_path_constant: PATH_ALIVE
      request_fields: []
      response_format: text/plain true|false
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidParser::is_alive
      notes: GET {GROBID_URL}/api/isalive; fail-closed ParserError::Unavailable
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: crates/da-parse/src/http.rs
    hard_regressions: [panic]
    metrics:
      conservation: not_applicable
      quality: boolean_alive
      performance: probe_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.health
    group: 1
    kind: endpoint
    state: absent
    product_scope: required
    promotion_state: candidate
    official:
      identity: GET /api/health
      grobid_path_constant: PATH_HEALTH
      request_fields: []
      response_format: JSON Dropwizard/health payload
    implementation:
      crate: da-parse
      surface: none
      notes: Not called. Optional REST facade (D291) must not bind :8070.
    baseline: java-grobid-http@0.9.0-crf
    candidate: none
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    hard_regressions: [panic]
    metrics:
      conservation: not_applicable
      quality: status_code
      performance: probe_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.version
    group: 1
    kind: endpoint
    state: absent
    product_scope: required
    promotion_state: candidate
    official:
      identity: GET /api/version
      grobid_path_constant: PATH_VERSION
      request_fields: []
      response_format: JSON {name, version, revision} or plain version string
    implementation:
      crate: da-parse
      surface: none
      notes: T03 reports Java version when the service is reachable; no client yet.
    baseline: java-grobid-http@0.9.0-crf
    candidate: none
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    hard_regressions: [incorrect_cache_reuse]
    metrics:
      conservation: not_applicable
      quality: version_string_match
      performance: probe_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  # ------------------------------------------------------------------
  # Group 2 — fulltext
  # ------------------------------------------------------------------
  - id: rest.processFulltextDocument
    group: 2
    kind: endpoint
    state: proxy
    product_scope: required
    promotion_state: candidate
    official:
      identity: POST /api/processFulltextDocument
      grobid_path_constant: PATH_FULL_TEXT
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      - {name: consolidateHeader, required: false, type: enum, values: [0, 1, 2, 3]}
      - {name: consolidateCitations, required: false, type: enum, values: [0, 1, 2]}
      - {name: consolidateFunders, required: false, type: enum, values: [0, 1, 2]}
      - {name: includeRawCitations, required: false, type: enum, values: [0, 1]}
      - {name: includeRawAffiliations, required: false, type: enum, values: [0, 1]}
      - {name: teiCoordinates, required: false, type: list, values: [persName, figure, ref, biblStruct, formula, s, note, title, head, p, affiliation, table]}
      - {name: segmentSentences, required: false, type: enum, values: [0, 1]}
      - {name: generateIDs, required: false, type: enum, values: [0, 1]}
      - {name: start, required: false, type: int, meaning: first_page}
      - {name: end, required: false, type: int, meaning: last_page}
      response_format: application/xml TEI (200); 204 empty; 400 invalid; 503 busy
      busy_semantics: honest_503_not_internal_retry
    implementation:
      crate: da-parse
      surface: crates/da-parse/src/http.rs GrobidParser::parse_pdf
      notes: >-
        Multipart input + consolidateHeader/Citations from GrobidProfile bools
        (0|1 only) + teiCoordinates JSON [figure,table,note,formula]. Timeout
        120s. Profile fingerprint rotates cache identity (D204). Full dialect
        (modes 2/3, funders, raw fields, page window) is S04. Since S02 the
        transport sits behind the provider-neutral ParseBackend seam
        (GrobidHttpBackend); wire contract and cache identity are unchanged.
    baseline: java-grobid-http@0.9.0-crf
    candidate: da-parse@http-proxy
    evidence_ref: crates/da-parse/src/http.rs
    hard_regressions:
    - lost_references_or_links
    - changed_reading_order
    - lost_figures_tables_formulas
    - invented_revision
    - nondeterministic_output
    - panic
    - dropped_parser_work
    - incorrect_cache_reuse
    metrics:
      conservation: tei_family_counts
      quality: header_reference_field_accuracy
      performance: p50_p95_p99_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.processFulltextAssetDocument
    group: 2
    kind: endpoint
    state: absent
    product_scope: supporting
    promotion_state: candidate
    official:
      identity: POST /api/processFulltextAssetDocument
      grobid_path_constant: PATH_FULL_TEXT_ASSET
      request_fields:
      - {name: input, required: true, type: pdf-bytes}
      - {name: consolidateHeader, required: false, type: enum, values: [0, 1, 2, 3]}
      - {name: consolidateCitations, required: false, type: enum, values: [0, 1, 2]}
      - {name: teiCoordinates, required: false, type: list}
      response_format: zip of TEI plus extracted assets
    implementation:
      crate: da-parse
      surface: none
      notes: Not a compatibility requirement. Asset zip is not graph truth (D127).
    baseline: java-grobid-http@0.9.0-crf
    candidate: none
    evidence_ref: https://grobid.readthedocs.io/en/latest/Grobid-service/
    hard_regressions: [incorrect_cache_reuse]
    metrics:
      conservation: asset_family_counts
      quality: not_gated
      performance: p95_latency_ms
    rollback_target: java-grobid-http@0.9.0-crf

  - id: rest.processFulltextDocumentHTML
    group: 2
