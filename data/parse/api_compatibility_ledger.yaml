# API compatibility OBSERVATION ledger — scholarly parse plane
# (M464-z84in2 / S01 / T01).
#
# RELATIONSHIP TO THE REGISTRY OF RECORD: the canonical GROBID compatibility
# ledger required by R113/R117 is `data/parse/grobid_compatibility.yaml`
# (generic-reader contract in data/parse/SCHEMA.yaml). THIS document is its
# observation input for T03's baseline promotion: it records ONLY currently
# observable facts of the crates/da-parse surface (ADR-075 staged native Rust
# platform) plus the compatibility obligations that later tasks must preserve.
# It is not a second ledger of record and introduces no competing states.
#
# Every entry states visibility; internal load-bearing behavior is marked
# `internal_observable`. Changing an obligation requires bumping
# `ledger_version` here and coordinating the same fact into
# grobid_compatibility.yaml within the slice wave.
#
# S04/T04: the fulltext endpoint entry additionally carries the optional
# `typed_transport:` structured record documenting the versioned request
# dialect and the closed failure vocabulary. `ledger_version` stays 1 — the
# legacy 4-field wire contract and the D204 identities are byte-unchanged
# (additive typed observation, not wire-contract evolution).
# tests/data_contracts.rs cross-validates the record against live code and
# fails loudly on any invented failure code, unmapped status or unsupported
# request version.
ledger_version: 1
scope_note: >-
  Covers the public exports of crates/da-parse plus its implementing
  da_ports::parser::ParserPort contract. HTML parsing, PDF classification and
  XY-Cut live in da-adapters (see crates/da-parse/src/lib.rs crate docs) and
  are out of scope here. Registry-of-record cross-references used by
  regression_cases.yaml: rest.processFulltextDocument, dialect.teiCoordinates,
  stage.tei_lift. Since M464-z84in2 S02 the staged-platform seams
  (ParseBackend, TeiEnvelope, TeiLifter, ScholarlyParser) are observed under
  the existing entry ids below — no parallel ledger and no new capability
  identities (R105). Since S04 the typed transport (versioned
  FulltextRequestV1 request dialect, closed ParseBackendFailure vocabulary,
  compatibility facade mapping) is documented inside the existing fulltext
  endpoint entry — still no parallel ledger (R107/R113/R117).
policy_locks:
  import_eligible: false
  dspy_enabled: false
  graph_mutation: forbidden
  llm_promotion: forbidden
  free_label_invention: forbidden
  sidecar_status: candidate_evidence_only
entries:
  - id: parse.entrypoint.grobid_parser.parse_pdf
    kind: entrypoint
    owner_crate: da-parse
    visibility: public_trait_impl
    stability: stable
    entry_point: da_ports::parser::ParserPort::parse_pdf
    implemented_by: da_parse::GrobidParser (compatibility facade composing da_parse::ScholarlyParser since S02/T03)
    port_trait: da_ports::parser::ParserPort
    request_shape: 'parse_pdf(&self, pdf_path: &str, paper_id: &str)'
    input_kind: pdf_file_path_string
    result_shape: 'ParseResult<ParsedArticle> = Result<ParsedArticle, ParserError>'
    error_shapes:
      - 'ParseFailed(String) — local PDF read failure (tokio::fs::read)'
      - 'Unavailable("parse backend failure: code={busy|timeout|transport} phase=… status=… …") — availability-class typed backend failure, fail-closed'
      - 'ParseFailed("parse backend failure: code={no_content|limit_exceeded|invalid_request|conversion_failed|invalid_response} phase=… status=… limit=… retry_after=…") — remaining typed backend failures (204, 413/opt-in bounds, 400, 5xx/body read, uninterpretable status)'
    async_behavior: async_trait method; tracing span name grobid_parse carrying paper_id
    notes:
      - Trait default parse_html stays ParserError::Unavailable on this path — there is no silent HTML fallback.
      - ParsedArticle keeps tei_xml = Some(raw TEI); layout_json and page_text_missingness stay None until a classifier stamps them later.
      - 'Since S02/T03 the facade drives the provider-neutral composition da_parse::ScholarlyParser (exactly one ParseBackend call, then TeiEnvelope → TeiLifter → projection); grobid_parse span, aggregate identity/size/timing-only logs and the error mapping are unchanged.'
      - 'Since S04/T03 typed backend failures cross the seam as Result<_, ParseBackendFailure> and convert to ParserError exactly once via ParseBackendFailure::to_parser_error: availability class (busy, timeout, transport) -> Unavailable, every other closed code -> ParseFailed; strings carry stable code=/phase=/status=/limit=/retry_after= metadata and never a cause, body, source or payload.'
    compatibility_obligation: Signature, error mapping (fail-closed Unavailable on transport loss) and the ParsedArticle projection shape must be preserved by all later native/direct-parser work in this slice; the two-variant ParserError vocabulary must not grow — typed failures stay behind the seam (R107).
  - id: parse.constructor.grobid_parser
    kind: constructor
    owner_crate: da-parse
    visibility: public_fn
    stability: stable
    entry_point: da_parse::GrobidParser::{new, from_env, with_profile, with_timeout, profile}
    request_shape: 'new(url: Option<&str>) | from_env() -> GrobidParser'
    notes:
      - Base URL resolution order explicit argument -> env GROBID_URL -> crate default http://127.0.0.1:8070 (DEFAULT_GROBID_URL, pub(crate)).
      - Default reqwest client timeout is 120s; with_timeout(Duration) overrides it operationally without changing successful TEI semantics.
      - Default profile is GrobidProfile::rich().
    compatibility_obligation: URL/env resolution order, the interactive 120s default and builder chaining are observable behavior; the HTTP timeout override must NEVER become an input of stage cache/content keys.
  - id: parse.probe.is_alive
    kind: probe
    owner_crate: da-parse
    visibility: public_fn
    stability: stable
    entry_point: da_parse::GrobidParser::is_alive
    http_endpoint: /api/isalive
    http_method: GET
    result_shape: 'async fn is_alive(&self) -> bool'
    notes:
      - Returns true only on success-status responses; any transport error yields false.
      - Never panics, performs no retries.
    compatibility_obligation: Boolean-only liveness contract (true on success status, false on any failure, no panic) must hold; callers may treat false as service-unavailable.
  - id: parse.endpoint.process_fulltext_document
    kind: endpoint
    owner_crate: da-parse
    visibility: internal_observable
    stability: internal_observable
    entry_point: da_parse::GrobidParser::process_fulltext (pub(crate); reached through ParserPort::parse_pdf)
    http_endpoint: /api/processFulltextDocument
    http_method: POST
    request_fields:
      - 'input — multipart file part named paper.pdf with mime application/pdf'
      - 'consolidateCitations — text field rendered from the typed consolidation level (sanctioned 0..=1; legacy presets send "1" or "0")'
      - 'consolidateHeader — text field rendered from the typed consolidation level (sanctioned 0..=2; legacy presets send "1" or "0")'
      - 'teiCoordinates — text field holding the JSON array rendered from the typed CoordinateSet; legacy presets keep the D204 constant ["figure","table","note","formula"]'
      - 'consolidateFunders — text field rendered from the typed funders level (sanctioned 0..=1); appended only when non-zero, omitted equals the GROBID default'
      - 'includeRawCitations — "1" only when the typed switch is on; omitted otherwise'
      - 'includeRawAffiliations — "1" only when the typed switch is on; omitted otherwise'
      - 'segmentSentences — "1" only when the typed switch is on; omitted otherwise'
      - 'generateIDs — "1" only when the typed switch is on; omitted otherwise'
      - 'start — first page of the validated inclusive PageWindow (>= 1); appended only with a window'
      - 'end — last page (>= start) of the validated inclusive PageWindow; appended only with a window'
    result_shape: 'Result<TeiEnvelope, ParseBackendFailure> — verbatim raw TEI bytes (any encoding, no lossy decode) plus exact backend/profile identity (grobid-http | cached-tei)'
    error_shapes:
      - 'ParseBackendFailure — closed schema_version=1 vocabulary: busy (503 + bounded Retry-After), timeout, transport, no_content (204), limit_exceeded (413 or opt-in byte bounds), invalid_request (400), conversion_failed (5xx / body read), invalid_response'
      - 'Unavailable("parse backend failure: code={busy|timeout|transport} …") — facade availability mapping, honest no-retry 503'
      - 'ParseFailed("parse backend failure: code=… phase=… status=… limit=… retry_after=…") — facade fail-closed mapping of the remaining codes; the error body is never read and no payload/path/URL enters an error or log'
    notes:
      - 'Since S02/T01 the transport result crosses the provider-neutral ParseBackend seam as a TeiEnvelope — verbatim raw TEI bytes plus exact backend/profile identity (backend id grobid-http); bytes are never normalized or trimmed.'
      - 'The cached-TEI backend (backend id cached-tei) serves already-available bytes through the same seam without HTTP; the wire contract above is untouched.'
      - 'Since S04/T01 the wire request is the serde-versioned FulltextRequestV1 dialect (FulltextRequestVersioned envelope, request schema version 1): typed Consolidation modes (header 0..=2, citations/funders 0..=1), typed CoordinateSet (deduped canonical wire order), raw citation/affiliation switches, sentence/ID switches and a validated inclusive page window. GrobidHttpBackend is the sole multipart projector: exact Java GROBID names/values above, extended fields appended only when enabled, so legacy rich/structural requests stay byte-identical to the S02 wire contract (D204 fingerprints pinned by tests/cache_identity.rs).'
      - 'Since S04/T02 every wire outcome is a typed closed branch: 200 -> verbatim bytes (non-UTF-8 survives), 204 -> no_content, 400 -> invalid_request, 413 and opt-in request/response byte bounds -> limit_exceeded, 503 -> busy with honest no-retry and bounded Retry-After metadata (seconds | unparsable | absent), reqwest timeout -> timeout (distinct from connect/DNS/other transport), other 5xx -> conversion_failed, anything else -> invalid_response. No hidden retry; the error body is never read.'
      - 'Extended (non-legacy-equivalent) dialects own a versioned canonical identity (fulltext=v1;… from FulltextDialectV1::canonical_identity) that never collides with the legacy D204 fingerprints; timeout and opt-in byte limits are transport tuning excluded from identity.'
      - 'registry_binding: rest.processFulltextDocument; dialect.teiCoordinates'
    # S04/T04 typed transport record. ledger_version stays 1: the legacy
    # 4-field wire contract and D204 identities are byte-unchanged, so this
    # is additive observation, not wire-contract evolution. Any change to
    # the legacy wire values, failure codes or statuses MUST bump
    # ledger_version (and PARSE_FAILURE_SCHEMA_VERSION for new codes) in the
    # same commit — enforced by tests/data_contracts.rs cross-validation.
    typed_transport:
      request_schema: fulltext-v1
      request_schema_version: 1
      failure_schema_version: 1
      statuses: [200, 204, 400, 413, 503]
      failure_codes:
      - busy
      - timeout
      - transport
      - no_content
      - limit_exceeded
      - invalid_request
      - conversion_failed
      - invalid_response
      retry_policy: honest_503_no_hidden_retry
      retry_after_metadata: bounded_parse
      compatibility_facade: 'availability class (busy, timeout, transport) -> ParserError::Unavailable; every other code -> ParserError::ParseFailed; strings carry stable code=/phase=/status=/limit=/retry_after= metadata only'
    compatibility_obligation: The legacy multipart field names/values ARE the wire contract with Java GROBID; any change rotates the parse-stage cache identity (D204) and must bump ledger_version in the same commit. Additive V1 dialect fields ride the versioned request envelope and must keep the legacy projection byte-identical; the failure vocabulary is closed — new codes/statuses require a coordinated PARSE_FAILURE_SCHEMA_VERSION bump and the same coordinated identity decision as any D204 rotation.
  - id: parse.stage.lift_tei
    kind: lift_stage
    owner_crate: da-parse
    visibility: public_fn
    stability: stable
    entry_point: da_parse::TeiLifter::lift_tei (single algorithm owner; da_parse::GrobidParser::lift_tei delegates)
    request_shape: 'TeiLifter::lift(&TeiEnvelope, paper_id, pdf_hash) -> TeiParseIr | lift_tei(tei_xml: String, paper_id, pdf_hash) -> TeiParseIr'
    result_shape: TeiParseIr (pub struct — tei_xml, paper_id, title, abstract_text, body_text, sections, citations, tables, table_missingness, formulas, formula_missingness, pdf_hash)
    notes:
      - Pure local transformation; does NOT call Java GROBID or the network.
      - Extraction coverage this cut — title, abstract, body text, sections (nested div walk with flat head scan fallback and lexical path collision resolution), citations with in-text ref anchors resolved against back-matter xml:id, tables, formulas.
      - Intentional absences this cut — author lists, article-level idno and non-table figures are NOT parsed; TeiParseIr carries no fields for them.
      - 'Since S02/T02 the single lift algorithm is owned by the provider-neutral da_parse::TeiLifter — it accepts a TeiEnvelope (verbatim raw TEI bytes plus exact backend/profile identity from the ParseBackend seam) with logical paper_id/pdf_hash and needs no HTTP, filesystem or runtime infrastructure.'
      - 'da_parse::GrobidParser::lift_tei stays a compatibility delegate onto the same code — envelope-vs-compatibility parity is proven byte-exact on the preserved fixtures (S02/T02).'
      - 'Since S03/T04 the sanctioned conservation evidence for every lift result is da_parse::ConservationEngine.compare(&TeiEnvelope, &TeiParseIr); the parse-compat baseline binds each executed case ConservationDelta (identity/verdict/delta_digest plus family/span/structure/reason counts and a malformed summary) under data/parse/comparison_contract.yaml conservation_evidence.'
      - 'registry_binding: stage.tei_lift'
    compatibility_obligation: Lift determinism over unchanged TEI bytes is fixed; the intentional-absence list may only shrink behind a compatibility-note commit, never silently grow content.
  - id: parse.stage.project_article
    kind: project_stage
    owner_crate: da-parse
    visibility: internal_observable
    stability: stable
    entry_point: da_parse::GrobidParser::project_article
    request_shape: 'project_article(ir: TeiParseIr) -> ParsedArticle'
    result_shape: da_ports::parser::ParsedArticle
    notes:
      - Pure projection onto the ports type; layout_json stays None and page_text_missingness stays None on the GROBID path because a classifier stamps them later.
      - Section navigation identity — path_id, parent_section_id, order_in_parent, section_id sec-{path_id} — is produced by the section extractors consumed here.
      - 'Reached through the S02 composition da_parse::ScholarlyParser::lift_and_project as well as the GrobidParser facade; pure projection semantics and the ParsedArticle shape are unchanged.'
      - 'registry_binding: stage.tei_lift'
    compatibility_obligation: Projection must remain total and allocation-safe over any TeiParseIr and preserve the ports ParsedArticle field semantics consumed downstream by ingest.
  - id: parse.profile.rich
    kind: profile_contract
    owner_crate: da-parse
    visibility: public_fn
    stability: stable
    entry_point: da_parse::GrobidProfile::rich
    profile_name: rich
    configuration_fingerprint: 'profile=rich;consolidateHeader=1;consolidateCitations=1;teiCoordinates=figure,table,note,formula'
    notes:
      - Citation/header consolidation is Crossref-dependent — typically +2–5s per paper and can take minutes under rate-limit backoff.
      - This is the constructor default profile (legacy pilot behavior).
    compatibility_obligation: The exact configuration_fingerprint string is a durable cache-key component (D204); mixed consolidation policies report name "custom" and must never reuse this identity.
  - id: parse.profile.structural
    kind: profile_contract
    owner_crate: da-parse
    visibility: public_fn
    stability: stable
    entry_point: da_parse::GrobidProfile::structural
    profile_name: structural
    configuration_fingerprint: 'profile=structural;consolidateHeader=0;consolidateCitations=0;teiCoordinates=figure,table,note,formula'
    notes:
      - Consolidation flags are zero so header/bibliography enrichment runs later through the cached OpenAlex/Crossref stage — Crossref-independent and the managed scalable default (D204).
      - Coordinate groups stay enabled including formula coords added by M400 S03 T01.
    compatibility_obligation: The exact configuration_fingerprint string is a durable cache-key component (D204); structural requests must never share cache entries with rich or custom policies.
