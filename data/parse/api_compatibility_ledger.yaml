      - 'Since S05/T02 the operation runs through the ONE endpoint-neutral one-shot multipart exchange shared with fulltext: exactly one POST to the static /api/processReferences route (ParseEndpoint::static_path only), exactly one streamed response read, every wire outcome a typed closed branch. No hidden retry; the error body is never read.'
