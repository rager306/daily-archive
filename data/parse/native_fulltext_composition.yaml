# S18/T01 additive source-bound admission authority.
# This file is a schema-validated policy input, not a runtime route or report.
schema_version: native-fulltext-composition.v1
adr_ref: ADR-075
authority_id: native-fulltext-composition
observation_mode: shadow
promotion_state: candidate
auto_promote: forbidden
import_eligible: false
production_route: forbidden
graph_mutation: forbidden
rollback_target: java-grobid-http@0.9.0-crf
component_ids: [header, references, document_segmentation, figure, table, formula, learning_policy]
dispositions: [passed, fallback, rejected, unsupported, not_observed, invalid_evidence, stale]
strata:
  # S05/T06: `body` is registered as an observation stratum, never as a
  # component and never as an independently selectable lane (R125): the
  # fulltext body reading order is observed and fallback routing stays Java.
  # S06/T08 extends the same sanctioned superset with `funding` (R125): the
  # native funding lane is a shadow observation band, so `component_ids`
  # stays exactly seven, `admission.current_matrix` is untouched and
  # `admission.independently_selectable` stays exactly `[header, references]`.
  # A superset here is sanctioned; neither lane is admitted by it.
  lanes: [header, references, document_segmentation, body, funding]
  domains: [computer_science, physics, mathematics]
  genres: [research_article, survey, proceedings]
  closed: true
admission:
  native_substitution_requires: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt]
  terminal_receipt_is_pass: false
  pooled_winner: forbidden
  independently_selectable: [header, references]
  output_affecting_learning: false
  current_matrix:
    header: passed
    references: passed
    document_segmentation: fallback
    figure: fallback
    table: fallback
    formula: fallback
    learning_policy: not_observed
  fallback_target: java-grobid-http@0.9.0-crf
source_evidence:
  s12_named_denominators:
    date_total: 173
    header_raw_total: 36
    header_accepted_total: 35
    header_rejected_or_incomplete: 1
    # S03/T07: native header field denominators (T05 test-local constants).
    # These extend the header lane's field coverage; they are not a pool with
    # the accepted author denominator and never replace it.
    header_title_stmt_total: 3
    header_title_elements_total: 6
    header_emails_total: 3
    header_idno_elements_total: 6
    header_pubnum_elements_total: 3
    header_checksum_idno_elements_total: 3
    header_date_elements_total: 6
    citation_names_total: 2198
    affiliation_recognition_total: 13
    affiliation_linking_total: 13
    references_total: 207
    # S04/T08: native bibliography lane denominators (T07 lexical receipts,
    # native_bibliography_same_n.rs). The 3135/15415 pair is what binds the
    # native "one ABI row per token" claim to an independent number; the three
    # biblStruct receipts are the per-fixture split of the 207 total. They are
    # NOT pooled with header or accepted-author denominators.
    bibl_struct_hub_total: 80
    bibl_struct_rlm_total: 49
    bibl_struct_reca_total: 78
    bibl_lines_total: 3135
    bibl_tokens_total: 15415
    bibl_author_elements_total: 2185
    # S05/T06: native body reading-order lane denominators (T05 lexical
    # receipts, native_fulltext_same_n.rs). The 2375/75369 pair is what binds
    # the native "one ABI row per body token" claim to an independent number;
    # the family split is the DATA-ledger partition (body_blocks /
    # body_markers / visual_content) and sums exactly to the totals. 376 is
    # THIS lane's body-scoped `<ref type="bibr">` marker denominator; 380 is
    # the bibliography oracle's whole-document anchor population, restated so
    # the two can never be quietly pooled. A maximal base-name run is a finer
    # population than a family run (1313 vs 641) and neither replaces tokens.
    body_blocks_total: 2375
    body_tokens_total: 75369
    body_runs_total: 1313
    body_family_blocks_total: {body_blocks: 1678, body_markers: 475, visual_content: 222}
    body_family_tokens_total: {body_blocks: 67025, body_markers: 1525, visual_content: 6819}
    body_bibr_markers_total: 376
    body_anchors_restated_total: 380
    body_receipt_digest: 285a5ddd0c49a51616de2f40a48b6c9d18ce0a71e8685a73d3c15ace11069ec9
    anchors_total: 380
    anchors_targeted: 217
    anchors_targetless: 163
    anchors_fragmented_adjacency: 168
    java_lift_same_n:
      # Java TeiLifter (M473) equals independent raw/biblStruct, not native accepted
      # or citation-name populations. Hub 21 vs 20 is a named gap, not a pool.
      java_header_authors_equals: header_raw_total
      java_biblstruct_equals: references_total
      hub_native_accepted_header: 20
      hub_java_header_raw: 21
      citation_names_not_biblstruct: true
      pooling_accepted_with_raw: forbidden
      pooling_citation_names_with_references: forbidden
  s15_shared_intersection: {documents: 3, lanes: 3, terminal_lane_receipts: 9, source: immutable_s15_manifest}
  s16_shared_intersection: {documents: 3, lanes: 3, visual_receipts: 27, source: immutable_s16_manifest}
  s17_lineage: {source: immutable_s17_candidate_lineage, output_affecting: false, live_ruvllm_receipt: not_observed}
component_receipts:
  header:
    producer: S12
    disposition: passed
    evidence_state: passing
    schema_version: native-composition.outcome/v1
    source_hash: required_sha256
    artifact_sha256: optional_sha256_when_present
    fallback_target: java-grobid-http@0.9.0-crf
    # S03/T07: the native header lane beneath this receipt (29-column feature
    # ABI -> sequence decode -> title/email/ids projection). Shadow-only;
    # proof level is contract and the offline limits are named, not hidden.
    native_header_sequence:
      features_schema_version: da-parse.native-header-features/v1
      sequence_schema_version: da-parse.native-header-sequence/v1
      fields_schema_version: da-parse.native-header-fields/v1
      abi_columns: 29
      declared_labels: 44
      proof_level: contract
      hub_gap: {java_header_raw: 21, native_accepted_header: 20, pooling: forbidden}
      offline_limits:
      - no_preserved_alto_for_the_three_fixtures_so_pdf_to_header_e2e_is_unproven
      - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
      - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
      - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  references:
    producer: S12
    disposition: passed
    evidence_state: passing
    schema_version: native-composition.outcome/v1
    source_hash: required_sha256
    artifact_sha256: optional_sha256_when_present
    fallback_target: java-grobid-http@0.9.0-crf
    # S04/T08: the native bibliography lane beneath this receipt (gazetteer ->
    # 30/28-column feature ABI -> base-name run decode -> 19 citation role
    # clusters -> 18/17 nested name/date families -> callout grammar).
    # Shadow-only; proof level is contract and the offline limits are named,
    # not hidden (D360/D361/D362).
    native_bibliography_sequence:
      feature_facts_schema_version: da-parse.native-feature-facts/v1
      gazetteer_schema_version: da-parse.native-bibliography-gazetteer/v1
      features_schema_version: da-parse.native-bibliography-features/v1
      sequence_schema_version: da-parse.native-bibliography-sequence/v1
      nested_schema_version: da-parse.native-bibliography-nested/v1
      callout_schema_version: da-parse.callout-markers/v1
      citation_columns: 30
      reference_segmenter_columns: 28
      name_citation_columns: 18
      date_columns: 17
      citation_labels: 38
      reference_segmenter_labels: 6
      name_citation_labels: 9
      date_labels: 7
      citation_roles: 19
      proof_level: contract
      named_gap: {citation_names: 2198, references: 207, bibl_author_elements: 2185, pooling: forbidden}
      offline_limits:
      - no_preserved_alto_for_the_three_fixtures_so_pdf_to_bibliography_rows_is_unproven
      - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
      - bibl_lines_3135_and_bibl_tokens_15415_are_lexical_receipts_not_recorded_java_goldens
      - citation_names_2198_is_a_named_gap_never_pooled_with_references_207
      - identifier_and_url_gazetteer_lanes_are_shape_rules_not_source_bound_patterns
      - callout_inventory_resolution_is_ordinal_marker_to_body_label_not_java_coordinates
      - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
      - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  document_segmentation:
    producer: S15
    disposition: fallback
    evidence_state: invalid_evidence
    schema_version: native-segmentation.v1
    source_hash: required_sha256
    artifact_sha256: optional_sha256_when_present
    fallback_target: java-grobid-http@0.9.0-crf
    # S05/T06: the native body reading-order lane is registered here as an
    # OBSERVATION stratum beneath the existing segmentation component. This is
    # not a new component_id, and it admits nothing: producer, disposition and
    # evidence_state above are untouched, `body` stays out of
    # `admission.independently_selectable`, and `decision_point` stays 6.
    # Shadow-only; proof level is contract and the offline limits are named,
    # not hidden.
    native_fulltext_body_sequence:
      lane: body
      production_identity: processFulltextDocument
      features_schema_version: da-parse.native-fulltext-features/v1
      sequence_schema_version: da-parse.native-fulltext-sequence/v1
      reading_order_schema_version: da-parse.native-fulltext-reading-order/v1
      sentence_schema_version: da-parse.native-fulltext-sentence/v1
      abi_columns: 27
      base_labels: 12
      label_spellings: 24
      max_rows: 32768
      max_pages: 4096
      max_tokens: 32768
      grouping_rule: base_name_equality
      named_gap: {sentence_detection: not_implemented, language_identification: not_implemented, abstract: header_label_s03, pdf_version_vs_tei_body: envelope}
      denominators: {blocks: 2375, tokens: 75369, runs: 1313, body_bibr_markers: 376, bibliography_anchor_total: 380, pooling: forbidden}
      receipt_digest: 285a5ddd0c49a51616de2f40a48b6c9d18ce0a71e8685a73d3c15ace11069ec9
      proof_level: contract
      offline_limits:
      - no_preserved_alto_or_page_geometry_so_pdf_to_body_rows_is_unproven
      - same_n_frame_is_tei_to_body_atoms_not_pdf_to_atoms
      - sentence_and_language_are_named_gaps_not_reproduced_detectors
      - abstract_is_a_header_label_and_pdf_version_vs_tei_body_is_envelope_not_a_crf_family
      - fulltext_post_process_is_not_reproduced
      - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
      - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  figure: {producer: S16, disposition: fallback, evidence_state: unsupported, schema_version: native-visual-heads.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, fallback_target: java-grobid-http@0.9.0-crf}
  table: {producer: S16, disposition: fallback, evidence_state: not_observed, schema_version: native-visual-heads.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, fallback_target: java-grobid-http@0.9.0-crf}
  formula: {producer: S16, disposition: fallback, evidence_state: unsupported, schema_version: native-visual-heads.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, fallback_target: java-grobid-http@0.9.0-crf}
  learning_policy: {producer: S17, disposition: not_observed, evidence_state: not_observed, schema_version: candidate-lineage.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, output_affecting: false, fallback_target: java-grobid-http@0.9.0-crf}
hard_regressions: [terminal_receipt_as_pass, denominator_erosion, unknown_stratum, checksum_drift, schema_drift, stale_evidence, pooling, missing_rollback, promotion, import, raw_payload, physical_path]
redaction:
  allowed: [component_id, producer, disposition, lane, domain, genre, source_hash, artifact_sha256, evidence_digest, byte_count, truncated, fallback_target]
  forbidden: [raw_tei, tei_xml, pdf_bytes, body_text, text, captions, references, physical_path, hostname, executable, secret]
used_by: [S18-T01, S18-T02, S18-T03, S18-T04, S18-T05]

# S08/T04 additive route-recovery ledger (D377: one sibling block inside an
# already sanctioned DATA file, never a new `data/parse/*.yaml`).
#
# This block JOINS two existing DATA authority tables — the closed P0..P9
# cascade skeleton (`data/parse/grobid_compatibility.yaml#defaults.cascade_stages`)
# and the component admission matrix above (`admission.current_matrix`, with
# `component_receipts`) — into per-stage recovery verdicts, and quantifies them
# with the measured Java-work receipt (`artifacts/parse_compat/native_java_work.json`).
#
# It is a DERIVED qualification table, never a route: no row dispatches
# anything, `production_route` stays `forbidden` everywhere, and
# `grobid_compatibility.yaml` remains the rollback/baseline authority. This
# block owns the recovery qualification and nothing else.
#
# `java_models_observed` names are TAKEN FROM the S08/T03 verified receipt and
# are never guessed here: the loader refuses a name the receipt did not observe,
# refuses a model the receipt observed but no stage attributes, and refuses a
# model attributed by two stages.
route_recovery:
  schema_version: native-route-recovery.v1
  adr_ref: ADR-075
  requirement_ids: [R109, R085, R123, R117]
  # The two DATA tables this ledger joins. Everything else it reads is evidence
  # and is listed separately below, never as a second authority.
  source_tables:
  - data/parse/grobid_compatibility.yaml#defaults.cascade_stages
  - data/parse/native_fulltext_composition.yaml#admission.current_matrix
  source_evidence:
  - data/parse/native_fulltext_composition.yaml#component_receipts
  - data/parse/native_fulltext_composition.yaml#admission.native_substitution_requires
  - data/parse/native_fulltext_composition.yaml#admission.independently_selectable
  - data/parse/native_fulltext_composition.yaml#source_evidence.s12_named_denominators
  - data/parse/native_fulltext_composition.yaml#redaction.forbidden
  - data/parse/layout_bakeoff.yaml#corpus
  - artifacts/parse_compat/native_java_work.json
  - artifacts/parse_compat/native_core_profile.json
  - artifacts/parse_compat/native_core_smp.json
  qualification_vocabulary:
    # Closed lists, reused rather than reinvented: `component_states` must equal
    # this file's top-level `dispositions` exactly, and `stage_verdicts` must
    # equal the emitter's closed Rust vocabulary exactly. The loader refuses any
    # drift between either pair.
    component_states: [passed, fallback, rejected, unsupported, not_observed, invalid_evidence, stale]
    stage_verdicts: [recoverable, not_qualified, fallback, not_observed]
    condition_states: [met, unmet, not_applicable]
    surface_states: [present, absent, none_declared]
  # DATA-owned mapping from an owned component's admission disposition to the
  # verdict it forces. `admitted` is not a stage verdict: it only means the
  # component does not block recovery on its own. The key set must equal
  # `dispositions` exactly, so a new component state cannot appear here unnamed.
  component_state_verdicts:
    passed: admitted
    fallback: fallback
    rejected: not_qualified
    unsupported: not_qualified
    not_observed: not_qualified
    invalid_evidence: not_qualified
    stale: not_qualified
  # First match wins and every guard before the last is a refusal, so a stage
  # reaches `recoverable` only by passing all of them. Declared here so the rule
  # is DATA-owned; the emitter asserts this exact order against its closed enum.
  verdict_rule:
    order: [native_surface_absent, no_admitted_component, component_not_admitted, admission_conditions_unmet, core_qualification_missing, java_work_not_observed, no_attributed_java_work, all_conditions_met]
    reasons:
      native_surface_absent: no native surface is declared for the stage, or the declared path is absent from the tree
      no_admitted_component: the stage owns no component in admission.current_matrix, so nothing may be recovered
      component_not_admitted: at least one owned component is not `passed`
      admission_conditions_unmet: at least one of the four substitution conditions is unmet
      core_qualification_missing: the native-core qualification receipts are absent or unusable
      java_work_not_observed: the Java-work receipt carries no measurement, so no reduction may be published
      no_attributed_java_work: no measured Java model invocation is attributed to the stage
      all_conditions_met: every recovery guard passed
  # Applies to EVERY stage row. Each row restates it so a weakened row is visible
  # in the diff, and the loader refuses any row that drifts from this copy.
  recovery_rule_invariants:
    requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt]
    requires_core_qualification: true
    requires_measured_java_work: true
    pooling: forbidden
  # How `recovery_rule_invariants.requires_all_of` is evaluated per component.
  # These are the four conditions named by `admission.native_substitution_requires`.
  admission_conditions:
    exact_source_identity: the component receipt source_hash must be required_sha256
    exact_schema_version: the component receipt schema_version must be an exact non-empty token
    optional_sha256_when_present: the component receipt artifact_sha256 must be optional_sha256_when_present
    passing_receipt: the component must be `passed` with evidence_state `passing`, and a terminal receipt never counts as a pass
  measured_java_work:
    unit: java_model_invocations
    source: verified_stage_tape
    receipt: artifacts/parse_compat/native_java_work.json
    java_cpu_wall_clock: not_observed
    rss_ceiling: not_observed
    claim: offline_attribution_only_never_a_deployed_reduction
  denominators:
    corpus_id: s13-same-input-pdf-corpus
    corpus_manifest: data/parse/layout_bakeoff.yaml#corpus
    corpus_documents: 3
    corpus_documents_pinned_by_sha256: true
    unit: java_model_invocations
    pooled: forbidden
    # Restated from source_evidence.s12_named_denominators. The loader refuses a
    # value that differs there, refuses an extra key, and — because the two named
    # populations are separate keys — makes collapsing them into one impossible.
    named_gaps:
      citation_names: 2198
      references: 207
      pooling: forbidden
  attribution_rule:
    each_observed_model_attributed_exactly_once: true
    unattributed_models: forbidden
    double_attributed_models: forbidden
    names_are_taken_from_the_verified_receipt: true
  stages:
  - stage: P0
    java_stage: admit_identity_profile
    production_authority: java_http
    native_surface: none
    components: []
    java_models_observed: []
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P1
    java_stage: pdfalto_layout_lattice
    production_authority: java_http
    native_surface: crates/da-parse/src/layout.rs
    components: []
    java_models_observed: []
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P2
    java_stage: document_segmentation
    production_authority: java_http
    native_surface: crates/da-parse/src/native_segmentation.rs
    components: [document_segmentation]
    java_models_observed: [segmentation]
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P3
    java_stage: header_heads_and_compose
    production_authority: java_http
    native_surface: crates/da-parse/src/native_composition.rs
    components: [header]
    java_models_observed: [affiliation-address, date, header, name-header]
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P4
    java_stage: bibliography_segment_and_compose
    production_authority: java_http
    native_surface: crates/da-parse/src/native_composition.rs
    components: [references]
    java_models_observed: [citation, name-citation, reference-segmenter]
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P5
    java_stage: fulltext_body_sections
    production_authority: java_http
    native_surface: crates/da-parse/src/native_body.rs
    components: []
    java_models_observed: [fulltext]
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P6
    java_stage: figure_table_formula
    production_authority: java_http
    native_surface: crates/da-parse/src/native_visual.rs
    components: [figure, table, formula]
    java_models_observed: [figure, table]
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P7
    java_stage: tei_coordinates_callouts
    production_authority: java_http
    native_surface: none
    components: []
    java_models_observed: []
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P8
    java_stage: bibliographic_consolidation
    production_authority: java_profile
    native_surface: crates/da-parse/src/profile.rs
    components: []
    java_models_observed: []
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  - stage: P9
    java_stage: tei_lift_conservation
    production_authority: tei_lift
    native_surface: crates/da-parse/src/lift.rs
    components: []
    java_models_observed: []
    recovery_rule: {requires_all_of: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt], requires_core_qualification: true, requires_measured_java_work: true, pooling: forbidden}
  # Every lock restated here must equal the copy it mirrors: the file-level
  # locks above, the admission matrix above, and the T03 Java-work receipt.
  locks:
    production_route: forbidden
    deployed: false
    import_eligible: false
    auto_promote: forbidden
    graph_mutation: forbidden
    selection: forbidden
    decision_point: 6
    independently_selectable: [header, references]
  # Equal to this file's `redaction.forbidden`; the loader refuses any drift.
  redaction:
    forbidden: [raw_tei, tei_xml, pdf_bytes, body_text, text, captions, references, physical_path, hostname, executable, secret]
  named_limitations:
  - the date model is consumed by both the header and the reference lanes and is attributed exactly once, to P3, so the per-stage sums conserve the measured total instead of double-counting it
  - the fulltext model is attributed to P5, whose body lane is an observation stratum and never an independently selectable component, so P5 stays not_qualified
  - recovery verdicts qualify offline receipts only and never dispatch a route
  - a stage whose native surface exists but whose component is not `passed` keeps Java as the authority; a fallback is never reclassified as recoverable
  - java_cpu_wall_clock and rss_ceiling stay typed not_observed and h05 is not closed by this ledger
  h05_closure: not_claimed
  h05_reason: per-stage Java CPU wall-clock and RSS ceilings stay typed not_observed; only Java model invocations are measured and no byte, CPU or memory ceiling is claimed
  used_by: [S08-T04, S08-T05]

# M511-j7wz2f/S02/T04: reference-link integrity contract (D377: one more sibling
# block inside this already sanctioned DATA file, never a new `data/parse/*.yaml`).
#
# The file's existing sha256 binding in
# `scripts/governor/checks/scholarly_parse_plane.yaml#bindings.source_data` is the
# only registration surface: no second registry entry and no second file.
#
# What this fixes: the composer used to publish a synthesized `bibl-{ordinal}`
# domain while copying the source body verbatim, so every kept `target="#b0"`
# dangled in an emission still reported as `Accepted` (measured 217 occurrences /
# 120 unique dangling targets across the three sha256-pinned preserved TEI).
# The tokens below are mirrored one-for-one by the composer's code constants
# (`NATIVE_FULLTEXT_REFERENCE_LINK_*`) and the DATA contract test refuses drift
# in either direction.
#
# This block owns the id-space and the resolve rule only. It is not a route:
# `production_route`/`auto_promote`/`graph_mutation` stay `forbidden`,
# `import_eligible` stays false and Java stays the rollback authority.
reference_link_integrity:
  contract_id: native-fulltext-reference-link-integrity.v1
  adr_ref: ADR-076
  # The emitted document's `#fragment` address space is the *source's* published
  # keys — declared `xml:id`, else the positional fallback — never a synthesized
  # `bibl-{ordinal}` domain (which is exactly how the links came to dangle).
  id_space: source_published_keys
  # Those keys are the direct `biblStruct` children of the source's unique
  # `listBibl`, in source order. A non-`biblStruct` direct child is a typed
  # `InconservableBibliographyChild`, not a silent drop.
  derivation: source_listbibl_direct_children
  # The same text `da_ports::citation_link::positional_entry_key` publishes.
  positional_fallback: "b{ordinal}"
  # The obligations read from the *source* document: `ref type="bibr"` carrying a
  # non-empty local `#`-fragment `target`, by the XML attribute grammar (so
  # `target = '#b0'` counts exactly like the compact spelling, and a ref inside a
  # comment or CDATA creates no obligation).
  required_targets: source_ref_type_bibr_with_hash_target
  # The gate runs after the splice, in the emitted document's id space: the
  # pre-splice guard only saw the supplied anchor stream, so an empty stream
  # beside a live body link left it vacuous.
  resolve_gate: post_splice
  # Typed refusals; never a generic failure and never a silent drop.
  refusal_classes:
  - BibliographyDomainMismatch
  - BibliographyKeyCollision
  - UnresolvedBibliographyTarget
  - InconservableBibliographyChild
  # The observable record `NativeFulltextManifest.reference_links` publishes for
  # this rule (`#[serde(default)]`, so pre-S02 manifests decode to an all-zero
  # record). Order is the composer's field order; the DATA contract test compares
  # this exact set with the composer's serialized ledger shape.
  ledger_fields:
  - source_entries
  - admitted_references
  - target_occurrences
  - required_targets
  - resolved_targets
  - id_space
  pooling: forbidden
  named_limitations:
  - the rule is measured on the three sha256-pinned preserved TEI and is not yet a corpus regression; S05 owns the independent corpus check
  - an emission whose source declares no `xml:id` falls back to positional keys by construction, never to a synthesized domain
  used_by: [S02-T04, S02-T05]

# M511-j7wz2f/S03/T03: lane fallback policy contract (D377: one more sibling
# block inside this already sanctioned DATA file, never a new `data/parse/*.yaml`).
#
# The per-lane right to fall back to Java used to live only as prose spread over
# several DATA carriers (`comparison_contract.yaml` both :348 and :584,
# `grobid_compatibility.yaml`, `document_segmentation.yaml`,
# `native_visual_families.yaml`), so a disagreement between two carriers was
# invisible and a Rust run could silently substitute a lane's semantics or cancel
# that lane's fallback right (H16-N2). The tokens below are mirrored one-for-one
# by the composer's code constants (`NATIVE_FULLTEXT_LANE_FALLBACK_*` plus
# `SemanticFieldLoss::ALL`) and the DATA contract test refuses drift in either
# direction, both against the code and against every already-published carrier.
#
# This block owns the policy and nothing else: it is not a route,
# `production_route`/`auto_promote`/`graph_mutation` stay `forbidden`,
# `import_eligible` stays false and Java stays the rollback authority.
lane_fallback_policy:
  contract_id: native-fulltext-lane-fallback-policy.v1
  adr_ref: ADR-076
  # The lanes that may be independently selected for native substitution. These
  # are exactly the lanes `admission.independently_selectable` and every other
  # carrier already publish: an added lane here is a fabricated admission, and a
  # dropped lane would withdraw a lane's fallback right by omission.
  independently_selectable_lanes: [header, references]
  # Where an unadmitted or refused lane goes: the frozen Java envelope.
  fallback_target: java-grobid-http@0.9.0-crf
  # A lane closes only on its own receipt. An aggregate `passed` never closes a
  # lane, so no lane's fallback right may be cancelled by a sibling's success.
  lane_closure: own_receipt_only
  # Lanes are never pooled into a winner: one lane's disposition is never
  # computed from another lane's result.
  pooling: forbidden
  # A terminal receipt is never a pass (the `admission` block above says the
  # same; this block is the lane-scoped restatement).
  terminal_receipt_is_pass: false
  # The Rust shadow run may refuse typed and keep the byte-identical Java
  # envelope, but it may never cancel, consume or override a lane's fallback.
  rust_run_may_not_cancel_fallback: true
  # The typed refusal classes a Rust run may emit for an admitted semantic field
  # it cannot conserve. Exactly the composer's `SemanticFieldLoss` vocabulary in
  # report order; a second copy of the vocabulary is not a contract.
  refusal_classes:
  - SemanticFieldLoss::HeaderTitle
  - SemanticFieldLoss::HeaderEmail
  - SemanticFieldLoss::HeaderIds
  - SemanticFieldLoss::AuthorAffiliation
  - SemanticFieldLoss::CitationRole
  named_limitations:
  - the policy is measured against the three sha256-pinned preserved TEI and is not yet a corpus regression; S05 owns the independent corpus check
  - lane admission stays shadow/candidate, so this block grants no production route and does not lift D127
  - the refusal vocabulary is the composer's SemanticFieldLoss tokens, never a second dictionary
  - an unadmitted lane keeps Java as the authority and a fallback is never reclassified as recoverable
  used_by: [S03-T03, S03-T04]
