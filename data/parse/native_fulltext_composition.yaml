# S18/T01 additive source-bound admission authority.
# This file is a schema-validated policy input, not a runtime route or report.
schema_version: native-fulltext-composition.v1
adr_ref: ADR-075
authority_id: native-fulltext-composition
observation_mode: shadow
promotion_state: candidate
auto_promote: forbidden
import_eligible: false
production_route: forbidden
graph_mutation: forbidden
rollback_target: java-grobid-http@0.9.0-crf
component_ids: [header, references, document_segmentation, figure, table, formula, learning_policy]
dispositions: [passed, fallback, rejected, unsupported, not_observed, invalid_evidence, stale]
strata:
  lanes: [header, references, document_segmentation]
  domains: [computer_science, physics, mathematics]
  genres: [research_article, survey, proceedings]
  closed: true
admission:
  native_substitution_requires: [exact_source_identity, exact_schema_version, optional_sha256_when_present, passing_receipt]
  terminal_receipt_is_pass: false
  pooled_winner: forbidden
  independently_selectable: [header, references]
  output_affecting_learning: false
  current_matrix:
    header: passed
    references: passed
    document_segmentation: fallback
    figure: fallback
    table: fallback
    formula: fallback
    learning_policy: not_observed
  fallback_target: java-grobid-http@0.9.0-crf
source_evidence:
  s12_named_denominators:
    date_total: 173
    header_raw_total: 36
    header_accepted_total: 35
    header_rejected_or_incomplete: 1
    # S03/T07: native header field denominators (T05 test-local constants).
    # These extend the header lane's field coverage; they are not a pool with
    # the accepted author denominator and never replace it.
    header_title_stmt_total: 3
    header_title_elements_total: 6
    header_emails_total: 3
    header_idno_elements_total: 6
    header_pubnum_elements_total: 3
    header_checksum_idno_elements_total: 3
    header_date_elements_total: 6
    citation_names_total: 2198
    affiliation_recognition_total: 13
    affiliation_linking_total: 13
    references_total: 207
    # S04/T08: native bibliography lane denominators (T07 lexical receipts,
    # native_bibliography_same_n.rs). The 3135/15415 pair is what binds the
    # native "one ABI row per token" claim to an independent number; the three
    # biblStruct receipts are the per-fixture split of the 207 total. They are
    # NOT pooled with header or accepted-author denominators.
    bibl_struct_hub_total: 80
    bibl_struct_rlm_total: 49
    bibl_struct_reca_total: 78
    bibl_lines_total: 3135
    bibl_tokens_total: 15415
    bibl_author_elements_total: 2185
    anchors_total: 380
    anchors_targeted: 217
    anchors_targetless: 163
    anchors_fragmented_adjacency: 168
    java_lift_same_n:
      # Java TeiLifter (M473) equals independent raw/biblStruct, not native accepted
      # or citation-name populations. Hub 21 vs 20 is a named gap, not a pool.
      java_header_authors_equals: header_raw_total
      java_biblstruct_equals: references_total
      hub_native_accepted_header: 20
      hub_java_header_raw: 21
      citation_names_not_biblstruct: true
      pooling_accepted_with_raw: forbidden
      pooling_citation_names_with_references: forbidden
  s15_shared_intersection: {documents: 3, lanes: 3, terminal_lane_receipts: 9, source: immutable_s15_manifest}
  s16_shared_intersection: {documents: 3, lanes: 3, visual_receipts: 27, source: immutable_s16_manifest}
  s17_lineage: {source: immutable_s17_candidate_lineage, output_affecting: false, live_ruvllm_receipt: not_observed}
component_receipts:
  header:
    producer: S12
    disposition: passed
    evidence_state: passing
    schema_version: native-composition.outcome/v1
    source_hash: required_sha256
    artifact_sha256: optional_sha256_when_present
    fallback_target: java-grobid-http@0.9.0-crf
    # S03/T07: the native header lane beneath this receipt (29-column feature
    # ABI -> sequence decode -> title/email/ids projection). Shadow-only;
    # proof level is contract and the offline limits are named, not hidden.
    native_header_sequence:
      features_schema_version: da-parse.native-header-features/v1
      sequence_schema_version: da-parse.native-header-sequence/v1
      fields_schema_version: da-parse.native-header-fields/v1
      abi_columns: 29
      declared_labels: 44
      proof_level: contract
      hub_gap: {java_header_raw: 21, native_accepted_header: 20, pooling: forbidden}
      offline_limits:
      - no_preserved_alto_for_the_three_fixtures_so_pdf_to_header_e2e_is_unproven
      - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
      - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
      - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  references:
    producer: S12
    disposition: passed
    evidence_state: passing
    schema_version: native-composition.outcome/v1
    source_hash: required_sha256
    artifact_sha256: optional_sha256_when_present
    fallback_target: java-grobid-http@0.9.0-crf
    # S04/T08: the native bibliography lane beneath this receipt (gazetteer ->
    # 30/28-column feature ABI -> base-name run decode -> 19 citation role
    # clusters -> 18/17 nested name/date families -> callout grammar).
    # Shadow-only; proof level is contract and the offline limits are named,
    # not hidden (D360/D361/D362).
    native_bibliography_sequence:
      feature_facts_schema_version: da-parse.native-feature-facts/v1
      gazetteer_schema_version: da-parse.native-bibliography-gazetteer/v1
      features_schema_version: da-parse.native-bibliography-features/v1
      sequence_schema_version: da-parse.native-bibliography-sequence/v1
      nested_schema_version: da-parse.native-bibliography-nested/v1
      callout_schema_version: da-parse.callout-markers/v1
      citation_columns: 30
      reference_segmenter_columns: 28
      name_citation_columns: 18
      date_columns: 17
      citation_labels: 38
      reference_segmenter_labels: 6
      name_citation_labels: 9
      date_labels: 7
      citation_roles: 19
      proof_level: contract
      named_gap: {citation_names: 2198, references: 207, bibl_author_elements: 2185, pooling: forbidden}
      offline_limits:
      - no_preserved_alto_for_the_three_fixtures_so_pdf_to_bibliography_rows_is_unproven
      - same_n_frame_is_tei_to_atoms_not_pdf_to_atoms
      - bibl_lines_3135_and_bibl_tokens_15415_are_lexical_receipts_not_recorded_java_goldens
      - citation_names_2198_is_a_named_gap_never_pooled_with_references_207
      - identifier_and_url_gazetteer_lanes_are_shape_rules_not_source_bound_patterns
      - callout_inventory_resolution_is_ordinal_marker_to_body_label_not_java_coordinates
      - real_model_label_sequences_are_structural_invariants_not_recorded_goldens
      - lexicon_bundle_is_injected_and_grobid_model_and_lexicon_bytes_are_never_redistributed
  document_segmentation: {producer: S15, disposition: fallback, evidence_state: invalid_evidence, schema_version: native-segmentation.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, fallback_target: java-grobid-http@0.9.0-crf}
  figure: {producer: S16, disposition: fallback, evidence_state: unsupported, schema_version: native-visual-heads.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, fallback_target: java-grobid-http@0.9.0-crf}
  table: {producer: S16, disposition: fallback, evidence_state: not_observed, schema_version: native-visual-heads.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, fallback_target: java-grobid-http@0.9.0-crf}
  formula: {producer: S16, disposition: fallback, evidence_state: unsupported, schema_version: native-visual-heads.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, fallback_target: java-grobid-http@0.9.0-crf}
  learning_policy: {producer: S17, disposition: not_observed, evidence_state: not_observed, schema_version: candidate-lineage.v1, source_hash: required_sha256, artifact_sha256: optional_sha256_when_present, output_affecting: false, fallback_target: java-grobid-http@0.9.0-crf}
hard_regressions: [terminal_receipt_as_pass, denominator_erosion, unknown_stratum, checksum_drift, schema_drift, stale_evidence, pooling, missing_rollback, promotion, import, raw_payload, physical_path]
redaction:
  allowed: [component_id, producer, disposition, lane, domain, genre, source_hash, artifact_sha256, evidence_digest, byte_count, truncated, fallback_target]
  forbidden: [raw_tei, tei_xml, pdf_bytes, body_text, text, captions, references, physical_path, hostname, executable, secret]
used_by: [S18-T01, S18-T02, S18-T03, S18-T04, S18-T05]
