# Bounded regression-case DATA manifest — scholarly parse plane
# (M464-z84in2 / S01 / T01+T02). Sanctioned location per ADR-068 schema hierarchy:
# data/parse (see data/parse/SCHEMA.yaml, R113/R117).
#
# Every case references a repository fixture path by stable case ID and
# declares source kind, expected parse stage/outcome, required evidence fields
# and compatibility bindings into BOTH the registry of record
# (data/parse/grobid_compatibility.yaml — rest/dialect/stage capability ids)
# AND the observation ledger api_compatibility_ledger.yaml. Structural and rich
# GROBID profiles are kept strictly distinct through their cache/configuration
# fingerprint expectations.
#
# Binding lifecycle: `pending` cases carry no checksum yet and skip file
# existence checks; flipping to `bound` requires a 64-hex sha256 AND the file
# present on disk (enforced by crates/da-parse/tests/data_contracts.rs).
# T02 bound the three preserved rich TEI copies under
# crates/da-parse/tests/fixtures/preserved/. The structural companion remains
# pending: no structural-profile bytes exist, and copying rich TEI would
# violate D204 cache-key separation. Owner of that bind is S01/T03. Since S03/T04 every case (bound and pending) additionally requires `conservation_delta` typed conservation evidence; see data/parse/comparison_contract.yaml `conservation_evidence`.
# Since S08/T03 the three bound cases additionally carry the native-date
# shadow obligation: registry capability `rest.processDate` (state: shadow,
# versioned candidate da-parse.native_date@1.0.0), the observable surface
# entry `parse.component.native_date_shadow` and the `native_date_shadow`
# evidence field, all delivered inside the single parse-compat baseline
# report (never a parallel date report). manifest_version stays 1: additive
# obligation only, no fixture bytes, profile identity or stage list changes.
manifest_version: 1
scope_note: >-
  Contract layer only — this manifest binds identities and expectations;
  behavioral characterization runs in later slice tasks (T02, T03).
policy_locks:
  import_eligible: false
  dspy_enabled: false
  graph_mutation: forbidden
  llm_promotion: forbidden
  free_label_invention: forbidden
  sidecar_status: candidate_evidence_only
profile_fingerprint_binding_required: true
cache_key_separation_rule: >-
  Structural and rich GROBID profiles must never share a parse-stage cache
  entry: profile name, both consolidation flags and teiCoordinates are parts
  of the configuration fingerprint (D204;
  da_parse::GrobidProfile::configuration_fingerprint). The HTTP timeout is
  deliberately excluded because it does not alter successful TEI semantics.
cases:
  - id: reg.tei.hub-bibliography-2507.19457
    source_kind: preserved_grobid_tei
    fixture:
      path: crates/da-parse/tests/fixtures/preserved/hub_2507.19457.tei.xml
      sha256: 985461235406db21e1c0f4d16f7c161afe817d1bd23909ae51ddade2b79e7ec4
      origin: >-
        Byte-identical copy of archive/data-legacy/article_corpora/m033-grobid-probe-v1/per-paper/2507.19457/grobid.tei.xml
        (M033 GROBID CRF probe, GEPA hub arXiv 2507.19457). Capture-time
        consolidation flags are not recorded in TEI headers and are NOT
        asserted here; the profile below fixes reproduction and cache identity
        only. Provenance: crates/da-parse/tests/fixtures/preserved/provenance.yaml.
    binding_status: bound
    grobid_profile: rich
    expected_cache_config_fingerprint: 'profile=rich;consolidateHeader=1;consolidateCitations=1;teiCoordinates=figure,table,note,formula'
    stages:
      - tei_lift_ir
      - ir_project_article
    stage_execution_mode: offline_local
    expected_outcome: parse_ok
    required_evidence_fields:
      - source_sha256
      - source_path
      - profile_fingerprint
      - family_counts
      - lifted_counts
      - conservation_delta
      - native_date_shadow
      - native_personal_name_shadow
      - native_affiliation_shadow
      - native_citation_shadow
    ledger_bindings:
      - rest.processFulltextDocument
      - dialect.teiCoordinates
      - parse.entrypoint.grobid_parser.parse_pdf
      - parse.endpoint.process_fulltext_document
      - parse.stage.lift_tei
      - parse.stage.project_article
      - parse.profile.rich
      - rest.processDate
      - parse.component.native_date_shadow
      - parse.component.native_personal_name_shadow
      - rest.processAffiliations
      - parse.component.native_affiliation_shadow
      - rest.processCitation
      - rest.processCitationListTEI
      - parse.component.native_citation_shadow
    obligation_acknowledged: true
    notes:
      - 'S10/T05: affiliation recognition/linking are separate 13/13 same-n populations; HUB is an explicit zero-link negative control.'
      - 'Behavioral floors: sections >= 80, citations >= 80, 3 tables, 24 formulas; 21 header authors and 22 non-table figures present in TEI bytes (lifted since S07 — counts bound by the baseline report).'
      - 'Since S08/T03: 80 ordered <date type="published"> occurrences (1+1+78) ride the native_date_shadow evidence; strict parity 80/80.'
