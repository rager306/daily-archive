schema_version: parse-acceptance.v1
adr_ref: ADR-075
manifest_id: scholarly-parse-acceptance-s20
requirement_ids:
- R085
- R091
- R105
- R107
- R109
- R110
- R113
- R114
- R116
- R117
policy_locks:
  import_eligible: false
  auto_promote: forbidden
  production_route: forbidden
  fallback_target: java-grobid-http@0.9.0-crf
population_contract:
  schema_version: shadow-populations.v1
  # GAR-006: every shadow report is enumerated here, so the contract (and the
  # governor check that reads this DATA) fails when one of them is missing the
  # reference/executed/evaluated split. The list is the complete shadow-report
  # set under artifacts/parse_compat plus the two JSOND receipts emitted by the
  # offline shadow examples (p5 join, native body accounting) and the S08/T04
  # external-holdout release probe artifact.
  report_paths:
  - artifacts/parse_compat/fulltext_block_semantics_shadow.json
  - artifacts/parse_compat/callout_matching_shadow.json
  - artifacts/parse_compat/consolidation_specialized_shadow.json
  - artifacts/parse_compat/feature_tagger_training_shadow.json
  - artifacts/parse_compat/document_segmentation_shadow.json
  - artifacts/parse_compat/native_fulltext_composition_shadow.json
  - artifacts/parse_compat/native_fulltext_corpus_shadow.json
  - artifacts/parse_compat/native_visual_heads_shadow.json
  - artifacts/parse_compat/rest_batch_asset_shadow.json
  - artifacts/parse_compat/p5_shadow_join.json
  - artifacts/parse_compat/native_body_accounting_shadow.json
  - artifacts/parse_compat/parse_batch_budget_shadow.json
  # S08/T04: the frozen external-holdout release probe runtime artifact. It is
  # not a `*_shadow.json` file, so it is enumerated explicitly (like the two
  # offline receipt examples) rather than discovered by filename.
  - artifacts/parse_compat/external_holdout_release_probe.json
  required_blocks:
  - reference_population
  - executed_population
  - evaluated_population
  - outcomes
  forbidden_legacy_blocks:
  - denominators
  - corpus
  executed_population_required_fields:
  - corpus_execution
  - execution_evidence
  synthetic_corpus_execution: false
  quality_requires_evaluated_status: evaluated
comparison_rules:
  allowed_classes:
  - publisher_acceptance
  - layout_omnidocbench
  allowed_row_states:
  - bound
  - catalogued
  - bytes_absent
  allowed_comparison_kinds:
  - tei_family
  - layout_markdown
  missing_behavior: fail_visible
  same_n: required
  catalogued_bytes_are_executed: false
  omnidocbench_is_tei_oracle: false
external_holdout_contract:
  schema_version: external-holdout-readonly.v1
  purpose: transferability_and_cost_probe_only
  execution_status: not_executed
  byte_policy:
    external_bytes: bytes_absent
    load_external_bytes: forbidden
    download_external_bytes: forbidden
    materialize_external_files: forbidden
    external_rows_are_evidence: false
  identity_binding:
    digest: sha256
    input: canonical_dataset_id_plus_identity
    digest_is_byte_hash: false
    digest_is_authority_binding: true
    mismatch_behavior: fail_visible
    frozen_before_execution: true
    frozen_apart_from_production_corpora: true
    production_corpus_identity_overlap: forbidden
    identity_source: external_authority_identity_only
  # GAR-015: the bounded package of declarations an optional frozen external
  # probe must carry before any of its rows may be cited. Completeness is DATA:
  # every element below is named once, and citing a result while any element is
  # absent is forbidden rather than silently downgraded.
  package_elements:
    schema_version: external-holdout-package-elements.v1
    required_before_citation: true
    citation_blocked_until_complete: true
    elements:
    - id: acceptance_margins
      ref: external_holdout_contract.acceptance_margins
    - id: document_level_uncertainty_method
      ref: external_holdout_contract.document_level_reporting.uncertainty_method
    - id: transfer_latency_and_cost_accounting
      ref: external_holdout_contract.transfer_accounting
    - id: frozen_probe_identity
      ref: external_holdout_contract.identity_binding
    - id: result_invalidation_rules
      ref: external_holdout_contract.result_invalidation
    - id: recorded_human_release_decision
      ref: release_decision_package.human_release_review
  # GAR-015 acceptance margins, declared before execution and explicitly not
  # measured. A margin never fitted after seeing a result and never averaged
  # across a pooled corpus.
  acceptance_margins:
    schema_version: external-holdout-margins.v1
    declared_before_execution: true
    measured: false
    unit: document
    basis: same_n_local_proxy_documents; no pooled corpus claim
    margins:
    - metric: document_agreement_ratio
      direction: at_least
      margin: 0.9
      tolerance: same_document_within_declared_tolerance
      claim_scope: local_proxy_only
    - metric: document_uncertainty_interval_width
      direction: at_most
      margin: 0.25
      tolerance: bounded_interval_per_document
      claim_scope: local_proxy_only
    resolution_floor_documents: 3
    same_n_required: true
    margins_are_provisional: true
    failed_or_missing_margin_behavior: fail_visible
    claim_without_measured_margin: forbidden
  denominator_policy:
    local_bound_rows_only: true
    bytes_absent_rows_in_local_denominator: false
    catalogued_rows_in_local_denominator: false
    external_probe_changes_local_denominator: forbidden
    same_n_local_proxy_required: true
  document_level_reporting:
    unit: document
    uncertainty_method: bounded_interval_per_document; no pooled corpus claim
    report_required_before_execution_claim: true
    fields:
    - document_id
    - state
    - identity_sha256
    - uncertainty_low
    - uncertainty_high
    - cost_lower_bound
    - cost_upper_bound
  cost_bounds:
    currency: USD
    basis: estimated_external_bytes_and_runtime; no external bytes loaded
    lower_bound_includes:
    - manifest_validation
    - local_proxy_execution
    upper_bound_includes:
    - human_review
    - permitted_external_acquisition_if_later_approved
    unknown_cost_is_not_zero: true
    release_claim_allowed: false
  # GAR-015 transfer latency and cost accounting: the missing half of the
  # finding's demand. Latency and cost are bounded (not measured), an unknown
  # value is never read as zero, and neither may be pooled into a corpus claim.
  transfer_accounting:
    schema_version: external-holdout-transfer.v1
    unit: document
    measured: false
    latency:
      unit: seconds_per_document
      measured: false
      lower_bound_includes:
      - manifest_validation
      - local_proxy_execution
      upper_bound_includes:
      - external_acquisition_if_later_approved
      - human_review
      declared_timeout_secs: 900
      timeout_source: data/parse/external_holdout_results.yaml#timeout_secs
      unknown_latency_is_not_zero: true
      pooled_latency_claim: forbidden
    cost:
      reference: data/parse/acceptance_manifest.yaml#external_holdout_contract.cost_bounds
      currency: USD
      measured: false
      unknown_cost_is_not_zero: true
      pooled_cost_claim: forbidden
    transfer_bytes_loaded: false
    transfer_claim_allowed: false
  # GAR-015: a change to the probe identity, the source revision, the manifest
  # identity or the declared margins retires the prior result instead of
  # leaving it citable.
  result_invalidation:
    on_probe_identity_change: retire_result
    on_source_revision_change: retire_result
    on_manifest_identity_change: retire_result
    on_margin_revision_change: retire_result
    stale_result_behavior: fail_visible
    retired_result_may_be_cited: false
  # GAR-015 fail-closed citation rule: an unexecuted external or bytes_absent
  # representation is never executed evidence, and only a recorded human
  # release decision makes an executed external row citable.
  citation_rule:
    requires_executed_state: true
    requires_recorded_human_release_decision: true
    release_decision_record: doc/review/HUMAN-REVIEW-TEMPLATE.md
    unexecuted_external_rows_are_evidence: false
    bytes_absent_rows_are_evidence: false
    prose_alone_authorizes_citation: false
    citation_without_release_decision: forbidden
    citation_of_unexecuted_external_rows: forbidden
  # S08/T01: the frozen release-probe lane. ADDITIVE child of the existing
  # external holdout contract: it declares the frozen-identity canonicalization,
  # the metric DEFINITIONS and the latency/cost accounting for the S08 external
  # probe, and it never lifts the external `bytes_absent` band above. Threshold
  # values are owned by `acceptance_margins`; this lane carries only definitions
  # (a `margin_ref`, never a second numeric dictionary), so a margin can never be
  # fitted after seeing a result. The probe's own executed/evaluated population
  # belongs to the runtime artifact (GAR-006), not to this frozen declaration.
  release_probe:
    schema_version: external-holdout-release-probe.v1
    identity_input: canonical_dataset_id_plus_identity
    digest_is_byte_hash: false
    digest_is_authority_binding: true
    frozen_before_execution: true
    source_manifest: data/parse/holdout_manifests.yaml
    digest_input_fields:
    - article_id
    - sha256
    digest_input_order: as_listed
    digest_field_separator: "|"
    digest_record_separator: "\n"
    identity_digest: sha256:6385f9e5c1d17d04d49d6e14875ea079940ca63d902fc13ad1e59eb22ee72144
    margin_ref: external_holdout_contract.acceptance_margins
    metrics:
    - metric: document_agreement_ratio
      numerator_definition: documents whose frozen probe result agrees with the
        live Java reference within the declared per-document tolerance
      denominator_definition: documents with an admitted, non-zero evaluated
        population
      aggregation: per_document
      claim_scope: local_proxy_only
      zero_admitted_population_behavior: no_denominator
      margin_ref: external_holdout_contract.acceptance_margins
    - metric: document_uncertainty_interval_width
      numerator_definition: per-document bounded uncertainty interval upper bound
        minus its lower bound
      denominator_definition: documents with an admitted, non-zero evaluated
        population
      aggregation: per_document
      claim_scope: local_proxy_only
      zero_admitted_population_behavior: no_denominator
      margin_ref: external_holdout_contract.acceptance_margins
    latency:
      unit: seconds_per_document
      measurement_source: recorded_wall_clock_per_document
      pooled_latency_claim: forbidden
    cost:
      cost_status: bounded_not_measured
      unknown_is_not_zero: true
      pooled_cost_claim: forbidden
    # S08/T02: the frozen reference identity. `reference_tei` carries the byte
    # pins of the committed holdout TEI; it is filled by the same change that
    # commits the fixtures, so a document can never be cited while the bytes it
    # names are absent or drifting.
