schema_version: parse-acceptance.v1
adr_ref: ADR-075
manifest_id: scholarly-parse-acceptance-s20
requirement_ids:
- R085
- R091
- R105
- R107
- R109
- R110
- R113
- R114
- R116
- R117
policy_locks:
  import_eligible: false
  auto_promote: forbidden
  production_route: forbidden
  fallback_target: java-grobid-http@0.9.0-crf
population_contract:
  schema_version: shadow-populations.v1
  report_paths:
  - artifacts/parse_compat/fulltext_block_semantics_shadow.json
  - artifacts/parse_compat/callout_matching_shadow.json
  - artifacts/parse_compat/consolidation_specialized_shadow.json
  - artifacts/parse_compat/feature_tagger_training_shadow.json
  required_blocks:
  - reference_population
  - executed_population
  - evaluated_population
  - outcomes
  forbidden_legacy_blocks:
  - denominators
  - corpus
  executed_population_required_fields:
  - corpus_execution
  - execution_evidence
  synthetic_corpus_execution: false
  quality_requires_evaluated_status: evaluated
comparison_rules:
  allowed_classes:
  - publisher_acceptance
  - layout_omnidocbench
  allowed_row_states:
  - bound
  - catalogued
  - bytes_absent
  allowed_comparison_kinds:
  - tei_family
  - layout_markdown
  missing_behavior: fail_visible
  same_n: required
  catalogued_bytes_are_executed: false
  omnidocbench_is_tei_oracle: false
external_holdout_contract:
  schema_version: external-holdout-readonly.v1
  purpose: transferability_and_cost_probe_only
  execution_status: not_executed
  byte_policy:
    external_bytes: bytes_absent
    load_external_bytes: forbidden
    download_external_bytes: forbidden
    materialize_external_files: forbidden
    external_rows_are_evidence: false
  identity_binding:
    digest: sha256
    input: canonical_dataset_id_plus_identity
    digest_is_byte_hash: false
    digest_is_authority_binding: true
    mismatch_behavior: fail_visible
  denominator_policy:
    local_bound_rows_only: true
    bytes_absent_rows_in_local_denominator: false
    catalogued_rows_in_local_denominator: false
    external_probe_changes_local_denominator: forbidden
    same_n_local_proxy_required: true
  document_level_reporting:
    unit: document
    uncertainty_method: bounded_interval_per_document; no pooled corpus claim
    report_required_before_execution_claim: true
    fields:
    - document_id
    - state
    - identity_sha256
    - uncertainty_low
    - uncertainty_high
    - cost_lower_bound
    - cost_upper_bound
  cost_bounds:
    currency: USD
    basis: estimated_external_bytes_and_runtime; no external bytes loaded
    lower_bound_includes:
    - manifest_validation
    - local_proxy_execution
    upper_bound_includes:
    - human_review
    - permitted_external_acquisition_if_later_approved
    unknown_cost_is_not_zero: true
    release_claim_allowed: false
release_decision_package:
  schema_version: release-decision-package.v1
  purpose: bounded_evaluation_and_release_review_only
  package_status: pending_human_review
  evidence_revision: git:6f328bdfb9b136deecd0ded7917c086e8ad5899b
  required_gates:
  - quality
  - cost
  - rights
  quality:
    status: blocked
    evidence:
      acceptance_manifest: data/parse/acceptance_manifest.yaml
      local_proxy_contract: data/parse/layout_bakeoff.yaml
      external_holdout_status: not_executed
    required_claims:
      same_n_local_proxy: true
      document_level_uncertainty: required
      external_bytes_absent: true
      pooled_external_quality_claim: forbidden
    release_effect: does_not_authorize_production_use
  cost:
    status: bounded_not_measured
    evidence:
      cost_bounds: data/parse/acceptance_manifest.yaml#external_holdout_contract.cost_bounds
    required_fields:
    - currency
    - cost_lower_bound
    - cost_upper_bound
    - unknown_cost_is_not_zero
    unknown_cost_is_not_zero: true
    release_effect: does_not_authorize_external_downloads
  rights:
    status: blocked
    evidence:
      review_manifest: doc/review/manifest.yaml
      corrective_register: doc/review/grobid-absorption-review-2026-09-10.jsonl
    required_claims:
      component_license_provenance: required
      redistribution_permission: not_established
      model_distribution_permission: not_established
      external_dataset_permission: not_established
    release_effect: does_not_authorize_redistribution
  prohibited_authorizations:
    redistribution: blocked
    production_use: blocked
    model_distribution: blocked
    external_downloads: blocked
    graph_write_or_import: blocked
  human_release_review:
    required: true
    reviewer: null
    decision: pending
    decision_record: doc/review/HUMAN-REVIEW-TEMPLATE.md
    prose_alone_authorizes_release: false
    authorization_requires:
    - named_reviewer
    - explicit_decision
    - passing_quality_gate
    - passing_cost_gate
    - passing_rights_gate
  invalidation:
    on_source_revision_change: required
    on_manifest_identity_change: required
    on_rights_evidence_change: required
