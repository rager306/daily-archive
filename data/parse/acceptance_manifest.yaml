    # S02/T05: the frozen reference population is a PARTITION, and the partition
    # is DATA. `reference_tei` above is the MEASURABLE subset: the frozen
    # documents this lane can compose and measure. The rows below are the frozen
    # documents the lane cannot measure at all, each named once with its own byte
    # pins and a reason drawn from the closed vocabulary beneath them. This is
    # deliberately the opposite of a silent filter: nothing is dropped quietly,
    # and a document cannot move between the two lists without the manifest
    # bytes changing. `reference_tei` + `reference_exceptions` must cover exactly
    # the article identities of `source_manifest`; a partial or overlapping
    # partition is refused by name, not measured.
    reference_exception_reasons:
    - reason: header_author_absent
      detail: >-
        the frozen TEI header declares no author element, or every declared author
        name is rejected by the native personal-name parser (for example a
        single-token persName such as a group name), so no admitted author line
        exists and the native header composer refuses the document by assertion;
        a header without an admitted author cannot be measured by this lane
    - reason: header_date_absent
      detail: >-
        the frozen TEI header declares no dated element with text; the absence
        of a publication date is fatal both for this compact release probe and
        for the native header composer, so the document cannot be measured by
        this lane
    - reason: header_title_absent
      detail: >-
        the frozen TEI header's titleStmt declares a title element with no text
        (or whitespace only); an admitted title value of zero characters cannot
        be carried into XML character data, so the native header composer refuses
        the document by typed SemanticFieldLoss::HeaderTitle and this lane cannot
        measure it
    reference_exceptions:
