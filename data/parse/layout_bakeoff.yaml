    - id: '1506.02438'
      source_pdf: data/sources/arxiv/cs-lg/1506.02438/source/1506.02438.pdf
      sha256: 5aa736ccf3517a1f36d0ca8146982e69beaf9a2bdccac2ae324f780743bc045e
