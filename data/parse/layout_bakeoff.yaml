      sha256: a5672497671518d3b3d79698becfd5a4bbdc512bb02a002a473db501c3b097c8
      pages: 63
    - id: '1409.0473'
      source_pdf: data/sources/arxiv/cs-cl/1409.0473/source/1409.0473.pdf
      sha256: 84801c8410da51b449d379d2fa4939a416123f2c93991077a680f863026022a7
      pages: 15
    - id: '1410.4615'
      source_pdf: data/sources/arxiv/cs-ne/1410.4615/source/1410.4615.pdf
      sha256: 0b1bf1fdf2156d949dc47f69c739c1e8f621044d4d67f0f25d6becae33d27e0d
      pages: 25
    - id: '1410.5401'
      source_pdf: data/sources/arxiv/cs-ne/1410.5401/source/1410.5401.pdf
      sha256: b8d2939cd7c76097f2cc2e5061188ca824ef8cad12de4500dfbd014b60dd16a9
