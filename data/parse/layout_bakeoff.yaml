# S03 (M516-th0oby): the native PDF-to-TEI route's OWN corpus, distinct from the
# layout token-donor bakeoff above. `java_free_vertical_slice.corpus_binding`
# reads this block by pointer. `corpus.documents` and both layout oracle
# fixtures stay byte-unchanged (D543): layout_lattice_oracle.yaml has no
# in-repo generator, so growing the donor corpus honestly is impossible here.
#
# The three hub-/rlm-/reca- rows mirror the S02 corridor verbatim. The nine
# bare-arXiv rows are a documented stratified sample of the frozen holdout
# measurable set — `data/parse/holdout_manifests.yaml#articles` identities that
# also carry a row in
# `data/parse/acceptance_manifest.yaml#external_holdout_contract.release_probe.reference_tei`
# (531 measurable rows, all PDFs present locally). Strata are the closed
# `domains` vocabulary declared in `data/parse/comparison_contract.yaml`
# (`native_fulltext_composition_shadow.strata.domains`): computer_science,
# physics, mathematics. The target 3-per-stratum allocation is reduced by
# availability (mathematics has 2 eligible, physics contributes 3 of 4) and the
# shortfall is absorbed by computer_science: 4 / 3 / 2 = 9 (D544). Within a
# stratum the lexicographically smallest article_id wins, so the sample is
# deterministic and reproducible.
native_route_corpus:
  id: native-pdf-to-tei-route-corpus
  corpus_n: 12
  page_denominator: 381
  source_root: data/sources
  source_identity_rule: >-
    Each row pins a repository-relative PDF by bare sha256 and its PDF-verified
    page count; a document's identity is its id plus that exact sha256, never
    the path alone. The three S02 corridor rows restate `corpus.documents`
    field-for-field; the nine holdout rows are already-committed arXiv
    identities whose PDF bytes and reference TEI exist in-tree.
  selection:
    source: data/parse/holdout_manifests.yaml#articles
    measurable: data/parse/acceptance_manifest.yaml#external_holdout_contract.release_probe.reference_tei
    strata_vocabulary: data/parse/comparison_contract.yaml#native_fulltext_composition_shadow.strata.domains
    stratum_rule: >-
      An identity's stratum is its arXiv primary category mapped to the declared
      domains vocabulary: cs-* -> computer_science; math-* -> mathematics;
      cond-mat-*, physics-*, hep-*, quant-ph, astro-ph, gr-qc, nucl-* ->
      physics. Identities outside the closed domains vocabulary are ineligible.
    allocation: {computer_science: 4, physics: 3, mathematics: 2}
    within_stratum: ascending_article_id
  documents:
    - id: hub-2507.19457
      source_pdf: data/sources/arxiv/cs-cl/2507.19457/source/2507.19457.pdf
      sha256: ab3a5139bac83f192ad67529368d77b84b0d807e95a8e4fd0daa8d45fd046bec
      pages: 96
    - id: rlm-2512.24601
