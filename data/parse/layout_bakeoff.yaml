    - id: '2402.04268'
      source_pdf: data/sources/arxiv/cond-mat-soft/2402.04268/source/2402.04268.pdf
      sha256: 2c1da086d14fa90e0c80ae44f90a7de0a2c5ae842c5b7bb606cc738a149e9a98
