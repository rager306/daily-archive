schema_version: document-segmentation.v1
adr_ref: ADR-075
contract_id: native-document-segmentation-shadow
requirement_ids: [R085, R106, R108, R113, R117]
decisions: [D127, D204, D294, D295]
# Additive S15 authority. PDF identity and page topology are referenced from
# layout_bakeoff.yaml; this file owns segmentation labels and evaluation only.
policy_locks:
  observation_mode: shadow
  promotion_state: candidate
  auto_promote: forbidden
  donor_selection: forbidden
  import_eligible: false
  graph_mutation: forbidden
  raw_payloads: forbidden
  s14_durable_evidence_mutation: forbidden

regions:
  closed_labels: [header, body, references, annex, page_furniture]
  assignment_rule: exactly_one_region_per_admitted_token
  order_rule: admitted_reading_order_preserved
  transition_precedence: [page_furniture, header, body, references, annex]
  section_parent_regions: [body, annex]
  visual_structure_labels: forbidden
  opaque_token_kinds: [Formula, Image]
  no_classifier_branch_by_genre: true

source_corpus:
  authority: data/parse/layout_bakeoff.yaml
  corpus_id: s13-same-input-pdf-corpus
  source_identity: exact_document_id_and_sha256_from_layout_bakeoff
  corpus_n: 3
  documents:
    - id: hub-2507.19457
      source_sha256: ab3a5139bac83f192ad67529368d77b84b0d807e95a8e4fd0daa8d45fd046bec
      pages: 96
    - id: rlm-2512.24601
      source_sha256: 8567362c22768d9b50d4a4a8d63bb28dda2c2b2051be30d67f70f645170429ca
      pages: 43
    - id: reca-2605.26525v1
      source_sha256: a5672497671518d3b3d79698becfd5a4bbdc512bb02a002a473db501c3b097c8
      pages: 63
  page_sum: 202

lanes:
  closed_ids: [pdfalto, pdf_inspector_positioned, pdf_inspector_positioned_xy_cut]
  required_ids: [pdfalto, pdf_inspector_positioned, pdf_inspector_positioned_xy_cut]
  same_input: true
  pages_per_lane: 202
  total_lane_pages: 606
  pooling: forbidden
  silent_skip: forbidden

source_bound_genres:
  stratification_only: true
  classifier_branching: forbidden
  reviewed_annotation_required: true
  labels:
    - id: research_article
      provenance: source_bound_reviewed
      source_ref: layout_bakeoff.corpus.documents.page_classes
      coverage: all_three_documents
  unknown_label_behavior: fail_closed
  missing_coverage_behavior: fail_closed

evaluation:
  matrix_axes: [lane, source_bound_genre, region]
  required_rows: 45
  row_formula: 3_lanes_x_1_reviewed_genre_x_5_regions
  independent_denominators: true
  pooled_metrics: forbidden
  denominator_names:
    corpus_documents: 3
    lanes: 3
    pages_per_lane: 202
    lane_pages: 606
    matrix_rows: 45
    region_token_assignments: admitted_tokens_per_lane
    region_boundaries: admitted_boundaries_per_lane
    genre_documents: 3
  metrics: [token_precision, token_recall, boundary_f1, boundary_displacement, page_furniture_false_positive_rate]
  thresholds:
    conservation: exact
    ordered_boundary_digest: exact
    quality: candidate_evidence_only

oracle:
  fixture: crates/da-parse/tests/fixtures/segmentation_oracle.yaml
  independent: true
  expected_rows_not_from_sut_helpers: true
  key_fields: [document_id, lane_id, page_ordinal, token_ordinal, token_digest, region, boundary_digest]
  section_fields: [section_id, parent_region, order_ordinal, section_boundary_digest]
  provenance_fields: [source_sha256, genre_id, genre_provenance]
  forbidden_fields: [raw_text, pdf_bytes, tei_xml, page_image, physical_path, path, hostname, executable]
  conservation: assigned_equals_admitted
  boundary_order: monotonic
  terminal_outcomes: [pass, empty, invalid_evidence, missing, checksum_mismatch, malformed, unsupported, timeout, nonzero, oversize, encrypted, truncated]

failure_taxonomy:
  closed: true
  values: [unknown_region, unknown_genre, missing_oracle_row, duplicate_oracle_key, overlapping_range, denominator_erosion, pooled_metric, digest_mismatch, raw_payload_leakage, promotion_attempt, s14_evidence_mutation]

gates:
  candidate_evidence_complete: candidate
  candidate_below_threshold: candidate
  no_selection: forbidden
  invalid_evidence: terminal
  java_rollback: java-grobid-http@0.9.0-crf
  promotion_receipt_required: true
  production_route_change: forbidden

ownership:
  figures: out_of_scope
  tables: out_of_scope
  formulas: out_of_scope
  captions: out_of_scope
  visual_heads: out_of_scope
  formula_image_behavior: opaque_conserved_tokens_inside_document_region
  fulltext_composition: forbidden
  genre_use: stratification_only
