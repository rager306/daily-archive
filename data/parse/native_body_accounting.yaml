# Closed FullTextParser fulltext labels copied exactly from the evidence artifact.
fulltext_labels:
  closed: true
  unknown_label_behavior: fail_closed
  labels:
    paragraph: "<paragraph>"
    item: "<item>"
    section: "<section>"
    citation_marker: "<citation_marker>"
    figure_marker: "<figure_marker>"
    table_marker: "<table_marker>"
    equation_marker: "<equation_marker>"
    figure: "<figure>"
    table: "<table>"
    equation: "<equation>"
    equation_label: "<equation_label>"
    other: "<other>"

# Java entry points copied exactly from the evidence artifact
# (orchestration method line spans inside FullTextParser.java).
entry_points:
  engine: FullTextParser
  engine_file: grobid-core/src/main/java/org/grobid/core/engines/FullTextParser.java
  orchestration_method_lines:
    processingHeaderSection: [166, 733]
    processingReferenceSection: [232, 1539]
    processFigures: [278, 353, 2446, 2447, 2448, 2451, 2452, 2453, 2456]
    processTables: [308, 377, 2635, 2639, 2640, 2643, 2647, 2648, 2651]
    processEquations: [331, 403, 2854, 2855, 2858]
    postProcessCallout: [416, 2929]

# Six separate non-pooled accounting families. Fulltext labels partition
# across families exactly once; pooling any two families is forbidden.
families:
  closed: true
  pooling: forbidden
  body_blocks:
    description: admitted body prose blocks inside the body region
    segmentation_labels: [body]
    fulltext_labels: [paragraph, item, section]
    pooling: forbidden
  body_markers:
    description: in-body callout markers plus the unclassified other label (fail closed, never silently absorbed)
    segmentation_labels: [body]
    fulltext_labels: [citation_marker, figure_marker, table_marker, equation_marker, other]
    pooling: forbidden
  visual_content:
    description: visual heads inside body flow, opaque and conserved, never pooled into block counts
    segmentation_labels: [body]
    fulltext_labels: [figure, table, equation, equation_label]
    behavior: opaque_conserved
    pooling: forbidden
  annex:
    description: back-matter annex region and annex-adjacent segmentation labels
    segmentation_labels: [annex, acknowledgement, availability, funding, conflict, contribution]
    fulltext_labels: []
    pooling: forbidden
  references:
    description: bibliography region only
    segmentation_labels: [references]
    fulltext_labels: []
    pooling: forbidden
  page_furniture:
    description: running heads, pagination and marginalia, never body content
    segmentation_labels: [toc, page_number, cover, header, footnote, headnote, marginnote]
    fulltext_labels: []
    pooling: forbidden

