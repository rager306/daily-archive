schema_version: domain-math-schema.v1
extends: data/domains/_shared/SCHEMA.yaml
routing:
  coarse_topic_codes:
  - math-ho
  - math-co
  - math-oc
  - math-discrete
  keywords:
  - theorem
  - proof
  - lemma
  - corollary
  - axiom
entity_types:
- id: MathConcept
  description: определение математического понятия
  detector: ^(Definition|Определение) \d+(?:\.\d+)*[.:]
  extraction_hint: текст после заголовка Definition до пустой строки или следующего
    окружения
- id: MathTheorem
  description: теорема с формулировкой и доказательством
  detector: ^(Theorem|Лемма|Теорема) \d+(?:\.\d+)*[.:]
- id: MathLemma
  description: лемма — вспомогательное утверждение
  detector: ^(Lemma|Лемма) \d+(?:\.\d+)*[.:]
- id: MathCorollary
  description: следствие из теоремы
  detector: ^(Corollary|Следствие) \d+(?:\.\d+)*[.:]
- id: MathProof
  description: доказательство
  detector: ^(Proof|Доказательство)\.?$
- id: MathAxiom
  description: аксиома
  detector: ^(Axiom|Аксиома) \d+
structural_types:
  theorem:
    patterns:
    - (?i)^(theorem|lemma|corollary|proposition)\s
  definition:
    patterns:
    - (?i)^(definition|определение)\s
  proof:
    patterns:
    - (?i)^(proof|доказательство)\.?$
  exercise:
    patterns:
    - (?i)^(exercise|упражнение|задача)\s
  axiom:
    patterns:
    - (?i)^(axiom|аксиома)\s
quality_thresholds:
  grounding_warn_below: 0.6
  grounding_alarm_below: 0.35
  min_entities_per_section: 0.1
  furniture_share_warn_above: 0.3
extraction_rules:
- pattern: (Definition|Определение)\s+(\d+(?:\.\d+)*)[.:]\s*(.+)
  captures:
    number: 2
    statement: 3
  feeds: layer_j_terminology
- pattern: (Theorem|Лемма|Теорема)\s+(\d+(?:\.\d+)*)[.:]\s*(.+)
  captures:
    number: 2
    statement: 3
  feeds: structural_elements
cross_domain_note: '

  Математический профиль может применяться ВМЕСТЕ с computer_science:

  - stat-ml → [computer_science, mathematics]: ML-статья с теоремами

  - math-pr → [mathematics, computer_science]: probability для CS


  Порядок = приоритет: первый домен в списке — PRIMARY (использует свои

  quality_thresholds), остальные — SECONDARY (добавляют entity_types

  и structural_types, но не переопределяют пороги).

  '
