schema_version: domain-shared-schema.v1
adr_ref: ADR-069
entity_types:
- id: Method
  description: подход, техника, алгоритм
  detector: rule_based
- id: Dataset
  description: набор данных
  detector: rule_based
- id: Model
  description: модель
  detector: rule_based
- id: Metric
  description: метрика качества
  detector: rule_based
structural_types:
  introduction:
    patterns:
    - (?i)^introduction
  related_work:
    patterns:
    - (?i)^related work
    - (?i)^literature review
  methodology:
    patterns:
    - (?i)^method
    - (?i)^approach
    - '(?i)^our '
  experiments:
    patterns:
    - (?i)^experiment
    - (?i)^evaluation
    - (?i)^benchmark
  results:
    patterns:
    - (?i)^result
    - (?i)^finding
  discussion:
    patterns:
    - (?i)^discussion
    - (?i)^analysis
  conclusion:
    patterns:
    - (?i)^conclusion
    - (?i)^summary
  limitations:
    patterns:
    - (?i)^limitation
    - (?i)^threats to validity
  references:
    patterns:
    - (?i)^reference
    - (?i)^bibliography
  appendix:
    patterns:
    - (?i)^appendix
    - (?i)^supplementary
quality_thresholds:
  grounding_warn_below: 0.7
  grounding_alarm_below: 0.4
  min_entities_per_section: 0.5
  furniture_share_warn_above: 0.25
