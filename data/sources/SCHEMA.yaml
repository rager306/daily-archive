schema_version: v2
path: data/sources
description: Immutable source assets — read-only after load. Each source type has
  its own SCHEMA.
adr_ref: ADR-068
valid_subdirs:
- acm
- arxiv
- blog
- course
- doi
- nature
- textbook
valid_files:
- source_manifest.json
- '*.md'
ignore:
- .*
forbidden:
- pipeline_cache
- loader
- debug
legacy_files:
  source_manifest.json: folds into per-source MANIFEST.yaml cache in W6
