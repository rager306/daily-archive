schema_version: v2
path: data/sources/blog
description: 'Immutable web/blog sources (HTML primary). One article_key per
  post; no nested cs-ir/source duplicates. D127: trusted_kg_import_allowed
  stays false.'
adr_ref: ADR-068
valid_files:
- '*.json'
- '*.md'
- '*.yaml'
valid_subdirs:
- '*'
ignore:
- .*
- cs-ir
- source
article_layout:
  required:
  - identity.json
  - source/
  optional:
  - loader/
  - NOTES.md
forbidden:
- '*.safetensors'
- pipeline_cache
