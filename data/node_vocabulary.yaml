# Node vocabulary — type codes for evidence bundles, claims, clusters.
# Reference data for Layer 6 nodes (ADR-042, ADR-043).
# No hardcoded values in Rust — this YAML is the single source of truth.

version: "1.0"

# EvidenceBundle subtypes (EvidenceBundle.bundle_type field).
bundle_types:
  - code: "experiment_setup"
    name: "Experiment setup (Method × Dataset × Task × Metric)"
  - code: "result_bundle"
    name: "Result bundle (experimental results)"
  - code: "citation_context"
    name: "Citation context (citation relationship details)"
  - code: "claim_bundle"
    name: "Claim bundle (group of related claims)"

# Claim/EvidenceBundle verification statuses.
verification_statuses:
  - code: "pending"
    name: "Pending verification"
  - code: "verified"
    name: "Verified (artifact exists, hash matches, span in bounds)"
  - code: "disputed"
    name: "Disputed (conflicting evidence)"

# ConceptCluster types (ConceptCluster.cluster_type field).
cluster_types:
  - code: "concept_cluster"
    name: "Concept cluster (co-occurring entities)"
  - code: "method_family"
    name: "Method family (related methods)"
  - code: "benchmark_suite"
    name: "Benchmark suite (datasets used together)"
