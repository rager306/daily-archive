version: '1.0'
source_codes:
- code: arxiv
  name: arXiv preprint server
  reliability_tier: 2
- code: textbook
  name: Textbook (curated)
  reliability_tier: 1
- code: gnn_textbook
  name: Graph Neural Networks Textbook (curated HTML chapters)
  reliability_tier: 1
- code: stanford
  name: Stanford course materials
  reliability_tier: 2
- code: openalex
  name: OpenAlex (curated metadata)
  reliability_tier: 1
- code: crossref
  name: Crossref (curated DOI metadata)
  reliability_tier: 1
- code: semantic_scholar
  name: Semantic Scholar
  reliability_tier: 2
- code: company_blog
  name: Company engineering blog
  reliability_tier: 3
- code: nature
  name: Nature family (curated)
  reliability_tier: 2
- code: local
  name: Operator local drop / filesystem
  reliability_tier: 3
- code: acm
  name: ACM Digital Library (DOI-first, mirrored)
  reliability_tier: 2
source_types:
- code: pdf
  name: PDF document
- code: html
  name: HTML page
- code: markdown
  name: Markdown text
- code: api_json
  name: API JSON response
- code: latex
  name: LaTeX source
source_profiles:
- code: scientific_paper
  name: Scientific paper
- code: textbook
  name: Textbook chapter
- code: lecture_notes
  name: Lecture notes
- code: code_repo
  name: Code repository
- code: blog
  name: Blog post
reliability_tiers:
- tier: 1
  name: Curated (OpenAlex, Crossref)
- tier: 2
  name: Extracted (GROBID, HTML parser)
- tier: 3
  name: User-provided
acquisition_routing:
  schema_version: routing.v1
  note: CLI da source acquire <raw> — определение источника из сырой ссылки. Порядок
    правил = приоритет.
  rules:
  - pattern: arxiv\.org/(abs|pdf)/(\S+)
    kind: arxiv
    id_group: 2
    id_normalize: strip_version
    handler: arxiv_catalog
  - pattern: ^(\\d{4}\\.\\d{4,5})(v\\d+)?$
    kind: arxiv
    id_group: 1
    id_normalize: none
    handler: arxiv_catalog
  - pattern: ^10\.
    kind: doi
    id_group: 0
    id_normalize: none
    handler: doi_mirror
  - pattern: \.pdf($|\?)
    kind: direct_pdf
    id_group: 0
    id_normalize: none
    handler: direct_pdf
  - pattern: https?://
    kind: web_page
    id_group: 0
    id_normalize: none
    handler: html_page
