- fixture_id: figure-analysis-validation-2507.19457-Figure5
  task_id: figure_analysis
  split: validation
  source_text: 'Figure 5: GEPA’s reflective prompt mutation systematically incorporates
    task-specific nuances, leading to substantial improvements in performance. This
    figure visualizes the optimization trajectory taken by GEPA, presenting an annotated
    subtree from Figure 25d (for the privacy-preserving delegation task PUPA) to demonstrate
    the iterative enhancements made to the prompts. The progression from the base
    prompt (candidate 0) to the best performing prompt (candidate 11) is highlighted
    with red arrows, and key prompt changes at each step are annotated beside the
    corresponding nodes. Full-length instructions for these iterations are provided
    in Appendix K.1. Each prompt refinement in this trajectory adds targeted nuances
    informed by ongoing optimization, illustrating how GEPA’s process accumulates
    lessons to continually boost task performance.'
