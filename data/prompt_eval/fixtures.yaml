- fixture_id: figure-analysis-train-2507.19457-Figure3
  task_id: figure_analysis
  split: train
  source_text: 'Figure 3: GEPA proposes a new candidate in every iteration by improving
    existing candidates using one of the two strategies (Reflective Prompt Mutation
    (Section 3) or System Aware Merge (Appendix D.1)), first evaluating them on a
    minibatch, and if improved, evaluating on a larger dataset. Instead of selecting
    the best performing candidate to mutate always, which can lead to a local-optimum,
    GEPA introduces Paretobased candidate sampling (Section 3.1), which filters and
    samples from the list of best candidates per task, ensuring sufficient diversity.
    Overall, these design decisions allow GEPA to be highly sample-efficient while
    demonstrating strong generalization.'
  source_sha256: f249a0e7745874dbc8f98c641e79afb7b384645b2ba39b5a3bed4c8456501b00
