- fixture_id: article-summary-validation-2507.19457-sec3-prefix
  task_id: article_summary
  split: validation
  source_text: 'We introduce GEPA (Genetic-Pareto), a sample-efficient optimizer for
    compound AI systems motivated by three core principles: genetic prompt evolution
    (Section 3), reflection using natural language feedback (Section 3), and Pareto-based
    candidate selection (Section 3.1). Figure 3 gives an overview of GEPA and the
    full GEPA algorithm is formalized in Figure 4. GEPA receives the following inputs:
    A system Φ instantiated with simple prompts to be optimized, training dataset
    D train (consisting of task instances (x, m) as described in Section 2), the standard
    evaluation metric µ for the task, a feedback function µ f (introduced in Section
    3) and the total rollout budget B. Note that GEPA evolves only the set of prompts,
    denoted as Π Φ , whereas the underlying LLM weights, denoted by Θ Φ remains fixed.'
