[workspace]
resolver = "2"
members = [
    "crates/kg-ontology",
    "crates/kg-storage",
    "crates/kg-algorithms",
    "crates/kg-embeddings",
    "crates/kg-pipeline",
    "crates/da-domain",
    "crates/da-ports",
    "crates/da-application",
    "crates/da-adapters",
    "crates/da-parse",
    "crates/da-cli",
    "crates/da-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
regex = "1"
# Universal kg-* crates (reusable across projects)
kg-ontology = { path = "crates/kg-ontology" }
kg-storage = { path = "crates/kg-storage" }
kg-algorithms = { path = "crates/kg-algorithms" }
kg-embeddings = { path = "crates/kg-embeddings" }
kg-pipeline = { path = "crates/kg-pipeline" }

# Internal crates
da-domain = { path = "crates/da-domain" }
da-ports = { path = "crates/da-ports" }
da-application = { path = "crates/da-application" }
da-adapters = { path = "crates/da-adapters" }
da-parse = { path = "crates/da-parse" }

# Core
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
jsonschema = "0.40"
# D295: redb is allowed ONLY as a rebuildable cache-index/cursor accelerator
# (never authoritative). Optional + feature-gated in da-adapters/da-cli.
redb = "2.6"

# Samyama Graph (Tier 1: knowledge graph + vector + persistence)
samyama = { path = "/root/vendor-source/samyama-graph" }
samyama-sdk = { path = "/root/vendor-source/samyama-graph/crates/samyama-sdk" }
samyama-graph-algorithms = { path = "/root/vendor-source/samyama-graph/crates/samyama-graph-algorithms", default-features = false }

# RuVector (Tier 2: agent brain + Tier 3: experience)
ruvector-sona = { path = "/root/vendor-source/ruvector/crates/sona" }
ruvector-gnn-rerank = { path = "/root/vendor-source/ruvector/crates/ruvector-gnn-rerank" }
ruvector-hybrid = { path = "/root/vendor-source/ruvector/crates/ruvector-hybrid" }
ruvector-agent-memory = { path = "/root/vendor-source/ruvector/crates/ruvector-agent-memory" }
ruvector-solver = { path = "/root/vendor-source/ruvector/crates/ruvector-solver", default-features = false }
rvf-runtime = { path = "/root/vendor-source/ruvector/crates/rvf/rvf-runtime" }
rvf-types = { path = "/root/vendor-source/ruvector/crates/rvf/rvf-types" }
wasmi = "0.51"
wat = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = 1

# Disable incremental for all dependencies (path deps like samyama/ruvector
# AND crates.io deps). Workspace members (our da-*, kg-* crates) keep
# incremental=true for fast iteration. This allows sccache to cache dependency
# compilation across cargo clean / workspace switches.
# See: https://doc.rust-lang.org/cargo/reference/profiles.html#overrides
#
# debug = false drops the debuginfo of every dependency. Dependencies are the
# bulk of target/: each one is linked into every example and test binary, and
# the repo has ~86 heavyweight example runners, so dependency DWARF is paid for
# dozens of times per build. Our own crates keep `debug = 1`, so stepping through
# da-*/kg-* code is unaffected; backtraces through dependencies lose file/line
# detail but keep symbol names.
[profile.dev.package."*"]
incremental = false
debug = false
