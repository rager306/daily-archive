[workspace]
resolver = "2"
members = [
    "crates/da-domain",
    "crates/da-ports",
    "crates/da-application",
    "crates/da-adapters",
    "crates/da-graph",
    "crates/da-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
# Internal crates
da-domain = { path = "crates/da-domain" }
da-ports = { path = "crates/da-ports" }
da-application = { path = "crates/da-application" }
da-adapters = { path = "crates/da-adapters" }
da-graph = { path = "crates/da-graph" }

# Core
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

# Samyama Graph (Tier 1: knowledge graph + vector + persistence)
samyama = { path = "/root/vendor-source/samyama-graph" }
samyama-sdk = { path = "/root/vendor-source/samyama-graph/crates/samyama-sdk" }
samyama-graph-algorithms = { path = "/root/vendor-source/samyama-graph/crates/samyama-graph-algorithms" }

# RuVector (Tier 2: agent brain + Tier 3: experience)
ruvector-sona = { path = "/root/vendor-source/ruvector/crates/sona" }
ruvector-gnn-rerank = { path = "/root/vendor-source/ruvector/crates/ruvector-gnn-rerank" }
ruvector-hybrid = { path = "/root/vendor-source/ruvector/crates/ruvector-hybrid" }
ruvector-agent-memory = { path = "/root/vendor-source/ruvector/crates/ruvector-agent-memory" }
ruvector-solver = { path = "/root/vendor-source/ruvector/crates/ruvector-solver" }
rvf-runtime = { path = "/root/vendor-source/ruvector/crates/rvf/rvf-runtime" }
rvf-types = { path = "/root/vendor-source/ruvector/crates/rvf/rvf-types" }

[profile.release]
opt-level = 3
lto = "thin"
