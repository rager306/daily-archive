[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-daily-archive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "anthropic>=0.38.0",
    "yake>=0.5.0",
    # pymupdf removed — using arxiv2md (REST) + Marker (fallback for papers <2020)
    "feedparser>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.16.0",
    "ladybug>=0.16.1",
    "docling>=2.93.0",
    "loguru>=0.7.3",
    "riskratchet>=0.2.8",
    "transformers>=4.45.2,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pyrefly>=0.1.0",
    "ty>=0.0.35",
    "adaptix>=0.4.0",
    "hypothesis>=6.120.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.riskratchet]
paths = ["src/arxiv_archive"]
exclude = ["**/__pycache__/**", "**/.venv/**"]
missing_coverage = "ignore"


