[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-daily-archive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "anthropic>=0.38.0",
    "yake>=0.5.0",
    # PyMuPDF backs local PDF text extraction for parser replay and source repair fallbacks.
    "feedparser>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.16.0",
    "ladybug>=0.16.1",
    "docling>=2.93.0",
    "loguru>=0.7.3",
    "riskratchet>=0.2.8",
    "transformers>=4.45.2,<5",
    "pymupdf>=1.27.0",
]

[project.optional-dependencies]
# Hybrid PDF body path (ADR-008/009): OpenDataLoader library for layout/body.
# Install: uv sync --extra hybrid
hybrid = [
    "opendataloader-pdf>=2.5.0",
]
dev = [
    "ruff>=0.9.0",
    "pyrefly>=0.1.0",
    "ty>=0.0.35",
    "adaptix>=0.4.0",
    "hypothesis>=6.120.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/research_graph/cli/__init__.py" = ["F401", "E402"]
"scripts/*" = ["T201", "C408", "C416", "E402"]
"src/**/legacy/*" = ["E402"]
"tests/*" = ["E402", "C408", "C416"]

# D086 onion layering is enforced per-directory by scripts/verify_onion_layering.py
# (domain Core and application must not import infrastructure). ruff's
# flake8-tidy-imports banned-api is global (not per-layer), so it would create
# false positives on legitimate infrastructure imports of graph/corpus/llm.
# The custom AST guard is the authoritative layer enforcer; TID stays selected
# for its other tidy-import checks.

[tool.pyrefly]
# Pyrefly type checker (https://pyrefly.org/) configuration.
# Dev dep: pyrefly>=0.1.0 (M107)
# Baseline captured: see .gsd/milestones/M107-5vo7wx/
# Resolve repo-root modules such as scripts/*.py for script-wrapper tests.
search-path = ["."]

project-includes = [
    "src/research_graph/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]

# Match project python version (per .python-version: 3.13)
python-version = "3.13"

# Project excludes: legacy archives, build artifacts, .venv, egg-info
project-excludes = [
    "archive/**",
    "**/__pycache__/**",
    "**/.venv/**",
    "**/*.egg-info/**",
    "src/arxiv_daily_archive.egg-info/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.pytest-gremlins]
paths = [
    "src/research_graph/application/corpus/coverage.py",
    "src/research_graph/application/corpus/parser_replay.py",
    "src/research_graph/application/graph/probe.py",
]
report = ["console", "json"]
cache = true
max_pardons = 0

[tool.riskratchet]
paths = ["src/research_graph"]
exclude = ["**/__pycache__/**", "**/.venv/**"]
missing_coverage = "ignore"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest-gremlins>=1.8.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

