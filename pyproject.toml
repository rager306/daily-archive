[project]
name = "arxiv-daily-archive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "anthropic>=0.38.0",
    "yake>=0.5.0",
    "pymupdf>=1.25.0",
    "feedparser>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pyrefly>=0.1.0",
    "ty>=0.0.35",
    "adaptix>=0.4.0",
    "hypothesis>=6.120.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]


