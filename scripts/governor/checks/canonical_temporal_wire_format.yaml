# Canonical temporal wire format contract — PIR-008 closure, M398 S04 T04.
#
# DATA for the Governor `canonical_temporal_wire_format` check. The contract
# is encoded in ontology DATA (`data/ontology/node_schemas.yaml` →
# `temporal_wire_contract`) and enforced by
# `kg_ontology::temporal::validate_datetime_wire`: new node/edge DateTime
# writes MUST be canonical RFC3339 UTC strings (chrono
# `DateTime<Utc>::to_rfc3339()` shape, e.g. `2024-01-15T10:30:00Z`); integer
# Unix timestamps are the LEGACY read-only wire form and are rejected for
# new writes; `OPEN` is the only open-bound sentinel.
#
# Semantics:
#   - positive (canonical_wire): every value in the fixture must be accepted
#     by the write validator (RFC3339 UTC strings, OPEN, null);
#   - negative (legacy_integer_wire): every value must be rejected (integer
#     timestamps, non-UTC offsets, non-RFC3339 strings, wrong types).
#
# The committed fixtures are pinned by the Rust test
# `temporal_wire_fixtures_match_committed_governor_data` in
# `crates/kg-ontology/src/temporal.rs`, so a broken contract cannot silently
# survive a regenerate. This is DATA — tightening an expectation is an edit
# here (plus updating the committed fixture JSON), not a Python change.

schema_version: canonical-temporal-wire-format.v1
policy_id: canonical-temporal-wire-format
dimension: temporal_ast
severity: high
anchor: "ADR-050 (ontology DATA), ADR-058, PIR-008"

ontology_data:
  path: data/ontology/node_schemas.yaml
  required_markers:
    - "temporal_wire_contract"
    - "datetime_format: rfc3339_utc"
    - "integer_write: rejected"
    - "legacy_integer_read: compatibility_decoder_only"
    - "open_sentinel: OPEN"

wire_fixtures:
  positive:
    id: canonical_wire
    path: governor/fixtures/temporal_wire_contract/canonical_wire.positive.json
    expect: accepted
  negative:
    id: legacy_integer_wire
    path: governor/fixtures/temporal_wire_contract/legacy_integer_wire.negative.json
    expect: rejected
