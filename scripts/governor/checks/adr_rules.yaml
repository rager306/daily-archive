# ADR reverse audit rules — code-level checks that binding ADRs are honoured.
# Each rule has: id, anchor (ADR/decision), severity (high/medium), scan (path),
# pattern (regex), rationale, optional filters.
#
# This is DATA — adding a rule = adding an entry here, not changing Python code.
# Loaded by governor.domain.rule_loader at runtime.

rules:
  # --- D127 / ADR-005 artifacts-gate rules (JSON field checks) ---
  - id: no_graph_import_allowed_true_in_artifacts
    anchor: "ADR-005 (No Direct Extractor to GraphDB Path), D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_import_allowed"\s*:\s*true'
    rationale: "graph_import_allowed must remain false until explicit graph promotion milestone."

  - id: no_production_import_attempted_true_in_artifacts
    anchor: "ADR-005 (No Direct Extractor to GraphDB Path)"
    severity: high
    scan: artifacts/
    pattern: '"production_import_attempted"\s*:\s*true'
    rationale: "production_import_attempted must remain false."

  # --- Universal artifact field checks (Rust-era M274-M285) ---
  # These fields appear in ALL Rust-era artifacts regardless of milestone.
  # Governor must check every JSON artifact, not just hand-picked ones.
  - id: no_import_eligible_true_in_artifacts
    anchor: "R029, ADR-005, D127"
    severity: high
    scan: artifacts/
    pattern: '"import_eligible"\s*:\s*true'
    rationale: "import_eligible must remain false until independent review and explicit user yes (D127)."

  # --- ADR-059 frozen evaluation admission locks ---
  - id: prompt_eval_data_must_not_claim_production_acceptance
    anchor: "ADR-059 (independent frozen evaluation before optimizer admission)"
    severity: high
    scan: data/prompt_eval/
    pattern: 'production_acceptance_eligible\s*:\s*true'
    rationale: "Frozen source review and contract outputs do not prove production model quality; acceptance requires separately authorized real same-n baseline/candidate inference evidence."
    suffix_allowlist: [.yaml, .yml]

  - id: prompt_eval_data_must_not_enable_optimizer_or_promotion
    anchor: "ADR-059, D136, D127"
    severity: high
    scan: data/prompt_eval/
    pattern: '(?:optimizer_enabled|auto_promote)\s*:\s*true'
    rationale: "Prompt evaluation DATA may evaluate candidates but must not enable optimization, promotion or import authority."
    suffix_allowlist: [.yaml, .yml]

  - id: no_optimizer_or_auto_promote_true_in_artifacts
    anchor: "ADR-059 (no auto-promote), D136 (DSPy disabled), M387 optimizer FSM"
    severity: high
    scan: artifacts/
    pattern: '"(?:optimizer_enabled|auto_promote)"\s*:\s*true'
    rationale: "No runtime artifact may enable optimizer admission or automatic promotion; candidates stay evaluated until explicit human authorization. D127 import lock remains separate."

  # --- M333: D127 source lock — import_eligible must not be set true in crates ---
  # Artifacts already covered by no_import_eligible_true_in_artifacts.
  - id: no_import_eligible_true_in_crates
    anchor: "D127 + ADR-005 (import_eligible=false until explicit user yes)"
    severity: high
    scan: crates/
    pattern: 'import_eligible\s*[:=]\s*true|"import_eligible"\s*:\s*true'
    rationale: "import_eligible must remain false in Rust production sources until independent review and explicit user yes (D127). Fail-closed unit tests that temporarily assign true to prove rejection are excluded via path_contains_exclude."
    suffix_allowlist:
      - .rs
    # Exclude test trees only — production src/ and examples/ still scanned.
    path_contains_exclude:
      - /tests/
      - /test/

  - id: no_graph_writes_allowed_true_in_artifacts
    anchor: "ADR-040 (Samyama sole KG store), D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_writes_allowed"\s*:\s*true'
    rationale: "graph_writes_allowed must remain false. Graph writes locked behind D127."

  - id: no_graph_write_allowed_true_in_artifacts
    anchor: "ADR-040, D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_write_allowed"\s*:\s*true'
    rationale: "graph_write_allowed (singular) must remain false. Variant spelling of graph_writes_allowed."

  - id: no_graph_writes_any_true_in_artifacts
    anchor: "ADR-005, D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_writes_any"\s*:\s*true'
    rationale: "graph_writes_any must remain false. Any graph write signal locked behind D127."

  # --- M382/D229 exact snapshot lineage: no warning-only derivation waiver ---
  - id: no_boolean_derived_snapshot_waiver
    anchor: "D229 (exact physical derivation continuity)"
    severity: high
    scan: crates/
    pattern: 'allow[-_]derived[-_]snapshot'
    rationale: "Derived snapshots require DATA-governed producer-report continuity; a boolean waiver admits unrelated task-passing graphs."
    suffix_allowlist:
      - .rs
    path_contains_exclude:
      - /tests/
      - /test/

  # --- ADR-050 universal-crate invariant (Rust workspace) ---
  - id: kg_crates_must_not_depend_on_da
    anchor: "ADR-050 (kg-* crate family — universal, no da-* deps)"
    severity: high
    scan: crates/
    pattern: '^(?:da-domain|da-ports|da-application|da-adapters|da-graph|da-cli)\s*='
    rationale: "kg-* crates are universal (ADR-050). They must NOT declare any da-* dependency in Cargo.toml."
    filename_filter: Cargo.toml
    path_prefix_include: crates/kg-

  # --- Hexagonal overlay (ADR-034) on Rust workspace ---
  - id: da_domain_must_not_depend_on_infra
    anchor: "ADR-034 (Hexagonal/Onion overlay), ADR-040"
    severity: medium
    scan: crates/da-domain/Cargo.toml
    pattern: '^(?:reqwest|tokio|samyama|hyper|axum|actix)\s*='
    rationale: "da-domain (domain Core) must not depend on infrastructure crates."

  - id: da_application_must_not_depend_on_da_adapters
    anchor: "ADR-034 (Hexagonal/Onion overlay)"
    severity: medium
    scan: crates/da-application/Cargo.toml
    pattern: '^da-adapters\s*='
    rationale: "da-application must not depend on da-adapters in prod deps."
    section_filter: dependencies

  # --- ADR-040 binding: Samyama sole KG+vector+persist store ---
  - id: no_forbidden_graph_stores_in_cargo
    anchor: "ADR-040 §3 (binding inventory — Samyama sole KG store)"
    severity: high
    scan: crates/
    pattern: '^(?:nebula|falkordb|ladybugdb|arcadedb)\s*='
    rationale: "ADR-040 binding: Samyama is sole KG+vector+persist store. No NebulaGraph, no FalkorDB, no LadybugDB, no ArcadeDB."
    filename_filter: Cargo.toml

  - id: no_forbidden_graph_stores_in_rust_imports
    anchor: "ADR-040 §3 (binding inventory)"
    severity: high
    scan: crates/
    pattern: '^use (?:nebula|falkordb|ladybugdb|arcadedb)::'
    rationale: "ADR-040 binding: no forbidden graph store crates imported in Rust source."
    suffix_allowlist:
      - .rs

  # --- ADR-050 binding: kg-* crates must not use da_domain types directly ---
  - id: kg_crates_must_not_import_da_domain
    anchor: "ADR-050 (kg-* crate family — universal, no da-* deps)"
    severity: high
    scan: crates/
    pattern: '^use da_domain::'
    rationale: "kg-* crates are universal — must not import da_domain types directly. Use kg-ontology instead."
    suffix_allowlist:
      - .rs
    path_prefix_include: crates/kg-

  # --- ADR-045 / ADR-050 binding: no hardcoded schema in Rust (HE хардкодим) ---
  - id: no_hardcoded_node_label_definitions
    anchor: "ADR-050 + ADR-045 (HE хардкодим — data in YAML, logic in Rust)"
    severity: medium
    scan: crates/da-domain/src/schema.rs
    pattern: 'NodeSchemaDef\s*\{\s*label:\s*"[A-Z]'
    rationale: "Node schemas should be data-driven (YAML). Direct NodeSchemaDef literals in Rust indicate hardcoding. M285-z09px0/S06/S07 will move these to YAML."

  # --- M324/M325: inventory discovery must use meta-ontology, not string-literal label walks ---
  # Flags get_nodes_by_label("Label") in da-cli binary sources. Use collect_graph_inventory
  # / registered_node_labels_or_yaml instead. Examples under crates/da-cli/examples/ are
  # out of this scan path (src only).
  - id: no_hardcoded_inventory_label_walks
    anchor: "ADR-050 + M324/M325 (external meta-ontology; inventory YAML-first)"
    severity: medium
    scan: crates/da-cli/src/
    pattern: 'get_nodes_by_label\(\s*"[A-Za-z]+"'
    rationale: "CLI inventory/discovery must not hardcode node labels as string literals. Walk via collect_graph_inventory / registered_node_labels_or_yaml from data/ontology."
    suffix_allowlist:
      - .rs

  # --- M371 S05: cacheable PipelineStageExecutor purity ratchet ---
  # One data rule per known stage module keeps the scanner line-based and narrow.
  # Materializers in cluster.rs/enrich.rs are intentionally outside this scope.
  - id: cacheable_artifact_stage_must_not_mutate_graph
    anchor: "M371 S04/S05 cache side-effect boundary"
    severity: high
    scan: crates/da-application/src/artifact_stage.rs
    pattern: 'create_node|create_edge|set_node_property|materialize_|GraphStore|DirectGraphStore'
    rationale: "Cacheable PipelineStageExecutor must be pure; cache hits skip execute. Graph writes belong in an always-run idempotent materializer."
    suffix_allowlist: [.rs]

  - id: cacheable_cluster_stage_must_not_mutate_graph
    anchor: "M371 S04/S05 cache side-effect boundary"
    severity: high
    scan: crates/da-application/src/cluster_stage.rs
    pattern: 'create_node|create_edge|set_node_property|materialize_|GraphStore|DirectGraphStore'
    rationale: "ClusterDetectionStage is pure candidate computation. Graph materialization must stay outside the cacheable stage."
    suffix_allowlist: [.rs]

  - id: cacheable_document_context_stage_must_not_mutate_graph
    anchor: "M371 S04/S05 cache side-effect boundary"
    severity: high
    scan: crates/da-application/src/document_context_stage.rs
    pattern: 'create_node|create_edge|set_node_property|materialize_|GraphStore|DirectGraphStore'
    rationale: "DocumentContextStage is a pure artifact projection and must not hide graph mutations behind cache hits."
    suffix_allowlist: [.rs]

  - id: cacheable_figure_analysis_stage_must_not_mutate_graph
    anchor: "M371 S04/S05 cache side-effect boundary"
    severity: high
    scan: crates/da-application/src/figure_analysis_stage.rs
    pattern: 'create_node|create_edge|set_node_property|materialize_|GraphStore|DirectGraphStore'
    rationale: "Figure analysis is candidate evidence only; its cacheable stage must not write graph truth."
    suffix_allowlist: [.rs]

  - id: cacheable_figure_context_stage_must_not_mutate_graph
    anchor: "M371 S04/S05 cache side-effect boundary"
    severity: high
    scan: crates/da-application/src/figure_context_stage.rs
    pattern: 'create_node|create_edge|set_node_property|materialize_|GraphStore|DirectGraphStore'
    rationale: "Figure context projection is pure and cacheable; graph writes are forbidden in the stage."
    suffix_allowlist: [.rs]

  - id: cacheable_adapter_pipeline_stages_must_not_mutate_graph
    anchor: "M371 S04/S05 cache side-effect boundary"
    severity: high
    scan: crates/da-adapters/src/pipeline_stages.rs
    pattern: 'create_node|create_edge|set_node_property|materialize_|GraphStore|DirectGraphStore'
    rationale: "Parser/detector cacheable adapters may perform external computation but must not mutate graph state."
    suffix_allowlist: [.rs]

  # --- M371: document-scoped graph identity ratchet ---
  - id: extraction_must_not_resolve_section_globally_by_title
    anchor: "M371 S05 cache-to-graph document identity"
    severity: high
    scan: crates/da-application/src/extraction.rs
    pattern: 'find_node_by_string_property\("Section",\s*"title"'
    rationale: "Section titles repeat across and within papers. FOUND_IN must resolve the document-scoped Section VID from paper ID plus section ordinal."
    suffix_allowlist: [.rs]

  # --- ADR-052 semantic logging: never persist raw provider payloads ---
  - id: semantic_logs_must_not_include_raw_llm_payload
    anchor: "ADR-052 structured logging + secret/payload minimization"
    severity: high
    scan: crates/da-application/src/
    pattern: 'tracing::(?:trace|debug|info|warn|error)!.*(?:raw|payload|response_text)\s*='
    rationale: "Operational logs must carry semantic identity, state transitions, hashes and sizes — never raw LLM/provider payload text."
    suffix_allowlist: [.rs]

  # --- ADR-059 / D239 model registry authority ---
  - id: prompt_tasks_must_use_models_registry_bindings
    anchor: "ADR-059 + D239 (models.yaml owns provider/model/protocol roles)"
    severity: high
    scan: data/ontology/prompt_tasks.yaml
    pattern: 'ANTHROPIC_(?:BASE_URL|MODEL)|anthropic-(?:text|multimodal)'
    rationale: "Prompt tasks must reference canonical models.yaml binding IDs. Provider endpoint/model env keys in prompt task DATA duplicate routing policy and bypass 9router role lineage."
    suffix_allowlist:
      - .yaml

  - id: cli_generative_paths_must_not_bypass_prompt_execution
    anchor: "ADR-059 + D238 (all generative composition uses PromptExecutionPort)"
    severity: high
    scan: crates/da-cli
    pattern: 'Anthropic(?:LlmClient|MultimodalClient|MultimodalRoute)'
    rationale: "CLI generative composition must resolve PromptExecution tasks and models.yaml bindings; direct provider adapters bypass lineage, FSM and evaluation gates."
    suffix_allowlist:
      - .rs

  # --- DSPy / LLM deploy lock (D136) ---
  # --- M329: fact edges must use temporal_stamp (pair with cargo audit test) ---
  # Line-level catch for same-line patterns; multi-line sites covered by
  # crates/da-application/tests/temporal_write_path_audit_test.rs (hard gate).
  - id: no_bare_fact_create_edge_same_line
    anchor: "ADR-046 + M327–M329 (fact edges via create_edge_with_temporal)"
    severity: medium
    scan: crates/da-application/src/
    pattern: '\.create_edge\([^)]*(?:CITES|MENTIONS|SUPPORTS|SUPERSEDES|AFFILIATED_WITH|PARTICIPATES_IN|MEMBER_OF_CLUSTER)'
    rationale: "Bare create_edge with a fact wire on the same line bypasses TemporalEdge stamp. Use create_edge_with_temporal. Multi-line sites: cargo test -p da-application --test temporal_write_path_audit_test."
    suffix_allowlist:
      - .rs

  # --- M330/M331: application must use Clock port, not chrono::Utc::now (ADR-051) ---
  - id: no_bare_utc_now_in_application
    anchor: "ADR-051 Contour 1 + M330 (Clock port; no bare Utc::now in application)"
    severity: medium
    scan: crates/da-application/src/
    pattern: 'chrono::Utc::now|Utc::now\s*\('
    rationale: "Application must inject da_ports::Clock (SystemClock/FixedClock). Bare chrono::Utc::now breaks deterministic TemporalEdge stamps. Composition root (da-cli) may call Utc::now when passing explicit now to associate functions."
    suffix_allowlist:
      - .rs

  - id: no_dspy_enabled_in_artifacts
    anchor: "D136 (DSPy not enabled until eval metrics + benchmark fixtures verified)"
    severity: medium
    scan: artifacts/
    pattern: '"dspy_enabled"\s*:\s*true'
    rationale: "DSPy must remain disabled (D136) until eval metrics and benchmark fixtures are verified."

  # --- GEPA/LLM deploy lock: no auto-promote (AGENTS.md) ---
  - id: no_auto_promote_in_artifacts
    anchor: "AGENTS.md hard locks (GEPA/LLM deploy)"
    severity: medium
    scan: artifacts/
    pattern: '"auto_promote"\s*:\s*true'
    rationale: "GEPA/LLM deploy requires dual F1 + same-n + val_gap. No auto-promote."

  # --- GSD browser-evidence-gate early warning (MEM516) ---
  # Scans GSD PLAN files for 'snapshot' word in goal/successCriteria text.
  # The GSD browserEvidenceGateRequiresAttention function treats 'snapshot'
  # as a browser requirement trigger, downgrading verdict: pass -> needs-attention.
  # Fix: write ASSESSMENT.md with uatType: runtime-executable for triggering slices.
  - id: gsd_snapshot_trigger_in_plan_files
    anchor: "GSD browser evidence gate (MEM516)"
    severity: medium
    scan: .gsd/phases/
    pattern: '\b(?:snapshot|PropertySnapshot|export_snapshot|import_snapshot)\b'
    rationale: "Slice PLAN text contains 'snapshot' which triggers GSD browser-evidence gate. Write ASSESSMENT.md with uatType: runtime-executable to bypass. See AGENTS.md browser evidence gate section."
    filename_filter: PLAN.md

  # --- Stale pre-commit package references (MEM524) ---
  # When a workspace package is removed (e.g. da-graph in M290), the pre-commit
  # config must be updated. Stale references cause every commit to fail.
  - id: no_stale_precommit_packages
    anchor: "Workspace integrity (MEM524)"
    severity: medium
    scan: .pre-commit-config.yaml
    pattern: '(?:cargo\s+(?:fmt|clippy)\s+.*-p\s+.*)?(da-graph)'
    rationale: "pre-commit config references removed workspace packages. da-graph was disassembled in M290. Run 'cargo metadata --no-deps --format-version=1' to list current workspace members and update .pre-commit-config.yaml."

  # --- M298 / ADR-040 Wave 2: ruvector-solver feature hygiene ---
  # ruvector-solver default features enable neumann/cg/forward-push. Consumers
  # that only need CsrMatrix types must set default-features = false (D141/D142).
  - id: ruvector_solver_must_disable_default_features
    anchor: "ADR-040 (ruvector-solver types-only path), M298 D141/D142"
    severity: medium
    scan: crates/
    pattern: '^ruvector-solver\s*=\s*\{(?!.*default-features\s*=\s*false)[^}]*\}'
    rationale: "ruvector-solver default features pull solver algorithms (neumann/cg/forward-push). Types-only consumers must declare default-features = false."
    filename_filter: Cargo.toml

  # kg-storage owns GraphView producers; solver matrix export lives in kg-algorithms.
  # Production deps must not pull ruvector-solver (compose tests use dev-dep only).
  - id: kg_storage_must_not_prod_depend_on_ruvector_solver
    anchor: "ADR-040 / D141 (solver bridge in kg-algorithms, not storage)"
    severity: high
    scan: crates/kg-storage/Cargo.toml
    pattern: '^ruvector-solver\s*='
    rationale: "kg-storage must not depend on ruvector-solver in [dependencies]. Export lives in kg-algorithms; compose tests may use dev-dep only."
    section_filter: dependencies

  # --- M303/M304: da analyze algorithm list hygiene ---
  # ANALYZE_ALGORITHMS must remain the single source for unknown-algorithm help.
  # If removed, help/match arms drift (MEM557). Pattern flags hard-coded Available:
  # lists that bypass the constant.
  - id: analyze_must_not_hardcode_available_algorithm_list
    anchor: "M303 ANALYZE_ALGORITHMS hygiene / API-CLI parity"
    severity: medium
    scan: crates/da-cli/src/analyze.rs
    pattern: 'Available:\s*page-rank,\s*ppr,\s*wcc'
    rationale: "da-cli analyze unknown-algorithm help must use ANALYZE_ALGORITHMS.join, not a hard-coded list. Prevents help/match arm drift."

  # Require the constant to exist (negative: missing constant name is a process smell;
  # enforced by also flagging if constant declaration disappears — scan for typo path).
  - id: analyze_algorithms_constant_must_exist
    anchor: "M303 ANALYZE_ALGORITHMS hygiene"
    severity: medium
    scan: crates/da-cli/src/
    pattern: 'const ANALYZE_ALGORITHMS_MISSING_SENTINEL'
    rationale: "Sentinel-only rule: never matches while ANALYZE_ALGORITHMS exists. If constant is renamed without updating governor, add a positive existence check in a later rule."
    filename_filter: analyze.rs

  # --- GSD lifecycle desync after manual execute (D144 / MEM564 follow-on) ---
  # When a task SUMMARY reports gsd_task_complete blocked for missing Attempt,
  # code may be green while DB lifecycle stays pending. Seal via /gsd auto.
  - id: gsd_lifecycle_attempt_desync_in_summary
    anchor: "GSD canonical Attempt (D144)"
    severity: medium
    scan: .gsd/phases/
    pattern: 'blocked without running Attempt|requires a running or replay-matched Attempt'
    rationale: "SUMMARY notes gsd_task_complete blocked without Attempt while work may already be committed. Do not hand-edit gsd.db; run /gsd auto <milestone> so attempt.claim then complete. See D144."

  # --- M311 Wave 3: serve-graph must stay in-memory (no RocksDB creep) ---
  - id: serve_graph_must_not_use_rocksdb_persistence
    anchor: "M307–M311 Wave 3 in-memory RespServer"
    severity: high
    scan: crates/da-cli/src/
    pattern: 'new_with_persistence|data_path:\s*Some\('
    rationale: "da serve-graph must use RespServer::new with data_path=None. RocksDB/persistence is a later explicit-flag slice; do not sneak into serve_graph.rs."
    filename_filter: serve_graph.rs

  # --- M336/M337: graph task suites must use ontology wire strings (ADR-051 §8.1) ---
  # Ban Rust const *names* that are not graph wire strings (HAS_PART vs hasPart, etc.).
  # Suffix .cypher is not in DEFAULT_SUFFIXES — must allowlist.
  - id: graph_tasks_must_not_use_wrong_edge_wires
    anchor: "ADR-051 §8.1 + ADR-050 meta-ontology (edge_contracts.yaml wire strings)"
    severity: high
    scan: data/graph_tasks/
    pattern: '\[:(?:HAS_PART|AUTHORED_BY|HAS_TOPIC|FOUND_IN|IN_CATEGORY)\b'
    rationale: "Graph task Cypher must use ontology wire strings (hasPart, authoredBy, hasTopic, foundIn, inCategory), not Rust const names (HAS_PART, …). Source: data/ontology/edge_contracts.yaml."
    suffix_allowlist:
      - .cypher

  # Soft hygiene: tasks dir should exist with at least one suite (process smell if empty after M336).
  # Pattern never matches a real line — existence of suite is checked by unit tests in verify script.
  - id: graph_tasks_suite_file_sentinel
    anchor: "ADR-051 §8.1 semantic graph task suite"
    severity: medium
    scan: data/graph_tasks/
    pattern: '@query_MISSING_SENTINEL_NEVER_MATCHES'
    rationale: "Sentinel-only: ensures data/graph_tasks/ is scanned. Real suite presence enforced by cargo test -p da-cli --lib graph_tasks + E2E suite runner."
    suffix_allowlist:
      - .cypher

  # --- M343: ADR-051 P0 regression prevention ---
  # Every crate with Serialize+Deserialize pub types must have roundtrip tests.
  # Pattern matches lib.rs files in crates/ that do NOT contain roundtrip helper.
  # This is a sentinel check — real enforcement is via cargo test, this catches
  # crates that have Serialize derives but forgot the test module entirely.
  - id: serde_roundtrip_test_module_required
    anchor: "ADR-051 §4.4 P0 — every Serialize+Deserialize type needs roundtrip coverage"
    severity: medium
    scan: crates/
    pattern: '#\[derive\(Debug, Clone, Serialize, Deserialize\)\]\n.*pub (struct|enum)'
    rationale: "Crate has Serialize+Deserialize types. Verify roundtrip_json<T> or roundtrip<T> exists in lib.rs tests. If this flag fires, add serde_roundtrip_tests module to the crate's lib.rs (see M340-M343 pattern)."
    suffix_allowlist:
      - .rs

  # --- M360+: incorrect build commands (MEM468 enforcement) ---
  # Flag any script or CI config that uses cargo build/test --workspace
  # without explicit override. Per-crate commands only (AGENTS.md).
  - id: no_workspace_build_in_scripts
    anchor: "MEM468 + AGENTS.md compile rules"
    severity: high
    scan: scripts/
    pattern: 'cargo (build|test|check)\s+--workspace'
    rationale: "cargo build/test --workspace triggers librocksdb-sys rebuild (5-10 min). Use per-crate: cargo check -p <crate>, cargo test -p <crate> --lib. Exempt: scripts/verify_rust_architecture.sh (CI gate)."
    suffix_allowlist:
      - .sh

  - id: no_cargo_build_in_dev_scripts
    anchor: "MEM514 + AGENTS.md compile rules"
    severity: medium
    scan: scripts/
    pattern: 'cargo build -p(?!.*--quiet)'
    rationale: "Use 'cargo check -p <crate>' for compilation verification. Only use cargo build when you need the binary for E2E."
    suffix_allowlist:
      - .sh

  # --- D194: Graph algorithm utilization (Wave 2+) ---
  # da-mcp must call page_rank or graph_rank — 12 Samyama algorithms must not sit idle.
  # Sentinel pattern never matches if graph_rank exists in tools.rs.
  - id: graph_algorithms_must_be_called
    anchor: "D194 Wave 2 — graph algorithm activation"
    severity: medium
    scan: crates/da-mcp/src/
    pattern: 'GRAPH_ALGORITHMS_MISSING_SENTINEL'
    rationale: "da-mcp must use samyama-graph-algorithms (page_rank, wcc, etc). If graph_rank tool is removed, this sentinel won't catch it — add positive existence check. Wave 2 activated PageRank+WCC in graph_rank tool (commit 7f2e2daa)."
    suffix_allowlist:
      - .rs

  # --- D194: RuVector hybrid integration (Wave 2+) ---
  # da-mcp must import ruvector-hybrid if mode=hybrid is available.
  - id: ruvector_hybrid_must_be_integrated
    anchor: "D194 Wave 2 — hybrid search (BM25+RRF)"
    severity: medium
    scan: crates/da-mcp/src/
    pattern: 'RUVECTOR_HYBRID_MISSING_SENTINEL'
    rationale: "da-mcp must import ruvector_hybrid. Wave 2 integrated RrfHybridIndex (commit 3147d22c). If hybrid.rs is removed, this sentinel won't catch it."
    suffix_allowlist:
      - .rs

  # --- ADR-056 load plane: durable load-report.v1 honesty ---
  # Scanner is a forbidden-pattern finder: flag wrong schema_version values if present.
  - id: load_report_forbid_legacy_schema_ids
    anchor: "ADR-056 / D220 (LoadReport load-report.v1)"
    severity: medium
    scan: artifacts/loads/
    pattern: '"schema_version"\s*:\s*"(load-report\.v0|load_report_v1|LoadReport)"'
    rationale: "Load reports must use load-report.v1; legacy schema ids under artifacts/loads/ are forbidden."
    suffix_allowlist:
      - .json

  - id: load_report_import_eligible_must_stay_false
    anchor: "ADR-056 / D127 (load plane does not unlock import)"
    severity: high
    scan: artifacts/loads/
    pattern: '"import_eligible"\s*:\s*true'
    rationale: "da load must not stamp import_eligible=true without explicit enable_import + user unlock path."
    suffix_allowlist:
      - .json

  # --- ADR-057 Proposed: drafts must not leak into production ontology DATA ---
  - id: production_node_schemas_must_not_list_knowledge_unit
    anchor: "ADR-057 Proposed (non-article ontology not Accepted/materialized)"
    severity: high
    scan: data/ontology/node_schemas.yaml
    pattern: "label:\\s*KnowledgeUnit"
    rationale: "KnowledgeUnit must not appear in production node_schemas.yaml until ADR-057 Accept + N1 DATA wave."

  - id: production_node_schemas_must_not_list_collection_book
    anchor: "ADR-057 Proposed (non-article ontology not Accepted/materialized)"
    severity: high
    scan: data/ontology/node_schemas.yaml
    pattern: "label:\\s*Collection"
    rationale: "Collection (book/course) must not appear in production node_schemas until ADR-057 Accept + N1."

  - id: production_edge_contracts_must_not_list_discusses_paper
    anchor: "ADR-057 Proposed (DISCUSSES_PAPER deferred)"
    severity: high
    scan: data/ontology/edge_contracts.yaml
    pattern: "edge_constant:\\s*DISCUSSES_PAPER"
    rationale: "DISCUSSES_PAPER is draft-only under data/ontology/drafts/ until ADR-057 Accept."

  - id: load_plane_must_not_write_discusses_paper_edges
    anchor: "ADR-056 + ADR-057 (loader forbids curriculum edges)"
    severity: high
    scan: crates/da-application/src/article_load.rs
    pattern: "DISCUSSES_PAPER|KnowledgeUnit"
    rationale: "ArticleLoadUseCase must not invent KnowledgeUnit/DISCUSSES_PAPER graph materialization."
    suffix_allowlist:
      - .rs

  - id: load_cli_must_not_materialize_non_article_structure
    anchor: "ADR-056 + ADR-057 (CLI composition only)"
    severity: high
    scan: crates/da-cli/src/load.rs
    pattern: "DISCUSSES_PAPER|KnowledgeUnit"
    rationale: "da load CLI must not materialize non-article structure graph nodes/edges."
    suffix_allowlist:
      - .rs

  # --- ADR-058 Accepted: keep universal load orchestration out of graph policy ---
  # Revision materialization belongs in a dedicated application use case over
  # injected ports. ArticleLoadUseCase preserves source identity and must not
  # grow direct graph writes as an architectural shortcut.
  - id: article_load_must_not_inline_revision_graph_writes
    anchor: "ADR-056 + ADR-058 + onion boundary"
    severity: high
    scan: crates/da-application/src/article_load.rs
    pattern: "create_node\\(\\\"(PaperRevision|SourceManifestation)\\\"\\)|HAS_REVISION|HAS_MANIFESTATION"
    rationale: "Use the dedicated revision materializer; universal load orchestration must not inline accepted ontology graph policy."
    suffix_allowlist:
      - .rs
