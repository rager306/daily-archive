# ADR reverse audit rules — code-level checks that binding ADRs are honoured.
# Each rule has: id, anchor (ADR/decision), severity (high/medium), scan (path),
# pattern (regex), rationale, optional filters.
#
# This is DATA — adding a rule = adding an entry here, not changing Python code.
# Loaded by governor.domain.rule_loader at runtime.

rules:
  # --- D127 / ADR-005 artifacts-gate rules (JSON field checks) ---
  - id: no_graph_import_allowed_true_in_artifacts
    anchor: "ADR-005 (No Direct Extractor to GraphDB Path), D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_import_allowed"\s*:\s*true'
    rationale: "graph_import_allowed must remain false until explicit graph promotion milestone."

  - id: no_production_import_attempted_true_in_artifacts
    anchor: "ADR-005 (No Direct Extractor to GraphDB Path)"
    severity: high
    scan: artifacts/
    pattern: '"production_import_attempted"\s*:\s*true'
    rationale: "production_import_attempted must remain false."

  # --- Universal artifact field checks (Rust-era M274-M285) ---
  # These fields appear in ALL Rust-era artifacts regardless of milestone.
  # Governor must check every JSON artifact, not just hand-picked ones.
  - id: no_import_eligible_true_in_artifacts
    anchor: "R029, ADR-005, D127"
    severity: high
    scan: artifacts/
    pattern: '"import_eligible"\s*:\s*true'
    rationale: "import_eligible must remain false until independent review and explicit user yes (D127)."

  - id: no_graph_writes_allowed_true_in_artifacts
    anchor: "ADR-040 (Samyama sole KG store), D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_writes_allowed"\s*:\s*true'
    rationale: "graph_writes_allowed must remain false. Graph writes locked behind D127."

  - id: no_graph_write_allowed_true_in_artifacts
    anchor: "ADR-040, D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_write_allowed"\s*:\s*true'
    rationale: "graph_write_allowed (singular) must remain false. Variant spelling of graph_writes_allowed."

  - id: no_graph_writes_any_true_in_artifacts
    anchor: "ADR-005, D127"
    severity: high
    scan: artifacts/
    pattern: '"graph_writes_any"\s*:\s*true'
    rationale: "graph_writes_any must remain false. Any graph write signal locked behind D127."

  # --- ADR-050 universal-crate invariant (Rust workspace) ---
  - id: kg_crates_must_not_depend_on_da
    anchor: "ADR-050 (kg-* crate family — universal, no da-* deps)"
    severity: high
    scan: crates/
    pattern: '^(?:da-domain|da-ports|da-application|da-adapters|da-graph|da-cli)\s*='
    rationale: "kg-* crates are universal (ADR-050). They must NOT declare any da-* dependency in Cargo.toml."
    filename_filter: Cargo.toml
    path_prefix_include: crates/kg-

  # --- Hexagonal overlay (ADR-034) on Rust workspace ---
  - id: da_domain_must_not_depend_on_infra
    anchor: "ADR-034 (Hexagonal/Onion overlay), ADR-040"
    severity: medium
    scan: crates/da-domain/Cargo.toml
    pattern: '^(?:reqwest|tokio|samyama|hyper|axum|actix)\s*='
    rationale: "da-domain (domain Core) must not depend on infrastructure crates."

  - id: da_application_must_not_depend_on_da_adapters
    anchor: "ADR-034 (Hexagonal/Onion overlay)"
    severity: medium
    scan: crates/da-application/Cargo.toml
    pattern: '^da-adapters\s*='
    rationale: "da-application must not depend on da-adapters in prod deps."
    section_filter: dependencies

  # --- ADR-040 binding: Samyama sole KG+vector+persist store ---
  - id: no_forbidden_graph_stores_in_cargo
    anchor: "ADR-040 §3 (binding inventory — Samyama sole KG store)"
    severity: high
    scan: crates/
    pattern: '^(?:nebula|falkordb|ladybugdb|arcadedb)\s*='
    rationale: "ADR-040 binding: Samyama is sole KG+vector+persist store. No NebulaGraph, no FalkorDB, no LadybugDB, no ArcadeDB."
    filename_filter: Cargo.toml

  - id: no_forbidden_graph_stores_in_rust_imports
    anchor: "ADR-040 §3 (binding inventory)"
    severity: high
    scan: crates/
    pattern: '^use (?:nebula|falkordb|ladybugdb|arcadedb)::'
    rationale: "ADR-040 binding: no forbidden graph store crates imported in Rust source."
    suffix_allowlist:
      - .rs

  # --- ADR-050 binding: kg-* crates must not use da_domain types directly ---
  - id: kg_crates_must_not_import_da_domain
    anchor: "ADR-050 (kg-* crate family — universal, no da-* deps)"
    severity: high
    scan: crates/
    pattern: '^use da_domain::'
    rationale: "kg-* crates are universal — must not import da_domain types directly. Use kg-ontology instead."
    suffix_allowlist:
      - .rs
    path_prefix_include: crates/kg-

  # --- ADR-045 / ADR-050 binding: no hardcoded schema in Rust (HE хардкодим) ---
  - id: no_hardcoded_node_label_definitions
    anchor: "ADR-050 + ADR-045 (HE хардкодим — data in YAML, logic in Rust)"
    severity: medium
    scan: crates/da-domain/src/schema.rs
    pattern: 'NodeSchemaDef\s*\{\s*label:\s*"[A-Z]'
    rationale: "Node schemas should be data-driven (YAML). Direct NodeSchemaDef literals in Rust indicate hardcoding. M285-z09px0/S06/S07 will move these to YAML."

  # --- DSPy / LLM deploy lock (D136) ---
  - id: no_dspy_enabled_in_artifacts
    anchor: "D136 (DSPy not enabled until eval metrics + benchmark fixtures verified)"
    severity: medium
    scan: artifacts/
    pattern: '"dspy_enabled"\s*:\s*true'
    rationale: "DSPy must remain disabled (D136) until eval metrics and benchmark fixtures are verified."

  # --- GEPA/LLM deploy lock: no auto-promote (AGENTS.md) ---
  - id: no_auto_promote_in_artifacts
    anchor: "AGENTS.md hard locks (GEPA/LLM deploy)"
    severity: medium
    scan: artifacts/
    pattern: '"auto_promote"\s*:\s*true'
    rationale: "GEPA/LLM deploy requires dual F1 + same-n + val_gap. No auto-promote."

  # --- GSD browser-evidence-gate early warning (MEM516) ---
  # Scans GSD PLAN files for 'snapshot' word in goal/successCriteria text.
  # The GSD browserEvidenceGateRequiresAttention function treats 'snapshot'
  # as a browser requirement trigger, downgrading verdict: pass -> needs-attention.
  # Fix: write ASSESSMENT.md with uatType: runtime-executable for triggering slices.
  - id: gsd_snapshot_trigger_in_plan_files
    anchor: "GSD browser evidence gate (MEM516)"
    severity: medium
    scan: .gsd/phases/
    pattern: '\b(?:snapshot|PropertySnapshot|export_snapshot|import_snapshot)\b'
    rationale: "Slice PLAN text contains 'snapshot' which triggers GSD browser-evidence gate. Write ASSESSMENT.md with uatType: runtime-executable to bypass. See AGENTS.md browser evidence gate section."
    filename_filter: PLAN.md

  # --- Stale pre-commit package references (MEM524) ---
  # When a workspace package is removed (e.g. da-graph in M290), the pre-commit
  # config must be updated. Stale references cause every commit to fail.
  - id: no_stale_precommit_packages
    anchor: "Workspace integrity (MEM524)"
    severity: medium
    scan: .pre-commit-config.yaml
    pattern: '(?:cargo\s+(?:fmt|clippy)\s+.*-p\s+.*)?(da-graph)'
    rationale: "pre-commit config references removed workspace packages. da-graph was disassembled in M290. Run 'cargo metadata --no-deps --format-version=1' to list current workspace members and update .pre-commit-config.yaml."

  # --- M298 / ADR-040 Wave 2: ruvector-solver feature hygiene ---
  # ruvector-solver default features enable neumann/cg/forward-push. Consumers
  # that only need CsrMatrix types must set default-features = false (D141/D142).
  - id: ruvector_solver_must_disable_default_features
    anchor: "ADR-040 (ruvector-solver types-only path), M298 D141/D142"
    severity: medium
    scan: crates/
    pattern: '^ruvector-solver\s*=\s*\{(?!.*default-features\s*=\s*false)[^}]*\}'
    rationale: "ruvector-solver default features pull solver algorithms (neumann/cg/forward-push). Types-only consumers must declare default-features = false."
    filename_filter: Cargo.toml

  # kg-storage owns GraphView producers; solver matrix export lives in kg-algorithms.
  # Production deps must not pull ruvector-solver (compose tests use dev-dep only).
  - id: kg_storage_must_not_prod_depend_on_ruvector_solver
    anchor: "ADR-040 / D141 (solver bridge in kg-algorithms, not storage)"
    severity: high
    scan: crates/kg-storage/Cargo.toml
    pattern: '^ruvector-solver\s*='
    rationale: "kg-storage must not depend on ruvector-solver in [dependencies]. Export lives in kg-algorithms; compose tests may use dev-dep only."
    section_filter: dependencies
