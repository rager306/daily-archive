# Graph semantic validation — M449 S01.
#
# DATA for the Governor graph_semantics check. Validates that .sgnap
# snapshots contain semantically complete content, not structural stubs.
#
#   - section_text_completeness: avg raw_text per Section node must exceed
#     the threshold. The M445 audit found 364-char stubs where full article
#     text should be.
#   - enrichment_coverage: Author+Venue+Topic nodes must cover papers.
#     The M445 audit found ZERO enrichment nodes.
#   - entity_dedup_integrity: no duplicate Entity vids in the graph.
#   - revision_binding_coverage: papers with revision-owned vids.
#
# This is DATA — adjusting a threshold is an edit here, not a Python change.

schema_version: graph-semantics.v1
policy_id: graph-semantics
dimension: graph_semantics
severity: high
anchor: "M445 audit, M440-M443 materialization waves"

rules:
  - id: section_text_completeness
    description: "Average raw_text per Section must be > threshold chars (stubs < 500 are empty shells)"
    threshold: 500
    metric: avg_raw_text_len

  - id: enrichment_coverage
    description: "Author+Venue+Topic nodes must cover > threshold of papers"
    threshold: 0.5
    metric: enrichment_coverage

  - id: entity_dedup_integrity
    description: "Duplicate Entity vids must not exceed threshold"
    threshold: 0
    metric: duplicate_entity_vids

  - id: revision_binding_coverage
    description: "Papers with revision-owned vids must exceed threshold ratio"
    threshold: 0.9
    metric: revision_binding_coverage
