# DATED CORRECTION 2026-09-18 (M509-yzblqx/S06, second entry) — closes the
# documentary drift the first correction below recorded, and adds an explicit
# open-item contract so an unresolved stage can never be silent:
#   1. H07..H13 are promoted to `complete` with `completion_evidence`, because the
#      owning wave M507-4fk6m6 closed (S01..S09 all complete with UAT/ASSESSMENT).
#      The review prose does not create acceptance; the roadmap does, and the
#      roadmap closed. This is the closure the first correction deliberately left
#      to the owning wave. The five H07..H13 `verification_evidence` command rows
#      the first correction repaired are now recorded `pass` (their measured
#      results were already in the register), and the `governor_rule` rows whose
#      expected text said "stays unresolved with no PASS claim" were rewritten to
#      the closure they now carry.
#   2. H05 (global budgets and bounded reorder) stays unresolved. The M506/S04
#      ceiling work closed honestly with H05 unresolved and no live slice owns it
#      (`native_route_recovery` reports `h05_closure: not_claimed`), so it is
#      recorded as an explicitly accepted open item: owner `unassigned`,
#      `open_item.accepted: true`, with a reason and a closure condition. It is NOT
#      assigned to a wave that does not own budgets.
#   3. New contract key `open_item_required_for_unresolved: true`: every unresolved
#      stage must carry an `open_item {reason, since, accepted, closure_condition}`.
#      An accepted open item must be unassigned, and an unassigned unresolved stage
#      must be accepted — a silent `unassigned` cannot recur. `owner_allow` still
#      gates named owners so a typo or a stale slice cannot pass validation.
#
# DATED CORRECTION 2026-09-18 — supersedes grobid_rust_horizon_review.yaml per the
# ADR-076 §9/§10 convention (a dated snapshot is added, the reviewed one is not
# rewritten). Rationale for the change:
#   1. tested_source on every stage moved from git:3b327d7 (verified=false) to the
#      current revision with verified=true, because this review executed the stages'
#      recorded verification commands against the current tree.
#   2. index_freshness on every stage moved from 'stale' to 'fresh': both indexes were
#      genuinely rebuilt on 2026-09-18 (GitNexus up-to-date at fbd7080; CBM project
#      root-daily-archive, 497628 nodes). The stale duplicate CBM entry `daily-archive`
#      was deleted, so CBM queries must name `root-daily-archive`.
#   3. Three recorded verification commands were measured defective and were replaced:
#      H07 `cargo test -p da-parse --lib feature_abi` matched 0 tests (the symbol lives
#      in da-domain); H08 and H11 commands were rejected by cargo outright
#      (two filter words without `--`, 'unexpected argument'). Replacements were run
#      and pass: H07 da-domain feature_abi 5, da-adapters feature_provider_parity 5;
#      H08 da-domain scalar_crf 11; H11 reading_order 25, native_body_accounting 1.
#   4. NO STATUS WAS PROMOTED. The contract requires status=complete together with
#      completion_evidence to claim a PASS, and that closure belongs to the owning
#      wave (M507), not to a review. H07..H13 therefore stay pending even though their
#      implementation is present and their repaired verification commands pass — this
#      is documentary drift for the owning wave to close, recorded rather than papered
#      over.
#   5. owner_allow gained the M508-g9b5gi slices (S01..S05), the wave that followed.
#
# GROBID Rust long-horizon review registry contract (read-only control metadata).
#
# DATA for the Governor `grobid_horizon_review` validation path selected through
# `governor review --registry <this file>`. This does NOT ingest review prose as
# enforcement. It checks registry integrity and planning honesty only:
# stages are unresolved by default, implementation and verification evidence are
# separate, planning may not claim a PASS, index freshness is either current or
# has a documented limitation, negative tests exist, and every ADR-051 test
# matrix row states applicability with a reason.
schema_version: grobid-horizon-review-registry.v1
policy_id: grobid_horizon_review
format: horizon-json-v1
dimension: scholarly_parse_plane
severity: medium
anchor: "H01..H13, doc/review/grobid-rust-horizon-review.json"
registry:
  review: doc/review/grobid-rust-horizon-review.json
  review_schema: doc/review/grobid-rust-horizon-review.schema.json
  stage_id_pattern: "^H[0-9]{2}$"
  stage_id_range: [H01, H13]
  allow_status: [pending, in_progress, blocked, complete, superseded]
  unresolved_status: [pending, in_progress, blocked]
  required_stage_fields:
    - stage_id
    - title
    - scope
    - status
    - depends_on
    - owner
    - adr_refs
    - implementation_evidence
    - verification_evidence
    - tested_source
    - index_freshness
    - negative_tests
    - test_matrix
    - implementation_pass
    - verification_pass
  # ADR-051 two-axis matrix vocabulary (7 contours x 8 test types).
  contours:
    - "1 Determinism Infrastructure"
    - "2 Domain Semantic"
    - "3 Application Functional"
    - "4 Port Contract Suite"
    - "5 Adapter Integration"
    - "6 System Journey E2E"
    - "7 Architecture Invariant"
  test_types:
    - Unit
    - Property
    - Serde roundtrip
    - Contract
    - Integration
    - Business logic
    - Mutation
    - E2E journey
  owner_field: owner
  owner_unassigned_value: unassigned
  # Owners are milestone slices that actually own horizon stages. Baseline milestones
  # are CLOSED (M505 earlier; M506 on 2026-09-14 with S03–S05 complete and S06–S13
  # descoped by D355), and the descoped scope is now carried by the successor wave
  # **M507-4fk6m6** (planned 2026-09-14: S01–S04 detailed, S05–S08 sketches).
  # Current binding: H07→M507/S01, H08→M507/S02, H09→M507/S03, H10→M507/S04,
  # H11→M507/S05, H12→M507/S06, H13→M507/S08 (H13 = "Learning ablations and
  # operational performance" is jointly served by S07 learning ablations and S08
  # operational performance; S08 is the closing owner because a single owner string
  # is carried here, and the pairing is recorded in M507's boundary map).
  # H05 ("Global budgets and bounded reorder") is `unassigned`: it is M506/S04's own
  # unfinished ceiling work — the milestone closed honestly with H05 unresolved/no-claim
  # and no live slice owns it. M506 entries are kept only because they remain valid
  # historical owners; removal would flag stages that still name them.
  # Extend instead of writing a free-form owner, so a typo or a stale slice can never
  # pass validation silently. The next wave must extend this list with its own slices
  # BEFORE it claims any of these stages.
  owner_allow: [unassigned, M505-o169s4, M506-98qg7g/S01, M506-98qg7g/S02, M506-98qg7g/S03, M506-98qg7g/S04, M506-98qg7g/S05, M507-4fk6m6/S01, M507-4fk6m6/S02, M507-4fk6m6/S03, M507-4fk6m6/S04, M507-4fk6m6/S05, M507-4fk6m6/S06, M507-4fk6m6/S07, M507-4fk6m6/S08, M508-g9b5gi/S01, M508-g9b5gi/S02, M508-g9b5gi/S03, M508-g9b5gi/S04, M508-g9b5gi/S05]
  # An unresolved stage may never be silent. It must declare an open_item with a
  # reason, the date it was first recorded, an acceptance flag and a closure
  # condition. `accepted: true` is only legal for an unassigned stage, and an
  # unassigned unresolved stage must be accepted: either a live slice owns it, or
  # the absence of an owner is itself an explicit, reasoned record.
  open_item_required_for_unresolved: true
