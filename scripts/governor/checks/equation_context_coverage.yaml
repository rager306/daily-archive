# Equation context coverage contract — PIR-020 closure, M400 S05 T01.
#
# DATA for the Governor `equation_context_coverage` check. The contract
# mirrors the revision-grounded EquationCandidate contract implemented in
# `da_domain::equation_candidate` (M400 S03, ADR-051): every equation
# candidate must retain formula identity (`formula_id`), exact
# revision-scoped section lineage (`revision_vid`, `section_vid`,
# `section_path_id`), a typed representation kind (MathML, TeX, plain text)
# with representation text and digest, and a both-or-neither source span
# (typed missingness — never guessed). Authority and import stay hard-locked
# false (D127 / ADR-053); extraction missingness is typed at conversion and
# never invents a candidate.
#
# Semantics:
#   - positive (coverage_complete): every committed EquationCandidate fixture
#     must be clean — full formula identity, revision/section grounding,
#     typed representation, source span, deterministic identity, locks false;
#   - negative (coverage_broken): every record must trigger exactly its
#     labelled violation (missing formula identity, ungrounded formula,
#     missing representation, partial span, invalid span, identity mismatch,
#     authority unlock, import unlock), and every violation in
#     `require_violations` must appear in the fixture — a future edit that
#     removes a negative case is flagged;
#   - graph_task_suite: the snapshot-level equation candidate suite must keep
#     the grounded/required-formula/representation/D127 task markers.
#
# The committed fixtures are validated by `scripts/tests/test_governor.py`
# (`_check_equation_context_coverage`), and the same invariants are pinned by
# the Rust domain tests in `crates/da-domain/src/equation_candidate.rs` plus
# the materializer test `crates/da-application/tests/equation_candidate_test.rs`
# — a broken contract cannot silently survive a regenerate. This is DATA —
# tightening an expectation is an edit here (plus updating the committed
# fixture JSON), not a Python change.

schema_version: equation-context-coverage.v1
policy_id: equation-context-coverage
dimension: equation_context_coverage
severity: high
anchor: "PIR-020, ADR-060, ADR-053, D127"

# EquationCandidate wire contract (`da_domain::equation_candidate::EquationCandidate`).
candidate_contract:
  required_fields:
    - vid
    - revision_vid
    - source_pdf_sha256
    - formula_id
    - section_vid
    - section_path_id
    - section_ordinal
    - section_title
    - representation_kind
    - representation_text
    - representation_sha256
    - source_digest
    - candidate_metadata_sha256
    - authoritative
    - import_eligible
    - schema_version
  # Content-hash lineage fields (revision/section VIDs are lineage, checked
  # via the deterministic identity).
  sha256_fields:
    - source_pdf_sha256
    - representation_sha256
    - source_digest
    - candidate_metadata_sha256
  # Canonical representation wire kinds
  # (`EquationRepresentationKind::as_str`).
  representation_kinds:
    - math_ml
    - tex_math
    - plain_text
  # D127 / ADR-053 — candidate evidence is never graph truth or importable.
  authority_locked: true
  import_locked: true

fixtures:
  positive:
    id: coverage_complete
    path: governor/fixtures/equation_coverage_contract/coverage_complete.positive.json
    expect: clean
  negative:
    id: coverage_broken
    path: governor/fixtures/equation_coverage_contract/coverage_broken.negative.json
    expect:
      require_violations:
        - missing_formula_identity
        - ungrounded_formula
        - missing_representation
        - partial_span
        - invalid_span
        - identity_mismatch
        - authority_unlock
        - import_unlock

# Enforcement points that must keep existing on the Rust side.
source_markers:
  domain:
    path: crates/da-domain/src/equation_candidate.rs
    required_patterns:
      - equation_candidate_vid
      - EquationRepresentationKind
      - AuthorityViolation
      - IdentityMismatch

# Same contract expressed against a durable snapshot (ADR-051 Contour 6).
graph_task_suite:
  id: equation_candidate
  path: data/graph_tasks/equation_candidate.tasks.cypher
  required_patterns:
    - grounded_candidates
    - required_grounded_formulas
    - represented_candidates
    - unlocked_import_candidates
