# Per-article manifest content invariants — M451 W4 / ADR-068.
#
# Norm: data/schemas/article_schema.yaml (single definition site).
# This contract points the checker at the norm and the data locations.
# The checker validates manifest-internal consistency AND spot-checks
# the filesystem (FS = truth): artifact files must exist.

schema_version: article-manifest-check.v1
policy_id: article-manifest
dimension: article_manifest
severity: medium
anchor: "ADR-068, M451"

norm: data/schemas/article_schema.yaml
processed_root: data/processed
manifest_name: manifest.yaml
legacy_manifest_name: manifest.json

invariants:   # which invariants from the norm this check enforces
  - lifecycle_is_derived
  - transaction_time_monotonic
  - derived_from_exists
  - ast_covers_sections
  - no_orphan_entities
  - artifact_files_exist

sample_limit: 0   # 0 = all articles; >0 = cap for fast mode
