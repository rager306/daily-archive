schema_version: acap-runtime-control-plane.v1
policy_id: acap-runtime-control-plane
dimension: acap_runtime_control_plane
severity: high
anchor: PIR-014, PIR-015, PIR-016, D127
locks:
  import_eligible: false
  promotion_explicit_transitions: 3
admission:
  fsm_policy: scripts/governor/checks/article_context_assurance.yaml
  parity_fixture: governor/fixtures/acap_runtime_control_plane/admission_parity.vectors.json
  record_contract:
    required_fields:
    - stage_id
    - admitted
    - evidence_ref
    - disposition
    - from_state
    - to_state
    dispositions:
    - executed
    - cache_hit
    - failed
    source_evidence_prefix: 'source:sha256:'
  fixtures:
    positive:
      id: legal_admission
      path: governor/fixtures/acap_runtime_control_plane/admission_legal.positive.json
      expect: clean
    negative:
      id: admission_violations
      path: governor/fixtures/acap_runtime_control_plane/admission_illegal.negative.json
      expect:
        require_violations:
        - illegal_transition
        - missing_skip_reason
        - denied_without_reason
        - missing_evidence_ref
        - admitted_with_error
        - import_leak
promotion:
  record_contract:
    required_fields:
    - decision_id
    - transition
    - verifier
    - reviewer
    - promoter
    - evidence_refs
    - sink_len
    - explicit_transitions
    - import_eligible
    required_explicit_transitions: 3
  fixtures:
    positive:
      id: authority_legal
      path: governor/fixtures/acap_runtime_control_plane/promotion_authority.positive.json
      expect: clean
    negative:
      id: authority_violations
      path: governor/fixtures/acap_runtime_control_plane/promotion_authority.negative.json
      expect:
        require_violations:
        - auto_promote
        - import_leak
        - self_authority
        - missing_evidence
scheduler:
  record_contract:
    required_fields:
    - task_vid
    - status
    - attempts
    - attempt_outcomes
    - published_by_epoch
    - logical_results
    - due_after_replay
    - import_eligible
    completed_status: completed
  fixtures:
    positive:
      id: recovery_legal
      path: governor/fixtures/acap_runtime_control_plane/scheduler_recovery.positive.json
      expect: clean
    negative:
      id: recovery_violations
      path: governor/fixtures/acap_runtime_control_plane/scheduler_recovery.negative.json
      expect:
        require_violations:
        - double_publish
        - stale_epoch_publish
        - recovery_without_aborted_attempt
        - completed_without_result
        - due_after_completion
        - import_leak
replay:
  record_contract:
    required_fields:
    - scenario
    - pipeline_executor_calls
    - pipeline_stage_records
    - pipeline_replay_dispositions
    - promotion_sink_len
    - promotion_sink_len_after_replay
    - scheduler_attempts
    - scheduler_attempts_after_replay
    - scheduler_due_after_replay
    - import_eligible
  fixtures:
    positive:
      id: replay_idempotent
      path: governor/fixtures/acap_runtime_control_plane/replay_idempotent.positive.json
      expect: clean
    negative:
      id: replay_violations
      path: governor/fixtures/acap_runtime_control_plane/replay_idempotent.negative.json
      expect:
        require_violations:
        - executor_rerun
        - duplicate_stage_records
        - cache_miss_on_replay
        - promotion_sink_growth
        - scheduler_new_attempts
        - scheduler_due_again
        - import_leak
source_markers:
  control_plane_test:
    path: crates/da-application/tests/acap_control_plane_test.rs
    required_patterns:
    - ControlPlaneEvidenceLedger
    - admission:illegal_transition
    - AlreadyPromoted
    - recovered
    - import_eligible
  admission_domain:
    path: crates/da-domain/src/assurance.rs
    required_patterns:
    - ArticleContextState
    - IllegalTransition
    - error_class
  admission_ledger:
    path: crates/da-domain/src/pipeline_ledger.rs
    required_patterns:
    - PipelineStageLedger
    - StageIdRegistry
    - acap_layer
    - fn acap_layer
    - fn cache_mode
    - cannot declare FailedVisible as acap_layer
  admission_orchestrator:
    path: crates/da-application/src/pipeline.rs
    required_patterns:
    - stage_registry
    - .acap_layer(
    - pipeline_stage_graph_materialize_rerun_over_cached_report
    - ArticleJourneyComposition
    forbidden_patterns:
    - fn acap_state_for_stage
  article_journey:
    path: crates/da-application/tests/article_journey_test.rs
    required_patterns:
    - ArticleJourneyComposition
    - GraphMaterialize
    - cache_hit
    - import_eligible = true
  materialization_stages:
    path: crates/da-application/src/extraction_materialization_stage.rs
    required_patterns:
    - always-run-idempotent
    - import_eligible
    - materializer_only
  load_journey_module:
    path: crates/da-cli/src/load_journey.rs
    required_patterns:
    - run_journey_content
    - ArticleJourneyComposition
    - da_adapters::GrobidParser@load-v1
    - embedding_fingerprint
  load_journey_cli:
    path: crates/da-cli/src/load.rs
    required_patterns:
    - run_content_journey
    - journey_skip_reason
    - da_load_journey_fallback
    - da_load_journey_completed
    - default_value_t = true
  scheduler_ingest_executor:
    path: crates/da-application/src/scheduler_executors.rs
    required_patterns:
      - "IngestSchedulerExecutor"
      - "SchedulerTaskExecutor"
      - "catalog_pdf_not_found"
  scheduler_ingest_producer:
    path: crates/da-cli/src/load.rs
    required_patterns:
      - "add_pending_ingest_to"
      - "scheduler_ingest_enqueue_failed"
  scheduler_reparse_executor:
    path: crates/da-application/src/scheduler_executors.rs
    required_patterns:
      - "ReparseSchedulerExecutor"
      - "SchedulerTaskExecutor"
      - "paper_not_materialized"
  scheduler_reparse_producer:
    path: crates/da-cli/src/load.rs
    required_patterns:
      - "add_pending_reparse_to"
      - "scheduler_reparse_enqueue_failed"
  scheduler_embed_stale_executor:
    path: crates/da-application/src/scheduler_executors.rs
    required_patterns:
      - "EmbedStaleSchedulerExecutor"
      - "replace_vector"
      - "embedding_never_attached"
  scheduler_embed_stale_producer:
    path: crates/da-cli/src/load_journey.rs
    required_patterns:
      - "add_pending_embed_stale_to"
      - "embed_stale_enqueued"
  scheduler_no_graph_write_executor:
    path: crates/da-application/src/scheduler_runner.rs
    required_patterns:
      - "task_type_from_str"
      - "GraphWrite"
    forbidden_patterns:
      - "GraphWriteExecutor"
      - "add_pending_graph_write"
  scheduler_extract_executor:

    path: crates/da-application/src/scheduler_executors.rs
    required_patterns:
    - ExtractSchedulerExecutor
    - SchedulerTaskExecutor
    - parsed_plane_not_materialized
  scheduler_extract_producer:
    path: crates/da-cli/src/load.rs
    required_patterns:
    - add_pending_extract_to
    - scheduler_extract_enqueue_failed
  figure_analysis_grounding:
    path: crates/da-application/src/figure_analysis.rs
    required_patterns:
    - 'context.caption.as_str()'
    - figure-analysis-grounded-v2
    - MAX_OUTPUT_TOKENS_FALLBACK
  entity_embedding_add_or_replace:
    path: crates/da-application/src/extraction.rs
    required_patterns:
    - write_entity_embedding
    - entity_embedding_replaced
    - EntityEmbedWrite
  region_text_grounding:
    path: crates/da-cli/src/load_journey.rs
    required_patterns:
    - ground_section_by_region_text
    - figure_grounded_via_region_text
    - try_region_text_grounding
  pdf_triage_materialized:
    path: crates/da-application/src/ingest.rs
    required_patterns:
    - pdf_pages_needing_ocr
    - pdf_has_encoding_issues
  triage_decision_site:
    path: crates/da-application/src/ingest.rs
    required_patterns:
    - triage_decision
    - decide
  pdf_triage_admission_threshold:
    path: data/ontology/pdf_triage_policy.yaml
    required_patterns:
    - 'max_garbled_page_percent:'
    - 'fail_open:'
  remote_writes_unsupported:
    path: crates/kg-storage/src/graph_mode.rs
    required_patterns:
    - RemoteWritesUnsupported
    - RemoteEndpointMissing
    forbidden_patterns:
    - 'is not configured yet'
  remote_endpoint_alias:
    path: crates/kg-storage/src/remote.rs
    required_patterns:
    - ENV_ENDPOINT_ALIAS
    - DA_GRAPH_ENDPOINT
    - resolve_endpoint_from_map
  remote_query_read_plane:
    path: crates/da-cli/src/main.rs
    required_patterns:
    - open_remote_store_from_env
    - reject_remote_snapshot
    - REMOTE_NODE_COUNT_CYPHER
  ingest_content_embedding_replace:
    path: crates/da-application/src/ingest.rs
    required_patterns:
    - write_node_embedding
    - node_embedding_replaced
  page_text_missingness_stamp:
    path: crates/da-application/src/ingest.rs
    required_patterns:
    - page_text_missingness_from
    - page_text_missingness
  pdf_triage_canary:
    path: crates/da-adapters/examples/pdf_triage_canary.rs
    required_patterns:
    - classify_sync_with_options
    - detect_only
    - TriageModeDiff
    - page_scope_canary_only
  pdf_triage_options_surface:
    path: crates/da-adapters/src/pdf_classifier.rs
    required_patterns:
    - process_pdf_mem_with_options
    - PdfOptions::new
  stub_audit_doc:
    path: doc/STUB-AUDIT.md
    required_patterns:
    - rust-stub-audit.v1
    - honest-deferral
    - fake-fixed
  mcp_search_ci_retry:
    path: crates/da-mcp/src/tools.rs
    required_patterns:
    - toLower
    - retry_cypher
  mcp_real_engine_tests:
    path: crates/da-mcp/src/tools.rs
    required_patterns:
    - SamyamaGraphStore
  audit_field_scanner:
    path: crates/da-cli/src/audit_fields.rs
    required_patterns:
    - extract_set_fields
  audit_both_surfaces:
    path: crates/da-cli/src/main.rs
    required_patterns:
    - src_dirs
    forbidden_patterns:
    - 'for bline in block.lines()'
  pipeline_engine_honest:
    path: crates/kg-pipeline/src/engine.rs
    required_patterns:
    - max_attempts
    - StatusChanged
    - EngineControl
  embedding_write_honest:
    path: crates/da-application/src/embedding_write.rs
    required_patterns:
    - 'GraphResult<NodeEmbedWrite>'
    forbidden_patterns:
    - 'let _ = graph_store'
  figure_candidate_assembly:
    path: crates/da-application/src/figure_candidate_assembly.rs
    required_patterns:
    - locate_figure_section
    - figure_candidate_from_analysis
    - candidate_metadata_sha256
    - import_eligible
  figure_context_cache_identity:
    path: crates/da-application/src/figure_context_stage.rs
    required_patterns:
    - 'artifact_id={artifact_id}'
    - configuration_fingerprint
  figure_quote_policy_window:
    path: crates/da-application/src/figure_analysis_stage.rs
    required_patterns:
    - with_quote_policy
    - figure_quote_measured
    - figure_quote_soft_target_exceeded
  figure_quote_policy_data:
    path: data/ontology/figure_quote_policy.yaml
    required_patterns:
    - 'soft_target_chars:'
    - 'absolute_max_chars:'
  multimodal_prompt_schema_violation:
    path: crates/da-adapters/src/openai_multimodal_prompt.rs
    required_patterns:
    - 'kind={:?}'
    - bounded_instance_preview
  figure_journey_driver:
    path: crates/da-cli/src/load.rs
    required_patterns:
    - da_load_journey_figures_skipped
    - figures_route_unconfigured
  table_extraction_stage:
    path: crates/da-application/src/table_extraction_stage.rs
    required_patterns:
    - IOU_THRESHOLD
    - TableJoinRow
    - detection_absent
    - compare_table_fidelity
    - import_eligible
  equation_extraction_stage:
    path: crates/da-application/src/equation_extraction_stage.rs
    required_patterns:
    - equation_candidate_input_from_extracted
    - EquationExtractionArtifact
    - missingness
    - conversion_skipped
    - equation_candidate_missingness_skipped
    - import_eligible
  candidate_materialization_stage:
    path: crates/da-application/src/candidate_materialization_stage.rs
    required_patterns:
    - EquationCandidateMaterializer
    - not_attempted
    - deferred
    - import_eligible
  revision_materialization_domain:
    path: crates/da-application/src/revision_materialization.rs
    required_patterns:
    - retrieval_eligible
    - import_eligible
    - SourceManifestation
  pipeline_ledger_yaml:
    path: data/ontology/pipeline_stage_contracts.yaml
    required_patterns:
    - 'id: revision_materialization'
    - 'id: extraction_materialization'
    - 'acap_layer: structured'
    - 'acap_layer: evidence_linked'
    - 'acap_layer: parsed'
  scheduler_domain:
    path: crates/da-domain/src/scheduler.rs
    required_patterns:
    - logical_result_vid
    - AttemptOutcome
    - PendingTask
  figure_branch_resolver:
    path: crates/da-cli/src/load_journey.rs
    required_patterns:
    - resolve_figure_branch_from_env
    - FigureBranchSettings
ledger_layers:
  path: data/ontology/pipeline_stage_contracts.yaml
  required:
    acquisition: source_registered
    catalog: source_verified
    parse: parsed
    figure_context: structured
    figure_analysis: extracted
    table_fidelity: evidence_linked
    equation_extraction: embedded
    revision_materialization: structured
    extraction_compute: extracted
    extraction_materialization: evidence_linked
    embedding: embedded
    summary: summarized
    resolution: resolved
    checkpoint: accepted_checkpoint
  forbidden:
  - candidate_materialization
  - readiness
  - cluster
  - assurance
  - query
