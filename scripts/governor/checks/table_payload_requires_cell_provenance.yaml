# Table payload cell provenance contract — PIR-019 closure, M400 S05 T01.
#
# DATA for the Governor `table_payload_requires_cell_provenance` check. The
# contract mirrors the revision-grounded TableCandidate contract implemented
# in `da_domain::table_candidate` (M400 S02, ADR-051): every table payload
# must be TEI-grounded (a real structural TEI table with `tei_table_id` and
# `tei_source_digest` — a visual table with no TEI structure stays in the
# figure plane, never an invented candidate), every materialized cell must
# carry grid provenance (row, column), a deterministic digest, and a
# both-or-neither source span (R087 typed missingness — never guessed),
# disagreements between VLM and TEI must be typed conflict nodes with the
# allowed kinds (never a silent overwrite), and coverage gaps must stay
# counters — never conflict nodes. Authority and import stay hard-locked
# false (D127 / ADR-053).
#
# Semantics:
#   - positive (provenance_complete): every committed TableCandidate fixture
#     must be clean — full TEI grounding, per-cell row/column/digest/span
#     provenance, deterministic cell identities, typed conflict kinds only;
#   - negative (provenance_broken): every record must trigger exactly its
#     labelled violation (no TEI grounding, missing cell provenance, cell
#     without digest, partial cell span, coverage gap mis-typed as conflict,
#     identity mismatch, authority unlock, import unlock), and every
#     violation in `require_violations` must appear in the fixture — a
#     future edit that removes a negative case is flagged;
#   - graph_task_suite: the snapshot-level table fidelity suite must keep the
#     grounded/typed-conflict/gap-counter/D127 task markers.
#
# The committed fixtures are validated by `scripts/tests/test_governor.py`
# (`_check_table_payload_requires_cell_provenance`), and the same invariants
# are pinned by the Rust domain tests in `crates/da-domain/src/table_candidate.rs`
# and `crates/da-domain/src/table_fidelity.rs` plus the materializer test
# `crates/da-application/tests/table_candidate_test.rs` — a broken contract
# cannot silently survive a regenerate. This is DATA — tightening an
# expectation is an edit here (plus updating the committed fixture JSON),
# not a Python change.

schema_version: table-payload-requires-cell-provenance.v1
policy_id: table-payload-requires-cell-provenance
dimension: table_cell_provenance
severity: high
anchor: "PIR-019, ADR-060, ADR-053, R087, D127"

# TableCandidate wire contract (`da_domain::table_candidate::TableCandidate`).
candidate_contract:
  required_fields:
    - vid
    - revision_vid
    - artifact_id
    - image_sha256
    - section_vid
    - tei_table_id
    - tei_source_digest
    - coverage
    - candidate_metadata_sha256
    - authoritative
    - import_eligible
    - schema_version
  # Content-hash lineage fields (revision/section VIDs are lineage, checked
  # via the deterministic identity).
  sha256_fields:
    - image_sha256
    - source_pdf_sha256
    - tei_source_digest
    - candidate_metadata_sha256
  # TEI grounding is mandatory (R087): no structural TEI table, no candidate.
  tei_grounding_required: true
  # D127 / ADR-053 — candidate evidence is never graph truth or importable.
  authority_locked: true
  import_locked: true

# Materialized structural cell node contract
# (`da_domain::table_candidate::TableCellCandidate`).
cell_contract:
  required_fields:
    - vid
    - candidate_vid
    - row
    - column
    - colspan
    - rowspan
    - text
    - digest
    - authoritative
    - import_eligible
    - schema_version
  # Every cell carries a deterministic source digest (R087).
  digest_required: true
  # Source span is both-or-neither (typed missingness, never guessed).
  span_both_or_neither: true
  authority_locked: true
  import_locked: true

# Typed visual-versus-TEI disagreement evidence
# (`da_domain::table_candidate::TableConflictEvidence`).
conflict_contract:
  # Only real disagreements become conflict nodes; coverage gaps are
  # counters on the candidate (R087 no-invention / no-overwrite rules).
  allowed_kinds:
    - header_mismatch
    - numeric_mismatch
    - source_disagreement
  gap_kinds_forbidden:
    - missing_tei_cell
    - missing_visual_cell
  authority_locked: true
  import_locked: true

fixtures:
  positive:
    id: provenance_complete
    path: governor/fixtures/table_provenance_contract/provenance_complete.positive.json
    expect: clean
  negative:
    id: provenance_broken
    path: governor/fixtures/table_provenance_contract/provenance_broken.negative.json
    expect:
      require_violations:
        - no_tei_grounding
        - missing_cell_provenance
        - cell_without_digest
        - cell_partial_span
        - coverage_gap_as_conflict
        - identity_mismatch
        - authority_unlock
        - import_unlock

# Enforcement points that must keep existing on the Rust side.
source_markers:
  domain:
    path: crates/da-domain/src/table_candidate.rs
    required_patterns:
      - table_candidate_vid
      - table_cell_vid
      - AuthorityViolation
      - IdentityMismatch
  fidelity:
    path: crates/da-domain/src/table_fidelity.rs
    required_patterns:
      - TableCellCoverage
      - TableFidelityFinding
      - NoTeiTable

# Same contract expressed against a durable snapshot (ADR-051 Contour 6).
graph_task_suite:
  id: table_cell_fidelity
  path: data/graph_tasks/table_cell_fidelity.tasks.cypher
  required_patterns:
    - grounded_cells
    - typed_conflicts
    - gap_conflict_nodes
    - unlocked_conflicts
