planes:
  dependency_boundary:
    required_evidence: [source_path, source_sha256, forbidden_dependencies]
    forbidden_dependencies: [da-application->da-adapters, kg-*->da-*]
  persistence_authority:
    required_evidence: [source_path, source_sha256, authoritative_store, rvf_role]
    authoritative_store: samyama
    rvf_role: candidate_evidence_only
  configuration_ownership:
    required_evidence: [source_path, source_sha256, owner, physical_defaults]
    owner: data_and_typed_config
    physical_defaults: forbidden
  cache_identity:
    required_evidence: [source_path, source_sha256, raw_stage_identity, projector_stage_identity, profile_fingerprint, collision_policy]
    collision_policy: forbidden
    required_identity_components: [paper_id, pdf_sha256, raw_payload_sha256, projector_schema_fingerprint, profile_fingerprint]
  promotion_quarantine:
    required_evidence: [source_path, source_sha256, promotion_state, auto_promote, deployed, promotion_receipt, production_route, graph_write, import_eligible]
    promotion_state: candidate
    auto_promote: forbidden
    deployed: false
    promotion_receipt: forbidden
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
    # GAR-012: this quarantine establishes containment only. It carries no
    # relevance, quality or admissibility claim; those route through the
    # boundary contract below (isolation_only + semantic_boundary).
    isolation_only: true
    semantic_boundary: scripts/governor/checks/quarantine_semantic_boundary.yaml
