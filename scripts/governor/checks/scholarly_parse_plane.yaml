release_probe_lane:
  # M511/S08/T05: the frozen external release-probe lane is held in DATA so its
  # three failure modes stay distinct named flags — an absent or unmapped lane
  # (`release_probe_lane_missing`), a counter or identity that no longer
  # reproduces from the frozen inputs (`release_probe_denominator`, with the
  # expected and observed number), and a citation or authorization state that
  # unlocks while the human release review is still pending
  # (`release_probe_citation_state`, with the exact key). Counters are
  # recomputed from the frozen holdout manifest and the on-disk reference bytes,
  # never trusted from the artifact's own declaration.
  artifact_identity: external-holdout-release-probe.v1
  manifest: data/parse/acceptance_manifest.yaml
  lane_ref: external_holdout_contract.release_probe
  holdout_manifest: data/parse/holdout_manifests.yaml
  # M512/S02/T06: the frozen population is partitioned into the measurable
  # subset (`reference_tei`) and typed exceptions (`reference_exceptions`), both
  # declared as DATA on the lane. The check consumes the partition instead of
  # assuming every frozen document is measurable: frozen counters bind to the
  # full population, measurable counters bind to the subset, and every exception
  # is verified for identity, byte pins and a reason drawn from the closed
  # vocabulary at `reference_exception_reasons`. A count the partition cannot
  # reproduce is `release_probe_denominator` at the exact path, and an exception
  # missing its pins or reason is named too — the exception list is never read
  # as a measured zero and never silently skipped.
  population_partition:
    measurable_ref: reference_tei
    exceptions_ref: reference_exceptions
    exception_reasons_ref: reference_exception_reasons
    frozen_counters:
    - reference_population.documents
    - production_catalog_overlap.documents
    measurable_counters:
    - evaluated_population.documents
    - evaluated_population.aggregate.documents
    - executed_population.documents
  # The release decision stays with a real human: every citation guard stays
  # closed until that decision is recorded.
  expected_values:
    release_decision_package.human_release_review.decision: pending
    external_holdout_contract.citation_rule.requires_executed_state: true
    external_holdout_contract.citation_rule.requires_recorded_human_release_decision: true
    external_holdout_contract.citation_rule.citation_without_release_decision: forbidden
    external_holdout_contract.citation_rule.citation_of_unexecuted_external_rows: forbidden
    external_holdout_contract.citation_rule.unexecuted_external_rows_are_evidence: false
    external_holdout_contract.citation_rule.bytes_absent_rows_are_evidence: false
    external_holdout_contract.release_probe.citation_requires_recorded_human_release_decision: true
    external_holdout_contract.release_probe.citation_without_release_decision: forbidden
  # GAR-015 authorizations stay blocked until a recorded human release decision.
  blocked_authorizations:
    redistribution: blocked
    production_use: blocked
    model_distribution: blocked
    external_downloads: blocked
    graph_write_or_import: blocked
  # The artifact's own external band and locks are part of the frozen identity.
  artifact_expectations:
    external_holdout_band.execution_status: not_executed
    external_holdout_band.external_bytes: bytes_absent
    external_holdout_band.citation_without_release_decision: forbidden
    external_holdout_band.external_rows_are_evidence: false
    policy_locks.import_eligible: false
    policy_locks.graph_write: forbidden
    policy_locks.auto_promote: forbidden
    policy_locks.production_route: forbidden
    policy_locks.deployed: false
locks:
