# S19/T01 binding DATA contract for the staged native scholarly parse plane.
# This is deliberately narrower than the parse API ledger and promotion FSM:
# it binds shipped source/data/artifact identities and fail-closed locks.
schema_version: scholarly-parse-plane.v1
policy_id: scholarly_parse_plane
dimension: scholarly_parse_plane
severity: high
anchor: "ADR-075, ADR-076, D127, D204, D321, R091, R111, R112, R113, R115, R116, R117, R118, R119, R120, R121, R124"
closed_taxonomy:
  dispositions: [passed, fallback, rejected, unsupported, not_observed, invalid_evidence, stale]
  violations:
    - forbidden_dependency
    - authoritative_redb
    - memory_only_rvf
    - hardcoded_physical_default
    - cache_fingerprint_collision
    - missing_rollback
    - auto_promote
    - deployed
    - promotion_receipt
    - production_route
    - graph_write
    - import_leak
    - schema_vocabulary_drift
    - missing_integration_evidence
    - acceptance_evidence_missing
    - acceptance_evidence_substitution
    - acceptance_role_drift
    - acceptance_same_n_drift
    - acceptance_lock_erosion
    - ledger_surface
    - backend_identity
    - policy_stamp
    - silent_loss
    - lexical_visual_mix
    - region_coverage
    - header_sequence
    - invented_author
    - bibliography_sequence
    - lost_references
    - body_java_fallback
    - reading_order_change
    - typed_visual_absence
    - zero_count_from_absence
    - family_promote_cap
    - worker_identity_leak
planes:
  dependency_boundary:
    required_evidence: [source_path, source_sha256, forbidden_dependencies]
    forbidden_dependencies: [da-application->da-adapters, kg-*->da-*]
  persistence_authority:
    required_evidence: [source_path, source_sha256, authoritative_store, rvf_role]
    authoritative_store: samyama
    rvf_role: candidate_evidence_only
  configuration_ownership:
    required_evidence: [source_path, source_sha256, owner, physical_defaults]
    owner: data_and_typed_config
    physical_defaults: forbidden
  cache_identity:
    required_evidence: [source_path, source_sha256, raw_stage_identity, projector_stage_identity, profile_fingerprint, collision_policy]
    collision_policy: forbidden
    required_identity_components: [paper_id, pdf_sha256, raw_payload_sha256, projector_schema_fingerprint, profile_fingerprint]
  promotion_quarantine:
    required_evidence: [source_path, source_sha256, promotion_state, auto_promote, deployed, promotion_receipt, production_route, graph_write, import_eligible]
    promotion_state: candidate
    auto_promote: forbidden
    deployed: false
    promotion_receipt: forbidden
    production_route: forbidden
    graph_write: forbidden
    import_eligible: false
bindings:
  source_data:
    - path: data/parse/native_fulltext_composition.yaml
      sha256: ede993d4da29d5be88baaf1db9c4c90e5d1dc9a7eaa6869b78b1669e357c025b
    - path: data/parse/comparison_contract.yaml
      sha256: 6a65786e458db789a0e6a068deffcdbc00349363250f9686f53f78442f038c27
    - path: data/parse/api_compatibility_ledger.yaml
      sha256: 7ea0eb7c9e8520268d69948d10291a800c8bdae4f825a51a95130739dc70e05b
    - path: data/parse/acceptance_manifest.yaml
      sha256: 9c85b1d3bcec35614d15f7170a1e3f121beca0ce69e64105cb0698e474fa512e
    - path: data/parse/grobid_compatibility.yaml
      sha256: f34bbdb977f0bf53210fafff5572d0f0b77a7f3dfa86b8f94888b8bd4b8d307e
    - path: data/parse/native_visual_heads.yaml
      sha256: 49c9013ddb36943a74be38289b1bb0d03d5c43ffcf68003adb11d474c3388874
    - path: data/parse/document_segmentation.yaml
      sha256: dfcbcdb7da37923536fcf8fad1a6eef5339c0727860dd619b4df96422f2bdf3d
    - path: data/policies/registry.yaml
      sha256: 0cbf380907a9ed71e5b8cf8f9610ada0fec7273fb3c2fb489512425bb0841b55
  canonical_artifacts:
    - path: artifacts/parse_compat/native_fulltext_composition_shadow.json
      sha256: 385ac5a018ffb13b8f988d4bda359a9fe0543cffe6e170ec2b43a006e5917dd1
    - path: artifacts/parse_compat/acceptance_evidence.json
      sha256: 8af0cefea0085963e0288d8fbd6ff2814ce1dfb2aa8f2b5a27559092fe559896
  shared_promotion_contract: scripts/governor/checks/promotion_evidence_contract.yaml
  rollback_target: java-grobid-http@0.9.0-crf
  integration_evidence:
    - path: data/parse/comparison_contract.yaml
      identity: parse-comparison.v1
    - path: data/parse/acceptance_manifest.yaml
      identity: parse-acceptance.v1
    - path: artifacts/parse_compat/native_fulltext_composition_shadow.json
      identity: native-fulltext-composition-shadow.v1
    - path: artifacts/parse_compat/acceptance_evidence.json
      identity: parse-acceptance-evidence.v1
locks:
  import_eligible: false
  production_route: forbidden
  graph_write: forbidden
  auto_promote: forbidden
  deployed: false
  promotion_receipt: forbidden
  raw_payload: forbidden
  physical_path: forbidden
redaction:
  forbidden: [raw_tei, pdf_bytes, body_text, text, hostname, physical_path, secret]
fixtures:
  positive:
    path: governor/fixtures/scholarly_parse_plane/contract.positive.json
    expect: clean
  negative:
    path: governor/fixtures/scholarly_parse_plane/violations.negative.json
    expect:
      require_violations: [forbidden_dependency, authoritative_redb, memory_only_rvf, hardcoded_physical_default, cache_fingerprint_collision, missing_rollback, auto_promote, deployed, promotion_receipt, production_route, graph_write, import_leak, schema_vocabulary_drift, missing_integration_evidence, acceptance_evidence_missing, acceptance_evidence_substitution, acceptance_role_drift, acceptance_same_n_drift, acceptance_lock_erosion, ledger_surface, backend_identity, policy_stamp, silent_loss, lexical_visual_mix, region_coverage, header_sequence, invented_author, bibliography_sequence, lost_references, body_java_fallback, reading_order_change, typed_visual_absence, zero_count_from_absence, family_promote_cap, worker_identity_leak]
      each_label_isolated: true
      severity: high
      no_promotion: true
