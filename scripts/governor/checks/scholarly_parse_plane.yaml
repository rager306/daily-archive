    - {id: rest.processHeaderDocument, method: POST, route: /api/processHeaderDocument, request: header-v1, result: header=v1}
    - {id: rest.processReferences, method: POST, route: /api/processReferences, request: references-v1, result: references=v1}
  local_batch:
    route: local-parse-batch
    carrier: da-cli::parse_batch
    not_endpoint: true
  policy:
    rollback_target: java-grobid-http@0.9.0-crf
    structural_parse_independent_of_enrichment: true
    decision_point: 6
    independently_selectable: [header, references]
    import_eligible: false
    graph_write: forbidden
    auto_promote: forbidden
    production_route: forbidden
  scan:
    roots: [crates/da-cli/src, crates/da-ports/src, crates/da-application/src, crates/da-adapters/src, crates/da-parse/src]
    forbidden_tokens: [processFulltextAssetDocument, processFulltextDocumentHTML, annotatePDF, createTraining, trainTagger, batchProcessAssets, batchTraining]
