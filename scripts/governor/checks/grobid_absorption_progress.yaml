# Absorption progress scorecard contract — Governor check DATA (M514-1lss2s/S01/T04).
#
# DATA for the Governor `absorption_progress` check. The closed vocabulary stays
# owned by the T01 schema `data/parse/absorption_progress.schema.yaml`; this file
# adds only the rule configuration the domain deliberately does not carry, plus
# the positive/negative fixtures and the enforcement markers.
#
# Why it exists (M513 closeout): the recorded progress surface mixed preservation
# with extraction, published ratios over shrunken denominators, inferred
# independence from display labels, and read a terminal GSD state as delivered
# capability. T01 made each of those a typed violation inside one scorecard. T04
# makes the *measurement system* executable: a scalar must still be bound to the
# bytes that produced it, two rows may only be compared inside one accepted
# series, a resource saving must name its paired CPU measurement, and a scorecard
# may not shrink the pinned census or drop an axis the census already measured.
#
# Boundary (stated, not implied — E3, carried from M509/S02 Q3 R2): this is a
# consistency and fail-closed contract over what a scorecard declares about
# itself plus a recomputed content hash. It is NOT a tamper-evident attestation:
# an actor able to rewrite the scorecard, the evidence artifact and this DATA
# rule can satisfy it. Its value is that absence, drift, scope mixing and
# self-contradiction stop passing as compliance, and that a coverage number must
# name the artifact that produced it.
#
# Severity (E2): the check is deliberately NOT registered in
# `scripts/governor/checks/assurance_severity.yaml`. A false-progress scorecard is
# drift-visible (`drift_risk`), not `blocked`, so it cannot be silently promoted
# to a hard block — nor silently suppressed — by editing one severity file.
#
# Census (S02/T03): the scorecard must publish the derived per-document
# disposition projection of the 610 assigned documents, bound to the two frozen
# sources (the holdout manifest and the release probe). The reader recomputes the
# projection and its digest from those sources, and the oracle refuses a declared
# projection that is not the derived one (`census_projection_mismatch`), a dropped
# document (`census_document_dropped`), a reason outside the closed exclusion
# vocabulary (`census_disposition_untyped`) and a refusal boundary that is not the
# explicitly enumerated derived set (`refused_set_unbound`). Without this half the
# aggregate counts 610/531/79 could stay correct while the population they
# describe was silently re-cut.
#
# Thresholds (E1): S02 fixed the thresholds (`threshold_policy.state: frozen`) as a
# prospective regression floor over the frozen corpus (S01 already measured it) and
# bound them to the schema revision. Every regression here is still a state or
# ordering comparison, but the frozen contract adds the numeric noninferiority
# floor, and an edit to the schema after the freeze is a finding
# (`threshold_freeze_revision_mismatch`), not a silent re-tune. The floor is derived
# from a separately pinned reference artifact (`threshold_policy.reference_pins`),
# never from the candidate scorecard, and a threshold that points back at the
# candidate is refused by the domain
# (`threshold_reference_not_independently_pinned`).
#
# Scorecard availability: `scorecard.required: true` since S02/T02, because the
# governed baseline artifact is committed. Absence is no longer silent: a deleted
# or unreadable baseline is a finding, and the freeze cannot be dropped by deleting
# the artifact that declares it.

schema_version: grobid-absorption-progress.v1
policy_id: absorption_progress
# A new dimension on purpose: it is not in dimensions.yaml and not in
# assurance_severity.yaml, so findings are drift-visible and never blocking.
dimension: absorption_progress
severity: high
anchor: "R133, R141, ADR-075, D127, D491, ADR-051"

# The closed vocabulary is the T01 schema, reused rather than restated.
scorecard_contract:
  schema: data/parse/absorption_progress.schema.yaml

# The governed scorecard. T05 committed the source-bound baseline at this path;
# S02/T02 flipped `required` to true now that the artifact exists, so deleting it
# is a finding rather than silence.
scorecard:
  path: artifacts/parse_compat/absorption_progress_baseline.json
  required: true

# The accepted series. `source_revision` is deliberately absent: it moves every
# run and must match between a row and its own evidence (the domain validator
# enforces that), while corpus, profile and oracle are what make two scorecards
# comparable at all.
comparability_rules:
  accepted:
    corpus_id: m513-holdout-610
    profile: structural
  oracle_pin: external_holdout_probe_semantics

# Regression direction against the pinned census (`denominator.initial_census` in
# the T01 schema). Expected states are a floor only where the census already
# measured an axis: an axis moving from not_measured to measured is progress.
regression:
  expected_axis_states:
    preservation: measured
    extraction: measured

# A savings claim is a product measurement only when it is paired with the CPU
# measurement of the same workload. A wall-clock-only saving is the shape this
# refuses.
resources_claim:
  axis: resources
  savings_flag: savings_claimed
  paired_cpu_field: paired_cpu_metric_id
  kind_field: kind
  cpu_kind: cpu

# Closed vocabulary of the adapter-level labels the oracle can emit on top of the
# T01 domain labels. A label outside this set (and outside the domain
# vocabulary) is an implementation bug, not a finding.
violations:
  - evidence_path_not_relative
  - evidence_artifact_missing
  - evidence_hash_substituted
  - oracle_changed
  - scope_not_accepted
  - scope_mixed_in_scorecard
  - savings_without_paired_cpu
  - savings_paired_cpu_not_measured
  - coverage_regression
  - denominator_shrink
  - threshold_freeze_revision_mismatch
  - threshold_reference_unbound
  - census_projection_mismatch
  - census_document_dropped
  - census_disposition_untyped
  - refused_set_unbound

fixtures:
  positive:
    id: scorecard_clean
    path: governor/fixtures/absorption_progress/scorecard_clean.positive.json
    expect: clean
  negative:
    id: scorecard_broken
    path: governor/fixtures/absorption_progress/scorecard_broken.negative.json
    expect:
      require_violations:
        - evidence_path_not_relative
        - evidence_artifact_missing
        - evidence_hash_substituted
        - oracle_changed
        - scope_not_accepted
        - scope_mixed_in_scorecard
        - savings_without_paired_cpu
        - savings_paired_cpu_not_measured
        - coverage_regression
        - denominator_shrink
        - threshold_freeze_revision_mismatch
        - threshold_reference_unbound
        - census_projection_mismatch
        - census_document_dropped
        - census_disposition_untyped
        - refused_set_unbound
        # T01 domain labels exercised through the same composed oracle, so a
        # regression that disconnects the domain half is flagged too.
        - evidence_revision_mismatch
        - census_mismatch
        - unnamed_exclusions
        - skipped_as_delivered
        - assigned_ne_total
        - threshold_missing_for_required_metric

# ── Java-free vertical slice (M514/S03/T06) ─────────────────────────────────
# The slice claim is NOT this rule: it is `java_free_vertical_slice` in
# `data/parse/layout_bakeoff.yaml`, which ADR-077 §3 makes the sole authority of
# the boundary. This DATA block is the rule that reads that authority — it names
# where the claim lives, where the receipt evidencing it lives, the states the
# receipt must carry, the closed stage-disposition vocabulary and the closed set
# of adapter labels. Neither the stage ids nor the document identities are
# restated: both are followed by pointer, so the rule cannot drift from the thing
# it governs.
#
# Why it exists: the product `java_independence` axis legitimately reports
# `not_measured` while the production route is Java (D499), so a scoped,
# diagnostic Java-free receipt is exactly the progress the Governor could not see.
# What must not pass silently is a *claim* without that evidence, an untyped or
# counted stage where the boundary says "outside the slice", an observed zero with
# no guard provenance, a receipt bound to different bytes, or a diagnostic slice
# re-labelled as product coverage (R141).
#
# Severity: this block does not register a dimension or a severity — it rides the
# `absorption_progress` check, which is deliberately absent from
# `assurance_severity.yaml`, so a finding stays drift-visible and never blocks.
java_free_slice:
  schema_version: java-free-slice-rule.v1
  declaration:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: java_free_vertical_slice
  receipt:
    path: artifacts/parse_compat/java_free_vertical_slice.json
    schema_version: java-free-vertical-slice-receipt.v1
    required: true
  stage_id_source:
    manifest: data/parse/grobid_compatibility.yaml
    pointer: defaults.cascade_stages
  corpus:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: corpus.documents
  expected:
    claim_scope: diagnostic_only
    product_coverage_effect: none
    guard_observer: java_transport_fetch_tei
    guard_installed: true
    guard_identity_isolated: true
    observed_java_calls: 0
  stage_dispositions:
    in_slice: observed
    out_of_slice: out_of_slice
    identity_admission: not_observed
  # The closed vocabulary of adapter labels this half may emit. Kept separate from
  # the scorecard `violations` list above so the T01/T04 exact-set test stays valid
  # and the two halves stay separately governable. The literal set lives in
  # `scripts/governor/domain/absorption_progress.py`; the two must match exactly.
  violations:
    - java_free_slice_claim_without_receipt
    - java_free_slice_receipt_slice_mismatch
    - java_free_slice_unmeasured_stage
    - java_free_slice_guard_not_installed
    - java_free_slice_product_coverage_claimed
    - java_free_slice_stage_outside_slice_counted
    - java_free_slice_receipt_stale
    - java_free_slice_java_calls_nonzero
  fixtures:
    positive:
      id: java_free_slice_clean
      path: governor/fixtures/absorption_progress/java_free_slice.positive.json
      expect: clean
    negative:
      id: java_free_slice_broken
      path: governor/fixtures/absorption_progress/java_free_slice.negative.json
      expect:
        require_violations:
          - java_free_slice_claim_without_receipt
          - java_free_slice_receipt_slice_mismatch
          - java_free_slice_unmeasured_stage
          - java_free_slice_guard_not_installed
          - java_free_slice_product_coverage_claimed
          - java_free_slice_stage_outside_slice_counted
          - java_free_slice_receipt_stale
          - java_free_slice_java_calls_nonzero

# ── Native family receipts (M514/S04/T06) ────────────────────────────────
# The S04 native family receipts are the first source-bound evidence that the
# real native parsers — not the TEI-derived copies of the Java carrier — produced
# header and bibliography atoms on the declared 3-document slice, and that the 79
# typed baseline exclusions keep their denominator. They are *not* this rule: the
# rule names where each receipt lives, where each frozen carrier lives and what a
# receipt must declare. Neither the family identities nor the document identities
# are restated: the corpus pin resolves by pointer from `corpus.documents` in
# `data/parse/layout_bakeoff.yaml`, the denominator resolves from the frozen
# baseline, and the oracle pins resolve from the preserved-TEI provenance.
#
# Why it exists (R141): the product `java_independence` axis reports
# `not_measured` while the production route is Java (D499), so a scoped,
# diagnostic native-family receipt is exactly the progress the Governor could not
# see — and also exactly the claim that must not pass on the strength of an
# artifact's mere existence. A claim with no receipt, a receipt bound to older
# bytes or another population, an observed zero with no guard provenance, a
# self-scoring oracle, a diagnostic slice re-labelled as product coverage, a
# claimed threshold and a shrunken 79-exclusion denominator are each a typed,
# fail-closed violation.
#
# Severity: this block registers no dimension and no severity — it rides the
# `absorption_progress` check, which is deliberately absent from
# `assurance_severity.yaml`, so a finding stays drift-visible and never blocks
# (D492).
native_family_receipt:
  schema_version: native-family-receipt-rule.v1
  declaration:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: java_free_vertical_slice
  receipts:
    parity:
      path: artifacts/parse_compat/native_family_parity.json
      schema_version: native-family-parity-receipt.v1
      receipt_kind: parity_three_document_slice
      required: true
    exclusion:
      path: artifacts/parse_compat/native_exclusion_recovery.json
      schema_version: native-exclusion-recovery.v1
      receipt_kind: exclusion_recovery_baseline
      required: true
  # The frozen carriers a receipt pin must still match. The reader recomputes each
  # byte hash; the oracle compares the receipt's declared pin against the
  # recomputed one, so an edit to a carrier the receipt was derived from is
  # staleness rather than a silent re-pin.
  carriers:
    - id: layout_bakeoff
      path: data/parse/layout_bakeoff.yaml
      pointer: corpus.documents
      kind: corpus
    - id: absorption_progress_baseline
      path: artifacts/parse_compat/absorption_progress_baseline.json
      pointer: denominator
      kind: denominator
    - id: preserved_tei_provenance
      path: crates/da-parse/tests/fixtures/preserved/provenance.yaml
      pointer: fixtures
      kind: oracle_pins
    - id: holdout_manifests
      path: data/parse/holdout_manifests.yaml
      pointer: articles
      kind: exclusion_population
    - id: external_holdout_release_probe
      path: artifacts/parse_compat/external_holdout_release_probe.json
      pointer: reference_population
      kind: exclusion_probe
  populations:
    parity:
      population_kind: corpus
      document_count: 3
      page_denominator: 202
      family_dispositions: [observed, typed_absence, refused, out_of_scope]
    exclusion:
      population_kind: exclusion
      assigned: 610
      excluded: 79
      measurable: 531
      targeted: 79
      reason_counts:
        header_date_absent: 72
        header_title_absent: 5
        header_author_absent: 2
      recovery_dispositions: [recovered, not_recovered, out_of_scope, typed_refusal]
  expected:
    claim_scope: diagnostic_only
    product_coverage_effect: none
    thresholds: not_accepted
    guard_observer: java_transport_fetch_tei
    oracle_independent: true
    same_generator_refused: true
  # The closed vocabulary of adapter labels this half may emit. Kept separate from
  # the scorecard `violations` list above so the exact-set test stays valid and the
  # halves stay separately governable. The literal set lives in
  # `scripts/governor/domain/absorption_progress.py`.
  violations:
    - native_family_claim_without_receipt
    - native_family_receipt_population_mismatch
    - native_family_receipt_stale
    - native_family_product_coverage_claimed
    - native_family_java_calls_nonzero
    - native_family_guard_not_installed
    - native_family_oracle_not_independent
    - native_family_threshold_claimed
    - native_family_exclusion_denominator_dropped
  fixtures:
    positive:
      id: native_family_clean
      path: governor/fixtures/absorption_progress/native_family.positive.json
      expect: clean
    negative:
      id: native_family_broken
      path: governor/fixtures/absorption_progress/native_family.negative.json
      expect:
        require_violations:
          - native_family_claim_without_receipt
          - native_family_receipt_population_mismatch
          - native_family_receipt_stale
          - native_family_product_coverage_claimed
          - native_family_java_calls_nonzero
          - native_family_guard_not_installed
          - native_family_oracle_not_independent
          - native_family_threshold_claimed
          - native_family_exclusion_denominator_dropped

# ── Native content receipt (M514/S05/T07) ─────────────────────────────
# The S05 receipt is the first source-bound evidence that the native body /
# section / reading-order / visual / callout bands measured the declared
# 3-document slice against an *independent* oracle, with an explicit group
# partition, a per-document typed family matrix and the T01 body-character axis.
# It is *not* this rule: the rule names where the receipt lives, where the
# declaration authority and the oracle pins live, and what a receipt must
# declare. Neither the document identities nor the corpus page denominator are
# restated as evidence — the corpus pin resolves by pointer from
# `corpus.documents` in `data/parse/layout_bakeoff.yaml`, and the preserved-TEI
# fixture pins resolve from `crates/da-parse/tests/fixtures/preserved/provenance.yaml`.
#
# Why it exists (R141): the product `java_independence` axis reports
# `not_measured` while the production route is Java (D499), so a scoped,
# diagnostic content receipt is exactly the progress the Governor could not see —
# and also exactly the claim that must not pass on the strength of an artifact's
# mere existence. A claim with no receipt, a receipt whose population or group
# partition the frozen carriers do not derive, a receipt bound to older bytes, an
# observed zero with no guard provenance, an oracle that is not independent or
# carries only absences, a diagnostic slice re-labelled as product coverage (or
# publishing a threshold / leaking a redaction flag), a required family silently
# moved to `out_of_scope`, an untyped group partition and a body gap whose D498
# obligation is unresolved are each a typed, fail-closed violation.
#
# Severity: this block registers no dimension and no severity — it rides the
# `absorption_progress` check, which is deliberately absent from
# `assurance_severity.yaml`, so a finding stays drift-visible and never blocks
# (D492).
native_content_receipt:
  schema_version: native-content-receipt-rule.v1
  declaration:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: java_free_vertical_slice
  receipt:
    path: artifacts/parse_compat/native_content_receipt.json
    schema_version: native-content-receipt.v1
    required: true
  # The corpus pin resolves by pointer; the count and the page denominator are the
  # declared requirements the receipt must reproduce (3 documents / 202 pages).
  corpus:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: corpus.documents
  # The oracle carrier and the reviewed segmentation oracle. The rule never
  # restates a fixture identity: the preserved-TEI pins resolve from the carrier
  # and the reader recomputes every sha256 from the committed bytes.
  oracle:
    manifest: crates/da-parse/tests/fixtures/preserved/provenance.yaml
    pointer: fixtures
    segmentation_manifest: data/parse/document_segmentation.yaml
    segmentation_source: artifacts/parse_compat/document_segmentation_oracle_source.json
  populations:
    document_count: 3
    page_denominator: 202
  expected:
    claim_scope: diagnostic_only
    product_coverage_effect: none
    thresholds: not_accepted
    guard_observer: java_transport_fetch_tei
    families: [figure, table, formula, callout_marker, body_section, body_reading_order]
    required_families: [figure, table, formula, callout_marker]
    family_dispositions: [measured, unmet, not_observed]
    unmet_reasons: [no_text_layer, native_lane_unsupported, oracle_absent, oracle_vacuous]
    forbidden_family_token: out_of_scope
    body_verdicts: [granularity_only, content_loss, not_assessable]
    body_reasons:
      - matched
      - p1_native_text_absent
      - p1_localization_uncertain
      - p2_region_assignment_gap
      - p2_localization_uncertain
      - scope_mismatch
      - scope_join_mismatch
      - normalization_mismatch
      - oracle_empty
      - population_incomplete
    group_vocabulary: [digital_text, scanned_image, mixed, unknown]
    group_source_vocabulary: [measured, bytes_absent]
    partition_states: [partitioned, empty_declared_corpus]
    bytes_absent_reasons: [pdf_bytes_missing, pdf_read_failed, classifier_unavailable]
  # The closed vocabulary of adapter labels this half may emit. Kept separate from
  # the scorecard `violations` list above so the exact-set test stays valid and the
  # halves stay separately governable. The literal set lives in
  # `scripts/governor/domain/absorption_progress.py`.
  violations:
    - native_content_claim_without_receipt
    - native_content_receipt_population_mismatch
    - native_content_receipt_stale
    - native_content_product_coverage_claimed
    - native_content_java_calls_nonzero
    - native_content_guard_not_installed
    - native_content_oracle_not_independent
    - native_content_oracle_absence_only
    - native_content_required_family_out_of_scope
    - native_content_group_partition_untyped
    - native_content_body_gap_unresolved
  fixtures:
    positive:
      id: native_content_clean
      path: governor/fixtures/absorption_progress/native_content.positive.json
      expect: clean
    negative:
      id: native_content_broken
      path: governor/fixtures/absorption_progress/native_content.negative.json
      expect:
        require_violations:
          - native_content_claim_without_receipt
          - native_content_receipt_population_mismatch
          - native_content_receipt_stale
          - native_content_product_coverage_claimed
          - native_content_java_calls_nonzero
          - native_content_guard_not_installed
          - native_content_oracle_not_independent
          - native_content_oracle_absence_only
          - native_content_required_family_out_of_scope
          - native_content_group_partition_untyped
          - native_content_body_gap_unresolved

# ── Native route E2E boundary, endpoints/consolidation scope and limit freeze
#    (M514/S06/T02) ─────────────────────────────────────────────────────────
# The S06 native route is the first PDF->native path that ends in one typed
# document result on the frozen 3-document slice with no Java and no prior TEI.
# This block *declares the boundary of that route, the scholarly endpoints it
# must stay compatible with, the consolidation scope it runs and the operational
# ceilings it will be measured against* — BEFORE the benchmark runs (D509).
#
# It is NOT the boundary itself: `data/parse/layout_bakeoff.yaml#java_free_vertical_slice`
# stays the sole source of the slice (ADR-077 §3) and
# `data/parse/grobid_compatibility.yaml#defaults.cascade_stages` the sole source
# of the stage ids. Neither the stage ids, the document ids nor the endpoint
# URLs are restated here: every one is followed by pointer, so the rule cannot
# drift from the thing it governs (D377/D506 also forbid a new `data/parse/*`
# carrier, so this lives in the S04/S05 sibling home).
#
# Why it exists: today the slice boundary is pinned by S03/S04/S05 receipts, the
# consolidation scope lives implicitly in `crates/da-parse/src/profile.rs`, and
# `batch_budget_ceilings` (data/parse/comparison_contract.yaml) is not applied to
# the native route at all. Without this block nothing tells S06 which endpoints
# are required, whether structural consolidation is the scope, or what the
# freeze is — so a benchmark could score before any limit exists and a later
# receipt could tune its own ceiling after seeing the numbers. The freeze is
# prospective and diagnostic (`freeze_scope: prospective_diagnostic_ceiling`):
# it declares the metric vocabulary and the invariants, it measures nothing.
#
# The receipt-claim half is added by T07: the two S06 receipts exist
# (`native_route_e2e.json` from T03, `native_resource_same_n.json` from T06), so
# the block now names where they live, the envelope a receipt must carry and the
# closed vocabulary the oracle refuses by name. Nothing about the receipts'
# contents is restated: the schema versions, the declaration pointer, the corpus
# pin, the stage boundary and the frozen limit dictionary all resolve by pointer,
# and the reader recomputes every `sha256` from the committed bytes.
#
# Severity: this block registers no dimension and no severity — it rides the
# `absorption_progress` check, which is deliberately absent from
# `assurance_severity.yaml`, so a finding stays drift-visible and never blocks
# (D492).
native_route_e2e:
  schema_version: native-route-e2e-rule.v1
  # Boundary binding by pointer (sole source: the S03 declaration block).
  declaration:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: java_free_vertical_slice
  stage_id_source:
    manifest: data/parse/grobid_compatibility.yaml
    pointer: defaults.cascade_stages
  # Required / not-required / deferred scholarly endpoints. Each entry names the
  # existing declaration by pointer and its own reason; the URL is never copied.
  scholarly_endpoints:
    state_vocabulary: [required, not_required, deferred]
    declarations:
      - endpoint_id: parse.endpoint.process_fulltext_document
        state: required
        reason: native_route_reproduces_the_fulltext_request_dialect_and_structural_consolidation_scope
        manifest: data/parse/api_compatibility_ledger.yaml
        pointer: entries[id=parse.endpoint.process_fulltext_document]
      - endpoint_id: parse.endpoint.process_header_document
        state: deferred
        reason: header_band_compares_against_preserved_fulltext_tei_not_the_header_proxy
        manifest: data/parse/api_compatibility_ledger.yaml
        pointer: entries[id=parse.endpoint.process_header_document]
      - endpoint_id: parse.endpoint.process_references_document
        state: deferred
        reason: references_band_compares_against_preserved_fulltext_tei_not_the_references_proxy
        manifest: data/parse/api_compatibility_ledger.yaml
        pointer: entries[id=parse.endpoint.process_references_document]
      - endpoint_id: parse.probe.is_alive
        state: not_required
        reason: native_route_is_java_free_and_never_probes_the_java_service
        manifest: data/parse/api_compatibility_ledger.yaml
        pointer: entries[id=parse.probe.is_alive]
  # Consolidation scope: the structural profile, both consolidation flags off.
  # The declared values are the requirement; the pointer is the authority, and
  # the two must agree (rich's 1/1 is the forbidden neighbour).
  consolidation:
    manifest: data/parse/grobid_compatibility.yaml
    pointer: defaults.profiles.structural
    profile: structural
    consolidateHeader: 0
    consolidateCitations: 0
    fingerprint_fields: [profile, consolidateHeader, consolidateCitations, teiCoordinates]
    forbidden_profile: rich
  # Corpus identity by pointer; the counts are the declared requirement and are
  # recomputed from the pinned documents (3 documents / 202 pages).
  corpus:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: corpus.documents
    count_pointer: corpus.corpus_n
    page_denominator_pointer: corpus.page_denominator
    document_count: 3
    page_denominator: 202
  # Prospective operational ceiling, frozen before any S06 measurement (D509).
  limit_policy:
    state: frozen
    freeze_owner: S06
    freeze_scope: prospective_diagnostic_ceiling
    frozen_at: "2026-10-01"
    # The claim scope is the slice's own: diagnostic only, no product coverage
    # effect and no accepted threshold. The three locks are declared here so the
    # freeze is checkable rather than implied — a metric may not claim a
    # threshold while `thresholds` is `not_accepted`, and a receipt may not claim
    # while the limits are unfrozen (`claim_without_freeze: forbidden`).
    claim_scope: diagnostic_only
    product_coverage_effect: none
    thresholds: not_accepted
    freeze_revision:
      kind: composite_sha256
      rule: sha256_over_ordered_carrier_lines
      line_format: "<path>:<sha256-hex>"
      carriers:
        - path: data/parse/layout_bakeoff.yaml
          kind: declaration
        - path: data/parse/comparison_contract.yaml
          kind: ceiling_dictionary
        - path: data/parse/native_fulltext_composition.yaml
          kind: content_carrier
        - path: crates/da-parse/tests/fixtures/preserved/provenance.yaml
          kind: oracle_pins
      value: "sha256:d26473aac960fd8cd4df40c457c35192836ea8d5ef76fb3558088a17bfa3f17b"
    ceiling_metric_source:
      manifest: data/parse/comparison_contract.yaml
      pointer: batch_budget_ceilings.metrics
    # The frozen measured vocabulary: the batch ceiling names (resolved by
    # pointer) plus the route-only counters whose direction is declared below.
    metrics:
      - latency_p50_ms
      - latency_p95_ms
      - latency_p99_ms
      - peak_retained_bytes
      - peak_rss_bytes
      - java_cpu_wall_clock_ns
      - max_reorder_depth
      - max_publication_outstanding
      - max_in_flight
      - budget_waits
      - native_route_documents
      - native_route_pages
      - native_route_java_calls
      - native_route_unmeasured_stages
      - native_route_unclassified_families
    route_metrics:
      - {id: native_route_documents, direction: floor}
      - {id: native_route_pages, direction: floor}
      - {id: native_route_java_calls, direction: ceiling}
      - {id: native_route_unmeasured_stages, direction: ceiling}
      - {id: native_route_unclassified_families, direction: ceiling}
    direction_vocabulary: [floor, ceiling]
    tuned_after_scoring: forbidden
    zero_is_not_a_measurement: true
    silent_clamp: forbidden
    pass_requires_frozen_threshold: true
    claim_without_freeze: forbidden
  # ── receipt-claim half (M514/S06/T07) ───────────────────────────────
  # The two S06 receipts. `required: true` makes absence a finding rather than
  # silence, and each `schema_version` is the receipt's identity, not a copy of
  # its contents.
  receipt:
    path: artifacts/parse_compat/native_route_e2e.json
    schema_version: native-route-receipt.v1
    required: true
  resource_receipt:
    path: artifacts/parse_compat/native_resource_same_n.json
    schema_version: native-resource-same-n.v1
    required: true
  # The frozen limit dictionary the receipt's own `limits` block must mirror. The
  # values are NOT restated: only the field names are, and the T02 `limit_policy`
  # above stays the sole authority of every value it declares. `metric_source`
  # points at the same dictionary `limit_policy.metrics` closes.
  limit_vocabulary:
    source: limit_policy
    fields:
      - freeze_state
      - freeze_scope
      - tuned_after_scoring
      - claim_without_freeze
      - silent_clamp
      - zero_is_not_a_measurement
      - pass_requires_frozen_threshold
    direction_vocabulary: [floor, ceiling]
    metric_source: limit_policy.metrics
  # The receipt envelope and the closed vocabularies a receipt may use. The
  # declaration's own `stages_in_slice` / `stages_out_of_slice` /
  # `identity_admission_stage` entries (resolved by pointer) are the boundary the
  # stage cells are refused against, so no stage id is restated here.
  expected:
    claim_scope: diagnostic_only
    product_coverage_effect: none
    thresholds: not_accepted
    guard_observer: java_transport_fetch_tei
    # The promotion locks the receipt envelope must keep closed. The mapping is the
    # requirement: a lock outside it (or a lock left open) is refused as a
    # product-coverage claim, the same shape the S03/S04/S05 halves refuse.
    locks:
      deployed: false
      import_eligible: false
      auto_promote: forbidden
      production_route: forbidden
      graph_write: forbidden
    population_vocabulary: [native_route, reference]
    native_population: native_route
    # The T06 same-n resource receipt uses its own `native` / `reference`
    # population vocabulary (the native *resource* plane, not the route's
    # `native_route` document population), so it is declared separately rather
    # than overloaded onto `population_vocabulary`.
    resource_population_vocabulary: [native, reference]
    observation_state_vocabulary: [observed, not_observed]
    # The T06 absence-reason vocabulary: an unmeasured value names why.
    absence_reason_vocabulary:
      - native_metric_not_measured
      - reference_row_absent
      - reference_row_not_same_n
      - reference_row_not_measured
      - not_applicable_to_population
    # The frozen metric dictionaries: the route-only counters plus the T06 native
    # and reference observation metrics.
    native_metric_vocabulary:
      - latency_p50_ms
      - latency_p95_ms
      - latency_p99_ms
      - peak_rss_bytes
      - peak_retained_bytes
      - throughput
    reference_metric_vocabulary:
      - java_model_invocations
      - java_cpu_wall_clock_ns
    reference_source_kind: measured_reference
    pairing_vocabulary:
      rule: same_documents_only
      pooled: forbidden
      saving_claim: forbidden
      mismatch_disposition: hard_failure
    # The body/P1 residual vocabulary the route reproduces from T01 (D499).
    body_verdict_vocabulary: [granularity_only, content_loss, not_assessable]
    body_reason_vocabulary:
      - matched
      - p1_native_text_absent
      - p1_localization_uncertain
      - p2_region_assignment_gap
      - p2_localization_uncertain
      - scope_mismatch
      - scope_join_mismatch
      - normalization_mismatch
      - oracle_empty
      - population_incomplete
    # The stage / family dictionaries the receipt cells are closed against. The
    # forbidden family token is deliberately not a member: a required family
    # carrying it is refused by name, never accepted as an untyped disposition.
    stage_stance_vocabulary: [native_measured, not_qualified, out_of_scope, admission_boundary]
    out_of_slice_stance: out_of_scope
    admission_stance: admission_boundary
    family_disposition_vocabulary: [measured, unmet, not_observed, refused]
    family_unmet_reason_vocabulary:
      - region_no_admitted_tokens
      - header_atom
      - bibliography_atom
      - visual
      - callout
      - section
    family_refusal_reason_vocabulary:
      - header_band_refused
      - bibliography_band_refused
      - body_text_band_refused
      - section_band_refused
      - visual_band_refused
      - callout_band_refused
      - oracle_refused
    forbidden_family_token: out_of_scope
    residual_fields: [unmeasured_stages, unclassified_families]
  # The closed vocabulary of adapter labels this half may emit. Kept separate from
  # the scorecard `violations` list above so the exact-set test stays valid and the
  # halves stay separately governable. The literal set lives in
  # `scripts/governor/domain/absorption_progress.py`.
  violations:
    - native_route_claim_without_receipt
    - native_route_receipt_population_mismatch
    - native_route_receipt_stale
    - native_route_product_coverage_claimed
    - native_route_java_calls_nonzero
    - native_route_guard_not_installed
    - native_route_limit_not_frozen
    - native_route_limit_tuned_after_scoring
    - native_route_stage_outside_slice_counted
    - native_route_family_out_of_scope
    - native_route_body_gap_untyped
    - native_route_resource_pair_unbound
    - native_route_metric_untyped
  fixtures:
    positive:
      id: native_route_clean
      path: governor/fixtures/absorption_progress/native_route.positive.json
      expect: clean
    negative:
      id: native_route_broken
      path: governor/fixtures/absorption_progress/native_route.negative.json
      expect:
        require_violations:
          - native_route_claim_without_receipt
          - native_route_receipt_population_mismatch
          - native_route_receipt_stale
          - native_route_product_coverage_claimed
          - native_route_java_calls_nonzero
          - native_route_guard_not_installed
          - native_route_limit_not_frozen
          - native_route_limit_tuned_after_scoring
          - native_route_stage_outside_slice_counted
          - native_route_family_out_of_scope
          - native_route_body_gap_untyped
          - native_route_resource_pair_unbound
          - native_route_metric_untyped

# ── Acceptance package gate ledger (M514/S08/T06) ─────────────────────────
# T05 published `artifacts/parse_compat/grobid_retirement_acceptance_package.json`:
# it binds all fourteen S08 evidence carriers by repository-relative path +
# pointer + sha256, carries the T02 frozen-threshold evaluation verbatim, and
# enumerates all 21 mandatory gates (20 blocking) with `s09_authorized=false`.
# This block is the sibling governor half that makes the package auditable
# rather than merely present.
#
# Why it exists (R141): a published artifact is not progress, and the Governor
# may never read an artifact's existence or a terminal GSD state as delivered
# capability. Without this half the package's presence would be the whole signal,
# so a deleted package, a drifted carrier pin, a threshold verdict detached from
# the frozen reference, a silently dropped mandatory gate, an S09 authorization
# while a gate still blocks, a renamed body residual, an authorization read from
# GSD lifecycle state, a pooled/saving resource claim and a rollback claim with
# no byte-identity evidence would every one pass unseen.
#
# Nothing about the package contents is restated as evidence: every carrier
# resolves by repository-relative path and the reader recomputes each sha256 from
# the committed bytes; the frozen reference, the rollback carrier and the same-n
# resource carrier resolve by pointer. The declaration authority is the same S03
# slice declaration the Java-free, native-family, native-content and native-route
# halves read, so a tree without it is silence, not a finding.
#
# Severity: this block registers no dimension and no severity — it rides the
# `absorption_progress` check, which is deliberately absent from
# `assurance_severity.yaml`, so a finding stays drift-visible and never blocks
# (D492).
acceptance_package:
  schema_version: acceptance-package-rule.v1
  declaration:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: java_free_vertical_slice
  package:
    path: artifacts/parse_compat/grobid_retirement_acceptance_package.json
    schema_version: grobid-retirement-acceptance-package.v1
    required: true
  # The fourteen evidence carriers the package must bind, as `(manifest, pointer)`.
  # The list is the requirement, not the evidence: the reader recomputes each
  # sha256 from the committed bytes, so a dropped, unbound or duplicate binding
  # fails closed while the rule never restates a digest.
  evidence_carriers:
    - {manifest: artifacts/parse_compat/native_corpus_acceptance.json, pointer: documents}
    - {manifest: artifacts/parse_compat/native_corpus_resource_same_n.json, pointer: reference_metrics}
    - {manifest: artifacts/parse_compat/native_corpus_rollback_rehearsal.json, pointer: corpus_claim}
    - {manifest: artifacts/parse_compat/absorption_progress_reference_pins.json, pointer: values}
    - {manifest: artifacts/parse_compat/external_holdout_release_probe.json, pointer: evaluated_population}
    - {manifest: data/parse/absorption_progress.schema.yaml, pointer: required_scope.families}
    - {manifest: data/parse/absorption_progress.schema.yaml, pointer: requirement_ids}
    - {manifest: crates/da-parse/src/native_acceptance.rs, pointer: evaluate_native_acceptance}
    - {manifest: artifacts/parse_compat/grobid_retirement_release_decision_package.json, pointer: remainders}
    - {manifest: data/parse/grobid_compatibility.yaml, pointer: parity_ledger.named_gaps}
    - {manifest: doc/review/grobid-absorption-followup.json, pointer: stages}
    - {manifest: artifacts/parse_learning/candidate_cycle.json, pointer: outcome}
    - {manifest: artifacts/parse_compat/native_body_uncertainty_split.json, pointer: aggregate}
    - {manifest: artifacts/parse_compat/parse_batch_budget_live.json, pointer: executed_population}
  # The frozen reference the threshold verdicts must stay bound to, the candidate
  # carrier the evaluation names, and the body residual that may never be renamed
  # (D499). The reference pointer resolves the pins; the token is the wording.
  evaluation:
    frozen_reference_path: artifacts/parse_compat/absorption_progress_reference_pins.json
    reference_pointer: values
    candidate_source_path: artifacts/parse_compat/native_corpus_acceptance.json
    threshold_policy_state: frozen
    body_verdict: not_assessable
    body_residual_token: p1_localization_uncertain
  # The real-corpus rollback rehearsal (T04). A rollback claim is refused unless
  # the corpus claim carries byte identity and zero residual violations.
  rollback_carrier:
    path: artifacts/parse_compat/native_corpus_rollback_rehearsal.json
    pointer: corpus_claim
    claim_scope: rehearsal_only
    byte_identity_field: byte_identity_holds
    fragment_leak_field: native_fragment_leak_free
    residuals_pointer: residuals
    populations_pointer: populations
  # The same-n resource receipt (T03). The receipt now carries a measured
  # same-n pair over the 531 measurable documents plus typed absences for the
  # metrics that carrier cannot supply, so a reference row is honest either as
  # `observed` with a pinned source or as `not_observed` with a reason drawn
  # from the closed absence vocabulary. A pooled row or a saving claim is still
  # refused by name (D510/D531).
  resource_carrier:
    path: artifacts/parse_compat/native_corpus_resource_same_n.json
    pointer: reference_metrics
    observation_states: [observed, not_observed]
    observed_requires_source: true
    absence_reason_vocabulary: [native_metric_not_measured, reference_row_absent, reference_row_not_same_n, reference_row_not_measured, not_applicable_to_population]
    pairing_pointer: pairing
    pairing_rule: same_documents_only
    forbidden_pooling: forbidden
    forbidden_saving: forbidden
    residuals_pointer: residuals
  # The envelope the package must carry and the closed gate vocabulary the ledger
  # is checked against. `required_gate_ids` is the exact mandatory set, so a
  # silently dropped gate is a finding rather than a smaller-but-consistent list.
  expected:
    claim_scope: diagnostic_only
    product_coverage_effect: none
    thresholds: not_accepted
    authorization_basis: human_release_decision_required
    gate_state_vocabulary: [met, unmet, not_comparable, threshold_pending, not_assessable, not_observed, typed_refusal, pending, accepted_residual]
    non_blocking_states: [met, accepted_residual]
    gate_kind_vocabulary: [threshold, body_axis, threshold_pending_family, named_gap, learning_disposition, resource_pair, resource_absence, human_release]
    required_gate_ids:
      - threshold.preservation_micro_occurrence
      - threshold.extraction_micro_occurrence
      - threshold.extraction_weakest_family
      - body_axis.body_not_assessable
      - required_scope.rest.isalive
      - required_scope.rest.health
      - required_scope.rest.version
      - required_scope.rest.processFulltextDocument
      - required_scope.rest.processHeaderDocument
      - required_scope.rest.processReferences
      - required_scope.dialect.teiCoordinates
      - required_scope.stage.pdfalto_layout
      - required_scope.stage.document_segmentation
      - required_scope.stage.figure_table_formula
      - required_scope.stage.bibliographic_consolidation
      - required_scope.stage.tei_lift
      - named_gap_learning_ruvllm_ablation
      - h20_frozen_external_holdout_decision
      - h21_revision_label_residual
      - learning.s07_measured_no_gain
      - resource.container_java_cpu
    minimum_mandatory_gates: 21
    locks:
      deployed: "false"
      import_eligible: "false"
      auto_promote: forbidden
      production_route: forbidden
      graph_write: forbidden
    redaction_flags: [raw_text, raw_pdf, tei_xml, images, physical_paths, hostname, executable]
    # R134 clause (a): the reviewer-recomputability statement the package must
    # carry, the algorithm it must declare and the minimum reviewer surfaces.
    # The reader proves every named surface resolves on the live tree.
    recomputation:
      block: reviewer_recomputation
      digest_algorithm: sha256
      minimum_surfaces: 2
    # R134 clause (c): the same-generator/different-label provenance linkage the
    # package must carry and the minimum named independence judges. The reader
    # proves every judge manifest resolves on the live tree.
    independence:
      block: carrier_independence
      minimum_judges: 3
  # The closed vocabulary of adapter labels this half may emit. Kept separate from
  # the scorecard `violations` list above so the exact-set test stays valid and the
  # halves stay separately governable. The literal set lives in
  # `scripts/governor/domain/absorption_progress.py`.
  violations:
    - acceptance_package_claim_without_package
    - acceptance_package_schema_drift
    - acceptance_package_evidence_drift
    - acceptance_package_carrier_stale
    - acceptance_package_coverage_claimed
    - acceptance_package_threshold_unbound
    - acceptance_package_mandatory_gate_dropped
    - acceptance_package_body_residual_renamed
    - acceptance_package_unmet_gate_authorized
    - acceptance_package_authorization_drift
    - acceptance_package_lifecycle_authorization
    - acceptance_package_pooled_resource_claim
    - acceptance_package_rollback_without_byte_identity
    - acceptance_package_recompute_statement_drift
    - acceptance_package_independence_statement_drift
  fixtures:
    positive:
      id: native_acceptance_clean
      path: governor/fixtures/absorption_progress/native_acceptance.positive.json
      expect: clean
    negative:
      id: native_acceptance_broken
      path: governor/fixtures/absorption_progress/native_acceptance.negative.json
      expect:
        require_violations:
          - acceptance_package_claim_without_package
          - acceptance_package_schema_drift
          - acceptance_package_evidence_drift
          - acceptance_package_carrier_stale
          - acceptance_package_coverage_claimed
          - acceptance_package_threshold_unbound
          - acceptance_package_mandatory_gate_dropped
          - acceptance_package_body_residual_renamed
          - acceptance_package_unmet_gate_authorized
          - acceptance_package_authorization_drift
          - acceptance_package_lifecycle_authorization
          - acceptance_package_pooled_resource_claim
          - acceptance_package_rollback_without_byte_identity
          - acceptance_package_recompute_statement_drift
          - acceptance_package_independence_statement_drift

# S09/T03: the authorization axis is reported separately from product coverage
# (R141). The retirement-readiness receipt is the S09 artifact that binds the S08
# acceptance package, the committed human release record, the S02 required-scope /
# authorization declarations and the M513 release-decision package remainder, and
# carries the T01 authorization verdict verbatim with `families_switched: []`,
# `goal_unmet: true` and every required family naming its blocking gate. The rule
# names only *where* the receipt and the authorities live and *what blocked state*
# it must describe; nothing about the receipt contents is restated, so the rule
# cannot drift from the artifact it governs.
retirement_readiness:
  schema_version: retirement-readiness-rule.v1
  declaration:
    manifest: data/parse/layout_bakeoff.yaml
    pointer: java_free_vertical_slice
  receipt:
    path: artifacts/parse_compat/grobid_retirement_readiness.json
    schema_version: grobid-retirement-readiness.v1
    required: true
  # The committed human release record the receipt's human-gate claims are checked
  # against. The reader resolves it by pointer; the oracle refuses a receipt that
  # claims a recorded decision the record does not contain.
  human_record:
    manifest: data/parse/acceptance_manifest.yaml
    pointer: release_decision_package.human_release_review
    authorizing_decision_tokens: [recorded, approved]
  # The S08 gate ledger a switched-family claim is checked against, so a receipt
  # cannot hide a still-blocking gate behind its own wording. The reader resolves
  # it by pointer; the ledger itself is bound by the sha256 carrier above.
  gate_ledger:
    manifest: artifacts/parse_compat/grobid_retirement_acceptance_package.json
    pointer: mandatory_gates
    non_blocking_states: [met, accepted_residual]
  # The five carriers the receipt must bind by path + pointer + sha256. The reader
  # recomputes each sha256 from the committed bytes, so a dropped, unbound or
  # duplicate binding fails closed while the rule never restates a digest.
  evidence_carriers:
    - {manifest: artifacts/parse_compat/grobid_retirement_acceptance_package.json, pointer: mandatory_gates}
    - {manifest: data/parse/acceptance_manifest.yaml, pointer: release_decision_package.human_release_review}
    - {manifest: data/parse/absorption_progress.schema.yaml, pointer: required_scope.families}
    - {manifest: data/parse/absorption_progress.schema.yaml, pointer: authorization}
    - {manifest: artifacts/parse_compat/grobid_retirement_release_decision_package.json, pointer: remainders}
  # The body residual that may never be renamed (D499): the blocked state names one
  # open body gate with one typed wording, and a renamed residual is a different
  # claim.
  body_residual:
    token: p1_localization_uncertain
    gate_id: body_axis.body_not_assessable
  # The envelope the blocked receipt must carry and the exact mandatory scope it
  # must enumerate. `required_family_ids` / `required_blocking_gate_ids` are the
  # exact sets, so a silently dropped family or blocking gate is a finding rather
  # than a smaller-but-consistent list.
  expected:
    claim_scope: blocked_pending_human_authorization
    product_coverage_effect: none
    authorization_verdict: refused
    authorization_basis: human_release_decision_required
    goal_state: unmet
    locks:
      deployed: "false"
      import_eligible: "false"
      auto_promote: forbidden
      production_route: forbidden
      graph_write: forbidden
    required_family_ids:
      - rest.isalive
      - rest.health
      - rest.version
      - rest.processFulltextDocument
      - rest.processHeaderDocument
      - rest.processReferences
      - dialect.teiCoordinates
      - stage.pdfalto_layout
      - stage.document_segmentation
      - stage.header_composition
      - stage.reference_segmentation
      - stage.figure_table_formula
      - stage.bibliographic_consolidation
      - stage.tei_lift
      - parse.component.native_fulltext_composition_shadow
    required_blocking_gate_ids:
      - body_axis.body_not_assessable
      - required_scope.rest.isalive
      - required_scope.rest.health
      - required_scope.rest.version
      - required_scope.rest.processFulltextDocument
      - required_scope.rest.processHeaderDocument
      - required_scope.rest.processReferences
      - required_scope.dialect.teiCoordinates
      - required_scope.stage.pdfalto_layout
      - required_scope.stage.document_segmentation
      - required_scope.stage.figure_table_formula
      - required_scope.stage.bibliographic_consolidation
      - required_scope.stage.tei_lift
      - named_gap_learning_ruvllm_ablation
      - h20_frozen_external_holdout_decision
      - learning.s07_measured_no_gain
    required_refusal_codes: [human_reviewer_unnamed, human_decision_not_recorded]
    human_gate:
      reviewer_named: false
      decision: pending
      release_recorded: false
      package_status: pending_human_review
      m513_package_status: pending_human_review
    redaction_flags: [raw_text, raw_pdf, tei_xml, images, physical_paths, hostname, executable]
  # The closed vocabulary of adapter labels this half may emit. Kept separate from
  # the acceptance_package half above so the two halves stay separately governable.
  # The literal set lives in `scripts/governor/domain/absorption_progress.py`.
  violations:
    - retirement_readiness_claim_without_receipt
    - retirement_readiness_carrier_stale
    - retirement_readiness_human_decision_claimed_without_record
    - retirement_readiness_lifecycle_authorization
    - retirement_readiness_family_switched_with_blocking_gate
    - retirement_readiness_body_residual_renamed
    - retirement_readiness_product_coverage_claimed
    - retirement_readiness_goal_marked_met
  fixtures:
    positive:
      id: native_retirement_readiness_blocked
      path: governor/fixtures/absorption_progress/native_retirement_readiness.positive.json
      expect: clean
    negative:
      id: native_retirement_readiness_broken
      path: governor/fixtures/absorption_progress/native_retirement_readiness.negative.json
      expect:
        require_violations:
          - retirement_readiness_claim_without_receipt
          - retirement_readiness_carrier_stale
          - retirement_readiness_human_decision_claimed_without_record
          - retirement_readiness_lifecycle_authorization
          - retirement_readiness_family_switched_with_blocking_gate
          - retirement_readiness_body_residual_renamed
          - retirement_readiness_product_coverage_claimed
          - retirement_readiness_goal_marked_met

# Enforcement points that must keep existing. The rule reads these files as text;
# it never executes them.
source_markers:
  domain_validator:
    path: scripts/governor/domain/absorption_progress.py
    required_patterns: [scorecard_violations, preservation_pooled_with_extraction, skipped_as_delivered, threshold_missing_for_required_metric, JAVA_FREE_SLICE_VIOLATION_LABELS, NATIVE_FAMILY_VIOLATION_LABELS, NATIVE_CONTENT_VIOLATION_LABELS, NATIVE_ROUTE_VIOLATION_LABELS, ACCEPTANCE_PACKAGE_VIOLATION_LABELS, RETIREMENT_READINESS_VIOLATION_LABELS]
