# Dimension definitions — project maturity areas assessed by governor.
# Each dimension has: id, status_logic (how to derive status), evidence (list).
#
# This is DATA — loaded by governor.domain.dimensions at runtime.
# Condition syntax: "path/to/file exists" or "path exists AND path exists"

dimensions:
  - id: schema_readiness
    description: "Typed knowledge schema (node labels, property types, edge contracts)"
    status_logic:
      implemented: "crates/da-domain/src/schema.rs exists AND doc/adr/ADR-040-technology-stack-lock-samyama-ruvector-rvf.md exists"
      design_accepted: "doc/adr/ADR-040-technology-stack-lock-samyama-ruvector-rvf.md exists"
      missing: "always (fallback)"
    evidence:
      - "da-domain::schema canonical home (Rust workspace)"
      - "ADR-040 Samyama unified store"
      - "ADR-045 edge contract matrix"
      - "31 node schemas (XSchema)"

  - id: extraction_coverage
    description: "Extraction pipeline quality on gold-standard corpus"
    status_logic:
      prototype_done: "always (M283 eval_batch ran)"
    evidence:
      - "Rust RuleBasedExtractor (crates/da-adapters)"
      - "Gold-standard corpus: 12 modern papers, 96 gold entities"
      - "Precision 0.639 / Recall 0.979 / F1 0.774 (micro)"
      - "import_eligible=false (D127)"
    artifact_ref: "crates/da-cli/examples/eval_batch.rs"

  - id: graph_store_binding
    description: "KG+vector+persist store binding (ADR-040 Samyama)"
    status_logic:
      superseded_by_samyama: "crates/da-adapters/src/samyama_graph.rs exists"
      not_started: "always (fallback)"
    evidence:
      - "ADR-040 Samyama = sole KG+vector+persist store"
      - "SamyamaGraphStore impl (GraphStore + DirectGraphStore)"
      - "kg-storage traits re-exported via da-ports (M285-z09px0/S05)"

  - id: hexagonal_discipline
    description: "Hexagonal/Onion overlay maturity (ADR-034)"
    status_logic:
      crystallized: "crates/da-ports/src/lib.rs exists AND crates/da-adapters/src/samyama_graph.rs exists AND scripts/verify_rust_architecture.sh exists AND crates/kg-ontology/src/lib.rs exists AND crates/kg-storage/src/lib.rs exists"
      in_progress: "crates/da-ports/src/lib.rs exists"
      not_started: "always (fallback)"
    evidence:
      - "ADR-034 hexagonal/onion overlay on Rust workspace"
      - "da-domain <- da-ports <- da-application <- da-adapters/da-cli"
      - "kg-* universal crate family (ADR-050, no da-* deps)"
      - "scripts/verify_rust_architecture.sh guardrail"

  - id: kg_crate_family
    description: "Universal kg-* crate family migration (ADR-050)"
    status_logic:
      phase_a_complete: "crates/da-domain/Cargo.toml exists AND crates/kg-ontology/src/lib.rs exists AND crates/kg-storage/src/lib.rs exists"
      skeleton_done: "crates/kg-ontology/src/lib.rs exists"
      not_started: "always (fallback)"
    evidence:
      - "ADR-050 kg-* crate family (5 crates)"
      - "Phase A: da-domain re-exports kg-ontology (M285/S03)"
      - "Phase B: da-ports re-exports kg-storage (M285/S05)"
      - "Phase D: YAML ontology export pending"

  - id: canary_resolvability
    description: "Canary paper resolvability metric (M280-M284)"
    status_logic:
      measured: "artifacts/etl/canary-resolvability-metric.v1.json exists"
      not_started: "always (fallback)"
    evidence:
      - "M280: canary paper ids assigned, 12 held-out frozen"
      - "M281: gold char-span grounding"
      - "M282: relation entity-id resolve"
      - "M284: evidence governor fleet wire"
    artifact_ref: "artifacts/etl/canary-resolvability-metric.v1.json"

  - id: structure_gate
    description: "Structure gate v2 IR signals (M277)"
    status_logic:
      active: "artifacts/etl/structure-readiness.json exists"
      not_started: "always (fallback)"
    evidence:
      - "M277: v2 IR hard structure, newline soft_legacy"
      - "M283: ODL layout key fix, hybrid gold batch"
    artifact_ref: "artifacts/etl/structure-readiness.json"

  - id: gepa_isolation
    description: "GEPA held-out isolation wire (M279)"
    status_logic:
      wired: "artifacts/etl/canary-held-out-split.v1.json exists"
      not_started: "always (fallback)"
    evidence:
      - "M279: held_out excluded from GEPA train fail-closed"
      - "M280: 60 paper_ids assigned, 12 held-out frozen"
    artifact_ref: "artifacts/etl/canary-held-out-split.v1.json"
