# ---------------------------------------------------------------------------
# corrections — что именно исправлено относительно предыдущей редакции.
# ---------------------------------------------------------------------------
corrections:
  - id: C01
    previous: "«Absorption is complete ... and zero percent complete on the production route»"
    corrected: >
      production=0 — это 0 строк из 38 в состоянии `production`, а не 0 %
      миграции. Отдельной процентной метрики не существует, и её нельзя вывести
      из счётчика состояний.
    evidence: data/parse/grobid_compatibility.yaml
  - id: C02
    previous: "licensed: 38 (единственное булево поле)"
    corrected: >
      Лицензия присутствует как идентификатор происхождения на всех 38 строках,
      но правовая очистка не установлена: canonical license_inventory.yaml
      содержит 22 компонента, license_status verified=7 / blocked=15, а
      redistribution_policy запрещает новое распространение, коммерческое
      использование, import_eligible, graph_write и auto_promote;
      unknown_rights=blocked.
    evidence: data/parse/license_inventory.yaml
  - id: C03
    previous: "absent: 16 (как один класс «нет реализации»)"
    corrected: >
      16 строк `absent` разложены по product_scope: 4 deferred,
      5 not_compatibility_requirement, 7 supporting. Это разные решения
      (отложено / вне требования совместимости / вспомогательное), и их нельзя
      сводить к «16 нежелательных».
    evidence: data/parse/grobid_compatibility.yaml
  - id: C04
    previous: "tests.by_kind: {contract: 54, properties: 16, oracle: 14, data_contract: 12, same_n: 7, metamorphic: 1}"
    corrected: >
      Теги имён файлов перекрываются: 99 файлов, 14 файлов несут более одного
      тега, сумма тегов 108 ≠ 99. Поле by_kind нельзя использовать как
      разбиение. Замер на 2026-09-21: contract 55, properties 16, oracle 15,
      data_contract 13, same_n 8, metamorphic 1.
    evidence: crates/da-parse/tests/
  - id: C05
    previous: "«shadow PASS — ограниченное исполнение», без проверки корректности эмиссии"
    corrected: >
      Accepted от композитора не означает корректность выхода. Фактическое
      репро: 3 сохранённых реальных TEI дают Accepted, но эмитированный XML
      отвергается независимым парсером (mismatched tag на дублированном
      </title> в синтезированном <titleStmt>); вход с пустым списком anchors
      тоже даёт Accepted, но с висячей ссылкой b0.
    evidence: .gsd/exec/6c9cbd4d-e9eb-4281-8da8-1fdc7d724f1f.stdout
  - id: C06
    previous: "индексы считались свежими"
    corrected: >
      Оба индекса пересобраны на bcdd0cf. GitNexus MCP недоступен,
      CLI работает, CBM MCP работает. Обнаружено расхождение callers;
      отсутствие ребра не означает отсутствие вызова.
    evidence: .codebase-memory/artifact.json
  - id: C07
    previous: >
      A-XML (Accepted композитора при невалидном XML, C05) числился открытым с
      измеренным ignored-гейтом и счётчиками 1352 passed / 1 ignored; S01/T01
      сознательно фиксировал RED, а не исправление.
    corrected: >
      S01/T02 починил эмиттер структурно: спаривание открывающих и закрывающих
      тегов одним стеком, переразмещение детей заголовка по родителю,
      воспроизведение атрибутов исходного <teiHeader> дословно и перечитывание
      эмиссии до Accepted (ComposedOutputNotWellFormed), иначе байт-идентичный
      Java-envelope. Гейт preserved_tei_composition_is_independently_well_formed
      больше не #[ignore] и зелёный на трёх сохранённых TEI; RED-пин T01 заменён
      независимой консервацией. S01/T03, выполняя обязательную проверку
      namespace-негативов, воспроизвёл остаточный дефект того же класса:
      объявление xmlns:ext на СИНТЕЗИРУЕМЫХ обёртках fileDesc/titleStmt не
      воспроизводилось, поэтому Accepted возвращался при эмиссии, отвергаемой
      независимым парсером (an unknown namespace prefix 'ext' at 1:202 для
      fileDesc и 1:153 для titleStmt; gsd_exec c9cbe8d7), и закрыл его узко —
      переносятся только xmlns/xmlns:*. Прочие атрибуты обёрток (например
      собственный xml:lang) по-прежнему не копируются: это семантический
      остаток поля (H16), не well-formedness. Свежий замер da-parse: 100 suites,
      1359 passed, 0 failed, 0 ignored (gsd_exec 412df4be). H14 не закрывается
      этой записью: implementation_pass=false и planning-семантика сохраняются.
    evidence: .gsd/exec/412df4be-f747-4457-9c3b-a6eff4bf779e.stdout
  - id: C08
    previous: >
      Счётчики C07 (1359 passed / 0 ignored на `cargo test -p da-parse --tests`,
      17 passed на контракте композитора) и открытые остатки после S01/T03:
      правописание `xml:id`, подстроковая проверка `<!DOCTYPE`, лимиты 4 MiB/128.
    corrected: >
      S01/T04 развёл роли: `validate_well_formed` — отдельный проход по
      WFC-классам (ровно один корень, легальность Name/QName, атрибуты в форме
      `Name S? Eq S? AttValue`, ссылки, `]]>`, `--` в комментарии, CDATA только
      внутри документа, лимит глубины, легальные Char, привязка префиксов), а
      `XmlDocument::parse` больше не называется доказательством. S01/T05
      консервирует обёртки байтовыми интервалами (комментарии, PI, текст между
      детьми) и ищет wrapper только среди ПРЯМЫХ детей, поэтому вложенный
      titleStmt не дублируется. S01/T06 измерил три остатка: (1) `xml:id` с
      одиночными кавычками или пробелами вокруг `=` обходил uniqueness-гейт —
      Accepted с двумя `xml:id="author-0"` (gsd_exec b9a3be53-e685-41c7-ba48-f66674baad41),
      закрыто чтением атрибутов через XML-грамматику; (2) `<!DOCTYPE`/`<!ENTITY`
      искались подстрокой по всему документу, поэтому упоминание строки в
      комментарии или CDATA отвергалось как ForbiddenExternalEntity (там же),
      закрыто markup-aware детекцией без ослабления гейта (реальный `<!DOCTYPE`
      остаётся запретом, `<!doctype` отклоняется как нелегальная разметка,
      `<!DOCTYPE` в значении атрибута — по правилу AttValue); (3) лимиты 4 MiB и
      глубины 128 воспроизведённого дефекта НЕ имели — они запиннены регрессией
      как уже корректные (типизированный Oversized/MalformedXml, байт-идентичный
      Java-envelope, без частичного вывода). Актуальный замер: contract 28 passed
      / 0 ignored (gsd_exec 340ff4f1-c4d7-4255-879b-2dc2b9e005a5), properties
      8 passed (5f5e83ef-881d-434f-b366-3b6363d0119f), da-parse --tests 100 suites /
      1374 passed / 0 failed / 0 ignored (19803fcd-9b09-4b7e-ae0f-a1d4eda0ed60),
      clippy exit=0 (2d7bdcc9-dc10-47e9-a154-0cf743c8cc05), fmt --check exit=0
      (da2c8832-5a9f-4c95-8377-0265625dcf98). RED T06 замерен отдельно:
      25 passed / 3 failed и 7 passed / 1 failed. Замки не менялись; H14 не
      закрывается — planning-семантика и implementation_pass=false сохраняются.
    evidence: doc/review/grobid-absorption-audit-2026-09-21.md

# ---------------------------------------------------------------------------
# validation_commands — как воспроизвести проверку (read-only).
# ---------------------------------------------------------------------------
validation_commands:
  - command: "PYTHONPATH=scripts python3 -m governor review --registry doc/review/grobid-absorption-roadmap-2026-09-21.yaml"
    expected: "exit=0; только grobid_horizon_review_scope_warning и grobid_horizon_review_status (medium)"
  # S01/T04–T06 (2026-09-21) довели замер до текущего состояния: контракт
  # композитора 28 passed (было 24 после T05 и 17 после T03), properties 8,
  # полный набор 1374 passed, и два остаточных класса закрыты (см. C08).
  - command: "cargo test -p da-parse --tests"
    expected: "1374 passed; 0 failed; 0 ignored; 100 suites"
  # Исторический RED S01/T01, снятый починкой S01/T02: гейт
  # preserved_tei_composition_is_independently_well_formed больше не #[ignore] и
  # входит в зелёный прогон выше; namespace на синтезируемых обёртках закрыт
  # регрессией wrapper_namespace_declarations_are_carried_so_no_prefix_is_unbound,
  # вложенный titleStmt — nested_unique_titleStmt_under_seriesStmt_is_not_duplicated,
  # правописание xml:id — xml_id_spelling_never_escapes_the_duplicate_id_gate.
  - command: "cargo test -p da-parse --test native_fulltext_composition_contract"
    expected: "28 passed; 0 failed; 0 ignored (A-XML гейт, namespace-регрессия, malformed-набор, правописание xml:id, markup-aware DOCTYPE, лимиты 4 MiB/128)"
  - command: "cargo test -p da-parse --test native_fulltext_composition_properties"
    expected: "8 passed; 0 failed; 0 ignored (well-formed инвариант, правописание xml:id)"
  - command: "python3 -c \"import json,sys,jsonschema;d=json.load(open('doc/review/grobid-absorption-followup.json'));s=json.load(open('doc/review/grobid-rust-horizon-review.schema.json'));jsonschema.Draft202012Validator(s).validate(d);print('schema-ok')\""
    expected: "schema-ok"
