    reason: "Повтор с buffer pool 4 GiB завершён успешно; CLI context выполнен"
    indexed_commit: bcdd0cf
    current_commit: bcdd0cf
  codebase_memory:
    project: root-daily-archive
    commit: bcdd0cfc5e34f64821798463fe23b2f3845efe56
    indexed_at: "2026-09-21T13:51:53Z"
    nodes: 499260
    edges: 644211
    artifact: .codebase-memory/artifact.json
  mcp:
    state: partial
    note: "CBM MCP trace_path/check_index_coverage выполнены; GitNexus MCP Connection closed, использован CLI."
  limitation: >
    GitNexus переиндексирован: 81431 узел, 130142 ребра, 639 flows.
    CLI context не показывает callers композитора, CBM показывает 13.
    CBM реиндексирован: 499260 узлов / 644211 рёбер. Свежесть не означает
    полноту связей; результаты сверены с исходниками и Rust probe.

# ---------------------------------------------------------------------------
# corrections — что именно исправлено относительно предыдущей редакции.
# ---------------------------------------------------------------------------
corrections:
  - id: C01
    previous: "«Absorption is complete ... and zero percent complete on the production route»"
    corrected: >
      production=0 — это 0 строк из 38 в состоянии `production`, а не 0 %
      миграции. Отдельной процентной метрики не существует, и её нельзя вывести
      из счётчика состояний.
    evidence: data/parse/grobid_compatibility.yaml
  - id: C02
    previous: "licensed: 38 (единственное булево поле)"
    corrected: >
      Лицензия присутствует как идентификатор происхождения на всех 38 строках,
      но правовая очистка не установлена: canonical license_inventory.yaml
      содержит 22 компонента, license_status verified=7 / blocked=15, а
      redistribution_policy запрещает новое распространение, коммерческое
      использование, import_eligible, graph_write и auto_promote;
      unknown_rights=blocked.
    evidence: data/parse/license_inventory.yaml
  - id: C03
    previous: "absent: 16 (как один класс «нет реализации»)"
    corrected: >
      16 строк `absent` разложены по product_scope: 4 deferred,
      5 not_compatibility_requirement, 7 supporting. Это разные решения
      (отложено / вне требования совместимости / вспомогательное), и их нельзя
      сводить к «16 нежелательных».
    evidence: data/parse/grobid_compatibility.yaml
  - id: C04
    previous: "tests.by_kind: {contract: 54, properties: 16, oracle: 14, data_contract: 12, same_n: 7, metamorphic: 1}"
    corrected: >
      Теги имён файлов перекрываются: 99 файлов, 14 файлов несут более одного
      тега, сумма тегов 108 ≠ 99. Поле by_kind нельзя использовать как
      разбиение. Замер на 2026-09-21: contract 55, properties 16, oracle 15,
      data_contract 13, same_n 8, metamorphic 1.
    evidence: crates/da-parse/tests/
  - id: C05
    previous: "«shadow PASS — ограниченное исполнение», без проверки корректности эмиссии"
    corrected: >
      Accepted от композитора не означает корректность выхода. Фактическое
      репро: 3 сохранённых реальных TEI дают Accepted, но эмитированный XML
      отвергается независимым парсером (mismatched tag на дублированном
      </title> в синтезированном <titleStmt>); вход с пустым списком anchors
      тоже даёт Accepted, но с висячей ссылкой b0.
    evidence: .gsd/exec/6c9cbd4d-e9eb-4281-8da8-1fdc7d724f1f.stdout
  - id: C06
    previous: "индексы считались свежими"
    corrected: >
      Оба индекса пересобраны на bcdd0cf. GitNexus MCP недоступен,
      CLI работает, CBM MCP работает. Обнаружено расхождение callers;
      отсутствие ребра не означает отсутствие вызова.
    evidence: .codebase-memory/artifact.json

# ---------------------------------------------------------------------------
# validation_commands — как воспроизвести проверку (read-only).
# ---------------------------------------------------------------------------
validation_commands:
  - command: "PYTHONPATH=scripts python3 -m governor review --registry doc/review/grobid-absorption-roadmap-2026-09-21.yaml"
    expected: "exit=0; только grobid_horizon_review_scope_warning и grobid_horizon_review_status (medium)"
  # S01/T01 (2026-09-21) добавил отслеживаемую A-XML регрессию (независимый
  # парсер roxmltree как dev-dependency), поэтому счётчики сдвинулись:
  # базовый прогон 1352 passed / 0 failed / 1 ignored (100 suites), где ignored —
  # целевой гейт preserved_tei_composition_is_independently_well_formed,
  # RED до починки эмиттера в S01/T02.
  - command: "cargo test -p da-parse --tests"
    expected: "1352 passed; 0 failed; 1 ignored; 100 suites"
  # Ожидаемый RED, НЕ регрессия в обратную сторону: пока эмиттер не починен,
  # гейт обязан падать — падение и есть доказательство дефекта.
  - command: "cargo test -p da-parse --test native_fulltext_composition_contract -- --ignored"
    expected: "rc=101: независимый парсер отвергает Accepted-эмиссию на всех трёх сохранённых TEI (RED до S01/T02)"
  - command: "python3 -c \"import json,sys,jsonschema;d=json.load(open('doc/review/grobid-absorption-followup.json'));s=json.load(open('doc/review/grobid-rust-horizon-review.schema.json'));jsonschema.Draft202012Validator(s).validate(d);print('schema-ok')\""
    expected: "schema-ok"
