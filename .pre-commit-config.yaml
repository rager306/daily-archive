# Pre-commit hooks for daily-archive v2 (Rust).
# Install: pre-commit install
# Run all: pre-commit run --all-files
#
# FAST-ONLY policy (MEM468/MEM514):
#   No `cargo check --workspace`, no `cargo run`, no `--all-targets`.
#   Each hook must finish in <10s. Heavy checks (full workspace test,
#   eval-baseline, schema-check binary) belong in CI or manual `da` runs.
#   Governor CLI (Python, ~1s) enforces ADR invariants in every commit.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (kg-* + da-*)
        entry: cargo fmt -p kg-ontology -p kg-storage -p kg-embeddings -p kg-algorithms -p kg-pipeline -p da-domain -p da-ports -p da-application -p da-graph -p da-adapters -p da-cli -- --check
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      - id: cargo-clippy-lib
        name: cargo clippy (lib only, no --all-targets, avoids rocksdb)
        entry: cargo clippy -p kg-ontology -p kg-storage -p kg-embeddings -p kg-algorithms -p kg-pipeline -p da-domain -p da-ports -p da-application -p da-graph -p da-adapters -p da-cli --no-deps -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      - id: governor-trajectory
        name: governor CLI (ADR invariants + artifact gates)
        entry: bash -c 'PYTHONPATH=scripts python3 -m governor --phase preflight --check-only'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: docs-drift-check
        name: docs drift check (schema tables present)
        entry: bash scripts/docs_drift_check.sh
        language: system
        pass_filenames: false
        types: [rust, markdown]
        stages: [pre-commit]
        verbose: true
