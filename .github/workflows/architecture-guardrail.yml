name: Architecture Guardrail

# Daily-archive v2 architecture guardrail (Rust, hexagonal/onion).
# Replaces the Python M044/M045 guardrail (broken after Python→Rust rewrite:
# referenced scripts/ that moved to legacy/ and a root pyproject.toml that
# no longer exists). See ADR-040 §2 and decision D131.
#
# This workflow enforces the binding safety contract for the Rust layout:
#   1. Workspace compiles (cargo check --workspace)
#   2. Code is formatted (cargo fmt --check)
#   3. No clippy warnings in our crates (cargo clippy -p da-* -- -D warnings)
#   4. Dependency direction is clean (hexagonal layering):
#        da-domain  → (no infra deps: no reqwest/tokio/samyama/ruvector)
#        da-ports   → da-domain only (no infra deps)
#        da-application → da-domain, da-ports (no da-adapters, no infra)
#        da-graph   → da-domain, da-ports (no da-adapters, no infra)
#        da-adapters → da-domain, da-ports, samyama (infrastructure)
#        da-cli     → da-domain, da-ports, da-application, da-adapters
#      Rule: an inner layer must not depend on an outer layer.
#
# Runs on every push and pull_request to master.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: architecture-guardrail-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-guardrail:
    name: Rust Architecture Guardrail (mandatory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Samyama/RuVector are vendored under /root/vendor-source on the
          # dev host; on CI they are separate repos. For now this guardrail
          # runs only on self-hosted (vendor paths) — see repository_dispatch.
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fmt check
        run: |
          cargo fmt \
            -p da-domain -p da-ports -p da-application \
            -p da-graph -p da-adapters -p da-cli \
            -- --check

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (our crates, deny warnings, no-deps)
        run: |
          # --no-deps: lint only our crates, not vendored Samyama (which has
          # many pre-existing unused-import warnings we do not own).
          cargo clippy \
            -p da-domain -p da-ports -p da-application \
            -p da-graph -p da-adapters -p da-cli \
            --all-targets --no-deps -- -D warnings

      - name: Hexagonal dependency-direction check
        run: |
          # Inner layers must not depend on outer layers or infrastructure.
          # da-domain and da-ports: no infra crates allowed.
          set -euo pipefail
          # Helper: scan only [dependencies], never [dev-dependencies].
          grep_deps() {
            awk '/^\[dependencies\]$/ {in_deps=1;next}
                 /^\[/ && $0!="[dependencies]" {in_deps=0}
                 in_deps {print}' "$1" | grep -E "$2";
          }

          echo "Checking da-domain has no infrastructure dependencies..."
          ! grep_deps crates/da-domain/Cargo.toml 'reqwest|tokio|samyama|ruvector|hyper|axum|actix' || {
            echo "ERROR: da-domain must not depend on infrastructure crates"; exit 1; }
          echo "Checking da-ports has no infrastructure dependencies..."
          ! grep_deps crates/da-ports/Cargo.toml 'reqwest|tokio|samyama|ruvector|hyper|axum|actix' || {
            echo "ERROR: da-ports must not depend on infrastructure crates"; exit 1; }
          echo "Checking da-application does not depend on da-adapters..."
          ! grep_deps crates/da-application/Cargo.toml 'da-adapters' || {
            echo "ERROR: da-application must not depend on da-adapters (hexagonal violation)"; exit 1; }
          echo "Checking da-graph does not depend on da-adapters..."
          ! grep_deps crates/da-graph/Cargo.toml 'da-adapters' || {
            echo "ERROR: da-graph must not depend on da-adapters (hexagonal violation)"; exit 1; }
          echo "Hexagonal dependency direction: PASS"

      - name: Guardrail evidence
        if: success()
        run: |
          mkdir -p artifacts/architecture-guardrail
          echo "Rust architecture guardrail passed on $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/architecture-guardrail/ci-run.txt
          cat artifacts/architecture-guardrail/ci-run.txt
