name: Architecture Guardrail

# Daily-archive v2 architecture guardrail (Rust, hexagonal/onion).
# Replaces the Python M044/M045 guardrail (broken after Python→Rust rewrite:
# referenced scripts/ that moved to legacy/ and a root pyproject.toml that
# no longer exists). See ADR-040 §2 and decision D131.
#
# This workflow enforces the binding safety contract for the Rust layout:
#   1. Workspace compiles (cargo check --workspace)
#   2. Code is formatted (cargo fmt --check)
#   3. No clippy warnings in our crates (cargo clippy -p da-* -- -D warnings)
#   4. Dependency direction is clean (hexagonal layering):
#        da-domain  → (no infra deps: no reqwest/tokio/samyama/ruvector)
#        da-ports   → da-domain only (no infra deps)
#        da-application → da-domain, da-ports (no da-adapters, no infra)
#        da-graph   → da-domain, da-ports (no da-adapters, no infra)
#        da-adapters → da-domain, da-ports, samyama (infrastructure)
#        da-cli     → da-domain, da-ports, da-application, da-adapters
#      Rule: an inner layer must not depend on an outer layer.
#
# Runs on every push and pull_request to master.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: architecture-guardrail-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-guardrail:
    name: Rust Architecture Guardrail (mandatory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Samyama/RuVector are vendored under /root/vendor-source on the
          # dev host; on CI they are separate repos. For now this guardrail
          # runs only on self-hosted (vendor paths) — see repository_dispatch.
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fmt check
        run: |
          cargo fmt \
            -p kg-ontology -p kg-storage -p kg-embeddings -p kg-algorithms -p kg-pipeline \
            -p da-domain -p da-ports -p da-application \
            -p da-adapters -p da-parse -p da-cli -p da-mcp \
            -- --check

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (our crates, deny warnings, no-deps)
        run: |
          # --no-deps: lint only our crates, not vendored Samyama (which has
          # many pre-existing unused-import warnings we do not own).
          # M432: da-graph removed (crate no longer exists — the dead
          # reference failed clippy with an unmatched package ID); da-mcp
          # added (was absent from CI entirely).
          cargo clippy \
            -p kg-ontology -p kg-storage -p kg-embeddings -p kg-algorithms -p kg-pipeline \
            -p da-domain -p da-ports -p da-application \
            -p da-adapters -p da-parse -p da-cli -p da-mcp \
            --all-targets --no-deps -- -D warnings

      - name: Unit + integration tests (per-crate, M339 + M432)
        run: |
          # Per-crate tests matching scripts/verify_rust_architecture.sh.
          # M432: integration suites added — da-cli --tests (incl. the
          # cross-process ADR-061 contract remote_read_plane_test),
          # da-adapters --tests, and da-mcp --lib (the M425-M428
          # real-engine tool sweep) were previously absent from CI.
          cargo test -p kg-ontology --lib
          cargo test -p kg-storage --lib
          cargo test -p kg-embeddings --lib
          cargo test -p kg-algorithms --lib
          cargo test -p kg-pipeline --lib
          cargo test -p da-domain --lib
          cargo test -p da-parse --lib
          cargo test -p da-application --tests
          cargo test -p da-adapters --tests
          cargo test -p da-cli --tests
          cargo test -p da-mcp --lib

      - name: Hexagonal dependency-direction check
        run: |
          # Inner layers must not depend on outer layers or infrastructure.
          # da-domain and da-ports: no infra crates allowed.
          # kg-* crates: universal (ADR-050) — must not depend on da-* at all.
          set -euo pipefail
          # Helper: scan only [dependencies] (prod), never [dev-dependencies].
          grep_deps() {
            awk '/^\[dependencies\]$/ {in_deps=1;next}
                 /^\[/ && $0!="[dependencies]" {in_deps=0}
                 in_deps {print}' "$1" | grep -E "$2";
          }
          # Helper: scan [dependencies] AND [dev-dependencies] (universal invariant).
          grep_deps_all() {
            awk '/^\[dependencies\]$/ {in_deps=1;next}
                 /^\[dev-dependencies\]$/ {in_deps=1;next}
                 /^\[/ && $0!="[dependencies]" && $0!="[dev-dependencies]" {in_deps=0}
                 in_deps {print}' "$1" | grep -E "$2";
          }

          echo "Checking da-domain has no infrastructure dependencies..."
          ! grep_deps crates/da-domain/Cargo.toml 'reqwest|tokio|samyama|ruvector|hyper|axum|actix' || {
            echo "ERROR: da-domain must not depend on infrastructure crates"; exit 1; }
          echo "Checking da-ports has no infrastructure dependencies..."
          ! grep_deps crates/da-ports/Cargo.toml 'reqwest|tokio|samyama|ruvector|hyper|axum|actix' || {
            echo "ERROR: da-ports must not depend on infrastructure crates"; exit 1; }
          echo "Checking da-application does not depend on da-adapters..."
          ! grep_deps crates/da-application/Cargo.toml 'da-adapters' || {
            echo "ERROR: da-application must not depend on da-adapters (hexagonal violation)"; exit 1; }
          echo "Checking da-application does not depend on da-parse..."
          ! grep_deps crates/da-application/Cargo.toml 'da-parse' || {
            echo "ERROR: da-application must not depend on da-parse (hexagonal violation)"; exit 1; }
          echo "Checking da-parse does not depend on Samyama or kg-*..."
          if [ ! -f crates/da-parse/Cargo.toml ]; then
            echo "ERROR: crates/da-parse/Cargo.toml missing"; exit 1
          fi
          ! grep_deps crates/da-parse/Cargo.toml 'samyama|kg-ontology|kg-storage|kg-embeddings|kg-algorithms|kg-pipeline' || {
            echo "ERROR: da-parse must not depend on Samyama or kg-* (inspect direct [dependencies], not cargo tree)"; exit 1; }
          echo "Checking kg-* crates have no da-* dependencies (ADR-050 invariant)..."
          for kg in kg-ontology kg-storage kg-embeddings kg-algorithms kg-pipeline; do
            ! grep_deps_all "crates/$kg/Cargo.toml" 'da-domain|da-ports|da-application|da-adapters|da-parse|da-graph|da-cli' || {
              echo "ERROR: $kg must not depend on da-* crates (ADR-050 universal invariant)"; exit 1; }
            echo "  $kg: OK (no da-* deps)"
          done
          echo "Hexagonal dependency direction: PASS"

      - name: Governor trajectory check (preflight, M339)
        run: |
          # Project trajectory enforcement (ADR invariants, artifact gates).
          # Mirrors scripts/check_project_trajectory.py --phase preflight.
          pip install pyyaml
          PYTHONPATH=scripts python3 -m governor --phase preflight --check-only

      - name: Guardrail evidence
        if: success()
        run: |
          mkdir -p artifacts/architecture-guardrail
          echo "Rust architecture guardrail passed on $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/architecture-guardrail/ci-run.txt
          cat artifacts/architecture-guardrail/ci-run.txt
