name: Architecture Guardrail

# Daily-archive architecture guardrail (per M044 / D079 and M045 / D080).
#
# This workflow runs on every push and pull_request to master.
# It enforces the binding safety contract before any code change can
# be merged: M044 architecture guardrail (mandatory) and M045
# trajectory check (advisory, surfaces drift).
#
# If M044 fails, the PR cannot be merged. M045 drift is reported
# as a workflow annotation but does not block.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel previous runs on the same ref to save CI minutes.
concurrency:
  group: architecture-guardrail-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m044-guardrail:
    name: M044 Architecture Guardrail (mandatory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run D086 onion layering guard
        run: |
          uv run python scripts/verify_onion_layering.py --json

      - name: Run M044 architecture guardrail
        id: m044
        run: |
          uv run python scripts/verify_m044_sidecar_architecture_guardrail.py
        # exit code 0 = pass, 1 = fail (mandatory)

      - name: Run write-path inventory drift check
        run: |
          CANONICAL_BASELINE="data/architecture-assessment/write-path-inventory-canonical.json"
          PREVIEW_BASELINE="data/architecture-assessment/m179-write-path-inventory-baseline.json"
          STRICT_DRIFT=0
          BASELINE="$PREVIEW_BASELINE"
          if [ -f "$CANONICAL_BASELINE" ]; then
            BASELINE="$CANONICAL_BASELINE"
            STRICT_DRIFT=1
          fi
          CURRENT_JSON="$(mktemp)"
          CURRENT_MD="$(mktemp)"
          DELTA_MD="$(mktemp)"
          trap 'rm -f "$CURRENT_JSON" "$CURRENT_MD" "$DELTA_MD"' EXIT
          uv run python scripts/inventory_write_paths.py \
            --json "$CURRENT_JSON" \
            --markdown "$CURRENT_MD" \
            --delta-from "$BASELINE" \
            --delta-markdown "$DELTA_MD"
          uv run python - "$CURRENT_JSON" "$DELTA_MD" "$STRICT_DRIFT" <<'PY'
          import json
          import sys
          from pathlib import Path

          current = json.loads(Path(sys.argv[1]).read_text())
          delta_text = Path(sys.argv[2]).read_text()
          strict_drift = sys.argv[3] == "1"
          categories = current["summary"]["by_category"]
          assert categories.get("unknown", 0) == 0, categories
          assert categories.get("shared-state", 0) == 0, categories
          if strict_drift:
              forbidden = [line for line in delta_text.splitlines() if line.startswith("|") and not line.endswith("| +0 |")]
              forbidden = [line for line in forbidden if not line.startswith("| Category ") and not line.startswith("|---")]
              assert "Total delta: `+0`" in delta_text, delta_text
              assert not forbidden, forbidden
              print("write-path inventory strict drift: pass")
          else:
              print("write-path inventory drift preview: canonical baseline not present yet")
          print("write-path inventory guardrails: unknown=0 shared-state=0")
          print("write-path inventory delta preview:")
          print("\n".join(delta_text.splitlines()[:20]))
          PY

      - name: Upload M044 evidence on success
        if: success()
        run: |
          mkdir -p artifacts/m044-grobid-architecture-guardrail
          echo "M044 architecture guardrail passed on $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/m044-grobid-architecture-guardrail/ci-run.txt
          cat artifacts/m044-grobid-architecture-guardrail/ci-run.txt

  m045-trajectory:
    name: M045 Trajectory Check (advisory)
    runs-on: ubuntu-latest
    # Only run if M044 passes.
    needs: m044-guardrail
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run M045 trajectory check
        id: m045
        run: |
          uv run python scripts/check_project_trajectory.py \
            --output-dir artifacts/m045-project-trajectory/ci-run
          # Always exits 0 unless the report verdict is "blocked" (high drift).

      - name: Annotate drift
        if: always()
        run: |
          if [ -f artifacts/m045-project-trajectory/ci-run/trajectory-report.md ]; then
            VERDICT=$(grep -E "^- Verdict:" artifacts/m045-project-trajectory/ci-run/trajectory-report.md | head -1 || true)
            echo "::notice::Trajectory check: ${VERDICT}"
          else
            echo "::warning::Trajectory report not produced."
          fi

      - name: Upload M045 trajectory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-report
          path: artifacts/m045-project-trajectory/ci-run/trajectory-report.{json,md}
          if-no-files-found: ignore
          retention-days: 14
