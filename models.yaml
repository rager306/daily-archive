# Models Registry
#
# Canonical source of truth for 9router model paths and helper bindings.
# Used by M049 (models registry), M050 (LLM helper v2 worker pool), and
# downstream Track A milestones.
#
# Schema per entry (all fields required):
#   id:              stable identifier used in code (snake_case, ends with provider)
#   provider:        one of {anthropic, openai}
#   endpoint:        full URL for the API call
#                    (https:// public, or http://127.0.0.1|localhost for 9router)
#   model_name:      exact model name as expected by the provider
#   tool_version:    semver of the tool/api contract; bump on protocol changes
#   policy_version:  semver of the calling-side policy; bump on behavior changes
#
# Validation: cargo test -p da-adapters --lib model_registry (strict typed Rust loader).
# Last updated: MiniMax subscription cancelled; quality/fallback both grok via
#               local 9router OpenAI-compatible path. No api.minimax.io entries.

schema_version: "v0.1"

models:
  # --- Local 9router (OpenAI-compatible) — primary LLM surface ---
  # Base: NINEROUTER_URL=http://127.0.0.1:20128  (env may override host/port)
  - id: ninerouter-agnes-2-0-flash-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: agnes-ai/agnes-2.0-flash
    tool_version: 2026-07-22
    policy_version: summary-roles-v0.1

  - id: ninerouter-luna-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: cx/gpt-5.6-luna
    tool_version: 2026-08-12
    policy_version: figure-analysis-v0.1

  # Cataloged in 9router; paid TokenPlan channel may 404 without credentials.
  - id: ninerouter-agnes-2-5-flash-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: agnes-ai/agnes-2.5-flash
    tool_version: 2026-07-24
    policy_version: summary-roles-v0.1

  # Live free Agnes path (works when paid agnes-ai/* credentials are down).
  - id: ninerouter-agnes-ai-free-2-5-flash-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: agnes-ai-free/agnes-2.5-flash
    tool_version: 2026-07-24
    policy_version: summary-roles-v0.1

  - id: ninerouter-agnes-ai-free-2-0-flash-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: agnes-ai-free/agnes-2.0-flash
    tool_version: 2026-07-24
    policy_version: summary-roles-v0.1

  - id: ninerouter-grok-code-fast-1-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: xai/grok-code-fast-1
    tool_version: 2026-07-22
    policy_version: summary-roles-v0.1

  - id: ninerouter-glm-5-2-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: glm/glm-5.2
    tool_version: 2026-07-22
    policy_version: summary-roles-v0.1

  - id: ninerouter-gpt-5-4-mini-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: cx/gpt-5.4-mini
    tool_version: 2026-07-22
    policy_version: summary-roles-v0.1

  - id: ninerouter-qwen3-vl-235b-openai
    provider: openai
    endpoint: http://127.0.0.1:20128/v1/chat/completions
    model_name: novita/qwen/qwen3-vl-235b-a22b-instruct
    tool_version: 2026-08-12
    policy_version: figure-roles-v0.1

bindings:
  # bindings map a usage purpose to a model id
  # used by M050 worker pool and downstream helper code
  - binding_id: figure-qa-primary
    model_id: ninerouter-qwen3-vl-235b-openai
    description: "Primary figure analysis model via 9router OpenAI-compatible multimodal route"

  - binding_id: figure-qa-luna
    model_id: ninerouter-luna-openai
    description: "Figure analysis via cx/gpt-5.6-luna (fast vision, structured JSON)"

  - binding_id: prompt-eval-summary-agnes
    model_id: ninerouter-agnes-2-0-flash-openai
    description: "Evaluation-only summary binding via agnes-ai/agnes-2.0-flash (production summary route)"

  - binding_id: prompt-eval-figure-qwen-vl
    model_id: ninerouter-qwen3-vl-235b-openai
    description: "Evaluation-only figure binding via novita/qwen3-vl-235b (production figure route)"

  # --- Paper summary roles (10-paper eval; optional ETL stage, import_eligible=false) ---
  # Default: agnes for tests + fast volume. Quality and fallback share grok
  # after MiniMax subscription cancellation. Distinct binding IDs stay so
  # later same-n eval can retarget quality without renaming product routes.
  - binding_id: paper-summary-generate-default
    model_id: ninerouter-agnes-2-0-flash-openai
    description: "Default paper summary generator for tests and fast volume (agnes-2.0-flash via 9router)"

  - binding_id: paper-summary-generate-quality
    model_id: ninerouter-grok-code-fast-1-openai
    description: "Quality paper summary generator (xai/grok-code-fast-1 via 9router; MiniMax subscription cancelled)"

  - binding_id: paper-summary-generate-fallback
    model_id: ninerouter-grok-code-fast-1-openai
    description: "Fallback paper summary generator when quality/default unavailable (xai/grok-code-fast-1 via 9router)"

  - binding_id: paper-summary-judge-primary
    model_id: ninerouter-glm-5-2-openai
    description: "Primary summary quality judge (glm/glm-5.2); may put answer in reasoning_content"

  - binding_id: paper-summary-judge-secondary
    model_id: ninerouter-gpt-5-4-mini-openai
    description: "Second-opinion summary judge (cx/gpt-5.4-mini)"
