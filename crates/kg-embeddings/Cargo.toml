[package]
name = "kg-embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal vector embeddings: Embedder trait, FdApi adapter, RuVector bridge."

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = { workspace = true }
ruvector-hybrid = { path = "/root/vendor-source/ruvector/crates/ruvector-hybrid" }
ruvector-solver = { workspace = true, optional = true, default-features = false }

[features]
ppr = ["dep:ruvector-solver", "ruvector-solver/forward-push"]

[dev-dependencies]
tokio = { workspace = true }
