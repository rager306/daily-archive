[package]
name = "da-mcp"
description = "MCP server for daily-archive knowledge base external access (ADR-054)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kg-storage = { path = "../kg-storage", features = ["samyama", "algorithms"] }
kg-ontology = { path = "../kg-ontology" }
kg-embeddings = { path = "../kg-embeddings" }
da-domain = { path = "../da-domain" }
da-ports = { path = "../da-ports" }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.0"
rmcp = { version = "3.1", features = ["server", "transport-io"] }
tracing = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = "0.15"
tokio-util = "0.7"
ruvector-hybrid = { path = "/root/vendor-source/ruvector/crates/ruvector-hybrid" }
samyama-graph-algorithms = { path = "/root/vendor-source/samyama-graph/crates/samyama-graph-algorithms" }

[lib]
name = "da_mcp"
path = "src/lib.rs"

[[bin]]
name = "da-mcp"
path = "src/main.rs"
