[package]
name = "da-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Port implementations: Samyama GraphStore, GROBID parser, fd_api embedder"

# M423: canary binary measuring pdf-inspector Full vs DetectOnly.
# Built only with the pdf-classifier feature so default builds stay free
# of the pdf-inspector dependency.
[[example]]
name = "pdf_triage_canary"
required-features = ["pdf-classifier"]

[dependencies]
regex = "1"
futures-util = "0.3"
yake-rust = { version = "1", default-features = false, features = ["en"] }
hashbrown = "0.15"
da-domain = { workspace = true }
da-ports = { workspace = true }
da-parse = { workspace = true }
kg-storage = { workspace = true, features = ["samyama"] }
kg-embeddings = { workspace = true }
serde_yaml = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
ruvector-cognitive-container = { path = "/root/vendor-source/ruvector/crates/ruvector-cognitive-container" }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
wasmi = { workspace = true }
wat = { workspace = true }

# Samyama Graph SDK (embedded mode — zero network overhead)
samyama = { path = "/root/vendor-source/samyama-graph" }
samyama-sdk = { path = "/root/vendor-source/samyama-graph/crates/samyama-sdk" }

# Optional: PDF classification via pdf-inspector (M346)
# Enable with: cargo test -p da-adapters --features pdf-classifier
pdf-inspector = { version = "0.1", optional = true }

# D295: redb is allowed ONLY as a rebuildable cache-index/cursor
# accelerator (never authoritative). Off by default; canonical terminal
# result reports and FilePipelineCache payloads never depend on it.
redb = { workspace = true, optional = true }

[features]
default = []
# PDF OCR triage — pure Rust PDF classification (~10ms)
pdf-classifier = ["dep:pdf-inspector"]
# Rebuildable parse-batch cursor/manifest-index accelerator (D295, S06/T04).
redb = ["dep:redb"]

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
