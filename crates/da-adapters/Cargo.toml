[package]
name = "da-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Port implementations: Samyama GraphStore, GROBID parser, fd_api embedder"

[dependencies]
da-domain = { workspace = true }
da-ports = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
hex = { workspace = true }
sha2 = { workspace = true }

# Samyama Graph SDK (embedded mode — zero network overhead)
samyama = { path = "/root/vendor-source/samyama-graph" }
samyama-sdk = { path = "/root/vendor-source/samyama-graph/crates/samyama-sdk" }
