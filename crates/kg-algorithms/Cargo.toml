[package]
name = "kg-algorithms"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal graph algorithms: temporal resolution, causal chains, traversal helpers."

[dependencies]
kg-ontology = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
samyama-graph-algorithms = { workspace = true, optional = true, default-features = false }
ruvector-solver = { workspace = true, optional = true, default-features = false }

[features]
# Optional CSR/solver export path (Wave 2). Off by default — no change to package defaults.
solver = ["dep:samyama-graph-algorithms", "dep:ruvector-solver"]
# PPR smoke path: CSR export + ruvector ForwardPushSolver (Andersen-Chung-Lang).
# Enables solver types and the forward-push algorithm feature on ruvector-solver.
ppr = ["solver", "ruvector-solver/forward-push"]

[dev-dependencies]
# Async trait tests for GraphViewAlgorithms (feature ppr).
tokio = { workspace = true, features = ["macros", "rt"] }
