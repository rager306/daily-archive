[package]
name = "da-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scholarly PDF fulltext parse: Java GROBID HTTP, TEI IR, and ParserPort projector"

[dependencies]
da-ports = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
proptest = "1"
tokio = { workspace = true, features = ["test-util"] }
# A-XML (M511-j7wz2f/S01): independent XML well-formedness parser for the
# preserved-TEI regression. Dev-dependency only: the composer import-root set
# queried by `native_fulltext_composition_is_pure_and_stays_outside_every_runtime_route`
# stays `{crate, serde, sha2, std}`, and no runtime code may use this crate
# (D321/quarantine unchanged).
roxmltree = "0.21"
