[package]
name = "kg-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal graph storage abstraction: GraphStore trait, Samyama adapter, Mock for tests."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
samyama = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
samyama-graph-algorithms = { workspace = true, optional = true }

[features]
default = []
samyama = ["dep:samyama", "dep:tracing"]
algorithms = ["dep:samyama-graph-algorithms", "dep:tracing"]

[dev-dependencies]
serde_json = { workspace = true }
bincode = "1.3"
kg-ontology = { path = "../kg-ontology" }
kg-embeddings = { path = "../kg-embeddings" }
# Compose tests only (Mock → GraphView → CsrMatrix / PPR). Not a prod dep —
# keeps kg-storage free of ruvector-solver (D141 / onion).
# feature ppr implies solver + ruvector-solver/forward-push for M300 compose.
kg-algorithms = { path = "../kg-algorithms", features = ["ppr"] }
