[workspace]

[package]
name = "learning-critic-ruvllm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone deterministic ruVLLM reflection critic producing parse-learning-ablation.v1 critic observations (D471, ADR-075 §2.7 Э1)."

[dependencies]
ruvllm = { path = "/root/vendor-source/ruvector/crates/ruvllm", default-features = false, features = ["candle", "async-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
